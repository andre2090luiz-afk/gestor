  const profitLine = (rev, cost) => rev > 0 ? <b className={rev - cost < 0 ? "neg" : ""}>lucro {fmt(rev - cost)} · {fmtN(((rev - cost) / rev) * 100, 0)}%</b> : null;

  function KitRow({ kit, orders, aberto, toggle, render }) {
    const cli = orders.map((o) => o.clientId).filter(Boolean)[0];
    const c = cli ? cliMap[cli] : null;
    const qtdTotal = orders.reduce((s, o) => s + num(o.qty), 0);
    const valor = orders.filter(isSale).reduce((s, o) => s + num(o.price), 0);
    const custo = orders.reduce((s, o) => s + num(o.cost), 0);
    const vendaveis = orders.filter(isSale);
    const todosPagos = vendaveis.length > 0 && vendaveis.every((o) => o.paid);
    const algunsPagos = vendaveis.some((o) => o.paid);
    const sts = [...new Set(orders.map((o) => o.status))];
    const statusComum = sts.length === 1 ? sts[0] : "";
    const dataMin = orders.map((o) => o.date).sort()[0];
    const entregas = orders.map((o) => o.dueDate).filter(Boolean).sort();
    return (
      <React.Fragment>
        <tr className="neo-okit">
          <td><div className="neo-odt">{fmtDate(dataMin).slice(0, 5)}<small>{entregas.length ? `entrega ${fmtDate(entregas[entregas.length - 1]).slice(0, 5)}` : "sem prazo"}</small></div></td>
          <td>
            <button className="neo-opj kit" onClick={toggle} title={aberto ? "Recolher itens" : "Ver itens"}>
              <span className="neo-stack">{[...new Set(orders.map((o) => o.projectId))].slice(0, 3).map((pid, i) => { const pp = projMap[pid]; return pp && pp.image ? <img key={pid} src={pp.image} alt="" className="th2 img" style={{ zIndex: 3 - i }} /> : <span key={pid} className="th2" style={{ zIndex: 3 - i }}><Package size={14} /></span>; })}</span>
              <span><b>{kit} · {orders.length} itens</b><small>{aberto ? "recolher ▴" : "clique para ver os itens ▾"}</small></span>
            </button>
          </td>
          <td>{c ? <span className="neo-ocli"><span className="av">{c.name.trim().charAt(0).toUpperCase()}</span>{c.name}</span> : "—"}</td>
          <td className="neo-on">{fmtN(qtdTotal)}</td>
          <td className="neo-ov2">{valor > 0 ? fmt(valor) : "—"}</td>
          <td className="neo-oc">{fmt(custo)}{profitLine(valor, custo)}</td>
          <td className="neo-opaid">
            {vendaveis.length === 0 ? <span className="mut">—</span> : (
              <Switch on={todosPagos} mixed={algunsPagos && !todosPagos} title={todosPagos ? "Kit pago — clique para desmarcar" : "Marcar o kit inteiro como pago"}
                onChange={(v) => { setData((d) => ({ ...d, orders: d.orders.map((x) => x.quoteCode === kit && isSale(x) ? { ...x, paid: v } : x) })); notify(v ? "Kit marcado como pago" : "Kit marcado como não pago"); }} />
            )}
          </td>
          <td>{statusSel(statusComum, (e) => { const v = e.target.value; if (!v) return; orders.forEach((o) => { if (o.status !== v) setOrderStatus(o, v); }); }, !statusComum ? <option value="">misto ({sts.length})</option> : null)}</td>
          <td><div className="neo-oico"><button className="neo-bg2 ic" title={aberto ? "Recolher" : "Ver itens"} onClick={toggle}>{aberto ? "▴" : "▾"}</button></div></td>
        </tr>
        {aberto && orders.map((o) => render(o, true))}
      </React.Fragment>
    );
  }

  function Orders() {
    const today = todayISO();
    const [per, setPerS] = useState(ORD_UI.per);
    const [from, setFromS] = useState(ORD_UI.from || thisMonth + "-01");
    const [to, setToS] = useState(ORD_UI.to || today);
    const [type, setTypeS] = useState(ORD_UI.type);
    const [sit, setSitS] = useState(ORD_UI.sit);
    const [qtext, setQtextS] = useState(ORD_UI.q);
    const [page, setPage] = useState(1);
    const [openKits, setOpenKits] = useState({});
    const [help, setHelp] = useState(false);
    const setFrom = (v) => { ORD_UI.from = v; setFromS(v); setPage(1); };
    const setTo = (v) => { ORD_UI.to = v; setToS(v); setPage(1); };
    const setType = (v) => { ORD_UI.type = v; setTypeS(v); setPage(1); };
    const setSit = (v) => { ORD_UI.sit = v; setSitS(v); setPage(1); };
    const setQtext = (v) => { ORD_UI.q = v; setQtextS(v); setPage(1); };
    const setPer = (k) => {
      ORD_UI.per = k; setPerS(k); setPage(1);
      if (k === "custom") return;
      let f = "", t = today;
      if (k === "mes") f = thisMonth + "-01";
      else if (k === "mesp") { const d = new Date(thisMonth + "-01T12:00:00"); d.setMonth(d.getMonth() - 1); f = d.toISOString().slice(0, 7) + "-01"; t = new Date(d.getFullYear(), d.getMonth() + 1, 0, 12).toISOString().slice(0, 10); }
      else if (k === "90d") f = addDays(today, -89);
      else if (k === "ano") f = today.slice(0, 4) + "-01-01";
      else { f = ""; t = ""; }
      ORD_UI.from = f; ORD_UI.to = t; setFromS(f); setToS(t);
    };
    const sOrdRaw = useSort("pedidos");
    const sOrd = { sort: sOrdRaw.sort, toggle: (c) => { sOrdRaw.toggle(c); setPage(1); } };

    const inPeriod = data.orders.filter((o) => (!from || o.date >= from) && (!to || o.date <= to));
    const bySearch = inPeriod.filter((o) => { if (!qtext) return true; const t = qtext.toLowerCase(); const pn = (projName(o) || "").toLowerCase(); const cn = ((o.clientId && cliMap[o.clientId] ? cliMap[o.clientId].name : "") || "").toLowerCase(); return pn.includes(t) || cn.includes(t); });
    const typeCount = { venda: 0, estoque: 0, brinde: 0, avulso: 0 };
    bySearch.forEach((o) => { typeCount[orderType(o)]++; });
    const sitOk = (o) => sit === "todos" || (sit === "aberto" && !isDone(o)) || (sit === "concluidos" && isDone(o)) || (sit === "naopagos" && isSale(o) && isDone(o) && !o.paid);
    const unpaidN = bySearch.filter((o) => isSale(o) && isDone(o) && !o.paid && (type === "todos" || orderType(o) === type)).length;
    const list = bySearch.filter((o) => (type === "todos" || orderType(o) === type) && sitOk(o)).sort((a, b) => (b.date > a.date ? 1 : -1));
    /* pedidos do mesmo orcamento viram UMA linha que expande */
    const kitCount = {};
    list.forEach((o) => { if (o.quoteCode) kitCount[o.quoteCode] = (kitCount[o.quoteCode] || 0) + 1; });
    const rows = [];
    const vistos = {};
    list.forEach((o) => {
      const k = o.quoteCode;
      if (k && kitCount[k] > 1) { if (vistos[k]) return; vistos[k] = true; rows.push({ kit: k, orders: list.filter((x) => x.quoteCode === k) }); }
      else rows.push({ order: o });
    });
    const destLabel = (o) => o.dest === "estoque" ? "→ Estoque" : o.dest === "avulso" ? "Impressão avulsa" : o.dest === "brinde" ? "Brinde / Teste" : (o.clientId && cliMap[o.clientId] ? cliMap[o.clientId].name : (o.client || ""));
    const rowOrders = (r) => (r.kit ? r.orders : [r.order]);
    const sortedRows = sortRows(rows, sOrd, {
      date: (r) => rowOrders(r).map((o) => o.date).sort()[0],
      project: (r) => projName(rowOrders(r)[0]),
      client: (r) => { if (!r.kit) return destLabel(r.order); const c = r.orders.map((o) => o.clientId).filter(Boolean)[0]; return c && cliMap[c] ? cliMap[c].name : destLabel(r.orders[0]); },
      qty: (r) => rowOrders(r).reduce((s, o) => s + num(o.qty), 0),
      price: (r) => { const v = rowOrders(r).filter(isSale); return v.length ? v.reduce((s, o) => s + num(o.price), 0) : null; },
      cost: (r) => rowOrders(r).reduce((s, o) => s + num(o.cost), 0),
      paid: (r) => { const v = rowOrders(r).filter(isSale); return v.length ? v.every((o) => o.paid) : null; },
      status: (r) => Math.min(...rowOrders(r).map((o) => { const i = STATUSES.indexOf(o.status); return i < 0 ? 99 : i; })),
    });
    const PER = 25;
    const pageCount = Math.max(1, Math.ceil(rows.length / PER));
    const curPage = Math.min(page, pageCount);
    const pageList = sortedRows.slice((curPage - 1) * PER, curPage * PER);
    const byDate = !sOrd.sort || !sOrd.sort.col || sOrd.sort.col === "date";
    /* resumo de cada mes (todos os pedidos do filtro, nao so da pagina) */
    const monthSum = {};
    list.forEach((o) => { const m = monthKey(o.date); (monthSum[m] = monthSum[m] || { n: 0, v: 0 }); monthSum[m].n++; if (isSale(o)) monthSum[m].v += num(o.price); });
    const monthName = (m) => new Date(m + "-15T12:00:00").toLocaleDateString("pt-BR", { month: "long", year: "numeric" }).replace(" de ", " ").toUpperCase();

    const doneSales = list.filter((o) => isDone(o) && isSale(o));
    const faturamento = doneSales.reduce((s, o) => s + num(o.price), 0);
    const recebido = list.filter((o) => o.paid && isSale(o)).reduce((s, o) => s + num(o.price), 0);
    const lucro = doneSales.reduce((s, o) => s + num(o.price) - num(o.cost), 0);
    const ticket = doneSales.length ? faturamento / doneSales.length : 0;
    const pecas = list.reduce((s, o) => s + num(o.qty), 0);
    const recPct = faturamento > 0 ? Math.min(100, (recebido / faturamento) * 100) : 0;
    const typeTot = Object.values(typeCount).reduce((s, n) => s + n, 0);
    const periods = [["mes", "Este mês"], ["mesp", "Mês passado"], ["90d", "90 dias"], ["ano", "Ano"], ["tudo", "Tudo"], ["custom", "📅 Período…"]];
    const types = [["todos", "Todos", bySearch.length, null], ["venda", "Vendas", typeCount.venda, "#3FD1CE"], ["estoque", "Estoque", typeCount.estoque, "#F5821F"], ["brinde", "Brinde / Teste", typeCount.brinde, "#FF6B6B"], ["avulso", "Avulso", typeCount.avulso, "#5E7A7B"]];

    let lastMonth = null;
    return (
      <div className="neo-orders">
        <div className="neo-pagehead">
          <span className="neo-code">PEDIDOS</span><h2>Histórico de pedidos</h2>
          <button className={"neo-help" + (help ? " on" : "")} onClick={() => setHelp(!help)} title="Os três tipos de pedido">?</button>
          <div className="neo-oacts" style={{ marginLeft: "auto" }}>
            <Btn kind="ghost" onClick={() => setModal({ type: "calc" })}><CalculatorIc size={15} />Calculadora</Btn>
            <Btn kind="ghost" onClick={() => setModal({ type: "quick" })} disabled={data.filaments.length === 0}><ZapIc size={15} />Impressão avulsa</Btn>
            <Btn kind="ghost" onClick={() => setModal({ type: "calib" })} disabled={data.printers.length === 0 || data.filaments.length === 0}><WrenchIc size={15} />Calibração</Btn>
            <Btn onClick={() => setModal({ type: "order" })} disabled={data.projects.length === 0}><Plus size={16} />Novo pedido</Btn>
          </div>
        </div>
        {help && (
          <div className="neo-hud neo-helpbox">
            💡 Três tipos de pedido: <b>Venda para cliente</b> (gera faturamento), <b>Produção para estoque</b> (as peças vão para a aba Estoque de Produtos) e <b>Brinde / Teste</b> (sem receita — só consome material e guarda a peça no estoque). <b>Impressão avulsa</b> e <b>Calibração</b> lançam só o consumo de material e máquina.
          </div>
        )}
        {data.projects.length === 0 && <div className="neo-hud neo-helpbox o">Pedidos são criados a partir de projetos. Cadastre um projeto primeiro na aba Projetos.</div>}

        <div className="neo-penbar">
          <div className="neo-seg sm">{periods.map(([k, l]) => <button key={k} className={"ord-per" + (per === k ? " on" : "")} data-p={k} onClick={() => setPer(k)}>{l}</button>)}</div>
          {per === "custom" && <>
            <In type="date" value={from} onChange={(e) => setFrom(e.target.value)} style={{ width: 150, height: 36, padding: "6px 10px" }} title="De" />
            <In type="date" value={to} onChange={(e) => setTo(e.target.value)} style={{ width: 150, height: 36, padding: "6px 10px" }} title="Até" />
          </>}
          <div className="neo-search"><SearchIc size={14} /><input value={qtext} onChange={(e) => setQtext(e.target.value)} placeholder="Projeto ou cliente…" />{qtext && <button onClick={() => setQtext("")}>×</button>}</div>
        </div>

        <div className="neo-okpis">
          <Reveal className="neo-hud neo-k" delay={0}><div className="l">Faturamento</div><div className="v"><CountUp value={faturamento} format={fmt} /></div><span className="neo-kd up">{fmtN(doneSales.length)} venda{doneSales.length === 1 ? "" : "s"} concluída{doneSales.length === 1 ? "" : "s"}</span></Reveal>
          <Reveal className="neo-hud neo-k" delay={60}><div className="neo-kring"><Ring pct={recPct} size={54} color="#6FA0EA"><b>{fmtN(recPct, 0)}%</b></Ring><div><div className="l">Recebido</div><div className="v sm"><CountUp value={recebido} format={fmt} /></div><span className="neo-kd">{faturamento - recebido > 0.005 ? `falta ${fmt(faturamento - recebido)}` : faturamento > 0 ? "tudo recebido ✓" : "—"}</span></div></div></Reveal>
          <Reveal className="neo-hud neo-k" delay={120}><div className="l">Lucro estimado</div><div className="v" style={{ color: lucro >= 0 ? "#5CE0D4" : "#FF8A8A" }}><CountUp value={lucro} format={fmt} /></div><span className="neo-kd">{faturamento > 0 ? `margem ${fmtN((lucro / faturamento) * 100, 0)}%` : "faturamento − custo de produção"}</span></Reveal>
          <Reveal className="neo-hud neo-k" delay={180}><div className="l">Ticket médio</div><div className="v"><CountUp value={ticket} format={fmt} /></div><span className="neo-kd">{fmtN(pecas)} peça{pecas === 1 ? "" : "s"} no período</span></Reveal>
          <Reveal className="neo-hud neo-funnel" delay={240}>
            <span className="neo-code">TIPO DE PEDIDO</span>
            <div className="bar">{typeTot ? [["venda", "a"], ["estoque", "o"], ["brinde", "r"], ["avulso", "e"]].map(([k, c]) => typeCount[k] > 0 && <i key={k} className={c} style={{ width: (typeCount[k] / typeTot * 100) + "%" }} />) : <i className="e" style={{ width: "100%", opacity: .3 }} />}</div>
            <div className="leg"><span className="a">Vendas {typeCount.venda}</span><span className="o">Estoque {typeCount.estoque}</span><span className="r">Brinde {typeCount.brinde}</span><span className="e">Avulso {typeCount.avulso}</span></div>
          </Reveal>
        </div>

        <div className="neo-penbar">
          <div className="neo-fchips">
            {types.map(([k, l, n, c]) => <button key={k} className={"neo-fchip ord-type" + (type === k ? " on" : "")} data-t={k} onClick={() => setType(k)}>{c && <i className="cdot" style={{ background: c }} />}{l} {n}</button>)}
            <span className="neo-sep" />
            {[["aberto", "Em aberto"], ["concluidos", "Concluídos"], ["naopagos", `⚠ Não pagos ${unpaidN}`]].map(([k, l]) => <button key={k} className={"neo-fchip ord-sit" + (sit === k ? " on" : "") + (k === "naopagos" && unpaidN ? " r" : "")} data-s={k} onClick={() => setSit(sit === k ? "todos" : k)}>{l}</button>)}
          </div>
        </div>

        <div className="neo-otbl">
          {list.length === 0 ? <Empty icon={ShoppingCart} text="Nenhum pedido neste filtro" hint="Ajuste o período e os filtros ou registre um novo pedido." /> : (
            <div style={{ overflowX: "auto" }}>
              <table className="neo-otable">
                <thead><tr><Th s={sOrd} col="date">Data</Th><Th s={sOrd} col="project">Projeto</Th><Th s={sOrd} col="client">Cliente / destino</Th><Th s={sOrd} col="qty" style={{ textAlign: "right" }}>Qtd</Th><Th s={sOrd} col="price" style={{ textAlign: "right" }}>Valor</Th><Th s={sOrd} col="cost" style={{ textAlign: "right" }}>Custo · lucro</Th><Th s={sOrd} col="paid" style={{ textAlign: "center" }}>Pago</Th><Th s={sOrd} col="status">Status</Th><th /></tr></thead>
                <tbody>
                  {pageList.map((linhaTab) => {
                    const d0 = rowOrders(linhaTab).map((o) => o.date).sort()[0];
                    const m = monthKey(d0);
                    const sep = byDate && m !== lastMonth ? (
                      <tr key={"m" + m} className="neo-omon"><td colSpan={9}>{monthName(m)}<span> · {fmtN(monthSum[m] ? monthSum[m].n : 0)} pedido{monthSum[m] && monthSum[m].n === 1 ? "" : "s"}{monthSum[m] && monthSum[m].v > 0 ? ` · ${fmt(monthSum[m].v)}` : ""}</span></td></tr>
                    ) : null;
                    lastMonth = m;
                    const row = linhaTab.kit
                      ? <KitRow key={"kit" + linhaTab.kit} kit={linhaTab.kit} orders={linhaTab.orders} aberto={!!openKits[linhaTab.kit]} toggle={() => setOpenKits((s) => ({ ...s, [linhaTab.kit]: !s[linhaTab.kit] }))} render={renderOrderRow} />
                      : renderOrderRow(linhaTab.order);
                    return sep ? <React.Fragment key={"f" + (linhaTab.kit || linhaTab.order.id)}>{sep}{row}</React.Fragment> : row;
                  })}
                </tbody>
              </table>
            </div>
          )}
        </div>
        <Pager total={rows.length} page={curPage} per={PER} setPage={setPage} />
      </div>
    );

    function renderOrderRow(o, dentroDoKit) {
      const p = projMap[o.projectId];
      const cli = o.clientId ? cliMap[o.clientId] : null;
      const noSale = !isSale(o);
      const cs = p ? itemColors(p, o.filChoices) : [];
      const colorTxt = cs.length ? (cs.length > 1 ? `${cs.length} cores` : colorName(cs[0].fil)) : "";
      return (
        <tr key={o.id} className={dentroDoKit ? "neo-osub" : ""}>
          <td>{!dentroDoKit && <div className="neo-odt">{fmtDate(o.date).slice(0, 5)}<small>{o.dueDate && !isDone(o) ? `entrega ${fmtDate(o.dueDate).slice(0, 5)}` : isDone(o) ? (o.status === "Entregue" ? "entregue" : "concluído") : "sem prazo"}</small></div>}</td>
          <td>
            <div className="neo-opj">
              {dentroDoKit && <span className="sub">↳</span>}{p && p.image ? <img src={p.image} alt="" className={"th2 img" + (dentroDoKit ? " sm" : "")} /> : <span className={"th2" + (dentroDoKit ? " sm" : "")}><Package size={dentroDoKit ? 13 : 15} /></span>}
              <span><b>{projName(o)}</b>{(colorTxt || o.giftNote) && <small>{dentroDoKit && colorTxt ? "" : ""}{colorTxt}{colorTxt && o.giftNote ? " · " : ""}{o.giftNote || ""}</small>}</span>
            </div>
          </td>
          <td>{dentroDoKit ? null : destPill(o, cli)}</td>
          <td className="neo-on">{fmtN(o.qty)}</td>
          <td className="neo-ov2">{noSale ? <span className="mut">—</span> : fmt(o.price)}</td>
          <td className="neo-oc">{fmt(o.cost)}{!noSale && !dentroDoKit && profitLine(num(o.price), num(o.cost))}</td>
          <td className="neo-opaid">{noSale ? <span className="mut">—</span> : <Switch on={!!o.paid} title={o.paid ? "Pago — clique para desmarcar" : "Marcar como pago"} onChange={(v) => saveItem("orders", { ...o, paid: v })} />}</td>
          <td>{statusSel(o.status, (e) => setOrderStatus(o, e.target.value))}</td>
          <td>
            <div className="neo-oico">
              <button className="neo-bg2 ic" title="Editar" onClick={() => setModal({ type: "order", item: o })}><Pencil size={13} /></button>
              <button className="neo-bg2 ic danger" title="Excluir" onClick={() => {
                const pj = projMap[o.projectId];
                if (isDone(o) && isSale(o) && o.processed && pj) {
                  if (!confirm(`Excluir esta venda de ${fmtN(o.qty)}× ${pj.name}?`)) return;
                  const back = confirm(`Devolver ${fmtN(o.qty)} un de "${pj.name}" ao estoque de produtos?\n\nOK = estornar (peças voltam ao estoque)\nCancelar = excluir sem devolver`);
                  const snap = data;
                  setData((d) => ({ ...d, products: back ? changeProductStock(d.products, o.projectId, num(o.qty)) : d.products, orders: d.orders.filter((x) => x.id !== o.id) }));
                  notify(back ? `Venda estornada — ${fmtN(o.qty)} un de "${pj.name}" voltaram ao estoque de produtos` : "Venda excluída sem devolução ao estoque", snap);
                } else if (o.dest === "brinde" && o.fromStock && isDone(o) && o.processed && pj) {
                  if (!confirm(`Excluir este brinde de ${fmtN(o.qty)}× ${pj.name}?\n\nAs peças voltam para o estoque de produtos.`)) return;
                  const snap = data;
                  setData((d) => ({ ...d, products: changeProductStock(d.products, o.projectId, num(o.qty)), orders: d.orders.filter((x) => x.id !== o.id) }));
                  notify(`Brinde excluído — ${fmtN(o.qty)} un de "${pj.name}" voltaram ao estoque`, snap);
                } else if (o.dest === "brinde" && isDone(o) && o.processed && pj) {
                  if (!confirm(`Excluir este Brinde/Teste de ${fmtN(o.qty)}× ${pj.name}?\n\nAs peças produzidas também serão removidas do estoque.`)) return;
                  const snap = data;
                  setData((d) => ({ ...d, products: changeProductStock(d.products, o.projectId, -num(o.qty)), orders: d.orders.filter((x) => x.id !== o.id) }));
                  notify(`Brinde/Teste excluído — ${fmtN(o.qty)} un removidas do estoque`, snap);
                } else if (confirm("Excluir este pedido?")) delItem("orders", o.id);
              }}><Trash2 size={13} /></button>
            </div>
          </td>
        </tr>
      );
    }
  }

  function OrderModal({ item, presetProject }) {
    const [f, setF] = useState(item ? { clientId: "", dest: "venda", ...item } : {
      id: uid(), projectId: presetProject || (data.projects[0] ? data.projects[0].id : ""), clientId: "", qty: 1,
      date: todayISO(), dueDate: "", price: "", cost: "", status: "Orçamento", dest: "venda",
      printerId: data.printers[0] ? data.printers[0].id : "", paid: false, processed: false,
    });
    const set = (k) => (e) => setF({ ...f, [k]: e.target.value });
    const p = projMap[f.projectId];
    // custo recalculado conforme o filamento escolhido no pedido
    const autoCost = p ? (orderUnitCost(p, f.filChoices) * num(f.qty)).toFixed(2) : "";
    const isStk = f.dest === "estoque";
    const isBrinde = f.dest === "brinde";
    const noSale = isStk || isBrinde;
    return (
      <Modal title={item ? "Editar pedido" : "Novo pedido"} onClose={() => setModal(null)}>
        <Row cols={1}>
          <div><L>Destino do pedido</L>
            <div style={{ display: "flex", gap: 8 }}>
              {[["venda", "Venda para cliente"], ["estoque", "Produção para estoque"], ["brinde", "Brinde / Teste"]].map(([v, lbl]) => (
                <button key={v} onClick={() => setF({ ...f, dest: v })} style={{
                  flex: 1, padding: "8px 0", borderRadius: 9, cursor: "pointer",
                  border: f.dest === v ? "1.5px solid #14A6A4" : "1px solid rgba(63,209,206,.22)",
                  background: f.dest === v ? "rgba(63,209,206,.1)" : "rgba(12,26,28,.72)",
                  font: "600 12.5px Inter,sans-serif", color: f.dest === v ? "#3FD1CE" : "#7E9191",
                }}>{lbl}</button>
              ))}
            </div>
            {isBrinde && <div style={{ font: "400 11.5px Inter,sans-serif", color: "#FFB067", marginTop: 6 }}>Consome material e guarda a peça no estoque. Nada entra no financeiro — se vender depois, registre pelo Estoque de Produtos.</div>}
          </div>
        </Row>
        <Row>
          <div><L>Projeto</L>
            <div style={{ display: "flex", alignItems: "center", gap: 8, minWidth: 0 }}>
              {p && (p.image
                ? <img src={p.image} alt="" title={p.name} style={{ width: 38, height: 38, objectFit: "cover", borderRadius: 8, border: "1px solid rgba(63,209,206,.14)", flexShrink: 0, display: "block" }} />
                : <span style={{ width: 38, height: 38, borderRadius: 8, border: "1px solid rgba(63,209,206,.14)", background: "rgba(5,12,12,.55)", flexShrink: 0, display: "grid", placeItems: "center", color: "#4A5559" }}><ImageIcon size={16} /></span>)}
              <div style={{ flex: 1, minWidth: 0 }}>
                <Combo value={f.projectId} onChange={(v) => setF({ ...f, projectId: v, filChoices: {}, partPrinters: {} })} placeholder="Selecionar projeto…"
                  options={data.projects.filter((x) => x.active !== false || x.id === f.projectId).map((x) => ({ value: x.id, label: x.name, sub: nichesText(x) || undefined }))} />
              </div>
            </div>
          </div>
          {!isStk ? (
            <div><L>Cliente{isBrinde ? " (opcional — quem recebeu)" : ""}</L>
              <div style={{ display: "flex", gap: 8 }}>
                <Combo value={f.clientId} onChange={(v) => setF({ ...f, clientId: v })} placeholder="— sem cliente —"
                  options={[{ value: "", label: "— sem cliente —" }].concat(data.clients.map((c) => ({ value: c.id, label: c.name, sub: c.phone || undefined })))} />
                <Btn small kind="ghost" style={{ whiteSpace: "nowrap" }} onClick={() => {
                  const n = prompt("Nome do novo cliente:");
                  if (n && n.trim()) { const c = { id: uid(), name: n.trim(), phone: "", team: "", kids: "", niches: [], notes: "", createdAt: todayISO() }; saveItem("clients", c); setF((x) => ({ ...x, clientId: c.id })); }
                }}><Plus size={13} /></Btn>
              </div>
            </div>
          ) : <div><L>Cliente</L><In disabled value="Produção interna → Estoque de Produtos" style={{ background: "rgba(63,209,206,.06)" }} /></div>}
        </Row>
        <Row cols={3}>
          <div><L>Quantidade de peças</L><In type="number" value={f.qty} onChange={(e) => {
            const q = e.target.value;
            setF({ ...f, qty: q, cost: p ? (num(p.cost) * num(q)).toFixed(2) : f.cost });
          }} /></div>
          <div><L>Data do pedido</L><In type="date" value={f.date} onChange={set("date")} /></div>
          <div><L>Entrega prevista</L><In type="date" value={f.dueDate} onChange={set("dueDate")} /></div>
        </Row>
        <Row cols={3}>
          {!noSale ? <div><L>Valor cobrado (R$)</L><In type="number" value={f.price} onChange={set("price")} placeholder={p ? (num(p.cost) * (1 + num(data.settings.defaultMargin) / 100) * Math.max(1, num(f.qty))).toFixed(2) : ""} /></div> : <div><L>Valor cobrado</L><In disabled value={isBrinde ? "— (brinde / teste)" : "— (sem venda)"} style={{ background: "rgba(63,209,206,.06)" }} /></div>}
          <div><L>Custo estimado (R$)</L><In disabled title="Calculado automaticamente a partir do projeto e do filamento escolhido" value={autoCost ? fmt(autoCost) : "—"} style={{ background: "rgba(63,209,206,.06)", color: "#93A6A6" }} /></div>
          {isPartsProj(p) && !f.fromStock ? (
            <div><L>Impressora</L><In disabled value={`Em ${p.parts.length} partes ↓`} style={{ background: "rgba(63,209,206,.06)", color: "#93A6A6" }} /></div>
          ) : (
          <div><L>Impressora</L>
            <Combo value={f.printerId} onChange={(v) => setF({ ...f, printerId: v })} placeholder="—"
              options={[{ value: "", label: "—" }].concat(data.printers.map((x) => ({ value: x.id, label: x.name })))} />
          </div>
          )}
        </Row>
        {isPartsProj(p) && !f.fromStock && (
          <div className="order-parts" style={{ border: "1px dashed rgba(63,209,206,.14)", background: "rgba(5,12,12,.55)", borderRadius: 10, padding: "10px 12px", marginBottom: 12 }}>
            <div style={{ font: "600 11.5px Inter,sans-serif", color: "#3FD1CE", textTransform: "uppercase", letterSpacing: ".06em", marginBottom: 8 }}>Impressora de cada parte</div>
            {p.parts.map((pt) => {
              const cur = (f.partPrinters || {})[pt.id] || pt.printerId || "";
              return (
                <div key={pt.id} style={{ display: "grid", gridTemplateColumns: "1fr 1.3fr 90px", gap: 8, alignItems: "center", marginBottom: 6 }}>
                  <span style={{ font: "600 12.5px Inter,sans-serif", color: "#D6E2E2" }}>{pt.name || "Parte"}</span>
                  <Combo value={cur} onChange={(v) => setF({ ...f, partPrinters: { ...(f.partPrinters || {}), [pt.id]: v } })} placeholder="—"
                    options={[{ value: "", label: "—" }].concat(data.printers.map((x) => ({ value: x.id, label: x.name })))} />
                  <span style={{ font: "500 11.5px 'JetBrains Mono',monospace", color: "#93A6A6", textAlign: "right" }}>{fmtHM(num(pt.hours) * Math.max(1, num(f.qty)))}</span>
                </div>
              );
            })}
            <div style={{ font: "400 11px Inter,sans-serif", color: "#7E9191", borderTop: "1px solid rgba(63,209,206,.14)", paddingTop: 6, marginTop: 2 }}>
              Já vem com a impressora do projeto — troque aqui se nesta produção uma parte for para outra máquina. Pronta em <b>{fmtHM(projWallHours(p, f.partPrinters) * Math.max(1, num(f.qty)))}</b>.
            </div>
          </div>
        )}
        <Row>
          <div><L>Status</L><Sel value={f.status} onChange={set("status")}>{STATUSES.map((s) => <option key={s}>{s}</option>)}</Sel></div>
          {!noSale ? (
            <div style={{ display: "flex", alignItems: "flex-end", gap: 8, paddingBottom: 8 }}>
              <input id="paidchk" type="checkbox" checked={!!f.paid} onChange={(e) => setF({ ...f, paid: e.target.checked })} style={{ width: 16, height: 16, accentColor: "#14A6A4" }} />
              <label htmlFor="paidchk" style={{ font: "500 13px Inter,sans-serif", color: "#D6E2E2", cursor: "pointer" }}>Pagamento recebido</label>
            </div>
          ) : <div />}
        </Row>
        {p && !f.fromStock && (() => {
          const slots = projSlots(p);
          if (!slots.length) return null;
          const escolha = f.filChoices || {};
          const pick = (k, v) => setF({ ...f, filChoices: { ...escolha, [k]: v } });
          const base = filCostPerPiece(slots, null);
          const atual = filCostPerPiece(slots, escolha);
          const dif = atual - base;
          return (
            <div style={{ border: "1px dashed rgba(63,209,206,.14)", background: "rgba(5,12,12,.55)", borderRadius: 10, padding: "10px 12px", marginBottom: 12 }}>
              <div style={{ font: "600 11.5px Inter,sans-serif", color: "#3FD1CE", textTransform: "uppercase", letterSpacing: ".06em", marginBottom: 8 }}>Filamentos desta produção</div>
              {slots.map((s) => {
                const atualId = escolha[s.key] || s.filamentId;
                const fl = filMap[atualId];
                const precisa = num(s.grams) * num(f.qty);
                const falta = fl && num(fl.stockG) < precisa;
                const trocado = atualId !== s.filamentId;
                return (
                  <div key={s.key} style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 6 }}>
                    <span style={{ font: "500 12px Inter,sans-serif", color: "#93A6A6", minWidth: 86 }}>{s.label}</span>
                    <span title={fl ? fl.color : ""} style={{ width: 14, height: 14, borderRadius: "50%", background: fl ? (fl.colorHex || "rgba(63,209,206,.22)") : "rgba(12,26,28,.72)", border: "1.5px solid rgba(63,209,206,.22)", flexShrink: 0 }} />
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <Combo value={atualId} onChange={(v) => pick(s.key, v)} placeholder="— selecionar —"
                        options={(() => {
                          /* v4.39: cores disponiveis do projeto aparecem primeiro */
                          const disp = new Set(projColors(p).map((c) => colorKey(c.name)));
                          const isD = (x) => disp.has(colorKey(x.color));
                          return data.filaments.slice().sort((a, b) => (isD(b) ? 1 : 0) - (isD(a) ? 1 : 0))
                            .map((x) => ({ value: x.id, label: (isD(x) ? "★ " : "") + x.name, sub: (x.color || "sem cor") + (isD(x) ? " · cor disponível" : "") + " · " + fmtN(x.stockG) + "g" }));
                        })()} />
                    </div>
                    <span style={{ font: "500 11.5px 'JetBrains Mono',monospace", color: falta ? "#FFB067" : "#7E9191", minWidth: 74, textAlign: "right" }}>
                      {fmtN(precisa)}g{falta ? " ⚠" : ""}
                    </span>
                    {trocado && <a onClick={() => pick(s.key, s.filamentId)} title="Voltar ao filamento do projeto" style={{ color: "#14A6A4", cursor: "pointer", font: "600 11px Inter,sans-serif" }}>↺</a>}
                  </div>
                );
              })}
              <div style={{ font: "400 11px Inter,sans-serif", color: "#7E9191", borderTop: "1px solid rgba(63,209,206,.14)", paddingTop: 6, marginTop: 2 }}>
                {Math.abs(dif) > 0.005
                  ? <span>Filamento diferente do projeto: custo por peça {dif > 0 ? "sobe" : "cai"} <b style={{ color: dif > 0 ? "#FFB067" : "#3FD1CE" }}>{fmt(Math.abs(dif))}</b> (projeto {fmt(p.cost)} → {fmt(orderUnitCost(p, escolha))}).</span>
                  : <span>Usando os filamentos do projeto. ⚠ = estoque insuficiente.</span>}
              </div>
            </div>
          );
        })()}
        {p && !f.fromStock && <div style={{ font: "400 12px Inter,sans-serif", color: "#7E9191", marginBottom: 12 }}>
          Ao concluir: baixa de {fmtN(projFilaments(p).reduce((s, x) => s + num(x.grams), 0) * num(f.qty))}g de filamento{p.extras && p.extras.length ? `, ${p.extras.length} material(is) extra(s)` : ""}{(() => {
            const hs = orderPrinterHours(p, f).filter((x) => x.printerId && x.hours > 0);
            if (!hs.length) return "";
            const per = {}; hs.forEach((x) => { per[x.printerId] = (per[x.printerId] || 0) + x.hours * num(f.qty); });
            return ", " + Object.entries(per).map(([id, h]) => `+${fmtN(h, 1)}h na ${(data.printers.find((y) => y.id === id) || {}).name || "impressora"}`).join(", ");
          })()}{isStk ? ` e +${fmtN(f.qty)} un no estoque de produtos` : ""}{isBrinde ? ` e +${fmtN(f.qty)} un no estoque de produtos` : ""}.
        </div>}
        <div style={{ display: "flex", justifyContent: "flex-end", gap: 10 }}>
          <Btn kind="ghost" onClick={() => setModal(null)}>Cancelar</Btn>
          <Btn disabled={!f.projectId} onClick={() => {
            const isNew = !item;
            const rec = { ...f, cost: autoCost || f.cost, price: noSale ? "" : f.price, clientId: isStk ? "" : f.clientId, paid: noSale ? false : f.paid, projectName: (projMap[f.projectId] || {}).name || f.projectName || "" };
            saveItem("orders", rec);
            if (["Concluído", "Entregue"].includes(rec.status) && !rec.processed) {
              setOrderStatus(rec, rec.status);
            }
            setModal(null); notify(isNew ? "Pedido criado" : "Pedido atualizado");
          }}>Salvar pedido</Btn>
        </div>
      </Modal>
    );
  }

  /* Impressao avulsa: peca unica, sem cadastrar projeto. So consome material. */
  function QuickPrintModal() {
    const [f, setF] = useState({
      date: todayISO(), name: "", qty: 1,
      printerId: data.printers[0] ? data.printers[0].id : "",
      fils: [{ id: uid(), filamentId: data.filaments[0] ? data.filaments[0].id : "", grams: "" }],
      hours: "", extras: [], price: "", paid: false, clientId: "", note: "",
      print: "unica", parts: [newPart(data.printers, data.filaments, 1)],
    });
    const set = (k) => (e) => setF({ ...f, [k]: e.target.value });
    const s = data.settings;
    const pr = data.printers.find((x) => x.id === f.printerId);
    const q = Math.max(1, num(f.qty));
    const emPartes = f.print === "partes";
    const toggleBtn = (on) => ({ flex: 1, padding: "8px 0", borderRadius: 9, cursor: "pointer", border: on ? "1.5px solid #14A6A4" : "1px solid rgba(63,209,206,.22)", background: on ? "rgba(63,209,206,.1)" : "rgba(12,26,28,.72)", font: "600 12.5px Inter,sans-serif", color: on ? "#3FD1CE" : "#7E9191" });

    /* varios filamentos: cada linha tem seu filamento e suas gramas por peca.
       Em partes: as linhas sao todas as cores de todas as partes. */
    const linhas = emPartes ? f.parts.flatMap((pt) => pt.fils || []) : (f.fils || []);
    const setFil = (i, patch) => setF({ ...f, fils: linhas.map((x, j) => j === i ? { ...x, ...patch } : x) });
    const addFil = () => setF({ ...f, fils: [...linhas, { id: uid(), filamentId: "", grams: "" }] });
    const delFil = (i) => setF({ ...f, fils: linhas.filter((_, j) => j !== i) });
    const gramasTotais = linhas.reduce((sm, l) => sm + num(l.grams), 0);
    /* soma de gramas por filamento (um mesmo filamento pode aparecer em duas linhas) */
    const usoPorFil = linhas.reduce((m, l) => { if (l.filamentId && num(l.grams) > 0) m[l.filamentId] = (m[l.filamentId] || 0) + num(l.grams) * q; return m; }, {});
    const faltando = Object.entries(usoPorFil).filter(([id, g]) => filMap[id] && g > num(filMap[id].stockG));

    const filCost = linhas.reduce((sm, l) => {
      const fl = filMap[l.filamentId];
      return sm + (fl ? num(l.grams) * q * (num(fl.price) / Math.max(1, num(fl.qtyG))) : 0);
    }, 0);
    const horasPeca = emPartes ? partsHours(f.parts) : num(f.hours);
    const maq = emPartes ? partsMachineCost(f.parts, data.printers, s.kwhPrice) : null;
    const energyCost = emPartes ? maq.energy * q : (pr ? num(pr.watts) : 0) / 1000 * num(f.hours) * q * num(s.kwhPrice);
    const deprPerH = pr && num(pr.lifeH) > 0 ? num(pr.price) / num(pr.lifeH) : 0;
    const deprCost = emPartes ? maq.depr * q : deprPerH * num(f.hours) * q;
    const extrasCost = (f.extras || []).reduce((sum, ex) => {
      const m = data.materials.find((mm) => mm.id === ex.materialId);
      return sum + (m ? num(ex.qty) * q * (num(m.cost) / Math.max(1, num(m.qty))) : 0);
    }, 0);
    const custoTotal = filCost + energyCost + deprCost + extrasCost;
    const receita = num(f.price);

    const linha = (label, val, hint) => (
      <div style={{ display: "flex", justifyContent: "space-between", padding: "3px 0", font: "400 12.5px Inter,sans-serif", color: "#93A6A6" }}>
        <span>{label}{hint && <span style={{ color: "#7E9191", fontSize: 11 }}> · {hint}</span>}</span>
        <span style={{ fontFamily: "'JetBrains Mono',monospace", color: "#D6E2E2" }}>{fmt(val)}</span>
      </div>
    );

    const salvar = () => {
      if (!f.name.trim()) { notify("Dê um nome para a impressão."); return; }
      if (!(gramasTotais > 0)) { notify("Informe os gramas de pelo menos um filamento."); return; }
      const cli = cliMap[f.clientId];
      const resumoFil = linhas.filter((l) => l.filamentId && num(l.grams) > 0)
        .map((l) => `${filMap[l.filamentId] ? filMap[l.filamentId].name : "—"}: ${fmtN(num(l.grams) * q)}g`).join("\n");
      const txt = `CONFIRMAR IMPRESSÃO AVULSA\n\n${f.name.trim()} · ${fmtN(q)} un\n`
        + `${resumoFil}\nTotal: ${fmtN(gramasTotais * q)}g · ${fmtN(horasPeca * q, 1)}h${emPartes ? ` de máquina (${f.parts.length} partes)` : ""}\n\n`
        + `Custo total: ${fmt(custoTotal)}\n`
        + (receita > 0 ? `Venda: ${fmt(receita)}${cli ? ` · ${cli.name}` : ""}\nLucro: ${fmt(receita - custoTotal)}\n` : `Sem venda registrada.\n`)
        + `\nO material será baixado do estoque. Confirmar?`;
      if (!confirm(txt)) return;
      setData((d) => {
        const materials = d.materials.map((m) => {
          const ex = (f.extras || []).find((e) => e.materialId === m.id);
          if (!ex) return m;
          const usado = num(ex.qty) * q;
          return { ...m, stock: Math.max(0, num(m.stock) - usado),
            movements: [{ id: uid(), date: f.date, type: "saida", qty: usado, note: `Impressão avulsa: ${f.name.trim()}` }, ...(m.movements || [])] };
        });
        return { ...d,
          filaments: d.filaments.map((x) => usoPorFil[x.id] ? { ...x, stockG: Math.max(0, num(x.stockG) - usoPorFil[x.id]) } : x),
          printers: d.printers.map((x) => {
            const h = emPartes ? (partsByPrinter(f.parts)[x.id] || 0) * q : (x.id === f.printerId ? num(f.hours) * q : 0);
            return h > 0 ? { ...x, hoursUsed: num(x.hoursUsed) + h } : x;
          }),
          materials,
          orders: [...d.orders, {
            id: uid(), projectId: "", projectName: f.name.trim(), clientId: f.clientId || "", qty: q,
            date: f.date, dueDate: "", price: receita > 0 ? receita.toFixed(2) : "", cost: custoTotal.toFixed(2),
            status: "Entregue", printerId: emPartes ? "" : f.printerId, paid: receita > 0 ? !!f.paid : false,
            processed: true, fromStock: true, dest: receita > 0 ? "venda" : "avulso",
            note: f.note, quick: true,
            ...(emPartes ? { quickParts: f.parts.map((pt) => ({ name: pt.name, printerId: pt.printerId, hours: num(pt.hours) * q })) } : {}),
            quickFils: linhas.filter((l) => l.filamentId && num(l.grams) > 0)
              .map((l) => ({ filamentId: l.filamentId, grams: num(l.grams) * q })),
            ts: nowStamp(),
          }],
        };
      });
      setModal(null);
      notify(`Impressão avulsa registrada: -${fmtN(gramasTotais * q)}g em ${Object.keys(usoPorFil).length} filamento(s)${receita > 0 ? ` · venda de ${fmt(receita)}` : ""}`);
    };

    return (
      <Modal title="Impressão avulsa (sem projeto)" onClose={() => setModal(null)} wide>
        <div style={{ font: "400 12.5px Inter,sans-serif", color: "#7E9191", marginBottom: 14 }}>
          Para peças que você imprime uma vez só e não vale cadastrar como projeto. Baixa o material do estoque; o valor de venda é opcional.
        </div>
        <Row cols={3}>
          <div><L>O que foi impresso</L><In value={f.name} onChange={set("name")} placeholder="ex: suporte sob medida" /></div>
          <div><L>Quantidade</L><In type="number" min="1" value={f.qty} onChange={set("qty")} /></div>
          <div><L>Data</L><In type="date" value={f.date} onChange={set("date")} /></div>
        </Row>
        <div style={{ display: "flex", gap: 8, marginBottom: 12 }}>
          <button onClick={() => setF({ ...f, print: "unica" })} style={toggleBtn(!emPartes)}>Peça única</button>
          <button onClick={() => setF({ ...f, print: "partes" })} style={toggleBtn(emPartes)}>Em partes (cada parte na sua impressora)</button>
        </div>
        {emPartes ? (
          <div style={{ border: "1px solid rgba(63,209,206,.14)", borderRadius: 12, padding: "12px 14px", marginBottom: 12, background: "rgba(5,12,12,.55)" }}>
            <div style={{ font: "600 11.5px Inter,sans-serif", color: "#3FD1CE", textTransform: "uppercase", letterSpacing: ".06em", marginBottom: 8 }}>Partes (valores por peça)</div>
            <PartsEditor parts={f.parts} onChange={(parts) => setF({ ...f, parts })} printers={data.printers} filaments={data.filaments} unitLabel="por peça" />
          </div>
        ) : (
        <React.Fragment>
        <div style={{ border: "1px solid rgba(63,209,206,.14)", borderRadius: 12, padding: "12px 14px", marginBottom: 12, background: "rgba(5,12,12,.55)" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 8 }}>
            <span style={{ flex: 1, font: "600 11.5px Inter,sans-serif", color: "#3FD1CE", textTransform: "uppercase", letterSpacing: ".06em" }}>
              Filamentos usados{gramasTotais > 0 ? ` · ${fmtN(gramasTotais)}g por peça` : ""}
            </span>
            <Btn small kind="ghost" onClick={addFil}><Plus size={13} />Adicionar filamento</Btn>
          </div>
          {linhas.length === 0 && <div style={{ font: "400 12.5px Inter,sans-serif", color: "#7E9191", padding: "4px 0 8px" }}>Nenhum filamento — clique em "Adicionar filamento".</div>}
          {linhas.map((l, i) => {
            const fl = filMap[l.filamentId];
            const usa = num(l.grams) * q;
            const estouro = fl && (usoPorFil[l.filamentId] || 0) > num(fl.stockG);
            return (
              <div key={l.id || i} style={{ display: "grid", gridTemplateColumns: "1fr 150px 34px", gap: 8, alignItems: "end", marginBottom: 8 }}>
                <div>
                  {i === 0 && <L>Filamento</L>}
                  <Combo value={l.filamentId} onChange={(v) => setFil(i, { filamentId: v })} placeholder="Selecionar…"
                    options={data.filaments.map((x) => ({ value: x.id, label: x.name, sub: (x.color || "sem cor") + " · " + fmtN(x.stockG) + "g" }))} />
                </div>
                <div>
                  {i === 0 && <L>Gramas por peça</L>}
                  <In type="number" value={l.grams} onChange={(e) => setFil(i, { grams: e.target.value })} placeholder="ex: 45"
                    style={estouro ? { borderColor: "#F0605F" } : undefined} />
                  {fl && usa > 0 && <div style={{ font: "400 11px Inter,sans-serif", color: estouro ? "#F0605F" : "#7E9191", marginTop: 3 }}>usa {fmtN(usa)}g · tem {fmtN(fl.stockG)}g</div>}
                </div>
                <Btn small kind="danger" title="Remover este filamento" style={{ justifyContent: "center" }} onClick={() => delFil(i)}><Trash2 size={13} /></Btn>
              </div>
            );
          })}
        </div>
        <Row cols={2}>
          <div><L>Tempo por peça (h)</L><In type="number" step="0.1" value={f.hours} onChange={set("hours")} placeholder="ex: 2.5" /></div>
          <div />
        </Row>
        <Row cols={2}>
          <div><L>Impressora</L>
            <Combo value={f.printerId} onChange={(v) => setF({ ...f, printerId: v })} placeholder="—"
              options={[{ value: "", label: "—" }].concat(data.printers.map((x) => ({ value: x.id, label: x.name })))} />
          </div>
          <div />
        </Row>
        </React.Fragment>
        )}
        <Row cols={1}>

              <label htmlFor="qpaid" style={{ font: "500 13px Inter,sans-serif", color: receita > 0 ? "#D6E2E2" : "#7E9191", cursor: "pointer" }}>Pagamento recebido</label>

          <div style={{ font: "600 11.5px Inter,sans-serif", color: "#3FD1CE", textTransform: "uppercase", letterSpacing: ".06em", marginBottom: 6 }}>Custo da impressão</div>

          {linha("Energia", energyCost, emPartes ? `${f.parts.length} partes · ${fmtHM(horasPeca * q)} de máquina` : (pr ? `${num(pr.watts)}W` : ""))}
          {linha("Depreciação", deprCost, emPartes ? "pela impressora de cada parte" : (deprPerH > 0 ? `${fmt(deprPerH)}/h` : ""))}
          {extrasCost > 0 && linha("Materiais extras", extrasCost)}
          <div style={{ display: "flex", justifyContent: "space-between", borderTop: "1px solid rgba(63,209,206,.14)", marginTop: 8, paddingTop: 8 }}>

            <span style={{ font: "700 16px 'JetBrains Mono',monospace", color: "#D6E2E2" }}>{fmt(custoTotal)}</span>

  function CalibrationModal() {
    const [f, setF] = useState({
      date: todayISO(),
      printerId: data.printers[0] ? data.printers[0].id : "",
      filamentId: data.filaments[0] ? data.filaments[0].id : "",
      grams: "",
      hours: "",
      note: "",
    });
    const set = (k) => (e) => setF({ ...f, [k]: e.target.value });
    const pr = data.printers.find((x) => x.id === f.printerId);
    const fil = data.filaments.find((x) => x.id === f.filamentId);
    const s = data.settings;

    const kgPrice = fil ? (num(fil.price) / Math.max(1, num(fil.qtyG))) * 1000 : 0;
    const filCost = num(f.grams) * (kgPrice / 1000);
    const energyCost = (pr ? num(pr.watts) : 0) / 1000 * num(f.hours) * num(s.kwhPrice);
    const deprPerH = pr && num(pr.lifeH) > 0 ? num(pr.price) / num(pr.lifeH) : 0;
    const deprCost = deprPerH * num(f.hours);
    const total = filCost + energyCost + deprCost;
    const semEstoque = fil && num(f.grams) > num(fil.stockG);

    const row = (label, val, hint) => (
      <div style={{ display: "flex", justifyContent: "space-between", padding: "4px 0", font: "400 13px Inter,sans-serif", color: "#93A6A6" }}>
        <span>{label}{hint && <span style={{ color: "#7E9191", fontSize: 11.5 }}> · {hint}</span>}</span>
        <span style={{ fontFamily: "'JetBrains Mono',monospace", color: "#D6E2E2" }}>{fmt(val)}</span>
      </div>
    );

    const confirmar = () => {
      if (!(total > 0)) { notify("Informe ao menos as horas ou os gramas usados."); return; }
      const txt = `CONFIRMAR LANÇAMENTO DE CALIBRAÇÃO\n\n`
        + `Impressora: ${pr ? pr.name : "—"}\n`
        + `Filamento: ${fil ? fil.name : "—"}\n`
        + `Gasto: ${fmtN(f.grams)}g · ${fmtN(f.hours, 1)}h\n\n`
        + `Filamento: ${fmt(filCost)}\nEnergia: ${fmt(energyCost)}\nDepreciação: ${fmt(deprCost)}\n`
        + `─────────────\nTOTAL (despesa): ${fmt(total)}\n\n`
        + `Isso será lançado como despesa em "Calibração" e o filamento será baixado do estoque.\n\nConfirmar?`;
      if (!confirm(txt)) return;
      setData((d) => ({
        ...d,
        filaments: d.filaments.map((x) => x.id === f.filamentId ? { ...x, stockG: Math.max(0, num(x.stockG) - num(f.grams)) } : x),
        printers: d.printers.map((x) => x.id === f.printerId ? { ...x, hoursUsed: num(x.hoursUsed) + num(f.hours) } : x),
        cashflow: [...(d.cashflow || []), {
          id: uid(), date: f.date, kind: "out", value: total.toFixed(2), cat: "Calibração",
          desc: `Calibração${pr ? ` · ${pr.name}` : ""}${fil ? ` · ${fil.name}` : ""} · ${fmtN(f.grams)}g · ${fmtN(f.hours, 1)}h${f.note ? ` — ${f.note}` : ""}`,
          ts: nowStamp(),
        }],
      }));
      setModal(null);
      notify(`Calibração lançada: despesa de ${fmt(total)} · -${fmtN(f.grams)}g de filamento`);
    };

    return (
      <Modal title="Lançar calibração" onClose={() => setModal(null)}>
        <div style={{ font: "400 12.5px Inter,sans-serif", color: "#7E9191", marginBottom: 14 }}>
          Registre o que foi gasto ajustando a impressora (temperatura, fluxo, primeira camada). Entra como despesa, sem gerar peça.
        </div>
        <Row cols={2}>
          <div><L>Data</L><In type="date" value={f.date} onChange={set("date")} /></div>
          <div><L>Impressora {pr ? `· ${num(pr.watts)}W` : ""}</L>
            <Combo value={f.printerId} onChange={(v) => setF({ ...f, printerId: v })} placeholder="—"
              options={[{ value: "", label: "—" }].concat(data.printers.map((x) => ({ value: x.id, label: x.name })))} />
          </div>
        </Row>
        <Row cols={1}>
          <div><L>Filamento usado</L>
            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
              <span style={{ width: 14, height: 14, borderRadius: "50%", background: fil ? (fil.colorHex || "rgba(63,209,206,.22)") : "rgba(12,26,28,.72)", border: "1.5px solid rgba(63,209,206,.22)", flexShrink: 0 }} />
              <div style={{ flex: 1 }}>
                <Combo value={f.filamentId} onChange={(v) => setF({ ...f, filamentId: v })} placeholder="Selecionar filamento…"
                  options={data.filaments.map((x) => ({ value: x.id, label: x.name, sub: x.type + ", " + (x.color || "sem cor") + " · " + fmtN(x.stockG) + "g em estoque" }))} />
              </div>
            </div>
          </div>
        </Row>
        <Row cols={2}>
          <div><L>Filamento gasto (g)</L><In type="number" value={f.grams} onChange={set("grams")} placeholder="ex: 45" /></div>
          <div><L>Tempo de impressora (h)</L><In type="number" step="0.1" value={f.hours} onChange={set("hours")} placeholder="ex: 1.5" /></div>
        </Row>
        <Row cols={1}>
          <div><L>Observação (opcional)</L><In value={f.note} onChange={set("note")} placeholder="ex: calibração de fluxo do PETG preto" /></div>
        </Row>
        {semEstoque && (
          <div style={{ font: "400 12.5px Inter,sans-serif", color: "#FFB067", background: "#2E2413", borderRadius: 9, padding: "8px 12px", marginBottom: 12 }}>
            ⚠ Estoque insuficiente: {fil.name} tem {fmtN(fil.stockG)}g e você informou {fmtN(f.grams)}g.
          </div>
        )}
        <div style={{ border: "1px solid rgba(63,209,206,.14)", borderRadius: 12, padding: "12px 14px", marginBottom: 14, background: "rgba(5,12,12,.55)" }}>
          <div style={{ font: "600 11.5px Inter,sans-serif", color: "#3FD1CE", textTransform: "uppercase", letterSpacing: ".06em", marginBottom: 6 }}>Custo da calibração</div>
          {row("Filamento", filCost, fil ? `${fmt(kgPrice)}/kg` : "")}
          {row("Energia", energyCost, pr ? `${num(pr.watts)}W × ${fmt(s.kwhPrice)}/kWh` : "")}
          {row("Depreciação da impressora", deprCost, deprPerH > 0 ? `${fmt(deprPerH)}/h` : "")}
          <div style={{ display: "flex", justifyContent: "space-between", borderTop: "1px solid rgba(63,209,206,.14)", marginTop: 8, paddingTop: 8 }}>
            <span style={{ font: "700 13.5px 'Space Grotesk',sans-serif", color: "#D6E2E2" }}>Total a lançar como despesa</span>
            <span style={{ font: "700 16px 'JetBrains Mono',monospace", color: "#F0605F" }}>−{fmt(total)}</span>
          </div>
        </div>
        <div style={{ display: "flex", justifyContent: "flex-end", gap: 10 }}>
          <Btn kind="ghost" onClick={() => setModal(null)}>Cancelar</Btn>
          <Btn onClick={confirmar} disabled={!(total > 0)}>Lançar calibração</Btn>
        </div>
      </Modal>
    );
  }

  /* ================================ CLIENTES =============================== */
  const comebackMsg = (c, lastProj) => {
    const si = data.storeInfo || {};
    return `Oi, ${firstName(c && c.name)}! Tudo bem? 😊\nAqui é da ${si.name || "PrintAR 3D"}. Faz um tempinho que a gente não se fala!${lastProj ? `\nLembrei de você — o ${lastProj} ficou bem bacana.` : ""}\nTemos novidades e posso fazer algo sob medida pra você. Quer ver umas ideias?${si.instagram ? `\n📸 ${String(si.instagram).startsWith("@") ? si.instagram : "@" + si.instagram}` : ""}`;
  };
  function Clients() {
    const today = todayISO();
    const [seg, setSegS] = useState(CLI_UI.seg);
    const setSeg = (v) => { CLI_UI.seg = v; setSegS(v); setCliPage(1); };
    const [q, setQS] = useState(CLI_UI.q);
    const setQ = (v) => { CLI_UI.q = v; setQS(v); setCliPage(1); };
    const [nicheF, setNicheS] = useState(CLI_UI.niche);
    const setNicheF = (v) => { CLI_UI.niche = v; setNicheS(v); setCliPage(1); };
    const [sortBy, setSortS] = useState(CLI_UI.sort);
    const setSortBy = (v) => { CLI_UI.sort = v; setSortS(v); };
    const [cliPage, setCliPage] = useState(1);
    const [menu, setMenu] = useState(null);
    useEffect(() => {
      if (!menu) return;
      const close = (e) => { if (!(e.target.closest && e.target.closest(".neo-qmenu, .neo-qmore"))) setMenu(null); };
      document.addEventListener("mousedown", close);
      return () => document.removeEventListener("mousedown", close);
    }, [menu]);
    /* estatisticas por cliente */
    const months6 = Array.from({ length: 6 }).map((_, i) => { const d = new Date(thisMonth + "-15T12:00:00"); d.setMonth(d.getMonth() - (5 - i)); return d.toISOString().slice(0, 7); });
    const stats = {};
    data.clients.forEach((c) => {
      const ords = clientOrders(c.id);
      const sales = ords.filter((o) => isSale(o) && isDone(o));
      const spent = sales.reduce((s, o) => s + num(o.price), 0);
      const dates = ords.map((o) => o.date).filter(Boolean).sort();
      const last = ords.slice().sort((a, b) => (b.date > a.date ? 1 : -1))[0];
      const debt = sales.filter((o) => !o.paid);
      const bars = months6.map((m) => sales.filter((o) => monthKey(o.date) === m).reduce((s, o) => s + num(o.price), 0));
      stats[c.id] = { n: ords.length, spent, ticket: sales.length ? spent / sales.length : 0, first: dates[0] || null, last, lastDays: last ? daysSince(last.date) : null, debt: debt.reduce((s, o) => s + num(o.price), 0), debtSince: debt.length ? debt.map((o) => o.date).sort()[0] : null, bars };
    });
    const buyers = data.clients.filter((c) => stats[c.id].spent > 0).sort((a, b) => stats[b.id].spent - stats[a.id].spent);
    const vipN = Math.max(buyers.length ? 1 : 0, Math.ceil(buyers.length * 0.2));
    const vipSet = new Set(buyers.slice(0, vipN).map((c) => c.id));
    const segOf = (c) => {
      const s = stats[c.id];
      return {
        vip: vipSet.has(c.id),
        rec: s.n >= 2,
        novo: !!s.first && daysSince(s.first) <= 30,
        sumido: s.n > 0 && s.lastDays != null && s.lastDays > 60,
        devendo: s.debt > 0,
      };
    };
    const segs = {}; data.clients.forEach((c) => { segs[c.id] = segOf(c); });
    const cnt = (k) => data.clients.filter((c) => segs[c.id][k]).length;
    const list = data.clients
      .filter((c) => !q || c.name.toLowerCase().includes(q.toLowerCase()) || (c.phone || "").includes(q))
      .filter((c) => nicheF === "Todos" || (c.niches || []).includes(nicheF))
      .filter((c) => seg === "todos" || segs[c.id][seg])
      .sort((a, b) => sortBy === "az" ? a.name.localeCompare(b.name, "pt-BR") : sortBy === "recente" ? ((stats[b.id].last ? stats[b.id].last.date : "") > (stats[a.id].last ? stats[a.id].last.date : "") ? 1 : -1) : stats[b.id].spent - stats[a.id].spent);
    const PER = 24;
    const pageCount = Math.max(1, Math.ceil(list.length / PER));
    const curPage = Math.min(cliPage, pageCount);
    const pageList = list.slice((curPage - 1) * PER, curPage * PER);
    /* numeros do topo */
    const newMonth = data.clients.filter((c) => stats[c.id].first && stats[c.id].first >= thisMonth + "-01").length;
    const active90 = data.clients.filter((c) => stats[c.id].last && stats[c.id].last.date >= addDays(today, -89)).length;
    const withOrders = data.clients.filter((c) => stats[c.id].n > 0);
    const recPct = withOrders.length ? (withOrders.filter((c) => stats[c.id].n >= 2).length / withOrders.length) * 100 : null;
    const avgVal = buyers.length ? buyers.reduce((s, c) => s + stats[c.id].spent, 0) / buyers.length : 0;
    const filters = [["todos", "Todos", data.clients.length, ""], ["vip", "⭐ VIP", cnt("vip"), "g"], ["rec", "Recorrentes", cnt("rec"), ""], ["novo", "Novos", cnt("novo"), ""], ["sumido", "Sumidos", cnt("sumido"), "o"], ["devendo", "Devendo", cnt("devendo"), "r"]];
    const relDays = (d) => (d === 0 ? "hoje" : d === 1 ? "há 1 dia" : `há ${d} dias`);
    return (
      <div className="neo-clients">
        <div className="neo-pagehead">
          <span className="neo-code">CLIENTES</span><h2>CRM</h2>
          <button className="neo-b1" style={{ marginLeft: "auto" }} onClick={() => setModal({ type: "client" })}><Plus size={15} />Cadastrar cliente</button>
        </div>
        <div className="neo-ckpis">
          <Reveal className="neo-hud neo-k" delay={0}><div className="l">Clientes</div><div className="v"><CountUp value={data.clients.length} /></div><span className="neo-kd">{newMonth ? `+${newMonth} novo${newMonth > 1 ? "s" : ""} este mês` : "nenhum novo este mês"}</span></Reveal>
          <Reveal className="neo-hud neo-k" delay={60}><div className="l">Ativos (90 dias)</div><div className="v" style={{ color: "#3FD1CE" }}><CountUp value={active90} /></div><span className="neo-kd">compraram nos últimos 3 meses</span></Reveal>
          <Reveal className="neo-hud neo-k" delay={120}><div className="l">Voltam a comprar</div><div className="v">{recPct == null ? "—" : <CountUp value={recPct} format={(v) => fmtN(v, 0) + "%"} />}</div><span className="neo-kd">clientes com 2+ pedidos</span></Reveal>
          <Reveal className="neo-hud neo-k or" delay={180}><div className="l">Valor médio por cliente</div><div className="v"><CountUp value={avgVal} format={fmt} /></div><span className="neo-kd">total gasto ÷ clientes que compraram</span></Reveal>
        </div>
        <div className="neo-penbar">
          <div className="neo-fchips">{filters.map(([k, l, n, tone]) => <button key={k} className={"neo-fchip cli-seg" + (seg === k ? " on" : "") + (tone ? " " + tone : "")} data-s={k} onClick={() => setSeg(k)}>{l} {n}</button>)}</div>
          <Sel value={sortBy} onChange={(e) => setSortBy(e.target.value)} style={{ width: 200, marginLeft: "auto", height: 36, padding: "6px 10px" }} title="Ordenar">
            <option value="gasto">Ordenar: maior gasto</option><option value="recente">Ordenar: mais recente</option><option value="az">Ordenar: A–Z</option>
          </Sel>
          <Sel value={nicheF} onChange={(e) => setNicheF(e.target.value)} style={{ width: 160, height: 36, padding: "6px 10px" }} title="Nicho">
            <option value="Todos">Nicho: todos</option>{data.settings.niches.map((n) => <option key={n} value={n}>{n}</option>)}
          </Sel>
          <div className="neo-search" style={{ marginLeft: 0 }}><SearchIc size={14} /><input value={q} onChange={(e) => setQ(e.target.value)} placeholder="Nome ou telefone…" />{q && <button onClick={() => setQ("")}>×</button>}</div>
        </div>
        {list.length === 0 ? (
          <Card><Empty icon={UsersIc} text={q || nicheF !== "Todos" || seg !== "todos" ? "Nenhum cliente encontrado" : "Nenhum cliente cadastrado"} hint="Conheça seus clientes: registre interesses e nichos para vender mais e melhor." /></Card>
        ) : (
          <div className="neo-cgrid">
            {pageList.map((c, idx) => {
              const s = stats[c.id], g = segs[c.id];
              const tone = g.devendo ? "debt" : g.vip ? "vip" : g.sumido ? "gone" : "";
              const mx = Math.max(...s.bars, 0);
              const lastName = s.last ? projName(s.last) : "";
              const waBtn = g.devendo
                ? { label: "Cobrar", msg: () => cobrarMsg(c, clientOrders(c.id).filter((o) => isSale(o) && isDone(o) && !o.paid)), tip: "Mensagem de cobrança pronta" }
                : g.sumido ? { label: "Chamar de volta", msg: () => comebackMsg(c, lastName), tip: "Mensagem simpática para quem sumiu" }
                : { label: "WhatsApp", msg: () => `Oi, ${firstName(c.name)}! Tudo bem? 😊`, tip: "Abrir conversa" };
              return (
                <Reveal key={c.id} className={"neo-ccard " + tone} delay={Math.min(idx, 9) * 40} title={c.name} style={menu === c.id ? { zIndex: 30 } : undefined}>
                  <div className="top">
                    <span className="av">{c.name.slice(0, 1).toUpperCase()}</span>
                    <div className="nm"><b>{c.name}</b><small>{c.phone || "sem telefone"}{c.city ? ` · ${c.city}` : ""}</small></div>
                  </div>
                  <div className="tags">
                    {g.vip && <span className="neo-ctag g">⭐ VIP</span>}
                    {g.rec && <span className="neo-ctag t">Recorrente</span>}
                    {g.novo && <span className="neo-ctag t">Novo</span>}
                    {g.sumido && <span className="neo-ctag o">Sumido · {s.lastDays} dias</span>}
                    {g.devendo && <span className="neo-ctag r">Devendo</span>}
                    {(c.niches || []).map((n) => <span key={n} className="neo-cniche">{n}</span>)}
                  </div>
                  <div className="stats">
                    <div>PEDIDOS<b>{fmtN(s.n)}</b></div>
                    <div>TOTAL<b style={{ color: "#3FD1CE" }}>{fmt(s.spent)}</b></div>
                    <div>TICKET<b>{s.ticket ? fmt(s.ticket) : "—"}</b></div>
                  </div>
                  <div className="spark" title="Compras dos últimos 6 meses">{s.bars.map((v, i) => <i key={i} className={v > 0 ? "" : "z"} style={v > 0 ? { height: Math.max(12, (v / mx) * 100) + "%" } : undefined} title={`${months6[i]}: ${fmt(v)}`} />)}</div>
                  {s.debt > 0
                    ? <div className="debtline"><span>A receber {relDays(daysSince(s.debtSince))}</span><span>{fmt(s.debt)}</span></div>
                    : <div className="last"><span>{s.last ? <>Último: <b>{lastName} × {fmtN(s.last.qty)}</b></> : "Ainda sem pedidos"}</span><span>{s.last ? relDays(s.lastDays) : ""}</span></div>}
                  <div className="neo-oacts left">
                    <button className={"neo-bg2 wa cli-wa"} disabled={!c.phone} title={c.phone ? waBtn.tip : "Cadastre o telefone do cliente para usar"} onClick={() => waOpen(c.phone, waBtn.msg())}><WaIc size={13} />{waBtn.label}</button>
                    <button className="neo-bg2 cli-orc" title="Novo orçamento já com este cliente" onClick={() => setModal({ type: "quote", clientId: c.id })}><Plus size={13} />Orçamento</button>
                    <button className="neo-bg2 ic" title="Ver ficha" onClick={() => setModal({ type: "clientDetail", item: c })}><EyeIc size={13} /></button>
                    <button className="neo-bg2 ic" title="Editar" onClick={() => setModal({ type: "client", item: c })}><Pencil size={13} /></button>
                    <button className={"neo-bg2 ic neo-qmore" + (menu === c.id ? " on" : "")} title="Mais opções" onClick={() => setMenu(menu === c.id ? null : c.id)}>⋯</button>
                    {menu === c.id && (

                      </div>
                    )}
                  </div>
                </Reveal>
              );
            })}
          </div>
        )}
        <Pager total={list.length} page={curPage} per={PER} setPage={setCliPage} />
      </div>
    );
  }

          <L>Nichos de interesse (para ofertas certeiras)</L>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginTop: 4 }}>
            {data.settings.niches.map((n) => {

                <button key={n} onClick={() => toggleNiche(n)} style={{
                  borderRadius: 999, padding: "5px 12px", cursor: "pointer", font: "600 12px Inter,sans-serif",
                  border: on ? "1.5px solid #14A6A4" : "1px solid rgba(63,209,206,.22)",
                  background: on ? "rgba(63,209,206,.1)" : "rgba(12,26,28,.72)", color: on ? "#3FD1CE" : "#7E9191",
                }}>{n}</button>
              );
            })}
            <button onClick={() => { const n = prompt("Nome do novo nicho:"); if (n && n.trim()) { addNiche(n); setF((x) => ({ ...x, niches: [...(x.niches || []), n.trim()] })); } }}
              style={{ borderRadius: 999, padding: "5px 12px", cursor: "pointer", font: "600 12px Inter,sans-serif", border: "1px dashed #5FA3A3", background: "rgba(12,26,28,.72)", color: "#3FD1CE" }}>
              + novo nicho

        </div>
        <Row cols={1}><div><L>Observações (gostos, datas importantes, contexto…)</L><In value={f.notes} onChange={set("notes")} placeholder="ex: aniversário em março, coleciona miniaturas de carros…" /></div></Row>
        <div style={{ display: "flex", justifyContent: "flex-end", gap: 10 }}>

          <Btn disabled={!f.name} onClick={() => { saveItem("clients", { ...f }); setModal(null); notify(item ? "Cliente atualizado" : "Cliente cadastrado"); }}>Salvar cliente</Btn>
        </div>
      </Modal>
    );
  }

            <thead><tr><Th s={sCli} col="date">Data</Th><Th s={sCli} col="project">Projeto</Th><Th s={sCli} col="qty">Qtd</Th><Th s={sCli} col="price">Valor</Th><Th s={sCli} col="status">Status</Th></tr></thead>
            <tbody>

              }).map((o) => (
                <tr key={o.id}>
                  <td>{fmtDate(o.date)}</td>
                  <td style={{ fontWeight: 600 }}>{projName(o)}{o.dest === "brinde" && <span style={{ background: "#331A1A", color: "#F0605F", borderRadius: 999, padding: "2px 8px", font: "600 10.5px Inter,sans-serif", marginLeft: 6 }}>brinde</span>}{o.giftNote && <div style={{ font: "400 11px Inter,sans-serif", color: "#8FA3A3" }}>{o.giftNote}</div>}</td>
                  <td style={{ fontFamily: "'JetBrains Mono',monospace" }}>{fmtN(o.qty)}</td>
                  <td style={{ fontFamily: "'JetBrains Mono',monospace", fontWeight: 600 }}>{o.dest === "brinde" ? "—" : fmt(o.price)}</td>
                  <td><span style={{ background: (STATUS_STYLE[o.status] || {}).bg, color: (STATUS_STYLE[o.status] || {}).fg, borderRadius: 999, padding: "3px 10px", font: "600 11.5px Inter,sans-serif" }}>{o.status}</span></td>

        {sugg.length > 0 && (

            <div style={{ font: "600 12.5px Inter,sans-serif", color: "#3FD1CE", marginBottom: 4 }}>💡 Sugestões de oferta (projetos nos nichos deste cliente)</div>
            <div style={{ font: "400 13px Inter,sans-serif", color: "#D6E2E2" }}>{sugg.map((p) => p.name).join(" · ")}</div>
