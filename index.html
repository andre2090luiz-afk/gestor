            } else notify("Material salvo no estoque");
            setModal(null);
          }}>Salvar material</Btn>
        </div>
      </Modal>
    );
  }

  function MovementModal() {
    const [f, setF] = useState({ materialId: data.materials[0] ? data.materials[0].id : "", type: "entrada", qty: 1, note: "", payValue: "" });
    const [launch, setLaunch] = useState(true);
    const set = (k) => (e) => setF({ ...f, [k]: e.target.value });
    const mat = data.materials.find((m) => m.id === f.materialId);
    const suggested = mat ? num(mat.unitCost) * num(f.qty) : 0;
    const payFinal = f.payValue === "" ? suggested : num(f.payValue);
    return (
      <Modal title="Entrada / Saída manual de estoque" onClose={() => setModal(null)}>
        <Row cols={1}>
          <div><L>Material</L>
            <Sel value={f.materialId} onChange={set("materialId")}>
              {data.materials.map((m) => <option key={m.id} value={m.id}>{m.name} ({fmtN(m.stock)} un)</option>)}
            </Sel>
          </div>
        </Row>
        <Row>
          <div><L>Tipo</L><Sel value={f.type} onChange={set("type")}><option value="entrada">Entrada (+)</option><option value="saida">Saída (−)</option></Sel></div>
          <div><L>Quantidade (un)</L><In type="number" value={f.qty} onChange={set("qty")} /></div>
        </Row>
        <Row cols={1}><div><L>Observação</L><In value={f.note} onChange={set("note")} placeholder="ex: perda, brinde, ajuste de contagem…" /></div></Row>
        {f.type === "entrada" && (
          <div style={{ background: "rgba(5,12,12,.55)", border: "1px dashed #5FA3A3", borderRadius: 10, padding: "10px 12px", marginBottom: 12 }}>
            <label style={{ display: "flex", gap: 9, alignItems: "flex-start", cursor: "pointer" }}>
              <input type="checkbox" checked={launch} onChange={(e) => setLaunch(e.target.checked)} style={{ width: 16, height: 16, accentColor: "#14A6A4", marginTop: 1 }} />
              <span style={{ font: "400 12.5px Inter,sans-serif", color: "#2A4A4A" }}>
                <b style={{ color: "#3FD1CE" }}>Foi uma compra? Lançar como gasto em Investimentos</b><br />
                <span style={{ color: "#6FA3A3" }}>Desmarque se foi ajuste de contagem, devolução ou se a compra já foi lançada.</span>
              </span>
            </label>
            {launch && (
              <div style={{ marginTop: 10 }}>
                <L>Valor pago (R$)</L>
                <In type="number" step="0.01" value={f.payValue} onChange={set("payValue")} placeholder={suggested > 0 ? `sugestão: ${fmt(suggested)} (${fmtN(f.qty)} un × ${fmt(mat ? mat.unitCost : 0)})` : "informe o valor da compra"} />
              </div>
            )}
          </div>
        )}
        <div style={{ display: "flex", justifyContent: "flex-end", gap: 10 }}>
          <Btn kind="ghost" onClick={() => setModal(null)}>Cancelar</Btn>
          <Btn disabled={!f.materialId || !num(f.qty)} onClick={() => {
            materialMovement(f.materialId, f.type, f.qty, f.note || "Ajuste manual");
            if (f.type === "entrada" && launch && payFinal > 0) {
              saveItem("expenses", { id: uid(), date: todayISO(), category: (mat && mat.category) || "Material", desc: `Compra: ${mat ? mat.name : "material"} (${fmtN(f.qty)} un)`, value: payFinal, units: num(f.qty), materialId: f.materialId });
              notify("Movimentação registrada e gasto lançado em Investimentos");
            } else notify("Movimentação registrada");
            setModal(null);
          }}>Registrar</Btn>
        </div>
      </Modal>
    );
  }

  /* ========================== PRODUTOS (ACABADOS) ========================= */
  /* idade da peca mais antiga ainda no estoque (as saidas consomem primeiro as mais antigas) */
  const oldestStockDate = (projectId) => {
    const evs = prodHistory(projectId);
    const lots = [];
    evs.forEach((e) => {
      if (e.delta > 0) lots.push({ d: e.date, q: e.delta });
      else if (e.delta < 0) { let out = -e.delta; while (out > 0 && lots.length) { const take = Math.min(out, lots[0].q); lots[0].q -= take; out -= take; if (lots[0].q <= 0) lots.shift(); } }
    });
    return lots.length ? lots[0].d : null;
  };
  function Products() {
    const [f, setFS] = useState(PRD_UI.f);
    const setF = (v) => { PRD_UI.f = v; setFS(v); };
    const [sortBy, setSortS] = useState(PRD_UI.sort);
    const setSortBy = (v) => { PRD_UI.sort = v; setSortS(v); };
    const [q, setQS] = useState(PRD_UI.q);
    const setQ = (v) => { PRD_UI.q = v; setQS(v); };
    const [help, setHelp] = useState(false);
    const [pop, setPop] = useState(null);
    useEffect(() => {
      if (!pop) return;
      const close = (e) => { if (!(e.target.closest && e.target.closest(".neo-fpop, .neo-ptile"))) setPop(null); };
      const esc = (e) => { if (e.key === "Escape") setPop(null); };
      document.addEventListener("mousedown", close); document.addEventListener("keydown", esc);
      return () => { document.removeEventListener("mousedown", close); document.removeEventListener("keydown", esc); };
    }, [pop]);
    const all = data.products.filter((p) => num(p.qty) > 0 && projMap[p.projectId]).map((row) => {
      const p = projMap[row.projectId];
      const price = num(p.salePrice) > 0 ? num(p.salePrice) : num(p.cost) * (1 + num(data.settings.defaultMargin) / 100);
      const od = oldestStockDate(row.projectId);
      const age = od ? daysSince(od) : null;
      const res = Math.min(num(row.qty), reservedQty(row.projectId));
      return { row, p, qty: num(row.qty), price, fromMargin: !(num(p.salePrice) > 0), cost: num(p.cost), age, res };
    });
    const parked = all.filter((x) => x.age != null && x.age > 30);
    const nicheCount = {}; all.forEach((x) => projNiches(x.p).forEach((n) => { nicheCount[n] = (nicheCount[n] || 0) + 1; }));
    let list = all.filter((x) => {
      if (q && !x.p.name.toLowerCase().includes(q.toLowerCase())) return false;
      if (f === "__res") return x.res > 0;
      if (f === "__park") return x.age != null && x.age > 30;
      if (f !== "Todos") return projNiches(x.p).includes(f);
      return true;
    });
    list = list.slice().sort((a, b) => sortBy === "nome" ? a.p.name.localeCompare(b.p.name, "pt-BR") : sortBy === "antigos" ? (b.age || 0) - (a.age || 0) : sortBy === "valor" ? b.qty * b.price - a.qty * a.price : b.qty - a.qty);
    const pieces = all.reduce((s, x) => s + x.qty, 0);
    const resTotal = all.reduce((s, x) => s + x.res, 0);
    const costValue = all.reduce((s, x) => s + x.qty * x.cost, 0);
    const saleValue = all.reduce((s, x) => s + x.qty * x.price, 0);
    const parkedVal = parked.reduce((s, x) => s + x.qty * x.price, 0);
    const big = (x) => {
      const mg = x.price > 0 ? ((x.price - x.cost) / x.price) * 100 : null;
      const cs = (() => { const out = []; const seen = new Set(); projFilaments(x.p).forEach((y) => { const fl = filMap[y.filamentId]; if (fl && !seen.has(fl.colorHex)) { seen.add(fl.colorHex); out.push(fl.colorHex); } }); return out; })();
      return (
        <div className="neo-pcard big">
          <button className="neo-mx sm" title="Fechar" onClick={() => setPop(null)} style={{ position: "absolute", top: 8, right: 8, zIndex: 5, width: 26, height: 26 }}><XIc size={14} /></button>
          <div className="ph" onClick={() => setModal({ type: "projectView", item: x.p })}>
            {x.p.image ? <img src={x.p.image} alt={x.p.name} /> : <div className="noimg"><ImageIcon size={30} /></div>}
            <div className="tl"><span className="nch">Pronta entrega</span></div>
            <div className="nm" style={{ right: 90 }}><b>{x.p.name}</b>{cs.length > 0 && <div className="dots">{cs.slice(0, 8).map((c, i) => <i key={i} style={{ background: c }} />)}</div>}</div>
            <div className="neo-pqty"><b>{fmtN(x.qty)}</b><small>EM ESTOQUE</small></div>
          </div>
          <div className="bd">
            <div className="pr">
              <div><div className="l">PREÇO DE VENDA{x.fromMargin ? " (SUGERIDO)" : ""}</div><div className="v">{fmt(x.price)}</div></div>
              {mg != null && <span className={"mg " + marginTone(mg)}>margem {fmtN(mg, 0)}%</span>}
            </div>
            <div className="sold"><span>custo {fmt(x.cost)}/un · total <b>{fmt(x.cost * x.qty)}</b></span><span>{x.age != null ? (x.age === 0 ? "entrou hoje" : `mais antiga há ${x.age} dia${x.age > 1 ? "s" : ""}`) : ""}</span></div>
            {x.res > 0 && <div className="neo-pres">🔒 {fmtN(x.res)} reservada{x.res > 1 ? "s" : ""} em orçamento{x.res > 1 ? "s" : ""} pendente{x.res > 1 ? "s" : ""}</div>}
            {x.age != null && x.age > 30 && <div className="neo-ppark">⏳ parado há mais de 30 dias — vale divulgar</div>}
            <div className="neo-oacts left">
              <button className="neo-bp prd-sell" onClick={() => { setPop(null); setModal({ type: "sell", presetProjectId: x.row.projectId }); }}><BoxSellIc size={13} />Vender</button>
              <button className="neo-bg2 prd-gift" title="Dar como brinde — sai do estoque sem gerar receita" onClick={() => { setPop(null); setModal({ type: "sell", presetProjectId: x.row.projectId, presetMode: "brinde" }); }}><GiftIc size={13} />Brinde</button>
              <button className="neo-bg2 prd-adj" title="Ajuste manual deste produto" onClick={() => { setPop(null); setModal({ type: "prodAdjust", projectId: x.row.projectId }); }}>± Ajustar</button>
              <button className="neo-bg2 ic" title="Movimentações deste produto" onClick={() => { setPop(null); setModal({ type: "prodHistory", projectId: x.row.projectId }); }}><FileTextIc size={13} /></button>
            </div>
          </div>
        </div>
      );
    };
    return (
      <div className="neo-products">
        <div className="neo-pagehead">
          <span className="neo-code">PRONTA ENTREGA</span><h2>Estoque de produtos</h2>
          <button className={"neo-help" + (help ? " on" : "")} onClick={() => setHelp(!help)} title="Como funciona">?</button>
          <div className="neo-oacts" style={{ marginLeft: "auto" }}>
            <Btn kind="ghost" onClick={() => setModal({ type: "prodHistory" })} disabled={data.projects.length === 0}><FileTextIc size={15} />Movimentações</Btn>
            <Btn kind="ghost" onClick={() => setModal({ type: "prodAdjust" })} disabled={data.projects.length === 0}><UploadIc size={15} />Ajuste manual</Btn>
            <Btn kind="ghost" onClick={() => setModal({ type: "sell", presetMode: "brinde" })} disabled={all.length === 0}><GiftIc size={15} />Dar brinde</Btn>
            <Btn kind="orange" onClick={() => setModal({ type: "sell" })} disabled={all.length === 0}><BoxSellIc size={16} />Vender do estoque</Btn>
          </div>
        </div>
        {help && <div className="neo-hud neo-helpbox">💡 Produtos prontos para venda. Eles entram aqui quando você conclui um pedido de "Produção para estoque" na aba Pedidos. Clique num produto para vender, dar de brinde ou ajustar — o produto sai do estoque e a receita entra no financeiro.</div>}
        <div className="neo-ckpis">
          <Reveal className="neo-hud neo-k or" delay={0}><div className="l">Peças prontas</div><div className="v"><CountUp value={pieces} format={(v) => fmtN(Math.round(v)) + " un"} /></div><span className="neo-kd">{all.length} produto{all.length === 1 ? "" : "s"}{resTotal ? ` · ${fmtN(resTotal)} reservada${resTotal > 1 ? "s" : ""}` : ""}</span></Reveal>
          <Reveal className="neo-hud neo-k" delay={60}><div className="l">Custo investido</div><div className="v"><CountUp value={costValue} format={fmt} /></div><span className="neo-kd">soma do custo de produção</span></Reveal>
          <Reveal className="neo-hud neo-k" delay={120}><div className="l">Potencial de venda</div><div className="v" style={{ color: "#3FD1CE" }}><CountUp value={saleValue} format={fmt} /></div><span className="neo-kd">pelo preço de venda · lucro {fmt(saleValue - costValue)}</span></Reveal>
          <Reveal className="neo-hud neo-k" delay={180} onClick={() => parked.length && setF("__park")}><div className="l">Parado há +30 dias</div><div className="v" style={{ color: parked.length ? "#FFAA5C" : undefined }}>{parked.length ? `${parked.length} produto${parked.length > 1 ? "s" : ""}` : "nenhum"}</div><span className="neo-kd">{parked.length ? `${fmt(parkedVal)} · vale divulgar` : "estoque girando bem ✓"}</span></Reveal>
        </div>
        <div className="neo-penbar">
          <div className="neo-fchips">
            <button className={"neo-fchip prd-f" + (f === "Todos" ? " on" : "")} data-f="Todos" onClick={() => setF("Todos")}>Todos {all.length}</button>
            {Object.keys(nicheCount).sort().map((n) => <button key={n} className={"neo-fchip prd-f" + (f === n ? " on" : "")} data-f={n} onClick={() => setF(n)}>{n} {nicheCount[n]}</button>)}
            {resTotal > 0 && <button className={"neo-fchip prd-f" + (f === "__res" ? " on" : "")} data-f="__res" onClick={() => setF(f === "__res" ? "Todos" : "__res")}>🔒 Reservados {all.filter((x) => x.res > 0).length}</button>}
            {parked.length > 0 && <button className={"neo-fchip o prd-f" + (f === "__park" ? " on" : "")} data-f="__park" onClick={() => setF(f === "__park" ? "Todos" : "__park")}>⏳ Parados {parked.length}</button>}
          </div>
          <Sel value={sortBy} onChange={(e) => setSortBy(e.target.value)} style={{ width: 200, marginLeft: "auto", height: 36, padding: "6px 10px" }} title="Ordenar">
            <option value="qtd">Ordenar: mais peças</option><option value="antigos">Ordenar: mais antigos</option><option value="valor">Ordenar: maior valor</option><option value="nome">Ordenar: nome</option>
          </Sel>
          <div className="neo-search" style={{ marginLeft: 0 }}><SearchIc size={14} /><input value={q} onChange={(e) => setQ(e.target.value)} placeholder="Produto…" />{q && <button onClick={() => setQ("")}>×</button>}</div>
        </div>
        {all.length === 0 ? <Card><Empty icon={BoxSellIc} text="Nenhum produto pronto em estoque" hint='Na aba Pedidos, crie um pedido com destino "Produção para estoque" e conclua — as peças aparecem aqui.' /></Card> : (
          <div className="neo-ptgrid">
            {list.map((x) => (
              <div key={x.row.id} className="neo-fcell">
                <button className={"neo-ptile" + (pop && pop.id === x.row.id ? " on" : "") + (x.age != null && x.age > 30 ? " park" : "")} data-prod={x.row.projectId} title={`${x.p.name} — clique para ver detalhes`}
                  onClick={(e) => { if (pop && pop.id === x.row.id) { setPop(null); return; } const r = e.currentTarget.getBoundingClientRect(); setPop({ id: x.row.id, align: r.left + 300 > window.innerWidth ? "r" : r.left < 300 ? "l" : "c", up: r.top + 430 > window.innerHeight && r.top > 430 }); }}>
                  <div className="pimg">{x.p.image ? <img src={x.p.image} alt="" /> : <ImageIcon size={24} />}<span className="q">{fmtN(x.qty)} un</span>{x.res > 0 && <span className="rz" title="Tem peças reservadas">🔒</span>}</div>
                  <b>{x.p.name}</b>
                </button>
                {pop && pop.id === x.row.id && <div className={"neo-fpop wide a-" + pop.align + (pop.up ? " up" : "")}>{big(x)}</div>}
              </div>
            ))}
            {list.length === 0 && <div className="neo-empty">Nenhum produto neste filtro.</div>}
          </div>
        )}
      </div>
    );
  }

  function SellModal({ presetProjectId, presetMode }) {
    const stockRows = data.products.filter((p) => num(p.qty) > 0 && projMap[p.projectId]);
    const [f, setF] = useState({
      projectId: presetProjectId || (stockRows[0] ? stockRows[0].projectId : ""),
      qty: 1, price: "", unit: "", clientId: "", date: todayISO(), paid: true,
      mode: presetMode === "brinde" ? "brinde" : "venda", giftNote: "",
    });
    const set = (k) => (e) => setF({ ...f, [k]: e.target.value });
    const gift = f.mode === "brinde";
    const p = projMap[f.projectId];
    const max = availableQty(f.projectId);
    const resv = reservedQty(f.projectId);
    const sug = p ? (num(p.salePrice) > 0 ? num(p.salePrice) : num(p.cost) * (1 + num(data.settings.defaultMargin) / 100)) * Math.max(1, num(f.qty)) : 0;
    return (
      <Modal title={gift ? "Dar produto como brinde" : "Vender do estoque"} onClose={() => setModal(null)}>
        <div style={{ marginBottom: 12 }}>
          <L>O que vai acontecer com a peça</L>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
            {[{ v: "venda", t: "Venda para cliente" }, { v: "brinde", t: "Brinde (sem receita)" }].map((op) => {
              const on = f.mode === op.v;
              const ac = op.v === "brinde" ? "#F0605F" : "#14A6A4";
              return (
                <button key={op.v} type="button" onClick={() => setF({ ...f, mode: op.v })}
                  style={{ padding: "10px 12px", borderRadius: 10, cursor: "pointer",
                    border: `1px solid ${on ? ac : "#2B3234"}`, background: on ? (op.v === "brinde" ? "#2A1718" : "#12302F") : "rgba(12,26,28,.72)",
                    color: on ? (op.v === "brinde" ? "#FF8A88" : "#3FD1CE") : "#8FA3A3", font: "600 13px Inter,sans-serif" }}>
                  {op.t}
                </button>
              );
            })}
          </div>
          {gift && <div style={{ font: "400 11.5px Inter,sans-serif", color: "#FFB067", marginTop: 6 }}>A peça sai do estoque e nada entra no financeiro: sem faturamento, sem lucro e sem conta a receber.</div>}
        </div>
        <Row cols={1}>
          <div><L>Produto</L>
            <Combo value={f.projectId} onChange={(v) => setF({ ...f, projectId: v })} placeholder="Selecionar produto…"
              options={stockRows.map((r) => ({ value: r.projectId, label: projMap[r.projectId].name, sub: fmtN(r.qty) + " em estoque" + (reservedQty(r.projectId) > 0 ? " · " + fmtN(availableQty(r.projectId)) + " disp." : "") }))} />
          </div>
        </Row>
        {gift ? (
          <Row cols={2}>
            <div><L>Quantidade (máx {fmtN(max)})</L><In type="number" min="1" max={max} value={f.qty} onChange={(e) => setF({ ...f, qty: e.target.value })} /></div>
            <div><L>Motivo do brinde (opcional)</L><In value={f.giftNote} onChange={set("giftNote")} placeholder="ex.: cortesia, amostra, troca" /></div>
          </Row>
        ) : (
        <Row cols={3}>
          <div><L>Quantidade (máx {fmtN(max)})</L><In type="number" min="1" max={max} value={f.qty} onChange={(e) => {
            const q = e.target.value;
            setF({ ...f, qty: q, price: f.unit !== "" && num(f.unit) > 0 ? (num(f.unit) * Math.max(1, num(q))).toFixed(2) : f.price });
          }} /></div>
          <div><L>Valor POR PEÇA (R$)</L><In type="number" step="0.01" value={f.unit} onChange={(e) => {
            const u = e.target.value;
            setF({ ...f, unit: u, price: num(u) > 0 ? (num(u) * Math.max(1, num(f.qty))).toFixed(2) : f.price });
          }} placeholder={p ? (num(p.cost) * (1 + num(data.settings.defaultMargin) / 100)).toFixed(2) : ""} /></div>
          <div><L>Valor TOTAL da venda (R$)</L><In type="number" step="0.01" value={f.price} onChange={(e) => {
            const t = e.target.value;
            setF({ ...f, price: t, unit: num(t) > 0 && num(f.qty) > 0 ? (num(t) / num(f.qty)).toFixed(2) : f.unit });
          }} placeholder={sug ? sug.toFixed(2) : ""} /></div>
        </Row>
        )}
        {p && (
          <div style={{ background: "rgba(5,12,12,.55)", border: "1px solid rgba(63,209,206,.1)", borderRadius: 10, padding: "8px 12px", marginBottom: 12, display: "flex", gap: 18, flexWrap: "wrap", font: "400 12.5px Inter,sans-serif", color: "#D6E2E2" }}>
            <span>Custo de produção: <b style={{ fontFamily: "'JetBrains Mono',monospace" }}>{fmt(p.cost)}/pç</b>{num(f.qty) > 1 ? ` · total ${fmt(num(p.cost) * num(f.qty))}` : ""}</span>
            {gift
              ? <span>Receita: <b style={{ fontFamily: "'JetBrains Mono',monospace", color: "#FF8A88" }}>R$ 0,00</b> · brinde não entra no faturamento</span>
              : num(f.price) > 0 && <span>Lucro da venda: <b style={{ fontFamily: "'JetBrains Mono',monospace", color: num(f.price) - num(p.cost) * num(f.qty) >= 0 ? "#3FD1CE" : "#F0605F" }}>{fmt(num(f.price) - num(p.cost) * num(f.qty))}</b>{num(f.qty) > 0 ? ` (${fmt((num(f.price) - num(p.cost) * num(f.qty)) / Math.max(1, num(f.qty)))}/pç)` : ""}</span>}
          </div>
        )}
        <Row cols={gift ? 2 : 3}>
          <div><L>Cliente (opcional)</L>
            <div style={{ display: "flex", gap: 8 }}>
              <Sel value={f.clientId} onChange={set("clientId")}>
                <option value="">{gift ? "— sem cliente —" : "— venda avulsa —"}</option>
                {data.clients.map((c) => <option key={c.id} value={c.id}>{c.name}</option>)}
              </Sel>
              <Btn small kind="ghost" style={{ whiteSpace: "nowrap" }} onClick={() => {
                const n = prompt("Nome do novo cliente:");
                if (n && n.trim()) { const c = { id: uid(), name: n.trim(), phone: "", team: "", kids: "", niches: [], notes: "", createdAt: todayISO() }; saveItem("clients", c); setF((x) => ({ ...x, clientId: c.id })); }
              }}><Plus size={13} /></Btn>
            </div>
          </div>
          <div><L>Data</L><In type="date" value={f.date} onChange={set("date")} /></div>
          {!gift && (
          <div style={{ display: "flex", alignItems: "flex-end", gap: 8, paddingBottom: 8 }}>
            <input id="sellpaid" type="checkbox" checked={!!f.paid} onChange={(e) => setF({ ...f, paid: e.target.checked })} style={{ width: 16, height: 16, accentColor: "#14A6A4" }} />
            <label htmlFor="sellpaid" style={{ font: "500 13px Inter,sans-serif", color: "#D6E2E2", cursor: "pointer" }}>Pagamento recebido</label>
          </div>
          )}
        </Row>
        {p && resv > 0 && <div style={{ font: "600 12px Inter,sans-serif", color: "#FFB067", marginBottom: 10 }}>{fmtN(resv)} un deste produto estão reservadas em orçamento pendente — disponível para venda: {fmtN(max)} un.</div>}
        {p && num(f.qty) > max && <div style={{ font: "600 12px Inter,sans-serif", color: "#F0605F", marginBottom: 10 }}>Quantidade maior que o disponível ({fmtN(max)} un).</div>}
        <div style={{ font: "400 12px Inter,sans-serif", color: "#7E9191", marginBottom: 12 }}>
          {gift
            ? 'Ao confirmar: o produto sai do estoque e o brinde fica registrado em Pedidos como "Brinde / Teste" (e no histórico do cliente, se você escolher um). Nenhuma receita é lançada. A matéria-prima não é descontada de novo (já saiu na produção).'
            : 'Ao confirmar: o produto sai do estoque, a venda entra em Pedidos como "Entregue" e soma no faturamento. A matéria-prima não é descontada de novo (já saiu na produção).'}
        </div>
        <div style={{ display: "flex", justifyContent: "flex-end", gap: 10 }}>
          <Btn kind="ghost" onClick={() => setModal(null)}>Cancelar</Btn>
          <Btn kind="orange" style={gift ? { background: "#C4453F" } : undefined} disabled={!f.projectId || !num(f.qty) || num(f.qty) > max || (!gift && !num(f.price))} onClick={() => { if (sellFromStock(f)) setModal(null); }}>{gift ? <GiftIc size={15} /> : null}{gift ? "Confirmar brinde" : "Confirmar venda"}</Btn>
        </div>
      </Modal>
    );
  }

  function ProdAdjustModal({ presetProject }) {
    const [f, setF] = useState({ projectId: presetProject || (data.projects[0] ? data.projects[0].id : ""), type: "entrada", qty: 1 });
    const set = (k) => (e) => setF({ ...f, [k]: e.target.value });
    return (
      <Modal title="Ajuste manual do estoque de produtos" onClose={() => setModal(null)}>
        <Row cols={1}>
          <div><L>Produto (projeto)</L>
            <Combo value={f.projectId} onChange={(v) => setF({ ...f, projectId: v })} placeholder="Selecionar produto…"
              options={data.projects.filter((p) => p.active !== false || prodQty(p.id) > 0).map((p) => ({ value: p.id, label: p.name, sub: fmtN(prodQty(p.id)) + " em estoque" }))} />
          </div>
        </Row>
        <Row>
          <div><L>Tipo</L><Sel value={f.type} onChange={set("type")}><option value="entrada">Entrada (+) — peças que já tenho prontas</option><option value="saida">Saída (−) — perda, brinde, correção</option></Sel></div>
          <div><L>Quantidade (un)</L><In type="number" value={f.qty} onChange={set("qty")} /></div>
        </Row>
        <div style={{ font: "400 12px Inter,sans-serif", color: "#7E9191", marginBottom: 12 }}>Este ajuste não mexe na matéria-prima nem no faturamento — é só contagem de peças prontas.</div>
        <div style={{ display: "flex", justifyContent: "flex-end", gap: 10 }}>
          <Btn kind="ghost" onClick={() => setModal(null)}>Cancelar</Btn>
          <Btn disabled={!f.projectId || !num(f.qty)} onClick={() => {
            const delta = (f.type === "entrada" ? 1 : -1) * num(f.qty);
            setData((d) => {
              const products = changeProductStock(d.products, f.projectId, delta);
              return { ...d, products,
                prodMoves: [...(d.prodMoves || []), { id: uid(), date: todayISO(), ts: nowStamp(), projectId: f.projectId, delta, note: f.type === "entrada" ? "Ajuste manual (entrada)" : "Ajuste manual (saída)" }],
              };
            });
            setModal(null); notify("Estoque de produtos ajustado");
          }}>Registrar</Btn>
        </div>
      </Modal>
    );
  }

  /* ============================== IMPRESSORAS ============================ */
  function Printers() {
    return (
      <div>
        <SectionHead title="Impressoras" count={data.printers.length}>
          <Btn onClick={() => setModal({ type: "printer" })}><Plus size={16} />Cadastrar impressora</Btn>
        </SectionHead>
        {data.printers.length === 0 ? (
          <Card><Empty icon={PrinterIc} text="Nenhuma impressora cadastrada" hint="Cadastre suas máquinas para calcular depreciação e acompanhar manutenção." /></Card>
        ) : (
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill,minmax(280px,1fr))", gap: 14 }}>
            {data.printers.map((p) => {
              const sinceMaint = num(p.hoursUsed) - num(p.lastMaintH || 0);
              const maintPct = Math.min(100, (sinceMaint / Math.max(1, num(data.settings.maintEveryH))) * 100);
              const deprH = num(p.lifeH) > 0 ? num(p.price) / num(p.lifeH) : 0;
              return (
                <Card key={p.id}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
                    <div>
                      <div style={{ font: "600 15px 'Space Grotesk',sans-serif" }}>{p.name}</div>
                      <div style={{ font: "400 12.5px Inter,sans-serif", color: "#7E9191" }}>{p.brand} {p.model}</div>
                    </div>
                    <div style={{ display: "flex", gap: 6 }}>
                      <Btn small kind="ghost" onClick={() => setModal({ type: "printer", item: p })}><Pencil size={13} /></Btn>
                      <Btn small kind="danger" onClick={() => { if (confirm(`Excluir "${p.name}"?`)) delItem("printers", p.id); }}><Trash2 size={13} /></Btn>
                    </div>
                  </div>
                  <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginTop: 12, font: "400 12.5px Inter,sans-serif", color: "#D6E2E2" }}>
                    <div>Valor pago<br /><b style={{ fontFamily: "'JetBrains Mono',monospace" }}>{fmt(p.price)}</b></div>
                    <div>Compra<br /><b>{fmtDate(p.date)}</b></div>
                    <div>Horas de uso<br /><b style={{ fontFamily: "'JetBrains Mono',monospace" }}>{fmtN(p.hoursUsed, 1)}h</b></div>
                    <div>Depreciação/h<br /><b style={{ fontFamily: "'JetBrains Mono',monospace" }}>{fmt(deprH)}</b></div>
                    <div>Consumo<br /><b style={{ fontFamily: "'JetBrains Mono',monospace" }}>{fmtN(p.watts)}W</b></div>
                    <div>Vida útil<br /><b style={{ fontFamily: "'JetBrains Mono',monospace" }}>{fmtN(p.lifeH)}h</b></div>
                  </div>
                  <div style={{ marginTop: 12 }}>
                    <div style={{ display: "flex", justifyContent: "space-between", font: "600 11px Inter,sans-serif", color: maintPct >= 100 ? "#F0605F" : "#7E9191", marginBottom: 4 }}>
                      <span>MANUTENÇÃO ({fmtN(sinceMaint, 0)}h / {fmtN(data.settings.maintEveryH)}h)</span>
                      {maintPct >= 100 && <span>REVISAR ⚠</span>}
                    </div>
                    <div style={{ height: 6, background: "rgba(5,12,12,.55)", borderRadius: 99 }}>
                      <div style={{ height: 6, width: `${maintPct}%`, background: maintPct >= 100 ? "#F0605F" : maintPct > 70 ? "#F47A20" : "#14A6A4", borderRadius: 99 }} />
                    </div>
                    <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginTop: 8, gap: 8, flexWrap: "wrap" }}>
                      <span style={{ font: "400 11px Inter,sans-serif", color: "#8FA3A3" }}>{p.lastMaintDate ? `Última: ${fmtDate(p.lastMaintDate)}` : "Sem manutenção registrada"}{(p.maintLog && p.maintLog.length) ? ` · ${p.maintLog.length} no histórico` : ""}</span>
                      <Btn small kind={maintPct >= 100 ? "primary" : "ghost"} onClick={() => setModal({ type: "maint", item: p })}><WrenchIc size={13} />Registrar manutenção</Btn>
                    </div>
                  </div>
                </Card>
              );
            })}
          </div>
        )}
      </div>
    );
  }

  function MaintModal({ item }) {
    const [f, setF] = useState({ date: todayISO(), notes: "", cost: "", toFin: false });
    const save = () => {
      const entry = { id: uid(), date: f.date, notes: f.notes, cost: num(f.cost), hours: num(item.hoursUsed) };
      const log = (item.maintLog || []).concat(entry);
      saveItem("printers", { ...item, lastMaintH: num(item.hoursUsed), lastMaintDate: f.date, maintLog: log });
      if (num(f.cost) > 0 && f.toFin) { saveItem("cashflow", { id: uid(), date: f.date, kind: "out", desc: `Manutenção: ${item.name}${f.notes ? " — " + f.notes : ""}`, value: num(f.cost) }); }
      setModal(null); notify("Manutenção registrada");
    };
    const set = (k) => (e) => setF({ ...f, [k]: e.target.value });
    return (
      <Modal title={`Manutenção — ${item.name}`} onClose={() => setModal(null)}>
        <div style={{ font: "400 12.5px Inter,sans-serif", color: "#7E9191", background: "rgba(5,12,12,.55)", border: "1px solid rgba(63,209,206,.1)", borderRadius: 10, padding: "9px 11px", marginBottom: 12 }}>
          Registrar zera o contador de horas desde a última manutenção (atual: {fmtN(num(item.hoursUsed) - num(item.lastMaintH || 0), 0)}h).
        </div>
        <Row>
          <div><L>Data</L><In type="date" value={f.date} onChange={set("date")} /></div>
          <div><L>Custo (R$) — opcional</L><In type="number" value={f.cost} onChange={set("cost")} placeholder="0,00" /></div>
        </Row>
        <Row cols={1}><div><L>O que foi feito</L><In value={f.notes} onChange={set("notes")} placeholder="ex: troca de bico, lubrificação dos eixos" /></div></Row>
        {num(f.cost) > 0 && (
          <label style={{ display: "flex", alignItems: "center", gap: 8, font: "400 13px Inter,sans-serif", color: "#D6E2E2", marginBottom: 12, cursor: "pointer" }}>
            <input type="checkbox" checked={f.toFin} onChange={(e) => setF({ ...f, toFin: e.target.checked })} /> Lançar este custo no Financeiro (saída)
          </label>
        )}
        {(item.maintLog && item.maintLog.length > 0) && (
          <div style={{ marginBottom: 12 }}>
            <L>Histórico</L>
            <div style={{ border: "1px solid rgba(63,209,206,.1)", borderRadius: 8, maxHeight: 160, overflowY: "auto" }}>
              {item.maintLog.slice().reverse().map((mx) => (
                <div key={mx.id} style={{ display: "flex", justifyContent: "space-between", gap: 8, padding: "7px 10px", borderBottom: "1px solid rgba(5,12,12,.55)", font: "400 12px Inter,sans-serif" }}>
                  <span><b>{fmtDate(mx.date)}</b>{mx.notes ? " — " + mx.notes : ""}</span>
                  {num(mx.cost) > 0 && <span style={{ fontFamily: "'JetBrains Mono',monospace", color: "#F0605F" }}>{fmt(num(mx.cost))}</span>}
                </div>
              ))}
            </div>
          </div>
        )}
        <div style={{ display: "flex", justifyContent: "flex-end", gap: 10 }}>
          <Btn kind="ghost" onClick={() => setModal(null)}>Cancelar</Btn>
          <Btn onClick={save}>Registrar manutenção</Btn>
        </div>
      </Modal>
    );
  }

  function PrinterModal({ item }) {

  /* ============================= INVESTIMENTOS =========================== */
  const ECAT_ICON = { Filamento: "🧵", Material: "🔩", Embalagem: "📦", Ferramenta: "🛠", "Manutenção": "🔧", Energia: "⚡", Equipamento: "🖨", Marketing: "📣", "Calibração": "🎯", Outro: "•" };
  const ECAT_COLOR = { Filamento: "#3FD1CE", Material: "#A88AF0", Embalagem: "#F5821F", Ferramenta: "#6FA0EA", "Manutenção": "#9AF3EC", Energia: "#FFD166", Equipamento: "#FF6B6B", Marketing: "#FF8AC0", "Calibração": "#8FA0AC", Outro: "#7F9A9B" };
  const STOCK_CATS = ["Filamento", "Material", "Embalagem"];
  const InfoTip = ({ text }) => <span className="neo-info" tabIndex={0}>i<span className="neo-infobox">{text}</span></span>;
  function Expenses() {
    const ecats = data.settings.ecats || DEFAULT_ECATS;
    const [month, setMonthS] = useState(EXP_UI.month || thisMonth);
    const setMonth = (v) => { EXP_UI.month = v; setMonthS(v); };
    const [cat, setCatS] = useState(EXP_UI.cat);
    const setCat = (v) => { EXP_UI.cat = v; setCatS(v); };
    const [q, setQS] = useState(EXP_UI.q);
    const setQ = (v) => { EXP_UI.q = v; setQS(v); };
    const [help, setHelp] = useState(false);
    const [menu, setMenu] = useState(null);
    useEffect(() => {
      if (!menu) return;
      const close = (e) => { if (!(e.target.closest && e.target.closest(".neo-qmenu, .neo-qmore"))) setMenu(null); };
      document.addEventListener("mousedown", close);
      return () => document.removeEventListener("mousedown", close);
    }, [menu]);
    const shiftM = (d) => { const x = new Date(month + "-15T12:00:00"); x.setMonth(x.getMonth() + d); setMonth(x.toISOString().slice(0, 7)); };
    const monthLabel = new Date(month + "-15T12:00:00").toLocaleDateString("pt-BR", { month: "long", year: "numeric" }).replace(" de ", " ");
    const monthList = data.expenses.filter((e) => monthKey(e.date) === month);
    const sumOf = (arr) => arr.reduce((s, e) => s + num(e.value), 0);
    const total = sumOf(monthList);
    const prevKey = (() => { const x = new Date(month + "-15T12:00:00"); x.setMonth(x.getMonth() - 1); return x.toISOString().slice(0, 7); })();
    const prevTotal = sumOf(data.expenses.filter((e) => monthKey(e.date) === prevKey));
    const delta = prevTotal > 0 ? ((total - prevTotal) / prevTotal) * 100 : null;
    const stockSum = sumOf(monthList.filter((e) => STOCK_CATS.includes(e.category)));
    const opSum = total - stockSum;
    const months6 = Array.from({ length: 6 }).map((_, i) => { const x = new Date(month + "-15T12:00:00"); x.setMonth(x.getMonth() - (5 - i)); return x.toISOString().slice(0, 7); });
    const m6 = months6.map((m) => ({ m, v: sumOf(data.expenses.filter((e) => monthKey(e.date) === m)) }));
    const withData = m6.filter((x) => x.v > 0);
    const avg = withData.length ? withData.reduce((s, x) => s + x.v, 0) / withData.length : 0;
    const maxV = Math.max(1, ...m6.map((x) => x.v));
    const catNames = Array.from(new Set([...ecats, ...monthList.map((e) => e.category)]));
    const byCat = catNames.map((c, i) => ({ name: c, value: +sumOf(monthList.filter((e) => e.category === c)).toFixed(2), color: ECAT_COLOR[c] || CHART_COLORS[i % CHART_COLORS.length] })).filter((x) => x.value > 0).sort((a, b) => b.value - a.value);
    const list = monthList.filter((e) => (cat === "Todas" || e.category === cat) && (!q || (e.desc || "").toLowerCase().includes(q.toLowerCase()))).sort((a, b) => (b.date > a.date ? 1 : b.date < a.date ? -1 : 0));
    const days = []; list.forEach((e) => { const last = days[days.length - 1]; if (last && last.d === e.date) last.items.push(e); else days.push({ d: e.date, items: [e] }); });
    return (
      <div className="neo-exp">
        <div className="neo-pagehead">
          <span className="neo-code">INVESTIMENTOS</span><h2>Compras e gastos</h2>
          <button className={"neo-help" + (help ? " on" : "")} onClick={() => setHelp(!help)} title="Como funciona">?</button>
          <div className="neo-oacts" style={{ marginLeft: "auto" }}>
            <button className="neo-bg2 ic exp-prev" title="Mês anterior" onClick={() => shiftM(-1)}>‹</button>
            <span className="neo-mlabel">{monthLabel}</span>
            <button className="neo-bg2 ic exp-next" title="Próximo mês" onClick={() => shiftM(1)}>›</button>
            <Btn onClick={() => setModal({ type: "expense" })}><Plus size={16} />Lançar gasto</Btn>
          </div>
        </div>
        {help && <div className="neo-hud neo-helpbox">💡 Esta é a porta de entrada de tudo que você compra: filamento, materiais, embalagens, energia, ferramentas… As categorias Filamento, Material e Embalagem alimentam o Estoque automaticamente.</div>}
        <div className="neo-ckpis">
          <Reveal className="neo-hud neo-k or" delay={0}><div className="l">Gasto do mês</div><div className="v"><CountUp value={total} format={fmt} /></div>{delta == null ? <span className="neo-kd">sem base para comparar</span> : <span className={"neo-kd " + (delta > 0 ? "dn" : "up")}>{delta > 0 ? "▲" : "▼"} {fmtN(Math.abs(delta), 0)}% vs mês anterior</span>}</Reveal>
          <Reveal className="neo-hud neo-k" delay={60}><div className="l">Virou estoque <InfoTip text="Compras de Filamento, Material e Embalagem. O dinheiro saiu do caixa, mas continua seu em forma de matéria-prima na prateleira — só vira custo quando você imprime e vende a peça (já entra no custo de cada pedido)." /></div><div className="v" style={{ color: "#3FD1CE" }}><CountUp value={stockSum} format={fmt} /></div><span className="neo-kd">{total > 0 ? `${fmtN((stockSum / total) * 100, 0)}% · ` : ""}filamento, material, embalagem</span></Reveal>
          <Reveal className="neo-hud neo-k" delay={120}><div className="l">Custo operacional <InfoTip text="Gastos que não voltam como estoque: energia, ferramentas, manutenção, equipamentos, marketing, calibração e outros. É o dinheiro consumido para manter a produção funcionando — se crescer muito, vale olhar essas despesas." /></div><div className="v"><CountUp value={opSum} format={fmt} /></div><span className="neo-kd">energia, ferramentas, outros</span></Reveal>
          <Reveal className="neo-hud neo-k" delay={180}><div className="l">Média mensal <InfoTip text="Média dos meses com gastos entre os últimos 6 meses (até o mês que você está vendo)." /></div><div className="v"><CountUp value={avg} format={fmt} /></div><span className="neo-kd">últimos 6 meses</span></Reveal>
        </div>
        <div className="neo-penbar">
          <div className="neo-fchips">
            <button className={"neo-fchip exp-cat" + (cat === "Todas" ? " on" : "")} data-c="Todas" onClick={() => setCat("Todas")}>Todas {monthList.length}</button>
            {byCat.map((c) => <button key={c.name} className={"neo-fchip exp-cat" + (cat === c.name ? " on" : "")} data-c={c.name} onClick={() => setCat(c.name)}>{ECAT_ICON[c.name] || "•"} {c.name} {monthList.filter((e) => e.category === c.name).length}</button>)}
          </div>
          <div className="neo-search"><SearchIc size={14} /><input value={q} onChange={(e) => setQ(e.target.value)} placeholder="Descrição…" />{q && <button onClick={() => setQ("")}>×</button>}</div>
        </div>
        <div className="neo-expgrid">
          <div className="neo-hud">
            <span className="neo-code">LANÇAMENTOS</span>
            {list.length === 0 ? <Empty icon={Wallet} text={monthList.length ? "Nenhum gasto neste filtro" : "Nenhum gasto neste mês"} hint="Lance filamento, materiais, embalagens, energia, ferramentas e equipamentos." /> : days.map((g) => (
              <React.Fragment key={g.d}>
                <div className="neo-expday">{new Date(g.d + "T12:00:00").toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit", weekday: "short" }).replace(".", "").toUpperCase()}<span>{fmt(sumOf(g.items))}</span></div>
                {g.items.map((e) => {
                  const isFil = e.category === "Filamento";
                  const linked = (e.materialId && matMap[e.materialId]) || (e.filamentId && filMap[e.filamentId]);
                  const col = ECAT_COLOR[e.category] || "#7F9A9B";
                  const units = num(e.units) > 0 ? `${fmtN(e.units)}${isFil ? " g" : " un"} · ${isFil ? fmt((num(e.value) / num(e.units)) * 1000) + "/kg" : fmt(num(e.value) / num(e.units)) + "/un"}` : "";
                  return (
                    <div key={e.id} className="neo-exrow" style={menu === e.id ? { zIndex: 30, position: "relative" } : undefined}>
                      <span className="ic" style={{ color: col, boxShadow: `0 0 10px ${col}33` }}>{ECAT_ICON[e.category] || "•"}</span>
                      <div style={{ minWidth: 0 }}><b>{e.desc || e.category}{linked && <span className="stk">→ ESTOQUE</span>}</b><small>{e.category}{units ? ` · ${units}` : ""}</small></div>
                      <span className="v">{fmt(e.value)}</span>
                      <div className="neo-oacts">
                        <button className="neo-bg2 ic" title="Editar" onClick={() => setModal({ type: "expense", item: e })}><Pencil size={13} /></button>
                        <button className={"neo-bg2 ic neo-qmore" + (menu === e.id ? " on" : "")} title="Mais opções" onClick={() => setMenu(menu === e.id ? null : e.id)}>⋯</button>
                        {menu === e.id && <div className="neo-qmenu"><button className="r exp-del" onClick={() => { setMenu(null); if (confirm(`Excluir o lançamento "${e.desc || e.category}" (${fmt(e.value)})?`)) delItem("expenses", e.id); }}><Trash2 size={13} />Excluir</button></div>}
                      </div>
                    </div>
                  );
                })}
              </React.Fragment>
            ))}
            {list.length > 0 && <div className="neo-exptotal"><span>Total {cat !== "Todas" || q ? "do filtro" : "do mês"}</span><b>{fmt(sumOf(list))}</b></div>}
          </div>
          <div className="neo-col">
            <Reveal className="neo-hud" delay={60}>
              <span className="neo-code">POR CATEGORIA</span>
              {byCat.length === 0 ? <div className="neo-empty">Sem gastos neste mês.</div> : <HoloDonut gid="exp" totalLabel="TOTAL" unit={(v) => fmt(v)} items={byCat} />}
            </Reveal>
            <Reveal className="neo-hud" delay={120}>
              <span className="neo-code">ÚLTIMOS 6 MESES</span>
              <div className="neo-expbars">
                {m6.map((x) => (
                  <button key={x.m} className={"exp-bar" + (x.m === month ? " on" : "")} title={`${fmt(x.v)} — clique para ver o mês`} onClick={() => setMonth(x.m)}>
                    <small>{x.v > 0 ? fmtN(Math.round(x.v)) : ""}</small>
                    <i style={{ height: Math.max(2, (x.v / maxV) * 100) + "%" }} />
                    <span>{new Date(x.m + "-15T12:00:00").toLocaleDateString("pt-BR", { month: "short" }).replace(".", "")}</span>
                  </button>
                ))}
              </div>
            </Reveal>
          </div>
        </div>
      </div>
    );
  }

    const ftypes = data.settings.ftypes || DEFAULT_FTYPES;
    const [f, setF] = useState(item ? { units: "", stockAction: "none", ...item } : {
      id: uid(), date: todayISO(), category: "Filamento", desc: "", value: "", units: "",
      stockAction: "new", existingId: "", minStock: 10,
      fType: ftypes[0] || "PLA", fColor: "", fColorHex: "#14A6A4",
    });
    const set = (k) => (e) => setF({ ...f, [k]: e.target.value });
    const unitCost = num(f.units) > 0 ? num(f.value) / num(f.units) : 0;
    const isFil = f.category === "Filamento" && !item;
    const isMat = STOCK_CATS.includes(f.category) && !item;
    const stockable = (isFil || isMat) && num(f.units) > 0;
    return (
      <Modal title={item ? "Editar gasto" : "Lançar gasto / compra"} onClose={() => setModal(null)} wide>
        <Row>
          <div><L>Data</L><In type="date" value={f.date} onChange={set("date")} /></div>
          <div><L>Categoria</L><Sel value={f.category} onChange={set("category")}>{ecats.map((c) => <option key={c}>{c}</option>)}</Sel></div>
        </Row>
        <Row cols={1}><div><L>Descrição</L><In value={f.desc} onChange={set("desc")} placeholder={isFil ? "ex: Voolt PLA Verde 1kg" : "ex: Argola de chaveiro 25mm (pacote 200un)"} /></div></Row>
        <Row cols={3}>
          <div><L>Valor pago (R$)</L><In type="number" value={f.value} onChange={set("value")} /></div>
          <div><L>{isFil ? "Quantidade (gramas)" : "Quantas unidades vêm?"}</L><In type="number" value={f.units} onChange={set("units")} placeholder={isFil ? "ex: 1000" : "ex: 200"} /></div>
          <div><L>{isFil ? "Custo por kg" : "Custo por unidade"}</L><In disabled value={num(f.units) > 0 ? (isFil ? fmt(unitCost * 1000) : fmt(unitCost)) : "—"} style={{ background: "rgba(63,209,206,.06)" }} /></div>
        </Row>

        {isFil && num(f.units) > 0 && (
          <div style={{ border: "1px dashed #5FA3A3", background: "rgba(5,12,12,.55)", borderRadius: 10, padding: 12, marginBottom: 12 }}>
            <div style={{ font: "600 12.5px Inter,sans-serif", color: "#3FD1CE", marginBottom: 8 }}>🧵 Entrada automática no estoque de filamentos</div>
            <Row>
              <div><L>O que fazer?</L>
                <Sel value={f.stockAction} onChange={set("stockAction")}>
                  <option value="new">Cadastrar bobina nova</option>
                  <option value="existing">Somar a um filamento existente</option>
                  <option value="none">Não controlar estoque deste gasto</option>
                </Sel>
              </div>
              {f.stockAction === "existing" ? (
                <div><L>Filamento existente</L>
                  <Sel value={f.existingId} onChange={set("existingId")}>
                    <option value="">— selecionar —</option>
                    {data.filaments.map((x) => <option key={x.id} value={x.id}>{x.name} ({x.type}, {fmtN(x.stockG)}g)</option>)}
                  </Sel>
                </div>
              ) : f.stockAction === "new" ? (
                <div><L>Tipo</L><Sel value={f.fType} onChange={set("fType")}>{ftypes.map((t) => <option key={t}>{t}</option>)}</Sel></div>
              ) : <div />}
            </Row>
            {f.stockAction === "new" && (
              <Row>
                <div><L>Cor</L>
                  <div style={{ display: "flex", gap: 8 }}>
                    <input type="color" value={f.fColorHex} onChange={set("fColorHex")} style={{ width: 42, height: 38, border: "1px solid rgba(63,209,206,.22)", borderRadius: 8, padding: 2, background: "rgba(12,26,28,.72)", cursor: "pointer" }} />
                    <In value={f.fColor} onChange={set("fColor")} placeholder="ex: Verde" />
                  </div>
                </div>
                <div />
              </Row>
            )}
            <div style={{ font: "400 11.5px Inter,sans-serif", color: "#6FA3A3" }}>
              {f.stockAction === "new" && `Será criada a bobina "${f.desc || "…"}" com ${fmtN(f.units)}g a ${fmt(unitCost * 1000)}/kg.`}
              {f.stockAction === "existing" && `Entrada de ${fmtN(f.units)}g no filamento escolhido (custo médio recalculado).`}
            </div>
          </div>
        )}

        {isMat && num(f.units) > 0 && (
          <div style={{ border: "1px dashed #5FA3A3", background: "rgba(5,12,12,.55)", borderRadius: 10, padding: 12, marginBottom: 12 }}>
            <div style={{ font: "600 12.5px Inter,sans-serif", color: "#3FD1CE", marginBottom: 8 }}>📦 Entrada automática no estoque de materiais</div>
            <Row>
              <div><L>O que fazer?</L>
                <Sel value={f.stockAction} onChange={set("stockAction")}>
                  <option value="new">Criar novo item no estoque</option>
                  <option value="existing">Somar a um item existente</option>
                  <option value="none">Não controlar estoque deste gasto</option>
                </Sel>
              </div>
              {f.stockAction === "existing" ? (
                <div><L>Item existente</L>
                  <Sel value={f.existingId} onChange={set("existingId")}>
                    <option value="">— selecionar —</option>
                    {data.materials.map((m) => <option key={m.id} value={m.id}>{m.name}</option>)}
                  </Sel>
                </div>
              ) : f.stockAction === "new" ? (
                <div><L>Estoque mínimo (alerta)</L><In type="number" value={f.minStock} onChange={set("minStock")} /></div>
              ) : <div />}
            </Row>
            <div style={{ font: "400 11.5px Inter,sans-serif", color: "#6FA3A3" }}>
              {f.stockAction === "new" && `Será criado "${f.desc || "…"}" com ${fmtN(f.units)} un a ${fmt(unitCost)}/un — disponível como material extra na calculadora e nos projetos.`}
              {f.stockAction === "existing" && `Entrada de ${fmtN(f.units)} un no item escolhido, atualizando o custo/un para ${fmt(unitCost)}.`}
            </div>
          </div>
        )}

        <div style={{ display: "flex", justifyContent: "flex-end", gap: 10 }}>
          <Btn kind="ghost" onClick={() => setModal(null)}>Cancelar</Btn>
          <Btn disabled={!num(f.value) || (stockable && f.stockAction === "existing" && !f.existingId)} onClick={() => {
            let materialId = f.materialId || "", filamentId = f.filamentId || "";
            if (isFil && stockable && f.stockAction === "new") {
              const fil = { id: uid(), name: f.desc || "Filamento", type: f.fType, color: f.fColor, colorHex: f.fColorHex, qtyG: num(f.units), stockG: num(f.units), price: num(f.value) };
              saveItem("filaments", fil); filamentId = fil.id;
            } else if (isFil && stockable && f.stockAction === "existing" && f.existingId) {
              const fil = data.filaments.find((x) => x.id === f.existingId);
              if (fil) {
                saveItem("filaments", { ...fil, qtyG: num(fil.qtyG) + num(f.units), stockG: num(fil.stockG) + num(f.units), price: num(fil.price) + num(f.value) });
                filamentId = fil.id;
              }
            } else if (isMat && stockable && f.stockAction === "new") {
              const m = { id: uid(), name: f.desc || "Material", category: f.category, unitCost, stock: num(f.units), minStock: num(f.minStock) || 0, movements: [{ id: uid(), date: f.date, type: "entrada", qty: num(f.units), note: "Compra (Investimentos)" }] };
              saveItem("materials", m); materialId = m.id;
            } else if (isMat && stockable && f.stockAction === "existing" && f.existingId) {
              const m = data.materials.find((x) => x.id === f.existingId);
              if (m) {
                saveItem("materials", { ...m, unitCost, stock: num(m.stock) + num(f.units), movements: [{ id: uid(), date: f.date, type: "entrada", qty: num(f.units), note: "Compra (Investimentos)" }, ...(m.movements || [])] });
                materialId = m.id;
              }
            }
            saveItem("expenses", { id: f.id, date: f.date, category: f.category, desc: f.desc, value: f.value, units: f.units, materialId, filamentId });
            setModal(null); notify(stockable && f.stockAction !== "none" ? "Gasto lançado e estoque atualizado" : "Gasto lançado");
          }}>Salvar</Btn>
        </div>
      </Modal>
    );
  }

  /* ================================ PEDIDOS =============================== */
  const AG_DRAG = { id: null };
  function Agenda() {
    const today = todayISO();
    const [ym, setYmS] = useState(AG_UI.ym || monthKey(today));
    const setYm = (v) => { AG_UI.ym = v; setYmS(v); };
    const [view, setViewS] = useState(AG_UI.view);
    const setView = (v) => { AG_UI.view = v; setViewS(v); };
    const weekStartOf = (iso) => { const d = new Date(iso + "T12:00:00"); return addDays(iso, -d.getDay()); };
    const [wk, setWkS] = useState(AG_UI.wk || weekStartOf(today));
    const setWk = (v) => { AG_UI.wk = v; setWkS(v); };
    const [over, setOver] = useState(null);
    const parts = ym.split("-"); const y = +parts[0]; const m = +parts[1];
    const daysInMonth = new Date(y, m, 0).getDate();
    const startDow = new Date(y, m - 1, 1).getDay();
    const pend = data.orders.filter((o) => o.dueDate && !isDone(o));
    const q = printerQueue();
    const finOf = {};
    [...q.cols.flatMap((c) => c.items), ...q.none.items].forEach((it) => { if (!finOf[it.o.id] || it.finish > finOf[it.o.id]) finOf[it.o.id] = it.finish; });
    const byDay = {}, ghostDay = {};
    pend.forEach((o) => { (byDay[o.dueDate] = byDay[o.dueDate] || []).push(o); const f = finOf[o.id]; if (f && f !== o.dueDate) (ghostDay[f] = ghostDay[f] || []).push(o); });
    const late = pend.filter((o) => o.dueDate < today).sort((a, b) => (a.dueDate < b.dueDate ? -1 : 1));
    const todayL = pend.filter((o) => o.dueDate === today);
    const weekEnd = addDays(today, 6);
    const weekL = pend.filter((o) => o.dueDate > today && o.dueDate <= weekEnd).sort((a, b) => (a.dueDate < b.dueDate ? -1 : 1));
    const nextL = pend.filter((o) => o.dueDate > weekEnd).sort((a, b) => (a.dueDate < b.dueDate ? -1 : 1)).slice(0, 20);
    const val30 = pend.filter((o) => isSale(o) && o.dueDate >= today && o.dueDate <= addDays(today, 30)).reduce((s, o) => s + num(o.price), 0);
    const pctOf = (o) => { const t = num(o.qty); return t > 0 ? Math.min(100, (printedOf(o) / t) * 100) : 0; };
    const shift = (d) => { const nd = new Date(y, m - 1 + d, 1); setYm(nd.getFullYear() + "-" + String(nd.getMonth() + 1).padStart(2, "0")); };
    const MES = ["janeiro", "fevereiro", "março", "abril", "maio", "junho", "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"];
    const WD = ["DOM", "SEG", "TER", "QUA", "QUI", "SEX", "SÁB"];
    const reschedule = (iso) => {
      const o = data.orders.find((x) => x.id === AG_DRAG.id); AG_DRAG.id = null; setOver(null);
      if (!o || o.dueDate === iso) return;
      logAs(`Reagendou ${projName(o)} × ${fmtN(o.qty)} de ${fmtDate(o.dueDate).slice(0, 5)} para ${fmtDate(iso).slice(0, 5)}`);
      saveItem("orders", { ...o, dueDate: iso });
      notify(`Entrega de ${projName(o)} → ${fmtDate(iso)}`);
    };
    const colorOf = (o) => { const p = projMap[o.projectId]; const cs = p ? itemColors(p, o.filChoices) : []; return cs[0] && cs[0].fil ? (cs[0].fil.colorHex || "#4A5257") : "#4A5257"; };
    const chip = (o, big) => {
      const isLate = o.dueDate < today;
      return (
        <div key={o.id} className={"neo-agc" + (isLate ? " r" : "") + (big ? " big" : "")} draggable data-id={o.id}
          onDragStart={(e) => { AG_DRAG.id = o.id; try { e.dataTransfer.setData("text/plain", o.id); e.dataTransfer.effectAllowed = "move"; } catch (er) { /* jsdom */ } }}
          onClick={() => setModal({ type: "order", item: o })} title={`${projName(o)} × ${fmtN(o.qty)}${o.clientId && cliMap[o.clientId] ? " — " + cliMap[o.clientId].name : ""} · arraste para outro dia para reagendar`}>
          <div className="t"><i style={{ background: colorOf(o) }} />{isLate ? "⚠ " : ""}{projName(o)} ×{fmtN(o.qty)}</div>
          {big && <div className="m">{o.clientId && cliMap[o.clientId] ? cliMap[o.clientId].name : (o.dest === "estoque" ? "Para estoque" : "")}</div>}
          {!o.fromStock && <div className="bar"><b style={{ width: pctOf(o) + "%" }} /></div>}
        </div>
      );
    };
    const ghost = (o) => <div key={"g" + o.id} className="neo-agc ghost" title={`Previsão da fila: ${projName(o)} fica pronto neste dia (entrega ${fmtDate(o.dueDate)})`}>◷ {projName(o)} ×{fmtN(o.qty)} fica pronto</div>;
    const dayCell = (iso, label, opts) => {
      const list = byDay[iso] || [], gl = ghostDay[iso] || [];
      const isToday = iso === today, hasLate = list.some((o) => o.dueDate < today);
      const dow = new Date(iso + "T12:00:00").getDay();
      const max = opts && opts.week ? 99 : 3;
      return (
        <div key={iso} className={"neo-agd" + (isToday ? " today" : "") + (hasLate ? " late" : "") + (dow === 0 || dow === 6 ? " we" : "") + (opts && opts.out ? " out" : "") + (over === iso ? " drop" : "") + (opts && opts.week ? " wkd" : "")} data-day={iso}
          onDragOver={(e) => { e.preventDefault(); if (over !== iso) setOver(iso); }} onDragLeave={() => setOver(null)} onDrop={(e) => { e.preventDefault(); reschedule(iso); }}>
          <span className="n">{label}{isToday ? <em> HOJE</em> : null}</span>
          {list.slice(0, max).map((o) => chip(o, opts && opts.week))}
          {list.length > max && <div className="more">+{list.length - max}</div>}
          {gl.slice(0, opts && opts.week ? 99 : 1).map(ghost)}
        </div>
      );
    };
    const cells = [];
    for (let i = 0; i < startDow; i++) cells.push(null);
    for (let d = 1; d <= daysInMonth; d++) cells.push(d);
    const ds = (d) => ym + "-" + String(d).padStart(2, "0");
    const item = (o) => {
      const c = o.clientId ? cliMap[o.clientId] : null;
      const isLate = o.dueDate < today;
      const f = finOf[o.id];
      const p = projMap[o.projectId];
      const parts = p && isPartsProj(p);
      const pct = pctOf(o);
      return (
        <div key={o.id} className={"neo-agi" + (isLate ? " r" : "")} onClick={() => setModal({ type: "order", item: o })}>
          <span className="s" style={!isLate && o.status === "Em produção" ? { background: "#F5821F" } : undefined} />
          <div style={{ minWidth: 0 }}>
            <b>{projName(o)} × {fmtN(o.qty)}</b>
            <small>{c ? c.name : (o.dest === "estoque" ? "Para estoque" : o.dest === "brinde" ? "Brinde / teste" : "Sem cliente")} · {isLate ? `era ${fmtDate(o.dueDate).slice(0, 5)}` : new Date(o.dueDate + "T12:00:00").toLocaleDateString("pt-BR", { weekday: "short", day: "2-digit", month: "2-digit" }).replace(".", "")}{f ? ` · fica ~${fmtDate(f).slice(0, 5)}${!isLate && f <= o.dueDate ? " ✓" : ""}` : ""}{parts ? ` · ${p.parts.length} partes` : ""}</small>
            {!o.fromStock && <LayerBar pct={pct} tone={parts ? "o" : "t"} />}
          </div>
          {!o.fromStock && <button className="neo-kreg" onClick={(e) => { e.stopPropagation(); setModal({ type: "print", orderId: o.id }); }}><Plus size={12} />Registrar</button>}
        </div>
      );
    };
    const group = (title, list, cls) => list.length > 0 && (
      <React.Fragment key={title}>
        <h4 className={cls || ""}>{title} <em>{list.length}</em></h4>
        {list.map(item)}
      </React.Fragment>
    );
    const wkDays = Array.from({ length: 7 }).map((_, i) => addDays(wk, i));
    return (
      <div className="neo-agenda">
        <div className="neo-pagehead">
          <span className="neo-code">AGENDA</span><h2>Entregas</h2>
          <div className="neo-strip">
            <div className={late.length ? "r" : ""}>ATRASADAS<b>{fmtN(late.length)}</b></div>
            <div>HOJE<b>{fmtN(todayL.length)}</b></div>
            <div>PRÓX. 7 DIAS<b>{fmtN(weekL.length + todayL.length)} entrega{weekL.length + todayL.length === 1 ? "" : "s"}</b></div>
            <div className="o">PRÓX. 30 DIAS<b>{fmt(val30)}</b></div>
          </div>
        </div>
        <div className="neo-aggrid">
          <div className="neo-hud neo-agcal">
            <div className="top">
              {view === "mes" ? <>
                <button className="neo-bg2 ic ag-prev" onClick={() => shift(-1)} title="Mês anterior">‹</button>
                <h3>{MES[m - 1]} {y}</h3>
                <button className="neo-bg2 ic ag-next" onClick={() => shift(1)} title="Próximo mês">›</button>
              </> : <>
                <button className="neo-bg2 ic ag-prev" onClick={() => setWk(addDays(wk, -7))} title="Semana anterior">‹</button>
                <h3>{fmtDate(wkDays[0]).slice(0, 5)} – {fmtDate(wkDays[6]).slice(0, 5)}</h3>
                <button className="neo-bg2 ic ag-next" onClick={() => setWk(addDays(wk, 7))} title="Próxima semana">›</button>
              </>}
              <button className="neo-bg2" onClick={() => { setYm(monthKey(today)); setWk(weekStartOf(today)); }}>Hoje</button>
              <div className="neo-seg sm" style={{ marginLeft: "auto" }}>{[["mes", "Mês"], ["semana", "Semana"]].map(([k, l]) => <button key={k} className={"ag-view" + (view === k ? " on" : "")} data-v={k} onClick={() => setView(k)}>{l}</button>)}</div>
            </div>
            <div className={"neo-agwk" + (view === "semana" ? " wkv" : "")}>
              {view === "mes" ? <>
                {WD.map((w) => <div key={w} className="wd">{w}</div>)}
                {cells.map((d, i) => d ? dayCell(ds(d), d) : <div key={"e" + i} className="neo-agd out" />)}
              </> : wkDays.map((iso) => (
                <div key={iso} className="neo-agcol">
                  <div className="wd">{WD[new Date(iso + "T12:00:00").getDay()]} {fmtDate(iso).slice(0, 5)}</div>
                  {dayCell(iso, "", { week: true })}
                </div>
              ))}
            </div>
            <div className="neo-agleg">
              <span><i className="b1" />entrega (barra = peças prontas)</span>
              <span><i className="b2" />previsão da fila: quando fica pronto</span>
              <span className="r">● atrasada</span>
              <span className="mut">arraste uma entrega para outro dia para reagendar</span>
            </div>
          </div>
          <div className="neo-hud neo-agside">
            {pend.length === 0 && <div className="neo-empty">Nenhuma entrega agendada. Defina a data de entrega ao criar ou editar um pedido.</div>}
            {group("⚠ ATRASADAS", late, "r")}
            {group(`HOJE · ${new Date(today + "T12:00:00").toLocaleDateString("pt-BR", { weekday: "short", day: "2-digit", month: "2-digit" }).replace(".", "").toUpperCase()}`, todayL)}
            {group("PRÓXIMOS 7 DIAS", weekL)}
            {group("DEPOIS", nextL)}
          </div>
        </div>
      </div>
    );
  }

  /* linha de KIT: varios pedidos do mesmo orcamento mostrados como um so, com expandir */
  /* ---------- v4.50: Pedidos ---------- */
  const Switch = ({ on, onChange, title, mixed }) => (
    <button type="button" role="switch" aria-checked={!!on} title={title} className={"neo-sw" + (on ? " on" : "") + (mixed ? " mix" : "")} onClick={(e) => { e.stopPropagation(); onChange(!on); }}><i /></button>
  );

  const destPill = (o, cli) => {

    const stl = STATUS_STYLE[value] || {};

      <select className="neo-stsel" value={value} onChange={onChange} style={{ color: stl.fg || "#C9D6D6", borderColor: stl.fg ? stl.fg + "99" : undefined }}>
        {extra}{STATUSES.map((s) => <option key={s}>{s}</option>)}
      </select>
