      </Modal>
    );
  }

  /* =============================== RELATÓRIOS ============================= */
  function Reports() {
    const [mode, setMode] = useState("mensal");
    const [month, setMonth] = useState(thisMonth);
    const [from, setFrom] = useState(addDays(todayISO(), -6));
    const [to, setTo] = useState(todayISO());
    const [rep, setRep] = useState("resumo");

    let rFrom, rTo, label;
    if (mode === "mensal") {
      rFrom = month + "-01";
      const [y, m] = month.split("-").map(Number);
      rTo = new Date(y, m, 0).toISOString().slice(0, 10);
      label = new Date(y, m - 1, 1).toLocaleDateString("pt-BR", { month: "long", year: "numeric" });
    } else if (mode === "semanal") {
      rFrom = from; rTo = addDays(from, 6);
      label = `Semana de ${fmtDate(rFrom)} a ${fmtDate(rTo)}`;
    } else if (mode === "tudo") {
      rFrom = "0001-01-01"; rTo = "9999-12-31";
      label = "Todo o período";
    } else {
      rFrom = from; rTo = to;
      label = `${fmtDate(rFrom)} a ${fmtDate(rTo)}`;
    }
    const days = Math.max(1, Math.round((new Date(rTo) - new Date(rFrom)) / 86400000) + 1);
    const pFrom = addDays(rFrom, -days), pTo = addDays(rFrom, -1);

    const inR = (d, a, b) => d >= a && d <= b;
    const calc = (a, b) => {
      const done = data.orders.filter((o) => isDone(o) && inR(o.date, a, b));
      const sales = done.filter((o) => isSale(o));
      const produced = done.filter((o) => !o.fromStock);
      const all = data.orders.filter((o) => inR(o.date, a, b));
      const exp = data.expenses.filter((e) => inR(e.date, a, b));
      const rev = sales.reduce((s, o) => s + num(o.price), 0);
      const prodCost = sales.reduce((s, o) => s + num(o.cost), 0);
      const expTotal = exp.reduce((s, e) => s + num(e.value), 0);
      const pieces = produced.reduce((s, o) => s + num(o.qty), 0);
      const hours = produced.reduce((s, o) => s + num(projMap[o.projectId] ? projMap[o.projectId].hours : 0) * num(o.qty), 0);
      const grams = produced.reduce((s, o) => s + num(projMap[o.projectId] ? projMap[o.projectId].grams : 0) * num(o.qty), 0);
      const recebido = all.filter((o) => o.paid && isSale(o)).reduce((s, o) => s + num(o.price), 0);
      const newClients = data.clients.filter((c) => c.createdAt && inR(c.createdAt, a, b)).length;
      return { sales, produced, exp, rev, prodCost, expTotal, profit: rev - prodCost - expTotal, pieces, hours, grams, recebido, newClients, ticket: sales.length ? rev / sales.length : 0 };
    };
    const cur = calc(rFrom, rTo);
    const prev = calc(pFrom, pTo);
    const delta = (a, b) => b === 0 ? (a > 0 ? "novo" : "—") : `${a - b >= 0 ? "+" : ""}${fmtN(((a - b) / Math.abs(b)) * 100, 0)}%`;

    const topProjects = Object.values(cur.sales.reduce((m, o) => {
      const k = o.projectId;
      if (!m[k]) m[k] = { name: projMap[k] ? projMap[k].name : "—", qty: 0, rev: 0 };
      m[k].qty += num(o.qty); m[k].rev += num(o.price);
      return m;
    }, {})).sort((a, b) => b.rev - a.rev).slice(0, 5);

    const topClients = Object.values(cur.sales.reduce((m, o) => {
      if (!o.clientId) return m;
      if (!m[o.clientId]) m[o.clientId] = { name: cliMap[o.clientId] ? cliMap[o.clientId].name : "—", rev: 0, n: 0 };
      m[o.clientId].rev += num(o.price); m[o.clientId].n += 1;
      return m;
    }, {})).sort((a, b) => b.rev - a.rev).slice(0, 5);

    const byNiche = Object.entries(cur.sales.reduce((m, o) => {
      const p = projMap[o.projectId];
      const n = (p && p.niche) || "Sem nicho";
      m[n] = (m[n] || 0) + num(o.price);
      return m;
    }, {})).map(([name, value]) => ({ name, value: +value.toFixed(2) })).filter((x) => x.value > 0);

    const ecats = data.settings.ecats || DEFAULT_ECATS;
    const catNames = Array.from(new Set([...ecats, ...cur.exp.map((e) => e.category)]));
    const byCat = catNames.map((c) => ({ name: c, value: +cur.exp.filter((e) => e.category === c).reduce((s, e) => s + num(e.value), 0).toFixed(2) })).filter((x) => x.value > 0);

    const D = ({ v, p }) => <span style={{ font: "600 11px 'JetBrains Mono',monospace", color: v >= p ? "#3FD1CE" : "#F0605F" }}>{delta(v, p)} vs período anterior</span>;

    return (
      <div>
        <SectionHead title="Relatório analítico">
          <div className="no-print" style={{ display: "flex", gap: 10, flexWrap: "wrap", alignItems: "flex-end" }}>
            <div><L>Período</L>
              <Sel value={mode} onChange={(e) => setMode(e.target.value)} style={{ width: 140 }}>
                <option value="semanal">Semanal</option><option value="mensal">Mensal</option><option value="livre">Data específica</option><option value="tudo">Todo o período</option>
              </Sel>
            </div>
            {mode === "mensal" && <div><L>Mês</L><In type="month" value={month} onChange={(e) => setMonth(e.target.value)} style={{ width: 160 }} /></div>}
            {mode === "semanal" && <div><L>Início da semana</L><In type="date" value={from} onChange={(e) => setFrom(e.target.value)} style={{ width: 160 }} /></div>}
            {mode === "livre" && (
              <React.Fragment>
                <div><L>De</L><In type="date" value={from} onChange={(e) => setFrom(e.target.value)} style={{ width: 150 }} /></div>
                <div><L>Até</L><In type="date" value={to} onChange={(e) => setTo(e.target.value)} style={{ width: 150 }} /></div>
              </React.Fragment>
            )}
            <div><L>Relatório</L>
              <Sel value={rep} onChange={(e) => setRep(e.target.value)} style={{ width: 180 }}>
                <option value="resumo">Resumo do negócio</option>
                <option value="pedidos">Pedidos e vendas</option>
                <option value="orcamentos">Orçamentos</option>
                <option value="projetos">Projetos</option>
                <option value="clientes">Clientes</option>
                <option value="investimentos">Investimentos</option>
                <option value="brindes">Brindes e perdas</option>
                <option value="itens">Desempenho por item</option>
              </Sel>
            </div>
            {rep !== "brindes" && rep !== "itens" && <Btn onClick={() => setModal({ type: "report", report: rep, from: rFrom, to: rTo, label })}><PrintIc size={15} />Gerar PDF</Btn>}
          </div>
        </SectionHead>

        <Card style={{ marginBottom: 14, background: "rgba(12,26,28,.72)", border: "none", display: "flex", alignItems: "center", gap: 18 }}>
          <img src={LOGO_L} alt="PrintAR 3D" style={{ width: 76, height: 76, borderRadius: "50%", background: "rgba(12,26,28,.72)", flexShrink: 0, boxShadow: "0 2px 12px rgba(0,0,0,.35)" }} />
          <div>
            <div style={{ font: "500 11px Inter,sans-serif", color: "#5FA3A3", textTransform: "uppercase", letterSpacing: ".1em" }}>PrintAR 3D · Relatório do período</div>
            <div style={{ font: "700 22px 'Space Grotesk',sans-serif", color: "#fff", textTransform: "capitalize" }}>{label}</div>
            <div style={{ font: "400 12px Inter,sans-serif", color: "#5FA3A3", marginTop: 2 }}>suas ideias, impressas em 3D · comparado com {fmtDate(pFrom)} a {fmtDate(pTo)} · gerado em {fmtDate(todayISO())}</div>
          </div>
        </Card>

        {rep === "brindes" ? <GiftPanel from={rFrom} to={rTo} label={label} />
        : rep === "itens" ? <ItemPanel from={rFrom} to={rTo} label={label} />
        : (<React.Fragment>

        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(200px,1fr))", gap: 12, marginBottom: 14 }}>
          <Card><div style={{ font: "600 11.5px Inter,sans-serif", color: "#7E9191", textTransform: "uppercase" }}>Faturamento</div>
            <div style={{ font: "700 20px 'Space Grotesk',sans-serif", color: "#3FD1CE" }}>{fmt(cur.rev)}</div><D v={cur.rev} p={prev.rev} /></Card>
          <Card><div style={{ font: "600 11.5px Inter,sans-serif", color: "#7E9191", textTransform: "uppercase" }}>Gastos (compras + custo das vendas)</div>
            <div style={{ font: "700 20px 'Space Grotesk',sans-serif", color: "#FFB067" }}>{fmt(cur.prodCost + cur.expTotal)}</div><D v={-(cur.prodCost + cur.expTotal)} p={-(prev.prodCost + prev.expTotal)} /></Card>
          <Card><div style={{ font: "600 11.5px Inter,sans-serif", color: "#7E9191", textTransform: "uppercase" }}>Lucro</div>
            <div style={{ font: "700 20px 'Space Grotesk',sans-serif", color: cur.profit >= 0 ? "#3FD1CE" : "#F0605F" }}>{fmt(cur.profit)}</div><D v={cur.profit} p={prev.profit} /></Card>
          <Card><div style={{ font: "600 11.5px Inter,sans-serif", color: "#7E9191", textTransform: "uppercase" }}>Recebido</div>
            <div style={{ font: "700 20px 'Space Grotesk',sans-serif" }}>{fmt(cur.recebido)}</div><D v={cur.recebido} p={prev.recebido} /></Card>
          <Card><div style={{ font: "600 11.5px Inter,sans-serif", color: "#7E9191", textTransform: "uppercase" }}>Ticket médio</div>
            <div style={{ font: "700 20px 'Space Grotesk',sans-serif" }}>{fmt(cur.ticket)}</div><D v={cur.ticket} p={prev.ticket} /></Card>
        </div>

        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(200px,1fr))", gap: 12, marginBottom: 14 }}>
          <Stat label="Vendas concluídas" value={fmtN(cur.sales.length)} sub={`${fmtN(cur.produced.length)} produções no período`} icon={ShoppingCart} />
          <Stat label="Peças produzidas" value={fmtN(cur.pieces)} sub={`${fmtN(cur.hours, 1)}h de impressão`} icon={Boxes} accent="#6FA0EA" />
          <Stat label="Filamento consumido" value={`${fmtN(cur.grams / 1000, 2)} kg`} sub="baseado nas produções concluídas" icon={Layers} accent="#A88AF0" />
          <Stat label="Novos clientes" value={fmtN(cur.newClients)} sub={`base total: ${data.clients.length} clientes`} icon={UsersIc} accent="#5CD6C7" />
        </div>

        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(320px,1fr))", gap: 14 }}>
          <Card style={{ padding: 6 }}>
            <div style={{ font: "600 14px 'Space Grotesk',sans-serif", padding: "10px 12px 4px" }}>Top produtos do período</div>
            {topProjects.length === 0 ? <div style={{ font: "400 13px Inter,sans-serif", color: "#93A6A6", padding: 12 }}>Sem vendas concluídas no período.</div> : (
              <table>
                <thead><tr><th>#</th><th>Produto</th><th>Peças</th><th>Faturamento</th></tr></thead>
                <tbody>
                  {topProjects.map((p, i) => (
                    <tr key={i}><td>{i + 1}</td><td style={{ fontWeight: 600 }}>{p.name}</td>
                      <td style={{ fontFamily: "'JetBrains Mono',monospace" }}>{fmtN(p.qty)}</td>
                      <td style={{ fontFamily: "'JetBrains Mono',monospace", fontWeight: 600, color: "#3FD1CE" }}>{fmt(p.rev)}</td></tr>
                  ))}
                </tbody>
              </table>
            )}
          </Card>
          <Card style={{ padding: 6 }}>
            <div style={{ font: "600 14px 'Space Grotesk',sans-serif", padding: "10px 12px 4px" }}>Top clientes do período</div>
            {topClients.length === 0 ? <div style={{ font: "400 13px Inter,sans-serif", color: "#93A6A6", padding: 12 }}>Nenhuma venda concluída vinculada a clientes.</div> : (
              <table>
                <thead><tr><th>#</th><th>Cliente</th><th>Vendas</th><th>Faturamento</th></tr></thead>
                <tbody>
                  {topClients.map((c, i) => (
                    <tr key={i}><td>{i + 1}</td><td style={{ fontWeight: 600 }}>{c.name}</td>
                      <td style={{ fontFamily: "'JetBrains Mono',monospace" }}>{fmtN(c.n)}</td>
                      <td style={{ fontFamily: "'JetBrains Mono',monospace", fontWeight: 600, color: "#3FD1CE" }}>{fmt(c.rev)}</td></tr>
                  ))}
                </tbody>
              </table>
            )}
          </Card>
          {byNiche.length > 0 && (
            <Card>
              <div style={{ font: "600 14px 'Space Grotesk',sans-serif", marginBottom: 10 }}>Faturamento por nicho</div>
              <ResponsiveContainer width="100%" height={220}>
                <PieChart>
                  <Pie data={byNiche} dataKey="value" nameKey="name" innerRadius={45} outerRadius={75}>
                    {byNiche.map((_, i) => <Cell key={i} fill={CHART_COLORS[i % CHART_COLORS.length]} />)}
                  </Pie>
                  <Tooltip formatter={(v) => fmt(v)} />
                  <Legend wrapperStyle={{ fontSize: 11.5 }} />
                </PieChart>
              </ResponsiveContainer>
            </Card>
          )}
          {byCat.length > 0 && (
            <Card>
              <div style={{ font: "600 14px 'Space Grotesk',sans-serif", marginBottom: 10 }}>Gastos por categoria</div>
              <ResponsiveContainer width="100%" height={220}>
                <BarChart data={byCat} layout="vertical">
                  <CartesianGrid strokeDasharray="3 3" stroke="rgba(63,209,206,.14)" />
                  <XAxis type="number" tick={{ fontSize: 11, fill: "#8FA3A3" }} />
                  <YAxis type="category" dataKey="name" width={95} tick={{ fontSize: 11.5 }} />
                  <Tooltip formatter={(v) => fmt(v)} />

  function SubTabs({ tabs, value, onChange }) {

  /* =============================== PENDÊNCIAS ============================== */
  /* ===================== PRODUCAO POR ETAPAS (v4.41) ===================== */
  const printedOf = (o) => piecesPrinted(o, o && projMap[o.projectId]); /* em partes: so conta peca com todas as partes */
  function ProductionProgress({ o, compact }) {
    const total = num(o.qty), done = printedOf(o), pct = total > 0 ? Math.min(100, (done / total) * 100) : 0;
    const pp = projMap[o.projectId];
    return (
      <div className="prod-progress" style={{ minWidth: compact ? 150 : 0 }}>
        <div style={{ height: compact ? 5 : 8, background: "rgba(5,12,12,.55)", borderRadius: 99, overflow: "hidden" }}>
          <div style={{ height: "100%", width: pct + "%", background: done >= total ? "#14A6A4" : "#F47A20", borderRadius: 99 }} />
        </div>
        <div className="prod-progress-text" style={{ font: (compact ? "500 11px" : "600 12.5px") + " Inter,sans-serif", color: "#93A6A6", marginTop: 3 }}>
          <b style={{ color: "#D6E2E2" }}>{fmtN(done)}</b> de {fmtN(total)} {pp && isPartsProj(pp) ? "peça(s) pronta(s)" : "impressos"}{done < total ? ` · faltam ${fmtN(total - done)}` : " · completo"}
        </div>
        {pp && isPartsProj(pp) && (
          <div className="prod-parts" style={{ font: "500 " + (compact ? "10.5px" : "11.5px") + " Inter,sans-serif", color: "#8FA3A3", marginTop: 2 }}>
            {pp.parts.map((pt) => { const n = partPrinted(o, pt.id); return `${pt.name || "Parte"} ${fmtN(n)}/${fmtN(total)}${n >= total ? " ✔" : ""}`; }).join(" · ")}
          </div>
        )}
      </div>
    );
  }
  function PrintModal({ orderId }) {
    const o = data.orders.find((x) => x.id === orderId);
    const p = o && projMap[o.projectId];
    const total = o ? num(o.qty) : 0, done = printedOf(o), left = Math.max(0, total - done);
    const last = o && (o.prints || []).length ? o.prints[o.prints.length - 1] : null;
    const [f, setF] = useState(() => {
      const base = { qty: String(last ? Math.min(num(last.qty), left || num(last.qty)) : left), printerId: (last && last.printerId) || (o && o.printerId) || (data.printers[0] ? data.printers[0].id : ""), date: todayISO(), extraDest: "estoque" };
      if (!o || !p || !isPartsProj(p)) return base;
      /* em partes: ja marca a 1a parte que ainda falta, com o que falta dela */
      const firstOpen = p.parts.find((pt) => partPrinted(o, pt.id) < num(o.qty));
      return { ...base, regs: Object.fromEntries(p.parts.map((pt) => { const lp = Math.max(0, num(o.qty) - partPrinted(o, pt.id)); return [pt.id, { on: firstOpen ? firstOpen.id === pt.id : false, qty: String(lp || 1), printerId: partPrinterOf(o, pt) }]; })) };
    });
    if (!o || !p) return null;
    const q = Math.max(0, Math.round(num(f.qty)));
    const after = done + q, extra = Math.max(0, after - total);
    const parts = isPartsProj(p);
    if (parts) {
      const regs = f.regs || {};
      const setReg = (pid, patch) => setF({ ...f, regs: { ...regs, [pid]: { ...regs[pid], ...patch } } });
      const chosen = p.parts.filter((pt) => regs[pt.id] && regs[pt.id].on && num(regs[pt.id].qty) > 0).map((pt) => ({ partId: pt.id, qty: Math.round(num(regs[pt.id].qty)), printerId: regs[pt.id].printerId }));
      const sim = { ...o, prints: [...(o.prints || []), ...chosen.map((r) => ({ partId: r.partId, qty: r.qty }))] };
      const piecesAfter = piecesPrinted(sim, p), extraP = Math.max(0, piecesAfter - total);
      const gramsNow = chosen.reduce((s, r) => s + partFils(p, o, p.parts.find((x) => x.id === r.partId)).reduce((a, x) => a + x.grams, 0) * r.qty, 0);
      const hoursBy = {};
      chosen.forEach((r) => { const pt = p.parts.find((x) => x.id === r.partId); const nm = (data.printers.find((x) => x.id === r.printerId) || {}).name || "sem impressora"; hoursBy[nm] = (hoursBy[nm] || 0) + num(pt.hours) * r.qty; });
      return (
        <Modal title={`Registrar impressão — ${p.name}`} onClose={() => setModal(null)} wide>
          <div style={{ marginBottom: 12 }}>
            <div style={{ font: "500 13px Inter,sans-serif", color: "#D6E2E2", marginBottom: 6 }}>{projName(o)} × {fmtN(total)}{o.clientId && cliMap[o.clientId] ? ` · ${cliMap[o.clientId].name}` : ""}</div>
            <div style={{ marginTop: 8 }}><ProductionProgress o={o} /></div>
          </div>
          <L>Qual parte saiu da impressora?</L>
          <div className="part-regs" style={{ border: "1px solid rgba(63,209,206,.14)", borderRadius: 10, background: "rgba(5,12,12,.55)", padding: "6px 12px", marginBottom: 12 }}>
            {p.parts.map((pt) => {
              const r = regs[pt.id] || {}; const n = partPrinted(o, pt.id);
              const fs = partFils(p, o, pt);
              return (
                <div key={pt.id} className="part-reg" data-part={pt.id} style={{ display: "grid", gridTemplateColumns: "minmax(150px,1.3fr) 70px minmax(130px,1fr) 70px", gap: 10, alignItems: "center", padding: "7px 0", borderTop: "1px dashed rgba(63,209,206,.14)" }}>
                  <label style={{ display: "flex", gap: 8, alignItems: "center", cursor: "pointer", minWidth: 0 }}>
                    <input className="part-on" type="checkbox" checked={!!r.on} onChange={(e) => setReg(pt.id, { on: e.target.checked })} style={{ width: 16, height: 16, accentColor: "#14A6A4", flexShrink: 0 }} />
                    <span style={{ minWidth: 0 }}>
                      <span style={{ display: "block", font: "600 13px Inter,sans-serif", color: "#D6E2E2" }}>{pt.name || "Parte"}</span>
                      <span style={{ display: "flex", gap: 4, flexWrap: "wrap", alignItems: "center", font: "400 11px Inter,sans-serif", color: "#93A6A6" }}>
                        {fs.map((x, i) => { const fl = filMap[x.filamentId]; return <span key={i} style={{ display: "inline-flex", alignItems: "center", gap: 3 }}><ColorDot hex={fl && fl.colorHex} size={10} />{colorName(fl)}</span>; })}
                      </span>
                    </span>
                  </label>
                  <In className="part-qty" type="number" min="1" value={r.qty} disabled={!r.on} onChange={(e) => setReg(pt.id, { qty: e.target.value })} title="Quantas desta parte" />
                  <select className="part-printer" value={r.printerId || ""} disabled={!r.on} onChange={(e) => setReg(pt.id, { printerId: e.target.value })} style={{ ...inputStyle, height: 36, padding: "0 8px" }}>
                    <option value="">— impressora —</option>
                    {data.printers.map((x) => <option key={x.id} value={x.id}>{x.name}</option>)}
                  </select>
                  <span style={{ font: "600 12px 'JetBrains Mono',monospace", color: n >= total ? "#3FD1CE" : "#93A6A6", textAlign: "right" }}>{fmtN(n)}/{fmtN(total)}{n >= total ? " ✔" : ""}</span>
                </div>
              );
            })}
          </div>
          <Row cols={3}><div><L>Data</L><In type="date" value={f.date} onChange={(e) => setF({ ...f, date: e.target.value })} /></div><div /><div /></Row>
          <div className="print-preview" style={{ background: "rgba(5,12,12,.55)", border: "1px solid rgba(63,209,206,.1)", borderRadius: 10, padding: "10px 14px", font: "400 13px Inter,sans-serif", color: "#D6E2E2", marginBottom: 12 }}>
            {!chosen.length ? "Marque a parte que você imprimiu." : piecesAfter < total
              ? <span>Fica {p.parts.map((pt) => { const n = partPrinted(sim, pt.id); return `${pt.name || "Parte"} ${fmtN(n)}/${fmtN(total)}${n >= total ? " ✔" : ""}`; }).join(" · ")} → <b>{fmtN(piecesAfter)} de {fmtN(total)}</b> peça(s) pronta(s)</span>
              : <span>✔ Todas as partes impressas (<b>{fmtN(piecesAfter)} de {fmtN(total)}</b>) — o pedido vai para <b>Concluído</b>.</span>}
            {chosen.length > 0 && <div style={{ font: "400 11.5px Inter,sans-serif", color: "#8FA3A3", marginTop: 4 }}>Baixa agora: {fmtN(gramsNow)}g de filamento{Object.entries(hoursBy).map(([nm, h]) => ` · ${fmtN(h, 1)}h na ${nm}`).join("")}{piecesAfter > done && p.extras && p.extras.length ? " · materiais extras da(s) peça(s) completa(s)" : ""}</div>}
          </div>
          {chosen.length > 0 && extraP > 0 && (
            <div className="print-extra" style={{ border: "1px dashed #F0B27E", background: "#2E2413", borderRadius: 10, padding: "10px 14px", marginBottom: 12 }}>
              <div style={{ font: "600 13px Inter,sans-serif", color: "#FFB067", marginBottom: 8 }}>{fmtN(extraP)} peça(s) a mais. Para onde vão?</div>
              <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                {[["estoque", "📦 Para o estoque"], ["brinde", "🎁 Brinde para o cliente"]].map(([k, lbl]) => (
                  <button key={k} type="button" className={"extra-opt" + (f.extraDest === k ? " on" : "")} data-k={k} onClick={() => setF({ ...f, extraDest: k })} style={{ padding: "7px 14px", borderRadius: 9, cursor: "pointer", border: f.extraDest === k ? "1.5px solid #14A6A4" : "1px solid rgba(63,209,206,.22)", background: f.extraDest === k ? "rgba(63,209,206,.1)" : "rgba(12,26,28,.72)", font: "600 12.5px Inter,sans-serif", color: f.extraDest === k ? "#3FD1CE" : "#B5C4C4" }}>{lbl}</button>
                ))}
              </div>
            </div>
          )}
          <div style={{ display: "flex", justifyContent: "flex-end", gap: 10 }}>
            <Btn kind="ghost" onClick={() => setModal(null)}>Cancelar</Btn>
            <Btn disabled={!chosen.length} onClick={() => { registerPrint(o, { parts: chosen, date: f.date, extraDest: f.extraDest }); setModal(null); }}>Registrar impressão</Btn>
          </div>
        </Modal>
      );
    }
    return (
      <Modal title={`Registrar impressão — ${p.name}`} onClose={() => setModal(null)}>
        <div style={{ marginBottom: 12 }}>
          <div style={{ font: "500 13px Inter,sans-serif", color: "#D6E2E2", marginBottom: 6 }}>{projName(o)} × {fmtN(total)}{o.clientId && cliMap[o.clientId] ? ` · ${cliMap[o.clientId].name}` : ""}</div>
          {itemColorsLine(p, o.filChoices)}
          <div style={{ marginTop: 8 }}><ProductionProgress o={o} /></div>
        </div>
        <Row cols={3}>
          <div><L>Quantas impressas agora</L><In className="print-qty" type="number" min="1" value={f.qty} onChange={(e) => setF({ ...f, qty: e.target.value })} /></div>
          <div><L>Impressora</L>
            {parts ? <In disabled value="impressoras das partes" style={{ background: "rgba(63,209,206,.06)", color: "#93A6A6" }} />
              : <Combo value={f.printerId} onChange={(v) => setF({ ...f, printerId: v })} placeholder="—" options={data.printers.map((x) => ({ value: x.id, label: x.name }))} />}
          </div>
          <div><L>Data</L><In type="date" value={f.date} onChange={(e) => setF({ ...f, date: e.target.value })} /></div>
        </Row>
        <div className="print-preview" style={{ background: "rgba(5,12,12,.55)", border: "1px solid rgba(63,209,206,.1)", borderRadius: 10, padding: "10px 14px", font: "400 13px Inter,sans-serif", color: "#D6E2E2", marginBottom: 12 }}>
          {q <= 0 ? "Informe a quantidade impressa." : after < total
            ? <span>Fica <b>{fmtN(after)} de {fmtN(total)}</b> impressos · faltam <b>{fmtN(total - after)}</b></span>
            : <span>✔ Completa o pedido (<b>{fmtN(after)} de {fmtN(total)}</b>) — ele vai para <b>Concluído</b>.</span>}
          {q > 0 && <div style={{ font: "400 11.5px Inter,sans-serif", color: "#8FA3A3", marginTop: 4 }}>Baixa agora: {fmtN(orderFilaments(p, o).reduce((s, x) => s + num(x.grams), 0) * q)}g de filamento{num(p.hours) > 0 ? ` · ${fmtN((parts ? partsHours(p.parts) : num(p.hours)) * q, 1)}h de impressora` : ""}{p.extras && p.extras.length ? " · materiais extras" : ""}</div>}
        </div>
        {q > 0 && extra > 0 && (
          <div className="print-extra" style={{ border: "1px dashed #F0B27E", background: "#2E2413", borderRadius: 10, padding: "10px 14px", marginBottom: 12 }}>
            <div style={{ font: "600 13px Inter,sans-serif", color: "#FFB067", marginBottom: 8 }}>{fmtN(extra)} peça(s) a mais. Para onde vão?</div>
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
              {[["estoque", "📦 Para o estoque"], ["brinde", "🎁 Brinde para o cliente"]].map(([k, lbl]) => (
                <button key={k} type="button" className={"extra-opt" + (f.extraDest === k ? " on" : "")} data-k={k} onClick={() => setF({ ...f, extraDest: k })} style={{ padding: "7px 14px", borderRadius: 9, cursor: "pointer", border: f.extraDest === k ? "1.5px solid #14A6A4" : "1px solid rgba(63,209,206,.22)", background: f.extraDest === k ? "rgba(63,209,206,.1)" : "rgba(12,26,28,.72)", font: "600 12.5px Inter,sans-serif", color: f.extraDest === k ? "#3FD1CE" : "#B5C4C4" }}>{lbl}</button>
              ))}
            </div>
            {f.extraDest === "brinde" && <div style={{ font: "400 11.5px Inter,sans-serif", color: "#B5A58A", marginTop: 6 }}>Entra no relatório de Brindes e perdas como perda.</div>}
          </div>
        )}
        <div style={{ display: "flex", justifyContent: "flex-end", gap: 10 }}>
          <Btn kind="ghost" onClick={() => setModal(null)}>Cancelar</Btn>
          <Btn disabled={q <= 0 || (!parts && !f.printerId)} onClick={() => { registerPrint(o, { qty: q, printerId: parts ? "" : f.printerId, date: f.date, extraDest: f.extraDest }); setModal(null); }}>Registrar impressão</Btn>
        </div>
      </Modal>
    );
  }

  /* ===================== FILA POR IMPRESSORA (v4.43) ===================== */
  /* horas que faltam de cada pedido em cada impressora; pecas ja impressas saem da conta */
  const printerQueue = () => {
    const hpd = Math.max(1, num(data.settings.prodHoursPerDay) || 8);
    const cols = data.printers.map((pr) => ({ pr, items: [], hours: 0 }));
    const none = { pr: null, items: [], hours: 0 };
    const colOf = (pid) => cols.find((c) => c.pr.id === pid) || none;
    pendingOrdersList.filter((o) => !o.fromStock)
      .slice().sort((a, b) => ((a.dueDate || "9999") + a.date < (b.dueDate || "9999") + b.date ? -1 : 1))
      .forEach((o) => {
        const p = projMap[o.projectId];
        const left = Math.max(0, num(o.qty) - printedOf(o));
        if (p && isPartsProj(p)) {
          /* so as partes que ainda faltam, na impressora de cada uma */
          const byPid = {};
          p.parts.forEach((pt) => {
            const lp = Math.max(0, num(o.qty) - partPrinted(o, pt.id));
            if (lp <= 0) return;
            const pid = ((o.partPrinters || {})[pt.id]) || pt.printerId || "";
            (byPid[pid] = byPid[pid] || { hours: 0, parts: [], pids: [] });
            byPid[pid].hours += num(pt.hours) * lp; byPid[pid].parts.push(pt.name || "Parte"); byPid[pid].pids.push(pt.id);
          });
          Object.entries(byPid).forEach(([pid, x]) => colOf(pid).items.push({ o, p, hours: x.hours, parts: x.parts, pids: x.pids }));
        } else colOf(o.printerId).items.push({ o, p, hours: (p ? num(p.hours) : 0) * left });
      });
    [...cols, none].forEach((c) => {
      let cum = 0;
      c.items.forEach((it) => {
        cum += it.hours;
        it.finish = addDays(todayISO(), Math.max(0, Math.ceil(cum / hpd) - (cum > 0 ? 1 : 0)));
        it.late = !!(it.o.dueDate && it.hours > 0 && it.finish > it.o.dueDate);
      });
      c.hours = cum;
      c.freeAt = cum > 0 ? addDays(todayISO(), Math.max(0, Math.ceil(cum / hpd) - 1)) : null; /* dia em que termina a ultima peca da fila */
    });
    return { cols, none, hpd };
  };
  /* prazo com as impressoras trabalhando juntas: o que nao tem impressora (e o orcamento novo)
     vai para as maquinas menos carregadas ("enche" por nivel) */
  const parallelFinishHours = (extraHours) => {
    const q = printerQueue();
    const loads = q.cols.map((c) => c.hours).sort((a, b) => a - b);
    let free = q.none.hours + num(extraHours);
    if (!loads.length) return q.none.hours + num(extraHours);
    let level = loads[0];
    for (let i = 0; i < loads.length; i++) {
      const next = i + 1 < loads.length ? loads[i + 1] : Infinity;
      const need = (next - level) * (i + 1);
      if (free <= need) { level += free / (i + 1); free = 0; break; }
      free -= need; level = next;
    }
    return level;
  };

  /* ===================== CENTRAL DE COMANDO (v4.45) ===================== */
  const CC_DRAG = { id: null };
  const fmtDM = (iso) => (iso ? fmtDate(iso).slice(0, 5) : "—");
  /* trabalho atual de cada impressora = primeiro item da fila dela */
  const printerJob = (c) => {
    const it = c.items.find((x) => x.hours > 0);
    if (!it) return null;
    const o = it.o, p = it.p, qty = Math.max(1, num(o.qty));
    let done;
    if (it.pids && it.pids.length) done = Math.min(...it.pids.map((pid) => partPrinted(o, pid)));
    else done = printedOf(o);
    const pct = Math.max(0, Math.min(1, done / qty));
    const ch = p ? itemColors(p, o.filChoices) : [];
    const color = ch.length && ch[0].fil && ch[0].fil.colorHex ? ch[0].fil.colorHex : null;
    const blocks = it.parts ? 1 : Math.min(9, qty);
    return { it, o, p, qty, done, pct, color, blocks, blocksDone: it.parts ? (pct >= 1 ? 1 : 0) : Math.round(pct * blocks) };
  };
  const ccSendTo = (o, pid) => {
    const pr = data.printers.find((x) => x.id === pid);
    logAs(pid ? `Mandou ${projName(o)} × ${fmtN(o.qty)} para a fila da ${pr ? pr.name : "impressora"}` : `Tirou ${projName(o)} × ${fmtN(o.qty)} da fila da impressora`);
    saveItem("orders", { ...o, printerId: pid });
    notify(pid ? `${projName(o)} foi para a fila da ${pr ? pr.name : "impressora"}` : `${projName(o)} ficou sem impressora`);
  };
  /* sugestoes do assistente: so com os dados do app (sem internet) */
  const assistantTips = (q) => {
    const tips = [];
    const hpd = q.hpd;
    const idle = q.cols.filter((c) => c.hours <= 0);
    if (idle.length) {
      const cand = [
        ...q.none.items.filter((x) => !x.parts && x.hours > 0).map((x) => ({ ...x, from: null })),
        ...q.cols.flatMap((c) => c.items.filter((x) => !x.parts && x.late).map((x) => ({ ...x, from: c.pr }))),
      ];
      const pick = cand.find((x) => x.late) || cand[0];
      if (pick) {
        const to = idle[0].pr;
        const fin = addDays(todayISO(), Math.max(0, Math.ceil(pick.hours / hpd) - 1));
        const ok = !pick.o.dueDate || fin <= pick.o.dueDate;
        tips.push({ k: "move", tone: "o", text: <span>A <b>{to.name}</b> está livre. Mandando <b>{projName(pick.o)} × {fmtN(pick.o.qty)}</b>{pick.from ? <> (hoje na {pick.from.name})</> : <> (sem impressora)</>} para ela, fica pronto ~<b>{fmtDM(fin)}</b>{pick.o.dueDate ? (ok ? <> — <b>no prazo</b> (entrega {fmtDM(pick.o.dueDate)})</> : <> (entrega era {fmtDM(pick.o.dueDate)})</>) : null}.</span>,
          label: `Mover para ${to.name}`, go: () => ccSendTo(pick.o, to.id) });
      }
    }
    if (lateOrders.length) {
      const o = lateOrders.slice().sort((a, b) => (a.dueDate < b.dueDate ? -1 : 1))[0];
      tips.push({ k: "late", tone: "w", text: <span>{lateOrders.length > 1 ? <><b>{lateOrders.length} pedidos</b> passaram do prazo. O mais antigo: </> : "Passou do prazo: "}<b>{projName(o)} × {fmtN(o.qty)}</b> (previsto {fmtDM(o.dueDate)}).</span>, label: "Ver produção", go: () => setTab("pen") });
    }
    if (unpaidSales.length) {
      const by = {};
      unpaidSales.forEach((o) => { const k = o.clientId || "_"; (by[k] = by[k] || { v: 0, first: o.date, n: 0 }); by[k].v += num(o.price); by[k].n++; if (o.date < by[k].first) by[k].first = o.date; });
      const [cid, x] = Object.entries(by).sort((a, b) => (a[1].first < b[1].first ? -1 : 1))[0];
      const dd = daysSince(x.first);
      tips.push({ k: "pay", tone: "w", text: <span><b>{cliMap[cid] ? cliMap[cid].name : "Venda sem cliente"}</b> tem <b>{fmt(x.v)}</b> a pagar{dd > 0 ? <> há {dd} dia(s)</> : null}{x.n > 1 ? ` (${x.n} pedidos)` : ""}.</span>, label: "Ver recebimentos", go: () => setTab("pen") });
    }
    if (lowStock.length) {
      const f = lowStock.slice().sort((a, b) => num(a.stockG) - num(b.stockG))[0];
      tips.push({ k: "fil", tone: "", text: <span>O <b>{f.name}</b> está com <b>{fmtN(f.stockG)} g</b> — abaixo do mínimo de {fmtN(data.settings.lowStockG)} g.</span>, label: "Ver estoque", go: () => setTab("stk") });
    }
    const soon = openQuotes.filter((x) => x.validUntil && x.validUntil >= todayISO() && x.validUntil <= addDays(todayISO(), 3));
    if (soon.length) tips.push({ k: "orc", tone: "", text: <span>O orçamento <b>{soon[0].code}</b>{cliMap[soon[0].clientId] ? <> de <b>{cliMap[soon[0].clientId].name}</b></> : null} vence em <b>{fmtDM(soon[0].validUntil)}</b>.</span>, label: "Ver orçamentos", go: () => setTab("orc") });
    const fxDue = upcomingFixed().filter((u) => u.days <= 3);
    if (fxDue.length) { const u = fxDue[0]; tips.push({ k: "fix", tone: u.days < 0 ? "w" : "o", text: <span>A conta <b>{u.c.name}</b> ({fmt(u.c.value)}) {u.days < 0 ? <>venceu dia <b>{fmtDM(u.due)}</b></> : u.days === 0 ? <><b>vence hoje</b></> : <>vence em <b>{u.days} dia{u.days > 1 ? "s" : ""}</b> ({fmtDM(u.due)})</>} e ainda não está marcada como paga{fxDue.length > 1 ? ` (+${fxDue.length - 1} conta${fxDue.length > 2 ? "s" : ""})` : ""}.</span>, label: "Ver custos fixos", go: () => { FIN_UI.sub = "fixos"; FIN_UI.month = null; setTab("fin"); } }); }
    if (maintDue.length) tips.push({ k: "mnt", tone: "", text: <span>Manutenção recomendada na <b>{maintDue[0].name}</b>.</span>, label: "Ver impressoras", go: () => setTab("cfg") });
    return tips;
  };

  function CommandCenter() {
    const q = printerQueue();
    const hpd = q.hpd;
    const hr = new Date().getHours();
    const greet = hr < 12 ? "Bom dia" : hr < 18 ? "Boa tarde" : "Boa noite";
    const owner = String(data.settings.ownerName || "").trim();
    const queueH = q.cols.reduce((s, c) => s + c.hours, 0) + q.none.hours;
    const queueDays = queueH > 0 ? Math.max(1, Math.ceil((data.printers.length > 1 ? parallelFinishHours(0) : queueH) / hpd)) : 0;
    const inProd = pendingOrdersList.filter((o) => !o.fromStock).length;
    const toReceive = unpaidSales.reduce((s, o) => s + num(o.price), 0);
    const tips = assistantTips(q);
    const lanes = [...q.cols, ...(q.none.items.length ? [q.none] : [])];
    const maxH = Math.max(0, ...lanes.map((c) => c.hours));
    const winDays = Math.max(2, Math.ceil(maxH / hpd));
    const W = winDays * hpd;
    const dayLabel = (d) => d === 0 ? "hoje" : d === 1 ? "amanhã" : new Date(addDays(todayISO(), d) + "T12:00:00").toLocaleDateString("pt-BR", { weekday: "short", day: "2-digit", month: "2-digit" }).replace(".", "");
    const [overLane, setOverLane] = useState(null);
    const activeN = q.cols.filter((c) => c.hours > 0).length;
    return (
      <div className="neo-cc">
        <div className="neo-hud neo-hero">
          <LayerA size={78} animate gid="hero" />
          <div style={{ minWidth: 0, flex: 1 }}>
            <h1 className="neo-greet">{greet}{owner ? `, ${owner}` : ""} — <em>bora imprimir?</em></h1>
            <div className="neo-stats">

  const waOpen = (phone, msg) => {

    return `Olá, ${firstName(c && c.name)}! 😊\nSeu pedido de ${fmtN(total)}× ${projName(o)} ${st}.${fin ? `\nPrevisão de ficar pronto: ${fmtDate(fin)}.` : ""}\nQualquer novidade eu te aviso!${(data.storeInfo || {}).name ? `\n— ${data.storeInfo.name}` : ""}`;
  };
  const daysUntil = (iso) => Math.round((new Date(iso + "T12:00:00") - new Date(todayISO() + "T12:00:00")) / 86400000);

  const LayerBar = ({ pct, tone }) => (
    <div className={"neo-lay" + (tone === "o" ? " o" : "")}>{Array.from({ length: 10 }).map((_, i) => <i key={i} className={i < Math.round(pct / 10) ? "f" : ""} />)}</div>
  );
  const KANBAN_COLS = ["Orçamento", "Aprovado", "Em produção", "Concluído", "Entregue"];
  const PEN_DRAG = { id: null };

  function Pendencias() {
    const [sub, setSub] = useState("prod");
    const [view, setViewS] = useState(QUEUE_VIEW.v);
    const setView = (v) => { QUEUE_VIEW.v = v; setViewS(v); try { localStorage.setItem("gestor3d-pen-view", v); } catch (e) {} };
    const [open, setOpenS] = useState(() => PEN_OPEN.v);

    const setQ = (v) => { PEN_UI.q = v; setQS(v); };
    const [over, setOver] = useState(null);
    const queue = printerQueue();
    /* previsao e impressora de cada pedido, vindas da fila */
    const finOf = {}, prOf = {}, noPr = new Set();
    queue.cols.forEach((c) => c.items.forEach((it) => { if (!finOf[it.o.id] || it.finish > finOf[it.o.id]) finOf[it.o.id] = it.finish; (prOf[it.o.id] = prOf[it.o.id] || []).push(c.pr.name); }));
    queue.none.items.forEach((it) => { noPr.add(it.o.id); if (!finOf[it.o.id] || it.finish > finOf[it.o.id]) finOf[it.o.id] = it.finish; });
    const all = [...pendingOrdersList].sort((a, b) => (a.dueDate || "9999") < (b.dueDate || "9999") ? -1 : 1);
    const lateN = all.filter((o) => o.dueDate && o.dueDate < todayISO()).length;
    const weekN = all.filter((o) => o.dueDate && o.dueDate <= addDays(todayISO(), 7)).length;
    const noPrN = all.filter((o) => !o.fromStock && noPr.has(o.id)).length;
    const qq = q.trim().toLowerCase();
    const prodList = all.filter((o) => {
      if (filter === "atrasados" && !(o.dueDate && o.dueDate < todayISO())) return false;
      if (filter === "semana" && !(o.dueDate && o.dueDate <= addDays(todayISO(), 7))) return false;
      if (filter === "sempr" && !(!o.fromStock && noPr.has(o.id))) return false;
      if (qq && !(projName(o) + " " + ((cliMap[o.clientId] || {}).name || "")).toLowerCase().includes(qq)) return false;
      return true;
    });
    const queueH = queue.cols.reduce((s, c) => s + c.hours, 0) + queue.none.hours;
    const toReceive = unpaidSales.reduce((s, o) => s + num(o.price), 0);
    const destText = (o, c) => o.dest === "estoque" ? "Produção para estoque" : o.dest === "brinde" ? `Brinde / Teste${c ? ` · ${c.name}` : ""}` : o.dest === "avulso" ? "Impressão avulsa" : (c ? c.name : "Sem cliente");
    const dueBox = (o) => {
      const fin = finOf[o.id];
      if (!o.dueDate) return <div className="neo-due"><b className="mut">sem prazo</b><small>{fin ? `fica ~${fmtDate(fin)}` : ""}</small></div>;
      const d = daysUntil(o.dueDate);
      const late = d < 0, risk = !late && fin && fin > o.dueDate;
      return (
        <div className={"neo-due" + (late ? " late" : risk ? " risk" : d <= 2 ? "" : " ok")}>
          <b>{late ? `⚠ ${-d} dia${-d > 1 ? "s" : ""} atrasado` : d === 0 ? "entrega hoje" : d === 1 ? "entrega amanhã" : `em ${d} dias`}</b>
          <small>{late ? `era ${fmtDate(o.dueDate)}` : `entrega ${fmtDate(o.dueDate)}`}{fin ? ` · fica ~${fmtDate(fin).slice(0, 5)}` : ""}</small>
        </div>
      );
    };
    const progress = (o) => {
      const p = projMap[o.projectId];
      const total = num(o.qty), done = printedOf(o);
      const parts = p && isPartsProj(p);
      let pct = total > 0 ? Math.min(100, (done / total) * 100) : 0;
      if (parts) { const sumP = p.parts.reduce((s, pt) => s + Math.min(total, partPrinted(o, pt.id)), 0); pct = total > 0 ? Math.min(100, (sumP / (total * p.parts.length)) * 100) : 0; }
      const hoursLeft = p ? (parts ? p.parts.reduce((s, pt) => s + num(pt.hours) * Math.max(0, total - partPrinted(o, pt.id)), 0) : num(p.hours) * Math.max(0, total - done)) : 0;
      return (
        <div className="prod-progress neo-prog">
          <LayerBar pct={pct} tone={parts ? "o" : "t"} />

          {parts && <div className="prod-parts neo-prog-p">{p.parts.map((pt) => { const n = partPrinted(o, pt.id); return `${pt.name || "Parte"} ${fmtN(n)}/${fmtN(total)}${n >= total ? " ✔" : ""}`; }).join(" · ")}</div>}
        </div>

    const stepper = (o) => (

        })}

    );
    const kanbanDrop = (status) => {
      const o = data.orders.find((x) => x.id === PEN_DRAG.id); PEN_DRAG.id = null; setOver(null);
      if (!o || o.status === status) return;
      if (["Concluído", "Entregue"].includes(status) && !o.fromStock && printedOf(o) < num(o.qty)) {
        if (!confirm(`Marcar ${projName(o)} × ${fmtN(o.qty)} como ${status}?\n\nForam registradas ${fmtN(printedOf(o))} de ${fmtN(o.qty)} peça(s). O que faltar dá baixa no estoque agora, como peças feitas.`)) return;
      }
      setOrderStatus(o, status);
      notify(`${projName(o)} → ${status}`);
    };
    /* financeiro: agrupado por cliente */
    const groups = (() => {
      const m = {};
      unpaidSales.forEach((o) => { const k = o.clientId || "_"; (m[k] = m[k] || { k, c: cliMap[o.clientId], list: [], total: 0, first: o.date }); m[k].list.push(o); m[k].total += num(o.price); if (o.date < m[k].first) m[k].first = o.date; });
      return Object.values(m).map((g) => ({ ...g, list: g.list.sort((a, b) => (a.date < b.date ? -1 : 1)), age: daysSince(g.first) })).sort((a, b) => b.age - a.age || b.total - a.total);
    })();
    const aging = [0, 0, 0];
    unpaidSales.forEach((o) => { const a = daysSince(o.date); aging[a <= 7 ? 0 : a <= 30 ? 1 : 2] += num(o.price); });
    const receiveAll = (g) => {
      logAs(`Recebeu ${fmt(g.total)} de ${g.c ? g.c.name : "venda sem cliente"} (${g.list.length} venda${g.list.length > 1 ? "s" : ""})`);

      notify(`Recebimento de ${fmt(g.total)} confirmado`);

    const filters = [["todos", "Todos", all.length], ["atrasados", "⚠ Atrasados", lateN], ["semana", "Esta semana", weekN], ["sempr", "Sem impressora", noPrN]];

                      <span className={"av" + (g.age > 30 ? " r" : g.age > 7 ? " o" : "")}>{(g.c ? g.c.name : "?").trim().charAt(0).toUpperCase()}</span>

                      <button className="neo-bp" onClick={() => receiveAll(g)}>✓ {g.list.length > 1 ? "Recebi tudo" : "Recebi"}</button>
