          {kpi(1, "Lucro líquido", cur.profit, fmt, <Delta a={cur.profit} b={prev && prev.profit} />, { color: cur.profit >= 0 ? "#5CE0D4" : "#FF8A8A", spark: last6.map((x) => x.Lucro), sparkColor: "#9AF3EC" })}
          {kpi(2, "Margem", cur.margin, (v) => fmtN(v, 1) + "%", <Delta a={cur.margin} b={prev && prev.margin} pp />)}
          {kpi(3, "Ticket médio", cur.ticket, fmt, <span className="neo-kd">{fmtN(cur.sales.length)} venda{cur.sales.length === 1 ? "" : "s"}</span>)}
          {kpi(4, "Peças produzidas", cur.pieces, (v) => fmtN(Math.round(v)), <span className="neo-kd">{fmtN(cur.hours, 1)} h de máquina</span>, { tab: "ped" })}
          {kpi(5, "A receber", iaReceber, fmt, <span className="neo-kd o">{iaReceberCli ? `${iaReceberCli} cliente${iaReceberCli > 1 ? "s" : ""} · em aberto` : "nada em aberto"}</span>, { cls: "or", tab: "pen" })}
        </div>

        <div className="neo-g2">
          <Reveal className="neo-hud neo-chartcard">
            <div className="neo-ttl"><span className="neo-code">CAIXA</span><b>Faturamento × gastos × lucro</b><small>últimos 6 meses</small></div>
            <div className="neo-chartbox"><ResponsiveContainer width="100%" height="100%">
              <AreaChart data={last6} margin={{ top: 10, right: 8, left: 0, bottom: 0 }}>
                <defs>
                  <linearGradient id="neoFa" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stopColor="#14B8B2" stopOpacity={0.45} /><stop offset="1" stopColor="#14B8B2" stopOpacity={0} /></linearGradient>
                  <linearGradient id="neoFb" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stopColor="#F5821F" stopOpacity={0.25} /><stop offset="1" stopColor="#F5821F" stopOpacity={0} /></linearGradient>
                </defs>
                <CartesianGrid stroke="rgba(63,209,206,.07)" vertical={false} />
                <XAxis dataKey="mes" tick={{ fontSize: 11, fill: "#5E7A7B", fontFamily: "JetBrains Mono" }} axisLine={false} tickLine={false} />
                <YAxis tick={{ fontSize: 10.5, fill: "#5E7A7B", fontFamily: "JetBrains Mono" }} width={52} axisLine={false} tickLine={false} />
                <Tooltip content={<ChartTip />} cursor={{ stroke: "rgba(63,209,206,.45)", strokeDasharray: "3 3" }} />
                <Area type="monotone" dataKey="Faturamento" stroke="#3FD1CE" strokeWidth={2.5} fill="url(#neoFa)" animationDuration={1200} activeDot={{ r: 5, stroke: "#050C0D", strokeWidth: 2 }} />
                <Area type="monotone" dataKey="Gastos" stroke="#F5821F" strokeWidth={2} strokeDasharray="5 4" fill="url(#neoFb)" animationDuration={1200} />
                <Area type="monotone" dataKey="Lucro" stroke="#9AF3EC" strokeWidth={1.6} fill="none" animationDuration={1400} />
              </AreaChart>
            </ResponsiveContainer></div>
            <div className="neo-leg"><span><i style={{ background: "#3FD1CE" }} />Faturamento</span><span><i style={{ background: "#F5821F" }} />Gastos</span><span><i style={{ background: "#9AF3EC" }} />Lucro</span></div>
          </Reveal>
          <div className="neo-col">
            <Reveal className="neo-hud neo-health" delay={80}>
              <div className="neo-ttl"><span className="neo-code">SAÚDE</span><b>Saúde financeira</b><small>{new Date(today + "T12:00:00").toLocaleDateString("pt-BR", { month: "long" })}</small></div>
              <div className="neo-gwrap"><Gauge score={score} /><div className="neo-gscore" style={{ color: health.color }}><CountUp value={score} /><span>/100 · {health.label}</span></div></div>
              {tips.length > 0 ? tips.slice(0, 3).map((t, i) => <div key={i} className="neo-tip">{t}</div>) : <div className="neo-tip">Tudo em ordem: vendas no azul, produção em dia e recebimentos sob controle. 🎉</div>}
              {alerts.length > 0 && <details className="neo-alerts"><summary>Ver avisos ({alerts.length})</summary>{alerts.map((a, i) => <div key={i}><a.icon size={13} />{a.msg}</div>)}</details>}
            </Reveal>
            <Reveal className="neo-hud neo-goal" delay={140}>
              <div className="neo-ttl"><span className="neo-code">META</span><b>Meta do mês</b></div>
              {goal > 0 ? (

                  <div><div className="big"><CountUp value={monthRevenue} format={fmt} /></div><div className="sub">de {fmt(goal)} · {daysLeft > 0 ? `faltam ${daysLeft} dia${daysLeft > 1 ? "s" : ""}` : "último dia"}</div>
                    <div className="sub2">{goalPct >= 100 ? "Meta batida! 🎉" : perDay > 0 ? `≈ ${fmt(perDay)} por dia para chegar lá` : ""}</div></div>
                </div>
              ) : <div className="neo-empty" style={{ padding: "6px 0" }}>Defina quanto quer faturar por mês em <a onClick={() => setTab("cfg")}>Configurações → Central de Comando</a>.</div>}
            </Reveal>
          </div>
        </div>

        <div className="neo-champs">

          {champ(1, "Cliente que mais compra", "👑", "o", iaCliRank[0], (x) => fmt(x.v), "cli")}

        <div className="neo-g3">

              <div className="neo-spools">

                      <Ring pct={pct} size={62} stroke={9} color={isDarkHex(c) ? "#6B7A7D" : hexShade(c, 0)} track="rgba(127,154,155,.12)"><span className="hub" /></Ring>

            {iaPrinters.length === 0 ? <div className="neo-empty">Nenhuma impressora cadastrada.</div> : iaPrinters.map((it, i) => (
              <div key={it.p.id} className="neo-mach">
                <Ring pct={it.paybackPct} color={i % 2 ? "#F5821F" : "#3FD1CE"}><b>{fmtN(it.paybackPct, 0)}%</b></Ring>
                <div><b>{it.p.name}</b><small>{fmt(it.custoHora)}/h · {it.falta > 0 ? `falta ${fmt(it.falta)}` : "já se pagou ✓"}</small></div>
              </div>
            ))}
            {data.printers.length > 0 && <div className="neo-cap">USO DA CAPACIDADE NO MÊS · {fmtN(iaUsePct, 0)}%<div className="bar"><i style={{ width: iaUsePct + "%" }} /></div><small>~{fmtN(Math.max(0, iaCap - monthHours), 0)} h livres de {fmtN(iaCap, 0)} h</small></div>}
          </Reveal>
          <Reveal className="neo-hud" delay={160}>
            {board("Top clientes", "RANKING", iaCliRank, "t", (x) => fmt(x.v))}
            <div style={{ height: 12 }} />
            {board("Top produtos por lucro", "PRODUTOS", iaProdRank, "o", (x) => fmt(x.v))}
          </Reveal>
        </div>

        <div className="neo-g2b">
          <Reveal className="neo-hud">
            <div className="neo-ttl"><span className="neo-code">NICHOS</span><b>Vendas por nicho</b><small>{periods.find((x) => x[0] === iaP)[1].toLowerCase()}</small></div>
            {iaNicheRank.length === 0 ? <div className="neo-empty">Sem vendas no período.</div> : (
              <HoloDonut gid="nic" totalLabel="TOTAL" unit={(v) => fmt(v)} items={iaNicheRank.map((x, i) => ({ name: x.name, value: x.v, color: ["#3FD1CE", "#F5821F", "#6FA0EA", "#A88AF0", "#FF6B6B", "#9AF3EC", "#FFB066", "#8FA0AC"][i % 8] }))} />
            )}
          </Reveal>
          {hasFilCard && (
            <Reveal className="neo-hud" delay={80}>
              <div className="neo-ttl"><span className="neo-code">CONSUMO</span><b>Filamentos mais usados</b>
                <div className="neo-chips sm" style={{ marginLeft: "auto" }}>{[["proj", "Projetos ativos"], ["real", "Consumo real"]].map(([v, lb]) => <button key={v} className={filView === v ? "on" : ""} onClick={() => setFilView(v)}>{lb}</button>)}</div>
              </div>
              {filUsage.length === 0 ? <div className="neo-empty">Nenhum pedido produzido ainda — conclua pedidos de produção para ver o consumo real.</div> : (
                <HoloDonut gid="fil" totalLabel="GRAMAS" unit={(v) => fmtN(v) + " g"} items={filUsage.map((x, i) => ({ name: x.name, value: x.value, color: visColor(x.color, i), glow: x.color && isDarkHex(x.color) ? "#99AABB" : null }))} />
              )}
              <div className="neo-foot">{filView === "proj" ? "Gramas por peça somadas nos projetos ativos — de quais carretéis seu catálogo depende." : "Gramas baixadas nos pedidos produzidos — o que você realmente mais gasta."}</div>
            </Reveal>
          )}
        </div>
      </div>
    );
  }

  /* =============================== PROJETOS ============================== */
  const marginTone = (m) => (m == null ? "r" : m >= 50 ? "t" : m >= 30 ? "o" : "r");
  function Projects() {
    const [pq, setPqS] = useState(PJ_UI.q);
    const setPq = (v) => { PJ_UI.q = v; setPqS(v); };
    const [pNiche, setPNicheS] = useState(PJ_UI.niche);
    const setPNiche = (v) => { PJ_UI.niche = v; setPNicheS(v); };
    const [pSort, setPSortS] = useState(PJ_UI.sort);
    const setPSort = (v) => { PJ_UI.sort = v; setPSortS(v); };
    const [help, setHelp] = useState(false);
    const [menu, setMenu] = useState(null);
    useEffect(() => {
      if (!menu) return;
      const close = (e) => { if (!(e.target.closest && e.target.closest(".neo-qmenu, .neo-qmore"))) setMenu(null); };
      document.addEventListener("mousedown", close);
      return () => document.removeEventListener("mousedown", close);
    }, [menu]);
    const [ptab, setPtabS] = useState(() => PROJ_TAB.v);
    const setPtab = (v) => { PROJ_TAB.v = v; setPtabS(v); };
    const inactiveCount = data.projects.filter((p) => p.active === false).length;
    const soldMap = {}; data.orders.filter((o) => isSale(o) && isDone(o)).forEach((o) => { soldMap[o.projectId] = (soldMap[o.projectId] || 0) + num(o.qty); });
    const rankIds = Object.entries(soldMap).filter(([id, n]) => n > 0 && projMap[id]).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([id]) => id);
    const marginOf = (p) => (num(p.salePrice) > 0 ? ((num(p.salePrice) - num(p.cost)) / num(p.salePrice)) * 100 : null);
    const tabsEl = (
      <div className="neo-pagehead">
        <span className="neo-code">PROJETOS</span><h2>Catálogo</h2>
        <button className={"neo-help" + (help ? " on" : "")} onClick={() => setHelp(!help)} title="Como funciona">?</button>
        <div className="neo-seg" style={{ marginLeft: 6 }}>
          <button className={ptab === "proj" ? "on" : ""} onClick={() => setPtab("proj")}><Boxes size={14} />Projetos <i>{data.projects.length}</i></button>
          <button className={ptab === "kits" ? "on" : ""} onClick={() => setPtab("kits")}><Package size={14} />Kits <i>{(data.kits || []).length}</i></button>
        </div>
        <div className="neo-oacts" style={{ marginLeft: "auto" }}>
          <Btn kind="ghost" onClick={() => setModal({ type: "catalog" })}><PrintIc size={15} />Catálogo em PDF</Btn>
          {ptab === "proj" && <Btn kind="ghost" onClick={() => setModal({ type: "calc" })}><CalculatorIc size={15} />Calculadora</Btn>}
          {ptab === "proj" ? <Btn onClick={() => setModal({ type: "project" })}><Plus size={16} />Cadastrar projeto</Btn>
            : <Btn onClick={() => setModal({ type: "kit" })} disabled={data.projects.length === 0}><Plus size={16} />Montar kit</Btn>}
        </div>
      </div>
    );
    const helpEl = help && (
      <div className="neo-hud neo-helpbox">
        {ptab === "proj"
          ? <>💡 Aqui fica seu catálogo: cadastre os modelos que você produz e vende. A produção e a venda acontecem na aba Pedidos (ou direto na aba Estoque de Produtos, se já estiver pronto).</>
          : <>💡 Monte kits com os projetos que você já tem, coloque a foto do kit e o preço que quiser. O kit aparece no catálogo e entra no orçamento pelo botão <b>+ Kit</b>.</>}
      </div>
    );
    if (ptab === "kits") return <KitsTab tabs={<>{tabsEl}{helpEl}</>} />;
    const isInactiveView = pNiche === "__inativos";
    const base = isInactiveView ? data.projects.filter((p) => p.active === false) : activeProjects;
    let shown = base.filter((p) => {
      if (pq) { const t = pq.toLowerCase(); if (!((p.name || "").toLowerCase().includes(t) || (p.catalogDesc || "").toLowerCase().includes(t))) return false; }
      if (!isInactiveView && pNiche !== "Todos" && !projNiches(p).includes(pNiche)) return false;
      return true;
    });
    if (pSort === "nome") shown = shown.slice().sort((a, b) => (a.name || "").localeCompare(b.name || ""));
    else if (pSort === "vendidos") shown = shown.slice().sort((a, b) => (soldMap[b.id] || 0) - (soldMap[a.id] || 0));
    else if (pSort === "margem") shown = shown.slice().sort((a, b) => (marginOf(b) ?? -1) - (marginOf(a) ?? -1));
    else shown = shown.slice().reverse();
    const nicheCount = {}; activeProjects.forEach((p) => projNiches(p).forEach((n) => { nicheCount[n] = (nicheCount[n] || 0) + 1; }));
    const priced = activeProjects.filter((p) => marginOf(p) != null);
    const avgMargin = priced.length ? priced.reduce((s, p) => s + marginOf(p), 0) / priced.length : null;
    const top = rankIds[0] ? projMap[rankIds[0]] : null;
    const stockPieces = data.products.reduce((s, x) => s + Math.max(0, num(x.qty)), 0);
    const stockVal = data.products.reduce((s, x) => { const p = projMap[x.projectId]; return s + Math.max(0, num(x.qty)) * (p ? num(p.salePrice) : 0); }, 0);
    const colorsOf = (p) => {
      const out = []; const seen = new Set();
      const add = (hex, name) => { const k = String(hex || "").toLowerCase(); if (!hex || seen.has(k)) return; seen.add(k); out.push({ hex, name }); };
      projFilaments(p).forEach((x) => { const f = filMap[x.filamentId]; if (f) add(f.colorHex, colorName(f)); });
      if (p.colorsOn !== false) (p.extraColors || []).forEach((c) => add(c.hex, c.name));
      return out;
    };
    return (
      <div className="neo-projects">
        {tabsEl}
        {helpEl}
        <div className="neo-ckpis">
          <Reveal className="neo-hud neo-k" delay={0}><div className="l">Projetos ativos</div><div className="v"><CountUp value={activeProjects.length} /></div><span className="neo-kd">{inactiveCount} inativo{inactiveCount === 1 ? "" : "s"} · {Object.keys(nicheCount).length} nicho{Object.keys(nicheCount).length === 1 ? "" : "s"}</span></Reveal>
          <Reveal className="neo-hud neo-k" delay={60}><div className="l">Margem média</div><div className="v" style={{ color: avgMargin == null ? undefined : avgMargin >= 50 ? "#3FD1CE" : avgMargin >= 30 ? "#FFAA5C" : "#FF8A8A" }}>{avgMargin == null ? "—" : <CountUp value={avgMargin} format={(v) => fmtN(v, 0) + "%"} />}</div><span className="neo-kd">preço de venda × custo</span></Reveal>
          <Reveal className="neo-hud neo-k" delay={120}><div className="l">Mais vendido</div><div className="v" style={{ fontSize: 17, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{top ? `🏆 ${top.name}` : "—"}</div><span className="neo-kd">{top ? `${fmtN(soldMap[top.id])} peças vendidas` : "sem vendas ainda"}</span></Reveal>
          <Reveal className="neo-hud neo-k or" delay={180} onClick={() => setTab("prod")}><div className="l">Prontos em estoque</div><div className="v"><CountUp value={stockPieces} format={(v) => `${fmtN(Math.round(v))} peça${Math.round(v) === 1 ? "" : "s"}`} /></div><span className="neo-kd">{fmt(stockVal)} a preço de venda</span></Reveal>
        </div>
        <div className="neo-penbar">
          <div className="neo-fchips">
            <button className={"neo-fchip pj-niche" + (pNiche === "Todos" ? " on" : "")} data-n="Todos" onClick={() => setPNiche("Todos")}>Todos {activeProjects.length}</button>
            {(data.settings.niches || []).filter((n) => nicheCount[n]).map((n) => <button key={n} className={"neo-fchip pj-niche" + (pNiche === n ? " on" : "")} data-n={n} onClick={() => setPNiche(n)}>{n} {nicheCount[n]}</button>)}
            {inactiveCount > 0 && <button className={"neo-fchip pj-niche" + (isInactiveView ? " on" : "")} data-n="__inativos" onClick={() => setPNiche(isInactiveView ? "Todos" : "__inativos")}>Inativos {inactiveCount}</button>}
          </div>
          <Sel value={pSort} onChange={(e) => setPSort(e.target.value)} style={{ width: 210, marginLeft: "auto", height: 36, padding: "6px 10px" }} title="Ordenar">
            <option value="vendidos">Ordenar: mais vendidos</option><option value="recentes">Ordenar: últimos adicionados</option><option value="nome">Ordenar: nome (A–Z)</option><option value="margem">Ordenar: maior margem</option>
          </Sel>
          <div className="neo-search" style={{ marginLeft: 0 }}><SearchIc size={14} /><input value={pq} onChange={(e) => setPq(e.target.value)} placeholder="Nome ou descrição…" />{pq && <button onClick={() => setPq("")}>×</button>}</div>
        </div>
        {shown.length === 0 ? (
          <Card><Empty icon={Boxes} text={data.projects.length ? "Nenhum projeto neste filtro" : "Nenhum projeto cadastrado"} hint="Cadastre seu primeiro projeto para poder produzir e vender a partir dele." /></Card>
        ) : (
          <div className="neo-pgrid">
            {shown.map((p, idx) => {
              const inStock = prodQty(p.id);
              const mg = marginOf(p);
              const rank = rankIds.indexOf(p.id);
              const cols = colorsOf(p);
              const ch = num(p.cost) > 0 ? calcChannelPrices(p.cost, data.settings) : null;
              const grams = projFilaments(p).reduce((s, x) => s + num(x.grams), 0);
              const noFil = projFilaments(p).length === 0;
              return (
                <Reveal key={p.id} className={"neo-pcard" + (p.active === false ? " off" : "")} delay={Math.min(idx, 11) * 35} style={menu === p.id ? { zIndex: 30 } : undefined} title={p.name}>
                  <div className="ph" onClick={() => setModal({ type: "projectView", item: p })}>
                    {p.image ? <img src={p.image} alt={p.name} /> : <div className="noimg"><ImageIcon size={30} /></div>}
                    <div className="tl">{projNiches(p).slice(0, 2).map((n) => <span key={n} className="nch">{n}</span>)}</div>
                    <div className="tr">
                      {rank >= 0 && <span className="bdg g">🏆 {rank + 1}º</span>}
                      {inStock > 0 && <span className="bdg o">{fmtN(inStock)} em estoque</span>}
                      {isPartsProj(p) && <span className="bdg pt">{p.parts.length} partes</span>}
                      {p.active === false && <span className="bdg off">Inativo</span>}
                    </div>
                    <div className="nm"><b>{p.name}</b>{cols.length > 0 && <div className="dots">{cols.slice(0, 8).map((c, i) => <i key={i} style={{ background: c.hex }} title={c.name} />)}{cols.length > 8 && <em>+{cols.length - 8}</em>}</div>}</div>
                  </div>
                  <div className="bd">
                    <div className="sp">{noFil ? <span className="warn">⚠ Sem filamento vinculado</span> : <>{fmtN(grams)}g<span>/pç</span> {fmtN(p.hours, 1)}h<span>/pç</span>{p.extras && p.extras.length > 0 ? <> · {p.extras.length} extra{p.extras.length > 1 ? "s" : ""}</> : null}</>}</div>
                    <div className="pr">
                      <div><div className="l">PREÇO DE VENDA</div><div className={"v" + (num(p.salePrice) > 0 ? "" : " none")}>{num(p.salePrice) > 0 ? fmt(num(p.salePrice)) : "sem preço"}</div></div>
                      <span className={"mg " + marginTone(mg)}>{mg == null ? "defina o preço" : `margem ${fmtN(mg, 0)}%`}</span>
                    </div>
                    {ch && <div className="ch"><span><em>FINAL</em>{fmt(ch.final.price)}</span><span><em>SHOPEE</em>{fmt(ch.shopee.price)}</span><span><em>ML</em>{fmt(ch.mlClassic.price)}</span></div>}
                    <div className="sold"><span>Vendidos: <b>{fmtN(soldMap[p.id] || 0)}</b></span><span>custo {fmt(num(p.cost))}</span></div>
                    <div className="neo-oacts left">
                      <button className="neo-bp pj-order" title="Novo pedido com este projeto" onClick={() => setModal({ type: "order", projectId: p.id })}><Plus size={13} />Pedido</button>
                      <button className="neo-bg2 pj-quote" title="Novo orçamento com este projeto" onClick={() => setModal({ type: "quote", projectId: p.id })}><Plus size={13} />Orçamento</button>
                      <button className="neo-bg2 ic" title="Duplicar projeto" onClick={() => setModal({ type: "project", item: { ...p, id: uid(), name: `${p.name} (cópia)` }, isCopy: true })}><CopyIc size={13} /></button>
                      <button className="neo-bg2 ic" title="Editar" onClick={() => setModal({ type: "project", item: p })}><Pencil size={13} /></button>
                      <button className={"neo-bg2 ic neo-qmore" + (menu === p.id ? " on" : "")} title="Mais opções" onClick={() => setMenu(menu === p.id ? null : p.id)}>⋯</button>
                      {menu === p.id && (
                        <div className="neo-qmenu up">
                          <button className="pj-toggle" onClick={() => { setMenu(null); logAs(`${p.active === false ? "Ativou" : "Inativou"} o projeto ${p.name}`); saveItem("projects", { ...p, active: p.active === false }); }}>{p.active === false ? "▶ Ativar projeto" : "⏸ Inativar projeto"}</button>
                          <hr />
                          <button className="r pj-del" title="Excluir" onClick={() => { setMenu(null); if (confirm(`Excluir o projeto "${p.name}"?`)) delItem("projects", p.id); }}><Trash2 size={13} />Excluir</button>
                        </div>
                      )}
                    </div>
                  </div>
                </Reveal>
              );
            })}
          </div>
        )}
      </div>
    );
  }

  /* =============================== KITS (v4.39) =============================== */
  function KitsTab({ tabs }) {
    const kits = data.kits || [];
    const [menu, setMenu] = useState(null);
    useEffect(() => {
      if (!menu) return;
      const close = (e) => { if (!(e.target.closest && e.target.closest(".neo-qmenu, .neo-qmore"))) setMenu(null); };
      document.addEventListener("mousedown", close);
      return () => document.removeEventListener("mousedown", close);
    }, [menu]);
    return (
      <div className="neo-projects">
        {tabs}
        {kits.length === 0 ? (
          <Card><Empty icon={Package} text="Nenhum kit montado" hint='Clique em "Montar kit", escolha os projetos e as quantidades, coloque a foto e o preço.' /></Card>
        ) : (
          <div className="neo-pgrid">
            {kits.map((k, idx) => {
              const sum = kitSum(k), cost = kitCost(k), price = num(k.price);
              const mg = price > 0 ? ((price - cost) / price) * 100 : null;
              return (
                <Reveal key={k.id} className={"neo-pcard kit-card" + (k.active === false ? " off" : "")} delay={Math.min(idx, 11) * 35} style={menu === k.id ? { zIndex: 30 } : undefined} title={k.name}>
                  <div className="ph">
                    {k.image ? <img src={k.image} alt={k.name} /> : <div className="noimg"><Package size={30} /></div>}
                    <div className="tl"><span className="nch kit">KIT</span>{(k.niches || []).slice(0, 1).map((n) => <span key={n} className="nch">{n}</span>)}</div>
                    <div className="tr">{kitReady(k) && <span className="bdg t">pronta entrega</span>}{k.active === false && <span className="bdg off">Inativo</span>}</div>
                    <div className="nm"><b>{k.name}</b></div>
                  </div>
                  <div className="bd">
                    <div className="kits-items">{kitItemsText(k) || <span className="warn">⚠ sem itens</span>}</div>
                    <div className="pr">
                      <div><div className="l">PREÇO DO KIT</div><div className={"v" + (price > 0 ? "" : " none")}>{price > 0 ? fmt(price) : "Sob consulta"}</div></div>
                      {mg != null && <span className={"mg " + marginTone(mg)}>margem {fmtN(mg, 0)}%</span>}
                    </div>
                    <div className="sold">{price > 0 && sum > price + 0.004 ? <span className="eco">economia de {fmt(sum - price)}</span> : <span />}{price > 0 && <span>custo {fmt(cost)} · lucro {fmt(price - cost)}</span>}</div>
                    <div className="neo-oacts left">
                      <button className="neo-bg2 ic" title="Duplicar kit" onClick={() => setModal({ type: "kit", item: { ...k, id: uid(), name: `${k.name} (cópia)` }, isCopy: true })}><CopyIc size={13} /></button>
                      <button className="neo-bg2 ic" title="Editar" onClick={() => setModal({ type: "kit", item: k })}><Pencil size={13} /></button>
                      <button className={"neo-bg2 ic neo-qmore" + (menu === k.id ? " on" : "")} title="Mais opções" onClick={() => setMenu(menu === k.id ? null : k.id)}>⋯</button>
                      {menu === k.id && (
                        <div className="neo-qmenu up">
                          <button className="r" title="Excluir" onClick={() => { setMenu(null); if (confirm(`Excluir o kit "${k.name}"?`)) delItem("kits", k.id); }}><Trash2 size={13} />Excluir</button>
                        </div>
                      )}
                    </div>
                  </div>
                </Reveal>
              );
            })}
          </div>
        )}
      </div>
    );
  }

  function KitModal({ item, isCopy }) {
    const [f, setF] = useState(item ? { items: [], niches: [], gallery: [], desc: "", price: "", active: true, ...item }
      : { id: uid(), name: "", niches: [], image: "", gallery: [], desc: "", price: "", active: true, items: [{ id: uid(), projectId: "", qty: 1 }] });
    const set = (k) => (e) => setF({ ...f, [k]: e.target.value });
    const setIt = (i, patch) => setF({ ...f, items: f.items.map((x, j) => (j === i ? { ...x, ...patch } : x)) });
    const sum = kitSum(f), cost = kitCost(f), price = num(f.price);
    const ns = projNiches(f);
    const toggleNiche = (n) => { const arr = ns.includes(n) ? ns.filter((y) => y !== n) : [...ns, n]; setF({ ...f, niches: arr, niche: arr[0] || "" }); };
    const photos = [f.image, ...(f.gallery || [])].filter(Boolean);
    return (
      <Modal title={isCopy ? "Duplicar kit" : item ? "Editar kit" : "Montar kit"} onClose={() => setModal(null)} wide>
        <Row>
          <div><L>Nome do kit</L><In className="kit-name" value={f.name} onChange={set("name")} placeholder="ex: Kit Anjos" /></div>
          <div><L>Status</L><Sel value={f.active === false ? "0" : "1"} onChange={(e) => setF({ ...f, active: e.target.value === "1" })}><option value="1">Ativo (aparece no catálogo)</option><option value="0">Inativo (fica guardado)</option></Sel></div>
        </Row>
        <L>Itens do kit</L>
        <div style={{ border: "1px solid rgba(63,209,206,.14)", borderRadius: 12, padding: 12, marginBottom: 12, background: "rgba(5,12,12,.55)" }}>
          {f.items.map((it, i) => {
            const p = projMap[it.projectId];
            return (
              <div key={it.id || i} className="kit-line" style={{ display: "grid", gridTemplateColumns: "1fr 70px 110px 34px", gap: 8, alignItems: "center", marginBottom: 8 }}>
                <div style={{ display: "flex", alignItems: "center", gap: 7, minWidth: 0 }}>
                  {p && p.image ? <img src={p.image} alt="" style={{ width: 30, height: 30, objectFit: "cover", borderRadius: 6, flexShrink: 0 }} /> : <span style={{ width: 30, height: 30, borderRadius: 6, background: "rgba(12,26,28,.72)", border: "1px solid rgba(63,209,206,.14)", flexShrink: 0 }} />}
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <Combo value={it.projectId} onChange={(v) => setIt(i, { projectId: v })} placeholder="Escolher projeto…"
                      options={data.projects.filter((x) => x.active !== false || x.id === it.projectId).map((x) => ({ value: x.id, label: x.name, sub: num(x.salePrice) > 0 ? fmt(x.salePrice) : "sem preço" }))} />
                  </div>
                </div>
                <In type="number" min="1" value={it.qty} onChange={(e) => setIt(i, { qty: e.target.value })} title="Quantidade no kit" />
                <div style={{ font: "500 12px 'JetBrains Mono',monospace", color: "#93A6A6", textAlign: "right" }}>{p ? fmt(refPrice(p) * num(it.qty)) : "—"}</div>
                <button title="Remover item" onClick={() => setF({ ...f, items: f.items.filter((_, j) => j !== i) })} style={{ background: "none", border: "none", cursor: "pointer", color: "#F0605F" }}><Trash2 size={15} /></button>
              </div>
            );
          })}
          <Btn small kind="ghost" onClick={() => setF({ ...f, items: [...f.items, { id: uid(), projectId: "", qty: 1 }] })}><Plus size={13} />Adicionar projeto</Btn>
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, alignItems: "end", marginBottom: 12 }}>

  function ProjectModal({ item, isCopy }) {
    const [f, setF] = useState(item ? { extras: [], niche: "", active: true, moreFils: [], gallery: [], videoUrl: "", catalogDesc: "", salePrice: "", printMode: "unica", parts: [], ...item } : { id: uid(), name: "", printMode: "unica", parts: [], filamentId: data.filaments[0] ? data.filaments[0].id : "", grams: "", qty: 1, hours: "", cost: "", image: "", gallery: [], videoUrl: "", catalogDesc: "", salePrice: "", extras: [], niche: "", active: true, moreFils: [] });
    const [calc, setCalc] = useState(false);
    const set = (k) => (e) => setF({ ...f, [k]: e.target.value });
    const emPartes = f.printMode === "partes";
    const toggleBtn = (on) => ({ flex: 1, padding: "8px 0", borderRadius: 9, cursor: "pointer", border: on ? "1.5px solid #14A6A4" : "1px solid rgba(63,209,206,.22)", background: on ? "rgba(63,209,206,.1)" : "rgba(12,26,28,.72)", font: "600 12.5px Inter,sans-serif", color: on ? "#3FD1CE" : "#7E9191" });
    /* ao trocar para "em partes", a 1a parte nasce com os filamentos e o tempo da peca unica */
    const toPartes = () => setF((x) => ({ ...x, printMode: "partes", parts: (x.parts || []).length ? x.parts : [{
      ...newPart(data.printers, data.filaments, 1), hours: x.hours,
      fils: projFilaments(x).length ? projFilaments(x).map((y) => ({ filamentId: y.filamentId, grams: y.grams || "" })) : [{ filamentId: data.filaments[0] ? data.filaments[0].id : "", grams: "" }],
    }] }));
    /* projeto em partes: os campos de sempre (filamento principal, extras, horas) sao a soma das partes,
       assim estoque, relatorios e troca de cor continuam funcionando como antes */
    const withPartsTotals = (x) => {
      if (x.printMode !== "partes" || !(x.parts || []).length) return { ...x, printMode: "unica", parts: [] };
      const parts = x.parts.map((pt) => ({ ...pt, fils: (pt.fils || []).filter((y) => y.filamentId && num(y.grams) > 0) }));
      const tot = Object.entries(partsFilTotals(parts)).sort((a, b) => b[1] - a[1]);
      return { ...x, parts, hours: +partsHours(parts).toFixed(4),
        filamentId: tot[0] ? tot[0][0] : "", grams: tot[0] ? String(+tot[0][1].toFixed(2)) : "",
        moreFils: tot.slice(1).map(([fid, g]) => ({ id: "pf-" + fid, filamentId: fid, grams: String(+g.toFixed(2)) })) };
    };
    return (
      <React.Fragment>
        <Modal title={isCopy ? "Duplicar projeto" : item ? "Editar projeto" : "Cadastrar projeto"} onClose={() => setModal(null)} wide>
          <Row>
            <div><L>Nome do projeto</L><In value={f.name} onChange={set("name")} placeholder="ex: Chaveiro peixe articulado" /></div>
            <div><L>Status</L>
              <Sel value={f.active === false ? "0" : "1"} onChange={(e) => setF({ ...f, active: e.target.value === "1" })}>
                <option value="1">Ativo (aparece nas listas e no catálogo)</option>
                <option value="0">Inativo (fica guardado, mas oculto)</option>
              </Sel>
            </div>
          </Row>
          <Row>
            <div style={{ gridColumn: "1 / -1" }}><L>Nichos <span style={{ fontWeight: 400, color: "#8FA3A3" }}>(clique para marcar quantos quiser · ★ = principal, usado nos gráficos)</span></L>
              {(() => {
                const ns = projNiches(f);
                const setNs = (arr) => setF((x) => ({ ...x, niches: arr, niche: arr[0] || "" }));
                const toggle = (n) => setNs(ns.includes(n) ? ns.filter((y) => y !== n) : [...ns, n]);
                const makeMain = (n) => setNs([n, ...ns.filter((y) => y !== n)]);
                const all = Array.from(new Set([...(data.settings.niches || []), ...ns]));
                return (
                  <div className="niche-picker" style={{ display: "flex", gap: 6, flexWrap: "wrap", alignItems: "center" }}>

                      const on = ns.includes(n); const main = ns[0] === n;
                      return (
                        <span key={n} className={"niche-opt" + (on ? " on" : "")} data-n={n} style={{ display: "inline-flex", alignItems: "center", borderRadius: 999, border: on ? "1.5px solid #14A6A4" : "1px solid rgba(63,209,206,.22)", background: on ? "rgba(63,209,206,.1)" : "rgba(12,26,28,.72)", overflow: "hidden" }}>
                          {on && <button type="button" className="niche-star" title={main ? "Nicho principal" : "Tornar principal"} onClick={() => makeMain(n)} style={{ background: "none", border: "none", cursor: "pointer", padding: "5px 0 5px 9px", color: main ? "#FFB067" : "#4E6262", font: "700 13px Inter,sans-serif" }}>★</button>}
                          <button type="button" className="niche-toggle" onClick={() => toggle(n)} style={{ background: "none", border: "none", cursor: "pointer", padding: on ? "5px 11px 5px 5px" : "5px 11px", font: "600 12.5px Inter,sans-serif", color: on ? "#3FD1CE" : "#B5C4C4" }}>{n}{on ? " ✓" : ""}</button>

                    {ns.length === 0 && <span style={{ font: "400 12px Inter,sans-serif", color: "#7E9191" }}>sem nicho</span>}

            <button onClick={toPartes} style={toggleBtn(emPartes)}>Em partes (cada parte na sua impressora)</button>
          </div>
          {emPartes ? (
            <div style={{ border: "1px solid rgba(63,209,206,.14)", borderRadius: 12, padding: 12, marginBottom: 12, background: "rgba(5,12,12,.55)" }}>
              <div style={{ font: "600 12.5px 'Space Grotesk',sans-serif", color: "#3FD1CE", marginBottom: 8 }}>Partes da peça (valores POR PEÇA)</div>
              <PartsEditor parts={f.parts || []} onChange={(parts) => setF({ ...f, parts })} printers={data.printers} filaments={data.filaments} unitLabel="por peça" />
            </div>
          ) : (
          <div style={{ border: "1px solid rgba(63,209,206,.14)", borderRadius: 12, padding: "12px 12px 6px", marginBottom: 12, background: "rgba(5,12,12,.55)" }}>
            <div style={{ font: "600 12.5px 'Space Grotesk',sans-serif", color: "#3FD1CE", marginBottom: 8 }}>Filamentos da peça (valores POR PEÇA)</div>
            <div style={{ display: "grid", gridTemplateColumns: "1.4fr 110px 84px 34px", gap: 8, marginBottom: 4, font: "700 10px Inter,sans-serif", color: "#93A6A6", letterSpacing: ".06em" }}>
              <span>FILAMENTO</span><span>TOTAL USADO (G)</span><span style={{ textAlign: "right" }}>CUSTO</span><span />
            </div>
            {(() => {
              const filCost = (fid, g) => { const x = filMap[fid]; return x ? num(g) * (num(x.price) / Math.max(1, num(x.qtyG))) : 0; };
              const mainFil = filMap[f.filamentId];

                    </div>
                    <In type="number" min="0" value={f.grams} onChange={set("grams")} title="Filamento total usado por peça" />

                <span>CANAL</span><span style={{ textAlign: "right" }}>PREÇO</span><span style={{ textAlign: "right" }}>LUCRO</span>

                  <span>{ch.label}{ch.feePct ? ` (taxa ${fmtN(ch.feePct)}%)` : ""}</span>

                </div>

          <ExtrasEditor extras={f.extras || []} onChange={(ex) => setF({ ...f, extras: ex })} materials={data.materials} />
          <Row cols={1}>

            </div>
          </Row>
          <Row cols={1}>
            <div>
              <L>Fotos do projeto (até 4 — a 1ª é a capa)</L>
              <div style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap" }}>
                {[f.image, ...(f.gallery || [])].filter(Boolean).map((img, i) => (
                  <div key={i} style={{ position: "relative" }}>
                    <img src={img} alt="" style={{ width: 64, height: 64, objectFit: "cover", borderRadius: 8, border: i === 0 ? "2px solid #F47A20" : "1px solid rgba(63,209,206,.22)" }} />
                    {i === 0 && <span style={{ position: "absolute", bottom: -6, left: "50%", transform: "translateX(-50%)", background: "#F47A20", color: "#fff", borderRadius: 999, padding: "0 6px", font: "700 8.5px Inter,sans-serif" }}>CAPA</span>}
                    <button onClick={() => {
                      if (i === 0) { const g = f.gallery || []; setF({ ...f, image: g[0] || "", gallery: g.slice(1) }); }
                      else setF({ ...f, gallery: (f.gallery || []).filter((_, idx) => idx !== i - 1) });
                    }} title="Remover foto" style={{ position: "absolute", top: -7, right: -7, width: 19, height: 19, borderRadius: "50%", background: "#C43A3A", color: "#fff", border: "none", cursor: "pointer", font: "700 11px Inter,sans-serif", lineHeight: 1 }}>×</button>
                  </div>
                ))}
                {[f.image, ...(f.gallery || [])].filter(Boolean).length < 4 && (
                  <label style={{ ...inputStyle, cursor: "pointer", display: "flex", alignItems: "center", gap: 8, color: "#7E9191", width: "auto" }}>

                    <input type="file" accept="image/*" multiple style={{ display: "none" }}
                      onChange={(e) => {
                        const files = [...(e.target.files || [])];
                        files.forEach((file) => compressImage(file, (img) => setF((x) => {
                          const count = [x.image, ...(x.gallery || [])].filter(Boolean).length;
                          if (count >= 4) return x;
                          return x.image ? { ...x, gallery: [...(x.gallery || []), img] } : { ...x, image: img };
                        })));
                        e.target.value = "";
                      }} />
                  </label>
                )}
              </div>
            </div>
          </Row>
          <Row cols={1}>
            <div><L>Descrição para o catálogo (opcional)</L><In value={f.catalogDesc || ""} onChange={set("catalogDesc")} placeholder="ex: Articulado, pintado à mão, ideal para presente" /></div>
          </Row>
          <Row>
            <div>
              <L>Preço de venda no catálogo (R$)</L>
              <In type="number" step="0.01" value={f.salePrice || ""} onChange={set("salePrice")} placeholder="vazio = aparece 'Sob consulta'" />
              <div style={{ font: "400 11px Inter,sans-serif", color: "#8FA3A3", marginTop: 4 }}>É o único valor que o cliente vê no catálogo — o custo nunca sai daqui. Também vira a sugestão de preço nos orçamentos e vendas.</div>
            </div>
            <div />
          </Row>
          <div style={{ display: "flex", justifyContent: "flex-end", gap: 10, marginTop: 6 }}>
            <Btn kind="ghost" onClick={() => setModal(null)}>Cancelar</Btn>

          </div>
        </Modal>
        {calc && <CalcModal data={data} prefill={{ filamentId: f.filamentId, grams: f.grams, fils: projFilaments(f), hours: emPartes ? partsHours(f.parts) : f.hours, qty: f.qty, extras: f.extras, printMode: f.printMode, parts: f.parts }}
          onClose={() => setCalc(false)}
          onApply={(r, extras) => setF((x) => {
            const fp = r.filsPerPiece || [];
            const main = fp.slice().sort((a, b) => num(b.grams) - num(a.grams))[0];
            const rest = main ? fp.filter((y) => y !== main).slice(0, 3) : [];
            const base = {
              ...x, cost: r.unitCost.toFixed(2), extras,
              hours: r.hoursPerPiece || x.hours,
              filamentId: main ? main.filamentId : (r.mainFilamentId || x.filamentId),
              grams: main ? String(main.grams) : (r.gramsPerPiece || x.grams),
              moreFils: main ? rest.map((y) => ({ id: uid(), filamentId: y.filamentId, grams: String(y.grams) })) : (x.moreFils || []),
            };
            return r.printMode === "partes" ? { ...base, printMode: "partes", parts: r.parts || [] } : { ...base, printMode: "unica" };
          })} />}
      </React.Fragment>
    );

  /* ================================ ESTOQUE =============================== */
  function Stock() {
    const today = todayISO();
    const [view, setViewS] = useState(STK_UI.view);
    const setView = (v) => { STK_UI.view = v; setViewS(v); };
    const [typeF, setTypeS] = useState(STK_UI.type);
    const setTypeF = (v) => { STK_UI.type = v; setTypeS(v); };
    const [sortBy, setSortS] = useState(STK_UI.sort);
    const setSortBy = (v) => { STK_UI.sort = v; setSortS(v); };
    const [mcat, setMcatS] = useState(STK_UI.mcat);
    const setMcat = (v) => { STK_UI.mcat = v; setMcatS(v); };
    const [help, setHelp] = useState(false);
    const [pop, setPop] = useState(null);
    const [showMov, setShowMov] = useState(false);
    const [viewMov, setViewMov] = useState(null);
    const [menu, setMenu] = useState(null);
    useEffect(() => {
      if (!pop && !menu) return;
      const close = (e) => { if (!(e.target.closest && e.target.closest(".neo-fpop, .neo-ftile, .neo-qmenu, .neo-qmore"))) { setPop(null); setMenu(null); } };
      const esc = (e) => { if (e.key === "Escape") { setPop(null); setMenu(null); } };
      document.addEventListener("mousedown", close); document.addEventListener("keydown", esc);
      return () => { document.removeEventListener("mousedown", close); document.removeEventListener("keydown", esc); };
    }, [pop, menu]);
    const sFil = useSort("filamentos");
    const sMat = useSort("materiais");
    const matValue = data.materials.reduce((s, m) => s + num(m.stock) * num(m.unitCost), 0);
    const filValue = data.filaments.reduce((s, f) => s + (num(f.stockG) / Math.max(1, num(f.qtyG))) * num(f.price), 0);
    const allMovements = data.materials.flatMap((m) => (m.movements || []).map((mv) => ({ ...mv, matName: m.name })))
      .sort((a, b) => (b.date > a.date ? 1 : b.date < a.date ? -1 : 0)).slice(0, 15);
    /* quanto a fila (pedidos em aberto) ainda vai gastar de cada filamento */
    const need = {};
    const addNeed = (fid, g) => { if (fid && g > 0) need[fid] = (need[fid] || 0) + g; };
    pendingOrdersList.filter((o) => !o.fromStock).forEach((o) => {
      const p = projMap[o.projectId]; if (!p) return;
      const qty = num(o.qty);
      if (isPartsProj(p)) p.parts.forEach((pt) => { const left = Math.max(0, qty - partPrinted(o, pt.id)); partFils(p, o, pt).forEach((x) => addNeed(x.filamentId, x.grams * left)); });
      else { const left = Math.max(0, qty - printedOf(o)); orderFilaments(p, o).forEach((x) => addNeed(x.filamentId, num(x.grams) * left)); }
    });
    /* ritmo de uso: impressoes (e pedidos concluidos sem registro) dos ultimos 30 dias */
    const used30 = {};
    const from30 = addDays(today, -29);
    data.orders.filter((o) => !o.fromStock).forEach((o) => {
      const p = projMap[o.projectId]; if (!p) return;
      const prints = (o.prints || []).filter((x) => x.date && x.date >= from30);
      if (prints.length) {
        prints.forEach((pr) => {
          if (isPartsProj(p)) p.parts.filter((pt) => !pr.partId || pr.partId === pt.id).forEach((pt) => partFils(p, o, pt).forEach((x) => { used30[x.filamentId] = (used30[x.filamentId] || 0) + x.grams * num(pr.qty); }));
          else orderFilaments(p, o).forEach((x) => { used30[x.filamentId] = (used30[x.filamentId] || 0) + num(x.grams) * num(pr.qty); });
        });
      } else if (isDone(o) && o.processed && o.date >= from30 && !(o.prints || []).length) {
        orderFilaments(p, o).forEach((x) => { used30[x.filamentId] = (used30[x.filamentId] || 0) + num(x.grams) * num(o.qty); });
      }
    });
    const totalNeed = Object.values(need).reduce((s, g) => s + g, 0);
    const shortIds = Object.keys(need).filter((fid) => filMap[fid] && need[fid] > num(filMap[fid].stockG) + 0.01);
    const totalUse30 = Object.values(used30).reduce((s, g) => s + g, 0);
    const daysLeftAll = totalUse30 > 0 ? (stockTotal / (totalUse30 / 30)) : null;
    const durTxt = (days) => (days == null ? null : days < 14 ? `~${Math.max(1, Math.round(days))} dia${Math.round(days) > 1 ? "s" : ""}` : days < 60 ? `~${Math.round(days / 7)} semanas` : `~${Math.round(days / 30)} meses`);
    const types = [...new Set(data.filaments.map((f) => String(f.type || "").trim()).filter(Boolean))].sort();
    const lowIds = new Set(lowStock.map((f) => f.id));
    let fils = data.filaments.filter((f) => typeF === "Todos" || (typeF === "__low" ? lowIds.has(f.id) || shortIds.includes(f.id) : String(f.type || "").trim() === typeF));
    fils = fils.slice().sort((a, b) => sortBy === "nome" ? (a.name || "").localeCompare(b.name || "", "pt-BR") : sortBy === "tipo" ? (String(a.type).localeCompare(String(b.type)) || (a.name || "").localeCompare(b.name || "")) : sortBy === "mais" ? num(b.stockG) - num(a.stockG) : (num(a.stockG) / Math.max(1, num(a.qtyG))) - (num(b.stockG) / Math.max(1, num(b.qtyG))));
    const ringColor = (f) => { const c = f.colorHex || "#4A5257"; return isDarkHex(c) ? "#6B7A7D" : hexShade(c, 0); };
    const fcard = (f) => {
      const pct = Math.min(100, (num(f.stockG) / Math.max(1, num(f.qtyG))) * 100);
      const low = lowIds.has(f.id);
      const nd = need[f.id] || 0;
      const short = nd > num(f.stockG) + 0.01;
      const perWeek = (used30[f.id] || 0) / 30 * 7;
      const days = perWeek > 0 ? num(f.stockG) / (perWeek / 7) : null;
      const perKg = (num(f.price) / Math.max(1, num(f.qtyG))) * 1000;
      return (
        <div className={"neo-fcard" + (low ? " low" : short ? " need" : "")}>
          <button className="neo-mx sm" title="Fechar" onClick={() => setPop(null)}><XIc size={14} /></button>
          <Ring pct={pct} size={96} stroke={12} color={ringColor(f)} track="rgba(127,154,155,.12)"><div className="rc"><b style={low ? { color: "#FF8A8A" } : undefined}>{fmtN(pct, 0)}%</b><small>restante</small></div></Ring>
          <div className="nm">{f.name}</div>
          {f.type && <span className="ty">{f.type}</span>}
          <div className="g">{fmtN(f.stockG)} g <span>de {fmtN(f.qtyG)} g</span></div>
          <div className="info">
            {low && <><span className="r">⚠ abaixo do mínimo ({fmtN(data.settings.lowStockG)} g)</span><br /></>}
            fila precisa: {nd > 0 ? (short ? <span className="w">{fmtN(nd)} g · falta {fmtN(nd - num(f.stockG))} g</span> : <span className="ok">{fmtN(nd)} g ✓</span>) : <span className="ok">0 g</span>}<br />
            {perWeek > 0 ? <>uso ~{fmtN(perWeek)} g/semana · <span className={days < 21 ? "w" : ""}>dura {durTxt(days)}</span></> : "sem uso nos últimos 30 dias"}<br />
            {fmt(perKg)}/kg
          </div>
          <div className="neo-oacts" style={{ justifyContent: "center", marginTop: 10 }}>
            <button className={(low || short ? "neo-bp" : "neo-bg2") + " stk-restock"} onClick={() => { setPop(null); setModal({ type: "filament", restock: f }); }}>↻ Repor</button>
            <button className="neo-bg2 ic" title="Editar" onClick={() => { setPop(null); setModal({ type: "filament", item: f }); }}><Pencil size={13} /></button>
            <button className="neo-bg2 ic danger stk-del" title="Excluir" onClick={() => { setPop(null); if (confirm(`Excluir "${f.name}"?`)) delItem("filaments", f.id); }}><Trash2 size={13} /></button>
          </div>
        </div>
      );
    };
    const mats = data.materials.filter((m) => mcat === "Todos" || (mcat === "__low" ? num(m.stock) <= num(m.minStock) : m.category === mcat));
    const mcats = [...new Set(data.materials.map((m) => m.category).filter(Boolean))];
    const matIcon = (m) => (/embal|caixa|saco|saquinho/i.test((m.category || "") + " " + m.name) ? "📦" : /im[ãa]/i.test(m.name) ? "🧲" : /argola|chaveir|corrente/i.test(m.name) ? "🔗" : /led|luz|fio/i.test(m.name) ? "💡" : "🔩");
    const lowMatN = data.materials.filter((m) => num(m.stock) <= num(m.minStock)).length;
    return (
      <div className="neo-stock">
        <div className="neo-pagehead">
          <span className="neo-code">ESTOQUE</span><h2>Matéria-prima</h2>
          <button className={"neo-help" + (help ? " on" : "")} onClick={() => setHelp(!help)} title="Como funciona">?</button>
          <div className="neo-oacts" style={{ marginLeft: "auto" }}>
            <Btn kind="ghost" onClick={() => setModal({ type: "movement" })} disabled={data.materials.length === 0}><UploadIc size={15} />Entrada / Saída manual</Btn>
            <Btn kind="ghost" onClick={() => setModal({ type: "filament" })}><Plus size={15} />Filamento (manual)</Btn>
            <Btn kind="ghost" onClick={() => setModal({ type: "material" })}><Plus size={15} />Material (manual)</Btn>
          </div>
        </div>
        {help && <div className="neo-hud neo-helpbox">💡 As compras lançadas em Investimentos (Filamento, Material, Embalagem) entram aqui automaticamente. Os botões acima servem para cadastro manual do que você já tinha antes, ajustes e correções. Clique num carretel para ver os detalhes.</div>}
        <div className="neo-ckpis">
          <Reveal className="neo-hud neo-k or" delay={0}><div className="l">Valor em estoque</div><div className="v"><CountUp value={matValue + filValue} format={fmt} /></div><span className="neo-kd">{fmt(filValue)} filamentos · {fmt(matValue)} materiais</span></Reveal>
          <Reveal className="neo-hud neo-k" delay={60}><div className="l">Filamento disponível</div><div className="v" style={{ color: "#3FD1CE" }}><CountUp value={stockTotal / 1000} format={(v) => fmtN(v, 2) + " kg"} /></div><span className="neo-kd">{data.filaments.length} carretéis{daysLeftAll != null ? ` · dura ${durTxt(daysLeftAll)} no ritmo atual` : ""}</span></Reveal>
          <Reveal className="neo-hud neo-k" delay={120}><div className="l">A fila precisa de</div><div className="v"><CountUp value={totalNeed / 1000} format={(v) => fmtN(v, 2) + " kg"} /></div><span className={"neo-kd" + (shortIds.length ? " o" : "")}>{shortIds.length ? `${shortIds.length} cor${shortIds.length > 1 ? "es" : ""} sem filamento suficiente` : totalNeed > 0 ? "todas as cores dão ✓" : "nenhum pedido em aberto"}</span></Reveal>
          <Reveal className="neo-hud neo-k" delay={180}><div className="l">Alertas</div><div className="v" style={{ color: lowStock.length + lowMatN ? "#FF6B6B" : "#3FD1CE" }}><CountUp value={lowStock.length + lowMatN} /></div><span className="neo-kd">{lowStock.length + lowMatN ? `${lowStock.length} filamento${lowStock.length === 1 ? "" : "s"} · ${lowMatN} ${lowMatN === 1 ? "material" : "materiais"} para repor` : "tudo abastecido"}</span></Reveal>
        </div>

        <div className="neo-penbar">
          <span className="neo-code">FILAMENTOS</span><b className="neo-sect">Carretéis</b>
          <div className="neo-seg sm">{[["spools", "Carretéis"], ["table", "Tabela"]].map(([k, l]) => <button key={k} className={"stk-view" + (view === k ? " on" : "")} data-v={k} onClick={() => setView(k)}>{l}</button>)}</div>
          <div className="neo-fchips">
            <button className={"neo-fchip stk-type" + (typeF === "Todos" ? " on" : "")} data-t="Todos" onClick={() => setTypeF("Todos")}>Todos {data.filaments.length}</button>
            {types.map((t) => <button key={t} className={"neo-fchip stk-type" + (typeF === t ? " on" : "")} data-t={t} onClick={() => setTypeF(t)}>{t} {data.filaments.filter((f) => String(f.type || "").trim() === t).length}</button>)}
            {(lowStock.length > 0 || shortIds.length > 0) && <button className={"neo-fchip r stk-type" + (typeF === "__low" ? " on" : "")} data-t="__low" onClick={() => setTypeF(typeF === "__low" ? "Todos" : "__low")}>⚠ Baixos {new Set([...lowStock.map((f) => f.id), ...shortIds]).size}</button>}
          </div>
          {view === "spools" && <Sel value={sortBy} onChange={(e) => setSortBy(e.target.value)} style={{ width: 225, marginLeft: "auto", height: 36, padding: "6px 10px" }} title="Ordenar">
            <option value="menos">Ordenar: menos estoque</option><option value="mais">Ordenar: mais estoque</option><option value="nome">Ordenar: nome</option><option value="tipo">Ordenar: tipo</option>
          </Sel>}
        </div>

        {data.filaments.length === 0 ? <Card><Empty icon={Layers} text="Nenhum filamento cadastrado" hint="Lance a compra na aba Investimentos (categoria Filamento) que o carretel entra aqui sozinho." /></Card>
          : view === "spools" ? (
            <div className="neo-fgrid">
              {fils.map((f, i) => {
                const pct = Math.min(100, (num(f.stockG) / Math.max(1, num(f.qtyG))) * 100);
                const low = lowIds.has(f.id);
                const short = (need[f.id] || 0) > num(f.stockG) + 0.01;
                return (
                  <div key={f.id} className="neo-fcell">
                    <button className={"neo-ftile" + (low ? " low" : short ? " need" : "") + (pop && pop.id === f.id ? " on" : "")} data-fil={f.id} title={`${f.name} — clique para ver detalhes`}
                      onClick={(e) => { if (pop && pop.id === f.id) { setPop(null); return; } const r = e.currentTarget.getBoundingClientRect(); setPop({ id: f.id, align: r.left + 260 > window.innerWidth ? "r" : r.left < 280 ? "l" : "c", up: r.top + 380 > window.innerHeight && r.top > 380 }); }}>
                      <Ring pct={pct} size={58} stroke={8} color={ringColor(f)} track="rgba(127,154,155,.13)"><span className="hub" /></Ring>
                      <b>{f.name}</b><small>{fmtN(f.stockG)} g{low || short ? " ⚠" : ""}</small>
                    </button>
                    {pop && pop.id === f.id && <div className={"neo-fpop a-" + pop.align + (pop.up ? " up" : "")}>{fcard(f)}</div>}
                  </div>
                );
              })}
              {fils.length === 0 && <div className="neo-empty">Nenhum carretel neste filtro.</div>}
            </div>
          ) : (
            <div className="neo-otbl">
              <div style={{ overflowX: "auto" }}>
                <table className="neo-otable">
                  <thead><tr><Th s={sFil} col="name">Filamento</Th><Th s={sFil} col="type">Tipo</Th><Th s={sFil} col="color">Cor</Th><Th s={sFil} col="qtyG">Comprado</Th><Th s={sFil} col="stockG">Estoque</Th><th>Fila precisa</th><Th s={sFil} col="price">Preço</Th><Th s={sFil} col="perKg">R$/kg</Th><th /></tr></thead>
                  <tbody>
                    {sortRows(fils, sFil, { name: (x) => x.name, type: (x) => x.type, color: (x) => x.color, qtyG: (x) => num(x.qtyG), stockG: (x) => num(x.stockG), price: (x) => num(x.price), perKg: (x) => (num(x.price) / Math.max(1, num(x.qtyG))) * 1000 }).map((x) => {
                      const pct = Math.min(100, (num(x.stockG) / Math.max(1, num(x.qtyG))) * 100);
                      const low = lowIds.has(x.id);
                      const nd = need[x.id] || 0;
                      return (
                        <tr key={x.id}>
                          <td style={{ fontWeight: 600 }}>{x.name}</td>
                          <td>{x.type}</td>
                          <td><span style={{ display: "inline-flex", alignItems: "center", gap: 6 }}><span style={{ width: 13, height: 13, borderRadius: 4, background: x.colorHex || "#4A5257", border: "1px solid rgba(255,255,255,.2)" }} />{x.color}</span></td>
                          <td className="neo-on" style={{ textAlign: "left" }}>{fmtN(x.qtyG)}g</td>
                          <td style={{ minWidth: 130 }}>
                            <div style={{ font: "600 12.5px 'JetBrains Mono',monospace", color: low ? "#FF8A8A" : "#F3F6F6" }}>{fmtN(x.stockG)}g {low && "⚠"}</div>
                            <div style={{ height: 5, background: "rgba(127,154,155,.15)", borderRadius: 99, marginTop: 3 }}><div style={{ height: 5, width: `${pct}%`, background: low ? "#FF6B6B" : "#3FD1CE", borderRadius: 99, boxShadow: `0 0 6px ${low ? "#FF6B6B" : "#3FD1CE"}` }} /></div>
                          </td>
                          <td className="neo-on" style={{ textAlign: "left", color: nd > num(x.stockG) ? "#FFAA5C" : "#7F9A9B" }}>{nd > 0 ? `${fmtN(nd)}g` : "—"}</td>
                          <td className="neo-on" style={{ textAlign: "left" }}>{fmt(x.price)}</td>
                          <td className="neo-on" style={{ textAlign: "left" }}>{fmt((num(x.price) / Math.max(1, num(x.qtyG))) * 1000)}</td>
                          <td><div className="neo-oico">
                            <button className="neo-bg2" title="Repor estoque (nova compra)" onClick={() => setModal({ type: "filament", restock: x })}>↻ Repor</button>
                            <button className="neo-bg2 ic" title="Editar" onClick={() => setModal({ type: "filament", item: x })}><Pencil size={13} /></button>
                            <button className="neo-bg2 ic danger" title="Excluir" onClick={() => { if (confirm(`Excluir "${x.name}"?`)) delItem("filaments", x.id); }}><Trash2 size={13} /></button>
                          </div></td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            </div>
          )}

        <div className="neo-penbar" style={{ marginTop: 22 }}>
          <span className="neo-code">MATERIAIS</span><b className="neo-sect">Materiais e embalagens</b>
          <div className="neo-fchips">
            <button className={"neo-fchip" + (mcat === "Todos" ? " on" : "")} onClick={() => setMcat("Todos")}>Todos {data.materials.length}</button>
            {mcats.map((c) => <button key={c} className={"neo-fchip" + (mcat === c ? " on" : "")} onClick={() => setMcat(c)}>{c} {data.materials.filter((m) => m.category === c).length}</button>)}
            {lowMatN > 0 && <button className={"neo-fchip r" + (mcat === "__low" ? " on" : "")} onClick={() => setMcat(mcat === "__low" ? "Todos" : "__low")}>⚠ Repor {lowMatN}</button>}
          </div>
          <button className={"neo-bg2 stk-mov" + (showMov ? " on" : "")} style={{ marginLeft: "auto" }} onClick={() => setShowMov(!showMov)}>Últimas movimentações</button>
        </div>
        {showMov && (
          <div className="neo-hud" style={{ marginBottom: 12 }}>
            {allMovements.length === 0 ? <div className="neo-empty">As entradas e saídas de materiais aparecerão aqui.</div> : (
              <div className="neo-tline">
                {allMovements.map((mv) => <div key={mv.id} className="print-row"><span className="d">{fmtDate(mv.date).slice(0, 5)}</span><b style={{ color: mv.type === "entrada" ? "#3FD1CE" : "#FF8A8A" }}>{mv.type === "entrada" ? "+" : "−"}{fmtN(mv.qty)}</b><span>{mv.matName}</span><span className="pr">{mv.note}</span></div>)}
              </div>
            )}
          </div>
        )}
        {data.materials.length === 0 ? <Card><Empty icon={WarehouseIc} text="Nenhum material no estoque" hint="Lance a compra na aba Investimentos (Material/Embalagem, com unidades) que o item entra aqui sozinho." /></Card> : (
          <div className="neo-mgrid">
            {mats.map((m, i) => {
              const low = num(m.stock) <= num(m.minStock);
              const ref = Math.max(num(m.stock), num(m.minStock) * 3, 1);
              return (
                <Reveal key={m.id} className={"neo-mcard" + (low ? " low" : "")} delay={Math.min(i, 9) * 35} style={menu === m.id ? { zIndex: 30 } : undefined} title={m.name}>
                  <div className="top">
                    <span className="ic">{matIcon(m)}</span>
                    <div style={{ minWidth: 0 }}><b>{m.name}</b><small>{m.category || "Material"} · {fmt(m.unitCost)}/un</small></div>
                    <span className={"st" + (low ? " r" : "")}>{low ? "REPOR" : "OK"}</span>
                  </div>
                  <div className="bar"><i style={{ width: Math.min(100, (num(m.stock) / ref) * 100) + "%" }} /><em style={{ left: Math.min(100, (num(m.minStock) / ref) * 100) + "%" }} title={`mínimo ${fmtN(m.minStock)}`} /></div>
                  <div className="row"><span>estoque <b>{fmtN(m.stock)} un</b></span><span>mínimo {fmtN(m.minStock)}</span><span>valor <b>{fmt(num(m.stock) * num(m.unitCost))}</b></span></div>
                  <div className="neo-oacts left">
                    <button className={"neo-bg2" + (viewMov === m.id ? " on" : "")} onClick={() => setViewMov(viewMov === m.id ? null : m.id)}><EyeIc size={13} />Histórico</button>
                    <button className="neo-bg2 ic" title="Editar" onClick={() => setModal({ type: "material", item: m })}><Pencil size={13} /></button>
                    <button className={"neo-bg2 ic neo-qmore" + (menu === m.id ? " on" : "")} title="Mais opções" onClick={() => setMenu(menu === m.id ? null : m.id)}>⋯</button>
                    {menu === m.id && <div className="neo-qmenu"><button className="r" onClick={() => { setMenu(null); if (confirm(`Excluir "${m.name}" do estoque?`)) delItem("materials", m.id); }}><Trash2 size={13} />Excluir</button></div>}
                  </div>
                  {viewMov === m.id && (
                    <div className="neo-tline" style={{ marginTop: 10 }}>
                      {(m.movements || []).length === 0 ? <div className="neo-prog-t mut">Sem movimentações registradas.</div>
                        : (m.movements || []).slice(0, 12).map((mv) => <div key={mv.id} className="print-row"><span className="d">{fmtDate(mv.date).slice(0, 5)}</span><b style={{ color: mv.type === "entrada" ? "#3FD1CE" : "#FF8A8A" }}>{mv.type === "entrada" ? "+" : "−"}{fmtN(mv.qty)}</b><span className="pr">{mv.note}</span></div>)}
                    </div>
                  )}
                </Reveal>
              );
            })}
          </div>
        )}
      </div>
    );
  }

  function FilamentModal({ item, restock }) {
    const ftypes = data.settings.ftypes || DEFAULT_FTYPES;
    const [mode, setMode] = useState(item ? "edit" : restock ? "repor" : (data.filaments.length > 0 ? "ask" : "new"));
    const [f, setF] = useState(item || { id: uid(), name: "", type: ftypes[0] || "PLA", color: "", colorHex: "#14A6A4", qtyG: 1000, stockG: 1000, price: "" });
    const [launch, setLaunch] = useState(true);
    const [rep, setRep] = useState({ filamentId: restock ? restock.id : (data.filaments[0] ? data.filaments[0].id : ""), grams: 1000, value: "" });
    const set = (k) => (e) => setF({ ...f, [k]: e.target.value });
    const perG = num(f.price) / Math.max(1, num(f.qtyG));
    const target = data.filaments.find((x) => x.id === rep.filamentId);
    const newQtyG = target ? num(target.qtyG) + num(rep.grams) : 0;
    const newPrice = target ? num(target.price) + num(rep.value) : 0;
    const avgKg = newQtyG > 0 ? (newPrice / newQtyG) * 1000 : 0;
    if (mode === "ask") {
      return (
        <Modal title="Cadastrar filamento" onClose={() => setModal(null)}>
          <div style={{ font: "400 13px Inter,sans-serif", color: "#D6E2E2", marginBottom: 14 }}>Você comprou um filamento que <b>já está cadastrado</b> ou é um <b>modelo novo</b>?</div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
            <button onClick={() => setMode("repor")} style={{ border: "2px solid #14A6A4", background: "rgba(5,12,12,.55)", borderRadius: 12, padding: "16px 12px", cursor: "pointer", textAlign: "left" }}>
              <div style={{ font: "700 14px 'Space Grotesk',sans-serif", color: "#3FD1CE", marginBottom: 4 }}>🔄 Repor existente</div>
              <div style={{ font: "400 12px Inter,sans-serif", color: "#6FA3A3" }}>Soma no filamento já cadastrado e recalcula o custo médio. Sem linha duplicada.</div>
            </button>
            <button onClick={() => setMode("new")} style={{ border: "2px solid rgba(63,209,206,.14)", background: "rgba(12,26,28,.72)", borderRadius: 12, padding: "16px 12px", cursor: "pointer", textAlign: "left" }}>
              <div style={{ font: "700 14px 'Space Grotesk',sans-serif", color: "#F3F6F6", marginBottom: 4 }}>✨ Modelo novo</div>
              <div style={{ font: "400 12px Inter,sans-serif", color: "#7E9191" }}>Marca, tipo ou cor que ainda não existe no estoque.</div>
            </button>
          </div>
        </Modal>
      );
    }
    if (mode === "repor") {
      return (
        <Modal title="Repor filamento existente" onClose={() => setModal(null)}>
          <Row cols={1}>
            <div><L>Filamento</L>
              <Combo value={rep.filamentId} onChange={(v) => setRep({ ...rep, filamentId: v })} placeholder="Selecionar filamento…"
                options={data.filaments.map((x) => ({ value: x.id, label: x.name, sub: x.type + " " + (x.color || "") + " · " + fmtN(x.stockG) + "g" }))} />
            </div>
          </Row>
          <Row>
            <div><L>Gramas compradas (g)</L><In type="number" value={rep.grams} onChange={(e) => setRep({ ...rep, grams: e.target.value })} /></div>
            <div><L>Valor pago nesta compra (R$)</L><In type="number" step="0.01" value={rep.value} onChange={(e) => setRep({ ...rep, value: e.target.value })} /></div>
          </Row>
          {target && num(rep.grams) > 0 && (
            <div style={{ background: "rgba(5,12,12,.55)", border: "1px solid rgba(63,209,206,.1)", borderRadius: 10, padding: "10px 12px", marginBottom: 12, font: "400 12.5px Inter,sans-serif", color: "#2A4A4A", lineHeight: 1.6 }}>
              <b style={{ color: "#3FD1CE" }}>Prévia:</b> {target.name} ficará com <b>{fmtN(num(target.stockG) + num(rep.grams))}g em estoque</b> ({fmtN(newQtyG)}g compradas no total, {fmt(newPrice)} pagos).<br />
              Custo médio ponderado: <b style={{ color: "#3FD1CE" }}>{fmt(avgKg)}/kg</b>{num(rep.value) > 0 && num(target.qtyG) > 0 ? ` (antes: ${fmt(num(target.price) / num(target.qtyG) * 1000)}/kg)` : ""}
            </div>
          )}
          <label style={{ display: "flex", gap: 9, alignItems: "flex-start", background: "rgba(5,12,12,.55)", border: "1px dashed #5FA3A3", borderRadius: 10, padding: "10px 12px", marginBottom: 12, cursor: "pointer" }}>
            <input type="checkbox" checked={launch} onChange={(e) => setLaunch(e.target.checked)} style={{ width: 16, height: 16, accentColor: "#14A6A4", marginTop: 1 }} />
            <span style={{ font: "400 12.5px Inter,sans-serif", color: "#2A4A4A" }}>
              <b style={{ color: "#3FD1CE" }}>Lançar {num(rep.value) > 0 ? fmt(rep.value) : "o valor pago"} como gasto em Investimentos</b><br />
              <span style={{ color: "#6FA3A3" }}>Desmarque se essa compra já foi lançada lá.</span>
            </span>
          </label>
          <div style={{ display: "flex", justifyContent: "space-between", gap: 10 }}>
            <Btn kind="ghost" onClick={() => setMode(item ? "edit" : "ask")}>← Voltar</Btn>
            <div style={{ display: "flex", gap: 10 }}>
              <Btn kind="ghost" onClick={() => setModal(null)}>Cancelar</Btn>
              <Btn disabled={!target || !num(rep.grams)} onClick={() => {
                saveItem("filaments", { ...target, qtyG: newQtyG, stockG: num(target.stockG) + num(rep.grams), price: newPrice });
                if (launch && num(rep.value) > 0) {
                  saveItem("expenses", { id: uid(), date: todayISO(), category: "Filamento", desc: `Reposição: ${target.name} (${fmtN(rep.grams)}g)`, value: num(rep.value), units: num(rep.grams), filamentId: target.id });
                  notify("Estoque reposto e gasto lançado em Investimentos");
                } else notify("Estoque reposto — custo médio atualizado");
                setModal(null);
              }}>Repor estoque</Btn>
            </div>
          </div>
        </Modal>
      );
    }
    return (
      <Modal title={item ? "Editar filamento" : "Cadastrar filamento (manual)"} onClose={() => setModal(null)}>
        <Row cols={1}><div><L>Nome do filamento</L><In value={f.name} onChange={set("name")} placeholder="ex: Voolt PLA Verde" /></div></Row>
        <Row>
          <div><L>Tipo</L><Sel value={f.type} onChange={set("type")}>{ftypes.map((t) => <option key={t}>{t}</option>)}</Sel></div>
          <div><L>Cor</L>
            <div style={{ display: "flex", gap: 8 }}>
              <input type="color" value={f.colorHex} onChange={set("colorHex")} style={{ width: 42, height: 38, border: "1px solid rgba(63,209,206,.22)", borderRadius: 8, padding: 2, background: "rgba(12,26,28,.72)", cursor: "pointer" }} />
              <In value={f.color} onChange={set("color")} placeholder="ex: Verde" />
            </div>
          </div>
        </Row>
        <Row>
          <div><L>Quantidade comprada (g)</L><In type="number" value={f.qtyG} onChange={set("qtyG")} /></div>
          <div><L>Estoque atual (g)</L><In type="number" value={f.stockG} onChange={set("stockG")} /></div>
        </Row>
        <Row>
          <div><L>Valor pago (R$)</L><In type="number" value={f.price} onChange={set("price")} /></div>
          <div><L>Custo por kg / por grama</L><In disabled value={`${fmt(perG * 1000)} · ${fmt(perG)}/g`} style={{ background: "rgba(63,209,206,.06)" }} /></div>
        </Row>
        {!item && (
          <label style={{ display: "flex", gap: 9, alignItems: "flex-start", background: "rgba(5,12,12,.55)", border: "1px dashed #5FA3A3", borderRadius: 10, padding: "10px 12px", marginBottom: 12, cursor: "pointer" }}>
            <input type="checkbox" checked={launch} onChange={(e) => setLaunch(e.target.checked)} style={{ width: 16, height: 16, accentColor: "#14A6A4", marginTop: 1 }} />
            <span style={{ font: "400 12.5px Inter,sans-serif", color: "#2A4A4A" }}>
              <b style={{ color: "#3FD1CE" }}>Lançar {num(f.price) > 0 ? fmt(f.price) : "o valor pago"} como gasto em Investimentos</b><br />
              <span style={{ color: "#6FA3A3" }}>Entra como "Filamento" no mês de hoje e conta no Financeiro e na Contabilidade. Desmarque se essa compra já foi lançada lá.</span>
            </span>
          </label>
        )}
        <div style={{ display: "flex", justifyContent: "space-between", gap: 10 }}>
          <div>{!item && data.filaments.length > 0 && <Btn kind="ghost" onClick={() => setMode("ask")}>← Voltar</Btn>}</div>
          <div style={{ display: "flex", gap: 10 }}>
          <Btn kind="ghost" onClick={() => setModal(null)}>Cancelar</Btn>
          <Btn disabled={!f.name} onClick={() => {
            saveItem("filaments", { ...f });
            if (!item && launch && num(f.price) > 0) {
              saveItem("expenses", { id: uid(), date: todayISO(), category: "Filamento", desc: `Compra: ${f.name}`, value: num(f.price), units: num(f.qtyG), filamentId: f.id });
              notify("Filamento salvo e gasto lançado em Investimentos");
            } else notify("Filamento salvo");
            setModal(null);
          }}>Salvar filamento</Btn>
          </div>
        </div>
      </Modal>
    );
  }

  function MaterialModal({ item }) {
    const [f, setF] = useState(item || { id: uid(), name: "", category: "Material", unitCost: "", stock: 0, minStock: 10, movements: [] });
    const [launch, setLaunch] = useState(true);
    const set = (k) => (e) => setF({ ...f, [k]: e.target.value });
    const totalPago = num(f.unitCost) * num(f.stock);
    return (
      <Modal title={item ? "Editar material" : "Cadastrar material (manual)"} onClose={() => setModal(null)}>
        <Row cols={1}><div><L>Nome do item</L><In value={f.name} onChange={set("name")} placeholder="ex: Argola de chaveiro 25mm" /></div></Row>
        <Row>
          <div><L>Categoria</L><Sel value={f.category} onChange={set("category")}>{STOCK_CATS.map((c) => <option key={c}>{c}</option>)}</Sel></div>
          <div><L>Custo por unidade (R$)</L><In type="number" value={f.unitCost} onChange={set("unitCost")} /></div>
        </Row>
        <Row>
          <div><L>Estoque atual (un)</L><In type="number" value={f.stock} onChange={set("stock")} /></div>
          <div><L>Estoque mínimo (alerta)</L><In type="number" value={f.minStock} onChange={set("minStock")} /></div>
        </Row>
        {!item && (
          <label style={{ display: "flex", gap: 9, alignItems: "flex-start", background: "rgba(5,12,12,.55)", border: "1px dashed #5FA3A3", borderRadius: 10, padding: "10px 12px", marginBottom: 12, cursor: "pointer" }}>
            <input type="checkbox" checked={launch} onChange={(e) => setLaunch(e.target.checked)} style={{ width: 16, height: 16, accentColor: "#14A6A4", marginTop: 1 }} />
            <span style={{ font: "400 12.5px Inter,sans-serif", color: "#2A4A4A" }}>
              <b style={{ color: "#3FD1CE" }}>Lançar {totalPago > 0 ? fmt(totalPago) : "o total"} como gasto em Investimentos</b><br />
              <span style={{ color: "#6FA3A3" }}>({fmtN(f.stock)} un × {fmt(f.unitCost)}) — entra como "{f.category}" no mês de hoje. Desmarque se essa compra já foi lançada lá.</span>
            </span>
          </label>
        )}
        <div style={{ display: "flex", justifyContent: "flex-end", gap: 10 }}>
          <Btn kind="ghost" onClick={() => setModal(null)}>Cancelar</Btn>
          <Btn disabled={!f.name} onClick={() => {
            saveItem("materials", { ...f });
            if (!item && launch && totalPago > 0) {
              saveItem("expenses", { id: uid(), date: todayISO(), category: f.category, desc: `Compra: ${f.name}`, value: totalPago, units: num(f.stock), materialId: f.id });
