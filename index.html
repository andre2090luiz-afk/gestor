<style>
  html,body{margin:0;padding:0;background:#14171A;}
  button:hover { filter:brightness(.97); }
  ::-webkit-scrollbar{width:8px;height:8px} ::-webkit-scrollbar-thumb{background:rgba(63,209,206,.25);border-radius:8px}
  table { border-collapse: collapse; width:100%; }
  .print-sheet { color:#22302F; }
  .print-sheet th { color:#64787A; border-bottom:1px solid #D3DEDE; }
  .print-sheet td { color:#22302F; border-bottom:1px solid #E3EAEA; }
  .print-sheet tr:last-child td { border-bottom:none; }
  @media (max-width: 820px){
    .app-aside{ position: static !important; width: 100% !important; height: auto !important; flex-direction: row !important; align-items: center; overflow-x: auto !important; overflow-y: hidden !important; }
    .app-aside > div:first-child{ display: none !important; }
    .app-aside > div:last-child{ display: none !important; }
    .app-aside nav{ display: flex !important; flex-direction: row !important; padding: 6px 8px !important; flex: 0 0 auto; }
    .app-aside nav > div{ display: flex !important; flex-direction: row !important; margin-bottom: 0 !important; gap: 4px; }
    .app-aside nav > div > div:first-child{ display: none !important; }
    .app-main{ margin-left: 0 !important; padding: 14px 12px 48px !important; max-width: 100% !important; }
    table{ display: block; overflow-x: auto; white-space: nowrap; }
  }
  th { text-align:left; font:600 11.5px Inter,sans-serif; color:#7E9191; text-transform:uppercase; letter-spacing:.05em; padding:8px 10px; border-bottom:1px solid rgba(63,209,206,.14); }
  th.th-sort { cursor:pointer; user-select:none; white-space:nowrap; transition:color .12s; }
  th.th-sort:hover { color:#D6E2E2; }
  th.th-sort.on { color:#3FD1CE; }
  th.th-sort .th-arr { display:inline-block; width:12px; margin-left:4px; font-size:10px; opacity:0; transition:opacity .12s; }
  th.th-sort:hover .th-arr { opacity:.45; }
  th.th-sort.on .th-arr { opacity:1; }
  td { padding:10px; font:400 13.5px Inter,sans-serif; border-bottom:1px solid rgba(63,209,206,.07); vertical-align:middle; }
  tr:last-child td { border-bottom:none; }

  /* ===== v4.45 visual "Central de Comando" ===== */
  html,body{background:#050C0D;}
  .neo-bg{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(900px 500px at 60% -10%,rgba(20,184,178,.13),transparent 60%),radial-gradient(600px 420px at 100% 100%,rgba(245,130,31,.07),transparent 60%),linear-gradient(rgba(63,209,206,.035) 1px,transparent 1px) 0 0/32px 32px,linear-gradient(90deg,rgba(63,209,206,.035) 1px,transparent 1px) 0 0/32px 32px,#050C0D;}
  .neo-scan{position:fixed;left:0;right:0;height:120px;top:-120px;background:linear-gradient(180deg,transparent,rgba(63,209,206,.05),transparent);animation:neoScan 7s linear infinite;pointer-events:none;z-index:1;}
  @keyframes neoScan{to{top:100%}}
  .app-main{position:relative;z-index:2;}
  .app-aside{background:linear-gradient(180deg,rgba(3,8,8,.97),rgba(7,16,17,.96)) !important;border-right:1px solid rgba(63,209,206,.14);}
  .neo-brand{padding:18px 14px 14px;border-bottom:1px solid rgba(63,209,206,.12);}
  .neo-brand img{width:100%;display:block;filter:drop-shadow(0 0 14px rgba(20,184,178,.3));}
  .neo-brand small{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font:600 9.5px 'JetBrains Mono',monospace;color:#7F9A9B;letter-spacing:.1em;}
  .neo-brand small b{color:#3FD1CE;font-weight:600;}
  .neo-brand small b:before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#3FD1CE;box-shadow:0 0 8px #3FD1CE;margin-right:6px;animation:neoBlink 1.6s infinite;vertical-align:1px;}
  @keyframes neoBlink{50%{opacity:.3}}
  .neo-nav-btn{transition:background .15s,color .15s;}
  .neo-nav-btn:hover{color:#D6F2F1 !important;background:rgba(63,209,206,.07) !important;}
  .neo-nav-btn.on{color:#fff !important;background:linear-gradient(90deg,rgba(20,184,178,.24),rgba(20,184,178,.02)) !important;box-shadow:inset 3px 0 0 #3FD1CE, 0 0 18px rgba(20,184,178,.10);}
  .neo-nav-btn.on svg{color:#3FD1CE;filter:drop-shadow(0 0 5px rgba(63,209,206,.7));}
  .neo-install{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;margin:8px 0 6px;padding:8px 10px;border-radius:9px;border:1px solid rgba(63,209,206,.4);background:rgba(20,184,178,.10);color:#3FD1CE;font:600 12px Inter,sans-serif;cursor:pointer;}
  /* paineis HUD */
  .neo-cc{display:flex;flex-direction:column;gap:14px;margin-bottom:16px;}
  .neo-hud{position:relative;background:rgba(12,26,28,.72);border:1px solid rgba(63,209,206,.14);border-radius:16px;padding:14px 16px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);}
  .neo-hud:before,.neo-hud:after{content:"";position:absolute;width:14px;height:14px;border:2px solid #3FD1CE;opacity:.8;pointer-events:none;}
  .neo-hud:before{top:-1px;left:-1px;border-right:0;border-bottom:0;border-top-left-radius:16px;}
  .neo-hud:after{bottom:-1px;right:-1px;border-left:0;border-top:0;border-bottom-right-radius:16px;}
  .neo-ttl{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
  .neo-ttl b{font:600 15px 'Space Grotesk',sans-serif;color:#E6F1F1;}
  .neo-ttl small{margin-left:auto;color:#7F9A9B;font:500 11px 'JetBrains Mono',monospace;}
  .neo-code{font:600 10px 'JetBrains Mono',monospace;color:#3FD1CE;border:1px solid rgba(63,209,206,.35);border-radius:5px;padding:1px 6px;letter-spacing:.08em;}
  .neo-empty{font:400 13px Inter,sans-serif;color:#7F9A9B;padding:18px 4px;}
  .neo-empty a{color:#3FD1CE;cursor:pointer;text-decoration:underline;}
  .neo-hero{display:flex;align-items:center;gap:22px;padding:16px 22px;flex-wrap:wrap;background:linear-gradient(115deg,rgba(10,110,109,.5),rgba(8,26,28,.85) 55%,rgba(245,130,31,.16));border-color:rgba(63,209,206,.28);}
  .neo-a{flex-shrink:0;filter:drop-shadow(0 0 18px rgba(63,209,206,.55));}
  .neo-a.anim rect{animation:neoLay 3.4s ease-in-out infinite;}
  @keyframes neoLay{0%,8%{opacity:0;transform:translateY(-6px)}22%,85%{opacity:1;transform:none}100%{opacity:0}}
  .neo-greet{margin:0;font:700 25px 'Space Grotesk',sans-serif;letter-spacing:-.5px;color:#F3F6F6;}
  .neo-greet em{font-style:normal;background:linear-gradient(90deg,#3FD1CE,#F5821F);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .neo-stats{display:flex;gap:24px;margin-top:8px;flex-wrap:wrap;}
  .neo-stats div{font:500 10.5px 'JetBrains Mono',monospace;color:#7F9A9B;letter-spacing:.06em;cursor:pointer;}
  .neo-stats b{display:block;font:700 18px 'Space Grotesk',sans-serif;color:#fff;letter-spacing:0;}
  .neo-stats small{display:block;font:500 10.5px Inter,sans-serif;color:#3FD1CE;letter-spacing:0;}
  .neo-stats .o b{color:#F5821F;}
  .neo-acts{margin-left:auto;display:flex;flex-direction:column;gap:8px;}
  .neo-b1{display:flex;align-items:center;justify-content:center;gap:6px;height:40px;border-radius:11px;border:0;padding:0 20px;font:600 13px Inter,sans-serif;color:#1a0d02;background:linear-gradient(135deg,#FF9A3D,#F5821F);box-shadow:0 8px 24px rgba(245,130,31,.4);cursor:pointer;}
  .neo-b2{height:36px;border-radius:11px;padding:0 14px;font:600 12px Inter,sans-serif;color:#3FD1CE;background:rgba(6,16,15,.5);border:1px solid rgba(63,209,206,.35);cursor:pointer;}
  .neo-mid{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(260px,1fr);gap:14px;}
  .neo-printers{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;}
  .neo-pr{border-radius:12px;padding:8px 8px 10px;border:1px solid transparent;transition:border-color .15s,transform .15s,box-shadow .15s;}
  .neo-pr.on{cursor:pointer;}
  .neo-pr.on:hover{border-color:rgba(63,209,206,.35);transform:translateY(-3px);box-shadow:0 12px 30px rgba(20,184,178,.12);}
  .neo-iso{width:100%;height:auto;display:block;max-height:230px;}
  .neo-holo{background:rgba(5,14,15,.88);border:1px solid rgba(127,154,155,.35);border-radius:9px;padding:7px 10px;}
  .neo-holo.t{border-color:rgba(63,209,206,.6);box-shadow:0 0 16px rgba(63,209,206,.12);}
  .neo-holo.o{border-color:rgba(245,130,31,.6);box-shadow:0 0 16px rgba(245,130,31,.12);}
  .neo-holo .r1{display:flex;justify-content:space-between;gap:8px;font:600 12.5px Inter,sans-serif;color:#E6F1F1;}
  .neo-holo .r1 b{font:700 12.5px 'JetBrains Mono',monospace;color:#7F9A9B;}
  .neo-holo.t .r1 b{color:#3FD1CE;} .neo-holo.o .r1 b{color:#FFAA5C;}
  .neo-holo .r2{font:500 10.5px 'JetBrains Mono',monospace;color:#7F9A9B;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .neo-holo .bar{height:3px;border-radius:2px;background:rgba(127,154,155,.2);margin-top:5px;overflow:hidden;}
  .neo-holo .bar i{display:block;height:100%;background:#3FD1CE;box-shadow:0 0 8px #3FD1CE;}
  .neo-holo.o .bar i{background:#F5821F;box-shadow:0 0 8px #F5821F;}
  .neo-pr-foot{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:-4px;}
  .neo-tag{white-space:nowrap;display:inline-flex;align-items:center;gap:5px;font:600 10.5px Inter,sans-serif;padding:2px 8px;border-radius:999px;color:#7F9A9B;background:rgba(127,154,155,.12);}
  .neo-tag i{width:6px;height:6px;border-radius:50%;background:#7F9A9B;}
  .neo-tag.on{color:#3FD1CE;background:rgba(20,184,178,.12);} .neo-tag.on i{background:#3FD1CE;box-shadow:0 0 8px #3FD1CE;animation:neoBlink 1.4s infinite;}
  .neo-fin{white-space:nowrap;font:600 10.5px 'JetBrains Mono',monospace;color:#7F9A9B;} .neo-fin.late{color:#FF7A7E;}
  .neo-noz{animation:neoNoz 1.8s ease-in-out infinite alternate;}
  @keyframes neoNoz{from{transform:translateX(-7px)}to{transform:translateX(7px)}}
  .neo-glow{animation:neoGlow 1.2s ease-in-out infinite alternate;}
  @keyframes neoGlow{from{opacity:.3}to{opacity:1}}
  .neo-bot{display:flex;flex-direction:column;}
  .neo-eye{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
  .neo-eye b{font:600 14px 'Space Grotesk',sans-serif;color:#E6F1F1;} .neo-eye small{display:block;font:500 11px 'JetBrains Mono',monospace;color:#3FD1CE;margin-top:2px;}
  .neo-orb{width:48px;height:48px;flex-shrink:0;border-radius:50%;position:relative;background:radial-gradient(circle at 50% 45%,#9AF3EC,#14B8B2 35%,#063B3B 70%);box-shadow:0 0 24px rgba(63,209,206,.5);}
  .neo-orb:before{content:"";position:absolute;inset:-7px;border-radius:50%;border:2px solid transparent;border-top-color:#3FD1CE;border-right-color:rgba(63,209,206,.3);animation:neoSpin 2.4s linear infinite;}
  .neo-orb:after{content:"";position:absolute;left:13px;right:13px;top:21px;height:5px;border-radius:5px;background:#E6FFFD;box-shadow:0 0 10px #fff;animation:neoEye 4s infinite;}
  @keyframes neoSpin{to{transform:rotate(360deg)}}
  @keyframes neoEye{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
  .neo-sg{border:1px solid rgba(63,209,206,.14);background:rgba(5,12,12,.55);border-radius:12px;padding:10px 12px;margin-bottom:8px;font:400 12.5px/1.45 Inter,sans-serif;color:#C9DADA;}
  .neo-sg b{color:#fff;font-weight:600;}
  .neo-go{margin-top:7px;font:600 11px Inter,sans-serif;color:#061314;background:#3FD1CE;border:0;border-radius:7px;padding:4px 10px;cursor:pointer;}
  .neo-sg.w{border-color:rgba(255,93,93,.35);} .neo-sg.w .neo-go{background:#FF8A8A;}
  .neo-sg.o{border-color:rgba(245,130,31,.35);} .neo-sg.o .neo-go{background:#FFAA5C;}
  .neo-typing{font:500 11px 'JetBrains Mono',monospace;color:#7F9A9B;margin-top:auto;padding-top:4px;}
  .neo-typing i{display:inline-block;width:7px;height:12px;background:#3FD1CE;vertical-align:-2px;animation:neoBlink 1s steps(1) infinite;}
  .neo-tl{display:grid;grid-template-columns:110px minmax(0,1fr);row-gap:8px;}
  .neo-pn{font:600 12px Inter,sans-serif;color:#D6E2E2;display:flex;align-items:center;gap:7px;}
  .neo-pn i{width:7px;height:7px;border-radius:50%;background:#3FD1CE;box-shadow:0 0 8px #3FD1CE;flex-shrink:0;} .neo-pn i.off{background:#7F9A9B;box-shadow:none;}
  .neo-lane{position:relative;height:30px;border-radius:8px;background:rgba(5,12,12,.6);border:1px solid rgba(63,209,206,.14);transition:border-color .15s,background .15s;}
  .neo-lane.over{border-color:#3FD1CE;background:rgba(63,209,206,.08);}
  .neo-job{position:absolute;top:3px;bottom:3px;border-radius:6px;font:600 10.5px Inter,sans-serif;display:flex;align-items:center;padding:0 8px;white-space:nowrap;overflow:hidden;color:#061314;box-sizing:border-box;}
  .neo-job[draggable="true"]{cursor:grab;}
  .neo-job.a{background:linear-gradient(90deg,#3FE3D8,#14B8B2);} .neo-job.b{background:linear-gradient(90deg,#FFB066,#F5821F);}
  .neo-job.g{background:rgba(63,209,206,.12);color:#3FD1CE;border:1px dashed rgba(63,209,206,.45);}
  .neo-job.late{box-shadow:0 0 0 2px #FF5D5D,0 0 14px rgba(255,93,93,.4);}
  .neo-now{position:absolute;left:0;top:-4px;bottom:-4px;width:2px;background:#F5821F;box-shadow:0 0 10px #F5821F;}
  .neo-axis{grid-column:2;display:flex;justify-content:space-between;font:500 10px 'JetBrains Mono',monospace;color:#4E6869;}
  .neo-sec{font:600 11px 'JetBrains Mono',monospace;color:#7F9A9B;letter-spacing:.14em;text-transform:uppercase;display:flex;align-items:center;gap:10px;margin-top:6px;}
  .neo-sec:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(63,209,206,.3),transparent);}
  /* numeros do negocio no mesmo visual */
  .neo-dash .g-card{background:rgba(12,26,28,.72) !important;border-color:rgba(63,209,206,.14) !important;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);animation:neoUp .5s ease both;}
  @keyframes neoUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @media (max-width: 1000px){ .neo-mid{grid-template-columns:1fr;} }
  @media (max-width: 820px){ .app-aside{position:relative !important;z-index:3 !important;} .neo-acts{margin-left:0;flex-direction:row;} .neo-tl{grid-template-columns:80px minmax(0,1fr);} .neo-greet{font-size:20px;} }
  @media (prefers-reduced-motion: reduce){ .neo-scan,.neo-noz,.neo-glow,.neo-a.anim rect,.neo-orb:before,.neo-orb:after,.neo-dash .g-card{animation:none !important;} }

  /* ===== v4.46 numeros do negocio ===== */
  .neo-rv{opacity:0;transform:translateY(14px);transition:opacity .55s ease,transform .55s cubic-bezier(.2,.8,.2,1),border-color .15s,box-shadow .15s;}
  .neo-rv.in{opacity:1;transform:none;}
  .neo-rv.in[class*="neo-k"]:hover,.neo-rv.in.neo-champ:hover{transform:translateY(-3px);border-color:rgba(63,209,206,.35);box-shadow:0 12px 30px rgba(20,184,178,.12);}
  .neo-sec2{display:flex;align-items:center;gap:12px;margin:6px 0 14px;flex-wrap:wrap;}
  .neo-sec2 span{font:600 11px 'JetBrains Mono',monospace;color:#7F9A9B;letter-spacing:.14em;text-transform:uppercase;}
  .neo-sec2:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(63,209,206,.3),transparent);order:3;min-width:40px;}
  .neo-chips{display:flex;gap:4px;background:rgba(12,26,28,.8);border:1px solid rgba(63,209,206,.14);border-radius:10px;padding:3px;}
  .neo-chips button{border:0;background:none;font:600 12px Inter,sans-serif;color:#7F9A9B;padding:5px 12px;border-radius:7px;cursor:pointer;transition:all .15s;}
  .neo-chips button:hover{color:#D6F2F1;}
  .neo-chips button.on{background:linear-gradient(135deg,#14B8B2,#0A6E6D);color:#fff;box-shadow:0 0 14px rgba(20,184,178,.35);}
  .neo-chips.sm button{padding:3px 9px;font-size:11px;}
  .neo-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px;margin-bottom:14px;}
  .neo-k{min-height:96px;cursor:default;}
  .neo-k .l{font:600 10px Inter,sans-serif;letter-spacing:.12em;color:#7F9A9B;text-transform:uppercase;}
  .neo-k .v{font:700 23px 'Space Grotesk',sans-serif;margin-top:5px;letter-spacing:-.4px;color:#F3F6F6;white-space:nowrap;}
  .neo-k.or .v{color:#F5821F;}
  .neo-kd{display:block;font:600 11.5px Inter,sans-serif;color:#7F9A9B;margin-top:2px;}

  .neo-exptotal{display:flex;justify-content:space-between;margin-top:12px;padding-top:10px;border-top:1px solid rgba(63,209,206,.12);font:600 13px Inter,sans-serif;color:#C9DADA;} .neo-exptotal b{font:700 15px 'JetBrains Mono',monospace;color:#FFAA5C;}

  .neo-expbars button{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;border:0;background:none;cursor:pointer;padding:0;}
  .neo-expbars i{display:block;border-radius:6px 6px 0 0;background:linear-gradient(180deg,#FFAA5C,rgba(245,130,31,.25));transition:height .8s cubic-bezier(.2,.8,.2,1);}

/* Clique no titulo da coluna: 1x crescente, 2x decrescente, 3x volta a ordem original.
   A escolha de cada tabela fica guardada neste computador (chave unica "gestor3d-sort"). */
const SORT_LS = "gestor3d-sort";
const readSorts = () => { try { return JSON.parse(localStorage.getItem(SORT_LS) || "{}") || {}; } catch (e) { return {}; } };
function useSort(key) {
  const [sort, setSort] = useState(() => readSorts()[key] || null);
  const save = (next) => { try { const all = readSorts(); if (next) all[key] = next; else delete all[key]; localStorage.setItem(SORT_LS, JSON.stringify(all)); } catch (e) {} };
  /* atualizacao funcional: cliques rapidos seguidos nunca usam um estado antigo */
  const toggle = (col) => setSort((cur) => {
    const next = !cur || cur.col !== col ? { col, dir: "asc" } : cur.dir === "asc" ? { col, dir: "desc" } : null;
    save(next); return next;
  });
  const clear = () => { save(null); setSort(null); };
  return { sort, toggle, clear };

const sortCollator = new Intl.Collator("pt-BR", { sensitivity: "base", numeric: true });
const isBlankSortVal = (v) => v == null || v === "" || (typeof v === "number" && !isFinite(v));
/* cols = { coluna: (item) => valor }. Numero compara como numero, texto em ordem alfabetica

   Vazio vai sempre para o fim. Empate mantem a ordem original. */
function sortRows(list, s, cols) {
  const srt = s && s.sort;
  if (!srt || !cols || !cols[srt.col]) return list;
  const get = cols[srt.col], dir = srt.dir === "desc" ? -1 : 1;
  return list.map((it, i) => ({ it, i, v: get(it) })).sort((a, b) => {
    const ea = isBlankSortVal(a.v), eb = isBlankSortVal(b.v);
    if (ea || eb) return ea && eb ? a.i - b.i : ea ? 1 : -1;
    let c;
    if (typeof a.v === "number" && typeof b.v === "number") c = a.v - b.v;
    else if (typeof a.v === "boolean" || typeof b.v === "boolean") c = (a.v ? 1 : 0) - (b.v ? 1 : 0);
    else c = sortCollator.compare(String(a.v), String(b.v));
    return c !== 0 ? c * dir : a.i - b.i;

  const on = s && s.sort && s.sort.col === col;
  const arrow = on ? (s.sort.dir === "asc" ? "▲" : "▼") : "⇅";
  return (
    <th className={"th-sort" + (on ? " on" : "")} style={style} onClick={() => s.toggle(col)}
      title={title || (on ? (s.sort.dir === "asc" ? "Crescente — clique para decrescente" : "Decrescente — clique para voltar à ordem original") : "Clique para ordenar")}>
      {children}<span className="th-arr">{arrow}</span>
    </th>
  );
}

    let req;
    try { req = indexedDB.open(PHOTO_DB, 1); } catch (e) { reject(e); return; }
    req.onupgradeneeded = () => { const db = req.result; if (!db.objectStoreNames.contains(PHOTO_STORE)) db.createObjectStore(PHOTO_STORE); };
    req.onsuccess = () => resolve(req.result);

    const tx = db.transaction(PHOTO_STORE, mode);
    const out = fn(tx.objectStore(PHOTO_STORE));
    tx.oncomplete = () => resolve(out);
    tx.onerror = () => reject(tx.error);
    tx.onabort = () => reject(tx.error);
  }));
}

  for (let i = 0; i < s.length; i++) { const ch = s.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }

  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (h2 >>> 0).toString(16).padStart(8, "0") + (h1 >>> 0).toString(16).padStart(8, "0");

  m.forEach((row, r) => row.forEach((on, c) => { if (on) d += `M${c + quiet} ${r + quiet}h1v1h-1z`; }));
  return (
    <svg className="pix-qr" width={size} height={size} viewBox={`0 0 ${tot} ${tot}`} shapeRendering="crispEdges" style={{ display: "block", background: "#fff" }}>
      <rect width={tot} height={tot} fill="#fff" /><path d={d} fill={color} />
    </svg>
  );
}
/* arte em PNG para mandar no WhatsApp */
const pixArtPNG = (pix, ref, logo) => new Promise((resolve) => {
  const W = 900, H = 1240;
  const cv = document.createElement("canvas"); cv.width = W; cv.height = H;
  const g = cv.getContext && cv.getContext("2d");
  if (!g) return resolve("");
  const draw = (img) => {
    g.fillStyle = "#fff"; g.fillRect(0, 0, W, H);
    if (img) { const w = 420, h = (img.height / img.width) * w; g.drawImage(img, (W - w) / 2, 60, w, h); }
    g.textAlign = "center"; g.fillStyle = "#0A6E6D"; g.font = "700 54px 'Space Grotesk', Arial, sans-serif";
    g.fillText("Pagamento via PIX", W / 2, 250);
    g.fillStyle = "#64787A"; g.font = "400 26px Inter, Arial, sans-serif";
    g.fillText("Escaneie o QR no app do seu banco e informe o valor", W / 2, 298);
    const m = qrMatrix(pixPayload(pix)) || []; const n = m.length || 1; const box = 520; const cell = Math.floor(box / (n + 8)); const qs = cell * (n + 8);
    const x0 = (W - qs) / 2, y0 = 340;
    g.fillStyle = "#fff"; g.fillRect(x0, y0, qs, qs); g.strokeStyle = "#D3DEDE"; g.lineWidth = 2; g.strokeRect(x0 - 10, y0 - 10, qs + 20, qs + 20);
    g.fillStyle = "#111"; m.forEach((row, r) => row.forEach((on, c) => { if (on) g.fillRect(x0 + (c + 4) * cell, y0 + (r + 4) * cell, cell, cell); }));
    let y = y0 + qs + 80;
    g.fillStyle = "#64787A"; g.font = "600 26px Inter, Arial, sans-serif"; g.fillText("Chave PIX (" + (PIX_TYPES[pix.type] || "chave") + ")", W / 2, y);
    y += 52; g.fillStyle = "#22302F"; g.font = "700 40px 'JetBrains Mono', 'Courier New', monospace"; g.fillText(pixKeyDisplay(pix), W / 2, y);
    y += 56; g.fillStyle = "#45565A"; g.font = "400 28px Inter, Arial, sans-serif"; g.fillText("Favorecido: " + pix.name, W / 2, y);
    if (ref) { y += 44; g.fillStyle = "#78898A"; g.font = "400 24px Inter, Arial, sans-serif"; g.fillText("Ref.: " + ref, W / 2, y); }
    g.fillStyle = "#0D8B8A"; g.fillRect(60, H - 70, (W - 120) * 0.62, 12);
    g.fillStyle = "#F47A20"; g.fillRect(60 + (W - 120) * 0.62, H - 70, (W - 120) * 0.38, 12);
    resolve(cv.toDataURL("image/png"));
  };
  if (!logo) return draw(null);
  const im = new Image(); im.onload = () => draw(im); im.onerror = () => draw(null); im.src = logo;
});

/* ===================== CORES DISPONIVEIS + KITS (v4.39) =====================
   Cores: so as ADICIONAIS (a cor original ja aparece na foto). Opcoes = cores dos filamentos
   cadastrados (sem repetir) que o projeto nao usa, mais cores livres ("+ outra cor"). */
const colorKey = (s) => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").trim().toLowerCase();
const ColorDot = ({ hex, size = 14, title }) => (
  <span title={title} style={{ width: size, height: size, borderRadius: "50%", background: hex || "#9AA5A5", border: "1.5px solid rgba(0,0,0,.25)", display: "inline-block", flexShrink: 0 }} />
);
function ColorsEditor({ on, colors, onChange, filaments, ownColors }) {
  const sel = colors || [];
  const own = new Set((ownColors || []).map(colorKey));
  const opts = [];
  const seen = new Set();
  (filaments || []).forEach((f) => {
    const k = colorKey(f.color); if (!k || seen.has(k) || own.has(k)) return; seen.add(k);
    opts.push({ name: String(f.color).trim(), hex: f.colorHex || "#9AA5A5" });
  });
  sel.forEach((c) => { const k = colorKey(c.name); if (k && !seen.has(k)) { seen.add(k); opts.push({ ...c, custom: true }); } });
  const isOn = (c) => sel.some((x) => colorKey(x.name) === colorKey(c.name));
  const toggle = (c) => onChange(on, isOn(c) ? sel.filter((x) => colorKey(x.name) !== colorKey(c.name)) : [...sel, { name: c.name, hex: c.hex }]);
  const [adding, setAdding] = useState(false);
  const [nc, setNc] = useState({ name: "", hex: "#C0392B" });
  return (
    <div className="colors-editor" style={{ border: "1px solid rgba(63,209,206,.14)", borderRadius: 12, padding: "10px 12px", marginBottom: 12, background: "rgba(5,12,12,.55)" }}>
      <label style={{ display: "flex", alignItems: "center", gap: 8, cursor: "pointer", font: "600 12.5px Inter,sans-serif", color: on ? "#3FD1CE" : "#D6E2E2" }}>
        <input className="colors-on" type="checkbox" checked={!!on} onChange={(e) => onChange(e.target.checked, sel)} style={{ width: 16, height: 16, accentColor: "#14A6A4" }} />
        Este projeto tem outras cores disponíveis
      </label>
      {on && (
        <div style={{ marginTop: 10 }}>
          <div style={{ font: "400 11.5px Inter,sans-serif", color: "#8FA3A3", marginBottom: 8 }}>Marque só as cores <b>adicionais</b> — a cor original já aparece na foto. Elas aparecem no catálogo em "Cores disponíveis".</div>
          <div style={{ display: "flex", gap: 6, flexWrap: "wrap", alignItems: "center" }}>
            {opts.length === 0 && <span style={{ font: "400 12px Inter,sans-serif", color: "#7E9191" }}>Nenhuma outra cor nos filamentos cadastrados — use "+ outra cor".</span>}
            {opts.map((c) => {
              const s = isOn(c);
              return (
                <button key={colorKey(c.name)} type="button" className={"color-opt" + (s ? " on" : "")} data-c={c.name} onClick={() => toggle(c)} style={{
                  display: "inline-flex", alignItems: "center", gap: 6, padding: "5px 11px 5px 7px", borderRadius: 999, cursor: "pointer",
                  border: s ? "1.5px solid #14A6A4" : "1px solid rgba(63,209,206,.22)", background: s ? "rgba(63,209,206,.1)" : "rgba(12,26,28,.72)",
                  font: "600 12px Inter,sans-serif", color: s ? "#3FD1CE" : "#B5C4C4",
                }}><ColorDot hex={c.hex} size={13} />{c.name}{s ? " ✓" : ""}</button>
              );
            })}
            {!adding && <Btn small kind="ghost" onClick={() => setAdding(true)}><Plus size={12} />outra cor</Btn>}
          </div>
          {adding && (
            <div style={{ display: "flex", gap: 8, alignItems: "center", marginTop: 8, flexWrap: "wrap" }}>
              <input type="color" value={nc.hex} onChange={(e) => setNc({ ...nc, hex: e.target.value })} title="Escolha a cor" style={{ width: 38, height: 34, border: "1px solid rgba(63,209,206,.22)", borderRadius: 8, background: "rgba(12,26,28,.72)", padding: 2, cursor: "pointer" }} />
              <In className="color-new-name" value={nc.name} onChange={(e) => setNc({ ...nc, name: e.target.value })} placeholder="nome da cor (ex: Rosa bebê)" style={{ width: 220 }} />
              <Btn small disabled={!nc.name.trim()} onClick={() => { const n = nc.name.trim(); if (!sel.some((x) => colorKey(x.name) === colorKey(n))) onChange(true, [...sel, { name: n, hex: nc.hex }]); setNc({ name: "", hex: "#C0392B" }); setAdding(false); }}>Adicionar cor</Btn>
              <Btn small kind="ghost" onClick={() => setAdding(false)}>Cancelar</Btn>
            </div>
          )}
        </div>
      )}
    </div>
  );
}
/* divide o preco do kit entre os itens (proporcional ao preco avulso), fechando no centavo */
function splitKitPrice(lines, price) {
  const total = Math.round(num(price) * 100);
  const w = lines.map((l) => Math.max(0, num(l.ref)) * num(l.qty));
  const wsum = w.reduce((s, x) => s + x, 0) || lines.reduce((s, l) => s + num(l.qty), 0);
  const ww = w.reduce((s, x) => s + x, 0) ? w : lines.map((l) => num(l.qty));
  let shares = ww.map((x) => Math.floor((total * x) / wsum));
  let rest = total - shares.reduce((s, x) => s + x, 0);
  for (let i = 0; rest > 0; i = (i + 1) % shares.length, rest--) shares[i] += 1;
  const out = [];
  lines.forEach((l, i) => {
    const q = Math.max(1, Math.round(num(l.qty)));
    const unit = Math.floor(shares[i] / q), extra = shares[i] - unit * q;
    if (extra === 0) out.push({ ...l, qty: q, unitCents: unit });
    else { if (q - 1 > 0) out.push({ ...l, qty: q - 1, unitCents: unit }); out.push({ ...l, qty: 1, unitCents: unit + extra }); }
  });
  return out;
}

/* v4.37: varios nichos por projeto. niches[0] e o principal e fica espelhado em p.niche

const projNiches = (p) => !p ? [] : (Array.isArray(p.niches) && p.niches.length ? p.niches.filter(Boolean) : (p.niche ? [p.niche] : []));
const hasNiche = (p, n) => projNiches(p).includes(n);
const nichesText = (p) => projNiches(p).join(" · ");
function syncNiches(list) {
  return (list || []).map((p) => { if (!p) return p; const ns = projNiches(p); return { ...p, niches: ns, niche: ns[0] || "" }; });
}
function normalizeData(parsed) {
  const ps = parsed.settings || {};
  return {
    ...DEFAULTS, ...parsed,
    projects: syncNiches(foldPurge(stripSlotColors(parsed.projects))),

}

/* -------------------------- image compression ------------------------- */
function compressImage(file, cb) {
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      const MAX = 900;
      const scale = Math.min(1, MAX / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * scale);
      c.height = Math.round(img.height * scale);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      cb(c.toDataURL("image/jpeg", 0.8));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

const modalCode = (title) => {
  const t = typeof title === "string" ? title.toLowerCase() : "";
  if (/impress[aã]o|produ[cç]/.test(t)) return "PRODUÇÃO";
  if (/or[cç]amento/.test(t)) return "ORÇAMENTO";
  if (/pedido|vender|brinde/.test(t)) return "PEDIDO";
  if (/cliente/.test(t)) return "CLIENTE";
  if (/filamento|material|estoque|movimenta|ajust/.test(t)) return "ESTOQUE";
  if (/projeto|kit|cat[aá]logo|calculadora/.test(t)) return "PROJETO";
  if (/pix|cobran|pagamento|gasto|compra|custo|caixa|lan[cç]amento|investimento/.test(t)) return "FINANCEIRO";
  if (/impressora|manuten|calibra/.test(t)) return "MÁQUINA";
  if (/hist[oó]rico|a[cç][oõ]es/.test(t)) return "HISTÓRICO";
  return "PRINTAR";
};
const Modal = ({ title, onClose, children, wide, code }) => {
  useEffect(() => {
    const onKey = (e) => {
      if (e.key === "Escape") { e.preventDefault(); onClose && onClose(); return; }
      if (e.key === "Enter") {
        const t = e.target, tag = t && t.tagName;
        if (tag === "TEXTAREA" || tag === "SELECT" || tag === "BUTTON" || (t && t.isContentEditable)) return;
        const dlg = t && t.closest ? t.closest("[data-modal]") : null;
        const btns = Array.from((dlg || document).querySelectorAll("button"));
        const prim = btns.reverse().find((b) => /salvar|adicionar|cadastrar|usar|confirmar|aplicar|criar|registrar|lan.ar/i.test(b.textContent || ""));
        if (prim) { e.preventDefault(); prim.click(); }
      }
    };
    document.addEventListener("keydown", onKey);
    return () => document.removeEventListener("keydown", onKey);
  }, [onClose]);
  return (
  <div className="neo-ov">
    <div data-modal className="neo-modal" onClick={(e) => e.stopPropagation()} style={{ maxWidth: wide ? 780 : 520 }}>
      <div className="neo-mhead">
        <span className="neo-code">{code || modalCode(title)}</span>
        <h3>{title}</h3>
        <button onClick={onClose} className="neo-mx" aria-label="Fechar" title="Fechar (Esc)"><XIc size={17} /></button>
      </div>
      <div className="neo-mbody">{children}</div>
    </div>
  </div>
  );
};

const Combo = ({ value, onChange, options, placeholder = "Selecionar…", style }) => {
  const [open, setOpen] = useState(false);
  const [q, setQ] = useState("");
  const [hi, setHi] = useState(0);
  const boxRef = useRef(null);
  const inRef = useRef(null);
  const sel = options.find((o) => o.value === value);
  const list = !q ? options : options.filter((o) => ((o.label || "") + " " + (o.sub || "")).toLowerCase().includes(q.toLowerCase()));
  useEffect(() => {
    if (!open) return;
    const onDoc = (e) => { if (boxRef.current && !boxRef.current.contains(e.target)) setOpen(false); };
    document.addEventListener("mousedown", onDoc);
    return () => document.removeEventListener("mousedown", onDoc);
  }, [open]);
  useEffect(() => { if (open) { setQ(""); setHi(0); const t = setTimeout(() => inRef.current && inRef.current.focus(), 10); return () => clearTimeout(t); } }, [open]);
  const pick = (o) => { onChange(o.value); setOpen(false); };
  const onKey = (e) => {
    if (e.key === "ArrowDown") { e.preventDefault(); e.stopPropagation(); setHi((h) => Math.min(list.length - 1, h + 1)); }
    else if (e.key === "ArrowUp") { e.preventDefault(); e.stopPropagation(); setHi((h) => Math.max(0, h - 1)); }
    else if (e.key === "Enter") { e.preventDefault(); e.stopPropagation(); if (list[hi]) pick(list[hi]); }
    else if (e.key === "Escape") { e.stopPropagation(); setOpen(false); }
  };
  return (
    <div ref={boxRef} style={{ position: "relative", ...style }}>
      <button type="button" onClick={() => setOpen((v) => !v)} style={{ ...inputStyle, textAlign: "left", display: "flex", alignItems: "center", gap: 8, cursor: "pointer", ...(open ? { borderColor: "#3FD1CE", boxShadow: "0 0 0 3px rgba(63,209,206,.15)" } : null) }}>
        <span style={{ flex: 1, color: sel ? "#F3F6F6" : "#7E9191", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{sel ? sel.label : placeholder}</span>
        <ChevDownIc size={16} style={{ color: "#3FD1CE", flexShrink: 0, transform: open ? "rotate(180deg)" : "none", transition: "transform .15s" }} />
      </button>
      {open && (
        <div style={{ position: "absolute", zIndex: 80, top: "calc(100% + 6px)", left: 0, right: 0, background: "rgba(8,18,19,.98)", border: "1px solid rgba(63,209,206,.3)", borderRadius: 12, boxShadow: "0 18px 40px rgba(0,0,0,.55), 0 0 20px rgba(20,184,178,.12)", overflow: "hidden", backdropFilter: "blur(10px)" }}>
          <div style={{ padding: 8, borderBottom: "1px solid rgba(63,209,206,.12)" }}>
            <input ref={inRef} value={q} onChange={(e) => { setQ(e.target.value); setHi(0); }} onKeyDown={onKey} placeholder="Buscar…" style={{ ...inputStyle, padding: "7px 10px" }} />
          </div>
          <div style={{ maxHeight: 240, overflowY: "auto" }}>
            {list.length === 0 ? <div style={{ padding: "10px 12px", font: "400 13px Inter,sans-serif", color: "#8FA3A3" }}>Nada encontrado.</div>
              : list.map((o, i) => (
                <div key={(o.value === "" ? "__none" : o.value)} onMouseEnter={() => setHi(i)} onMouseDown={(e) => { e.preventDefault(); pick(o); }} style={{ display: "flex", alignItems: "center", gap: 8, padding: "9px 12px", cursor: "pointer", background: i === hi ? "rgba(63,209,206,.12)" : "transparent", boxShadow: i === hi ? "inset 3px 0 0 #3FD1CE" : "none", borderBottom: "1px solid rgba(63,209,206,.06)" }}>

                </div>

};

/* clareia/escurece uma cor #rgb ou #rrggbb (amt de -1 a 1) */
const hexShade = (hex, amt) => {
  let h = String(hex || "#14B8B2").replace("#", "");
  if (h.length === 3) h = h.split("").map((c) => c + c).join("");
  if (!/^[0-9a-fA-F]{6}$/.test(h)) h = "14B8B2";
  const c = [0, 2, 4].map((i) => parseInt(h.slice(i, i + 2), 16));
  const o = c.map((v) => Math.round(amt < 0 ? v * (1 + amt) : v + (255 - v) * amt));
  return "#" + o.map((v) => Math.max(0, Math.min(255, v)).toString(16).padStart(2, "0")).join("");
};
const isDarkHex = (hex) => { const x = hexShade(hex, 0).slice(1); return Math.max(parseInt(x.slice(0, 2), 16), parseInt(x.slice(2, 4), 16), parseInt(x.slice(4, 6), 16)) < 70; };
const hexLum = (hex) => { const x = hexShade(hex, 0).slice(1); const c = [0, 2, 4].map((i) => parseInt(x.slice(i, i + 2), 16) / 255); return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]; };

/* o "A" da logo em 7 camadas; fill = fracao preenchida de baixo para cima; animate = camadas "imprimindo" */

};

/* impressora isometrica com as pecas do pedido na mesa.
   job = { color, pieces, done, active } — pieces/done em quantidade de "blocos" (max 9) */
const IsoPrinter = ({ job }) => {
  const s = 0.78, cx = 130, cy = 205;
  const P = (x, y, z) => [cx + (x - y) * 0.866 * s, cy + (x + y) * 0.5 * s - z * s];
  const pts = (arr) => arr.map((p) => P(...p).map((v) => v.toFixed(1)).join(",")).join(" ");
  const poly = (key, arr, fill, stroke) => <polygon key={key} points={pts(arr)} fill={fill} stroke={stroke || "none"} strokeWidth={stroke ? 1 : 0} />;
  const on = !!(job && job.active);
  const els = [];
  els.push(poly("b1", [[-80, -80, -10], [80, -80, -10], [80, 80, -10], [-80, 80, -10]], "#0A2224"));
  els.push(poly("b2", [[-80, 80, -10], [80, 80, -10], [80, 80, 0], [-80, 80, 0]], "#0B2F31"));
  els.push(poly("b3", [[80, -80, -10], [80, 80, -10], [80, 80, 0], [80, -80, 0]], "#082628"));
  els.push(poly("bed", [[-80, -80, 0], [80, -80, 0], [80, 80, 0], [-80, 80, 0]], on ? "#103B3D" : "#0E2A2C", on ? "rgba(63,209,206,.45)" : "rgba(127,154,155,.25)"));
  [-40, 0, 40].forEach((i) => {
    const a = P(i, -80, 0), b = P(i, 80, 0), c = P(-80, i, 0), d = P(80, i, 0);
    els.push(<line key={"gx" + i} x1={a[0]} y1={a[1]} x2={b[0]} y2={b[1]} stroke="rgba(63,209,206,.1)" />);
    els.push(<line key={"gy" + i} x1={c[0]} y1={c[1]} x2={d[0]} y2={d[1]} stroke="rgba(63,209,206,.1)" />);
  });
  els.push(poly("c1", [[-90, -90, 0], [-82, -90, 0], [-82, -90, 170], [-90, -90, 170]], "#173F41"));
  els.push(poly("c2", [[82, -90, 0], [90, -90, 0], [90, -90, 170], [82, -90, 170]], "#173F41"));
  els.push(poly("c3", [[-90, -90, 170], [90, -90, 170], [90, -82, 170], [-90, -82, 170]], "#1E4C4E"));
  let noz = null;
  if (job && job.pieces > 0) {
    const base = job.color || "#14B8B2";
    const dark = isDarkHex(base);
    const top = dark ? hexShade(base, 0.22) : base, alt = dark ? hexShade(base, 0.32) : hexShade(base, 0.18);
    const side1 = hexShade(base, dark ? 0.08 : -0.3), side2 = hexShade(base, dark ? 0.02 : -0.45);
    const edge = dark ? "rgba(255,255,255,.22)" : null;
    const n = Math.min(9, job.pieces);
    const cols = n <= 1 ? 1 : n <= 4 ? 2 : 3;
    const gap = cols === 1 ? 0 : 46;
    const spots = Array.from({ length: n }).map((_, k) => {
      const i = k % cols, j = Math.floor(k / cols);
      const rows = Math.ceil(n / cols);
      return [(i - (cols - 1) / 2) * gap, (j - (rows - 1) / 2) * 42];
    });
    const big = cols === 1;
    const hw = big ? 30 : 14, hd = big ? 24 : 11, L = 7, lh = big ? 6 : 4.4, th = big ? 5.2 : 3.8;
    const doneN = Math.min(n, job.done);
    spots.forEach(([x, y], k) => {
      const full = k < doneN, cur = !full && k === doneN && on;
      const lays = full ? L : cur ? 3 : 0;
      for (let l = 0; l < lays; l++) {
        const z = l * lh;
        els.push(poly(`p${k}t${l}`, [[x - hw, y - hd, z + th], [x + hw, y - hd, z + th], [x + hw, y + hd, z + th], [x - hw, y + hd, z + th]], l % 2 ? alt : top, edge));
        els.push(poly(`p${k}f${l}`, [[x - hw, y + hd, z], [x + hw, y + hd, z], [x + hw, y + hd, z + th], [x - hw, y + hd, z + th]], side1, edge));
        els.push(poly(`p${k}s${l}`, [[x + hw, y - hd, z], [x + hw, y + hd, z], [x + hw, y + hd, z + th], [x + hw, y - hd, z + th]], side2, edge));
      }
      if (!full && !cur) els.push(poly(`p${k}g`, [[x - hw, y - hd, 0.5], [x + hw, y - hd, 0.5], [x + hw, y + hd, 0.5], [x - hw, y + hd, 0.5]], "none", "rgba(63,209,206,.3)"));
      if (cur) {
        const nz = 3 * lh + 8;
        els.push(poly("rail", [[-90, y - 5, nz + 34], [90, y - 5, nz + 34], [90, y + 5, nz + 34], [-90, y + 5, nz + 34]], "#2A6567"));
        const t = P(x, y, nz);
        noz = (
          <g className="neo-noz" key="noz">
            {poly("n1", [[x - 9, y - 9, nz + 12], [x + 9, y - 9, nz + 12], [x + 9, y + 9, nz + 12], [x - 9, y + 9, nz + 12]], "#F5821F")}
            {poly("n2", [[x - 9, y + 9, nz + 12], [x + 9, y + 9, nz + 12], [x + 9, y + 9, nz + 34], [x - 9, y + 9, nz + 34]], "#D96B10")}
            {poly("n3", [[x + 9, y - 9, nz + 12], [x + 9, y + 9, nz + 12], [x + 9, y + 9, nz + 34], [x + 9, y - 9, nz + 34]], "#B9590B")}
            <circle className="neo-glow" cx={t[0]} cy={t[1]} r="12" fill="#F5821F" opacity=".3" />
            <circle cx={t[0]} cy={t[1]} r="4.5" fill="#FFD2A3" />
          </g>
        );
      }
    });
  }
  return <svg viewBox="0 0 260 290" className="neo-iso" aria-hidden="true">{els}{noz}</svg>;
};

/* ===================== v4.46: NUMEROS DO NEGOCIO (pecas animadas) ===================== */
const reduceMotion = () => { try { return window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) { return false; } };
/* numero que "conta" ate o valor */
const CountUp = ({ value, format, ms = 700 }) => {
  const v = Number(value) || 0;
  const [shown, setShown] = useState(reduceMotion() ? v : 0);
  const fromRef = useRef(reduceMotion() ? v : 0);
  useEffect(() => {
    if (reduceMotion() || typeof requestAnimationFrame !== "function") { setShown(v); fromRef.current = v; return; }
    const now = () => (typeof performance !== "undefined" && performance.now ? performance.now() : Date.now());
    const from = fromRef.current, t0 = now(); let raf;
    const step = () => {
      const k = Math.min(1, (now() - t0) / ms), e = 1 - Math.pow(1 - k, 3);
      const cur = from + (v - from) * e; setShown(k >= 1 ? v : cur); fromRef.current = k >= 1 ? v : cur;
      if (k < 1) raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf);
  }, [v]);
  return <span className="neo-num">{format ? format(shown) : Math.round(shown)}</span>;
};
/* cartao que aparece ao rolar a pagina */
const Reveal = ({ children, className, style, delay = 0, onClick, title }) => {
  const ref = useRef(null);
  const [on, setOn] = useState(false);
  useEffect(() => {
    const el = ref.current;
    if (!el || typeof IntersectionObserver === "undefined" || reduceMotion()) { setOn(true); return; }
    const io = new IntersectionObserver((es) => { if (es.some((x) => x.isIntersecting)) { setOn(true); io.disconnect(); } }, { threshold: 0.12 });
    io.observe(el);
    const safety = setTimeout(() => setOn(true), 2500);
    return () => { io.disconnect(); clearTimeout(safety); };
  }, []);
  return <div ref={ref} onClick={onClick} title={title} className={"neo-rv" + (on ? " in" : "") + (className ? " " + className : "")} style={{ transitionDelay: delay + "ms", ...style }}>{children}</div>;
};
/* anel de progresso que enche ao aparecer */

          strokeDasharray={C} strokeDashoffset={on ? C * (1 - p / 100) : C} transform={`rotate(-90 ${size / 2} ${size / 2})`} style={{ transition: "stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)", filter: `drop-shadow(0 0 4px ${color}88)` }} />}

/* rosca "holografica": fatias com brilho, anel externo girando, centro mostra a fatia em foco */
const HoloDonut = ({ items, unit, totalLabel, gid = "hd" }) => {
  const [hi, setHi] = useState(-1);
  const [on, setOn] = useState(false);
  useEffect(() => { const t = setTimeout(() => setOn(true), 80); return () => clearTimeout(t); }, []);
  const total = items.reduce((s, x) => s + x.value, 0) || 1;
  const R = 62, C = 2 * Math.PI * R, gap = items.length > 1 ? 3 : 0;
  let acc = 0;
  const focus = hi >= 0 ? items[hi] : null;
  return (
    <div className="neo-donut">
      <svg viewBox="0 0 180 180" aria-hidden="true">
        <circle cx="90" cy="90" r="84" fill="none" stroke="rgba(63,209,206,.25)" strokeWidth="1" strokeDasharray="2 6" className="neo-spin-slow" style={{ transformOrigin: "90px 90px" }} />
        <circle cx="90" cy="90" r="74" fill="none" stroke="rgba(63,209,206,.08)" strokeWidth="1" />
        <circle cx="90" cy="90" r={R} fill="none" stroke="rgba(127,154,155,.10)" strokeWidth="16" />
        {items.map((x, i) => {
          const len = Math.max(0, (x.value / total) * C - gap);
          const el = (
            <circle key={i} cx="90" cy="90" r={R} fill="none" stroke={x.color} strokeWidth={hi === i ? 20 : 16}
              strokeDasharray={`${on ? len : 0} ${C}`} strokeDashoffset={-acc} transform="rotate(-90 90 90)"
              style={{ transition: "stroke-dasharray 1s cubic-bezier(.2,.8,.2,1), stroke-width .15s", filter: `drop-shadow(0 0 ${hi === i ? 8 : 4}px ${x.glow || x.color}aa)`, cursor: "pointer" }}
              onMouseEnter={() => setHi(i)} onMouseLeave={() => setHi(-1)} />
          );
          acc += (x.value / total) * C;
          return el;
        })}
        <circle cx="90" cy="90" r="44" fill="rgba(5,14,15,.9)" stroke="rgba(63,209,206,.2)" />
        <text x="90" y="84" textAnchor="middle" className="neo-donut-l">{focus ? (focus.name.length > 14 ? focus.name.slice(0, 13) + "…" : focus.name) : totalLabel}</text>
        <text x="90" y="104" textAnchor="middle" className="neo-donut-v">{focus ? `${fmtN(focus.value / total * 100, 0)}%` : unit(total)}</text>
      </svg>
      <div className="neo-donut-leg">
        {items.slice(0, 6).map((x, i) => (
          <div key={i} className={"neo-dl" + (hi === i ? " on" : "")} onMouseEnter={() => setHi(i)} onMouseLeave={() => setHi(-1)}>
            <i style={{ background: x.color, boxShadow: `0 0 8px ${x.glow || x.color}` }} />
            <span className="n">{x.name}</span>
            <span className="v">{unit(x.value)}</span>
            <span className="p">{fmtN(x.value / total * 100, 0)}%</span>
            <div className="bar"><b style={{ width: on ? (x.value / total * 100) + "%" : 0, background: x.color }} /></div>
          </div>
        ))}
      </div>
    </div>
  );
};
/* linha de tendencia pequena */
const Spark = ({ values, color = "#3FD1CE" }) => {
  const v = (values || []).map((x) => Number(x) || 0);
  if (v.length < 2 || v.every((x) => x === 0)) return null;
  const mx = Math.max(...v), mn = Math.min(...v), rg = mx - mn || 1;
  const pts = v.map((x, i) => `${(i / (v.length - 1)) * 70},${24 - ((x - mn) / rg) * 20}`).join(" ");
  return <svg viewBox="0 0 70 26" className="neo-spark" aria-hidden="true"><polyline points={pts} fill="none" stroke={color} strokeWidth="2" strokeLinejoin="round" strokeLinecap="round" /></svg>;
};

/* ------------------- impressao em partes (v4.34) -------------------
   Cada parte: { id, name, printerId, hours (decimal), fils: [{ filamentId, grams }] }.
   Tempo de maquina = soma das partes (gera custo e horas de uso).
   Pronta em = impressora mais carregada (as maquinas trabalham ao mesmo tempo). */
const newPart = (printers, filaments, n) => ({ id: uid(), name: "Parte " + (n || 1), printerId: printers[0] ? printers[0].id : "", hours: "", fils: [{ filamentId: filaments[0] ? filaments[0].id : "", grams: "" }] });
const partsHours = (parts) => (parts || []).reduce((s, p) => s + num(p.hours), 0);
const partsByPrinter = (parts, override) => (parts || []).reduce((m, p) => {
  const pid = ((override || {})[p.id]) || p.printerId || "";
  m[pid] = (m[pid] || 0) + num(p.hours); return m;
}, {});
const partsWall = (parts, override) => { const v = Object.values(partsByPrinter(parts, override)); return v.length ? Math.max(...v) : 0; };
const partsFilTotals = (parts) => (parts || []).reduce((m, p) => {
  (p.fils || []).forEach((x) => { if (x.filamentId && num(x.grams) > 0) m[x.filamentId] = (m[x.filamentId] || 0) + num(x.grams); });
  return m;
}, {});
const partsGrams = (parts) => (parts || []).reduce((s, p) => s + (p.fils || []).reduce((a, x) => a + num(x.grams), 0), 0);
/* energia e depreciacao de cada parte com a impressora daquela parte */
const partsMachineCost = (parts, printers, kwhPrice) => (parts || []).reduce((acc, p) => {
  const pr = (printers || []).find((x) => x.id === p.printerId);
  const h = num(p.hours);
  acc.energy += (pr ? num(pr.watts) : 0) / 1000 * h * num(kwhPrice);
  acc.depr += (pr && num(pr.lifeH) > 0 ? num(pr.price) / num(pr.lifeH) : 0) * h;
  return acc;
}, { energy: 0, depr: 0 });
const scaleParts = (parts, k) => (parts || []).map((p) => ({ ...p, id: p.id || uid(), hours: +(num(p.hours) * k).toFixed(4),
  fils: (p.fils || []).map((x) => ({ ...x, grams: num(x.grams) > 0 ? +(num(x.grams) * k).toFixed(2) : x.grams })) }));
const fmtHM = (h) => { const t = Math.round(num(h) * 60); const hh = Math.floor(t / 60), mm = t % 60; return hh + "h" + String(mm).padStart(2, "0"); };

/* ------------------------- cost calculation core ---------------------- */
/* energyOverride/deprOverride: usados no modo "em partes" (cada parte com sua impressora) */
function calcPrint({ mode, pieces, materialCost, hoursTotal, watts, kwhPrice, deprPerH, failureRate, laborH, laborRate, fixed, margin, extrasCost, maintMarginPct, energyOverride, deprOverride }) {
  const q = Math.max(1, num(pieces));
  const matPieces = num(materialCost);
  const energy = energyOverride != null ? num(energyOverride) : (num(watts) / 1000) * num(hoursTotal) * num(kwhPrice);
  const depr = mode === "completo" ? (deprOverride != null ? num(deprOverride) : num(deprPerH) * num(hoursTotal)) : 0;
  const labor = mode === "completo" ? num(laborH) * num(laborRate) : 0;
  const fix = mode === "completo" ? num(fixed) : 0;
  const extras = num(extrasCost);
  const preMaint = matPieces + energy + depr + labor + fix + extras;
  const maint = mode === "completo" ? preMaint * (num(maintMarginPct) / 100) : 0;
  const subtotal = preMaint + maint;
  const fail = mode === "completo" ? subtotal * (num(failureRate) / 100) : 0;
  const totalCost = subtotal + fail;
  const totalPrice = totalCost * (1 + num(margin) / 100);
  return { matPieces, energy, depr, labor, fix, extras, maint, fail, totalCost, totalPrice, unitCost: totalCost / q, unitPrice: totalPrice / q, qty: q };
}

/* ------------------- multichannel pricing (revenda/varejo/marketplaces) ------------------- */
function calcChannelPrices(unitCost, settings) {
  const cost = num(unitCost);
  const s = settings || {};
  const withMultiplier = (mult) => { const price = cost * num(mult); return { price, profit: price - cost, feePct: 0 }; };
  // price such that, after the marketplace fee is deducted, profit over cost matches defaultMargin
  const withFee = (feePct) => {
    const fee = num(feePct) / 100;
    const marginFrac = num(s.defaultMargin) / 100;
    const price = fee < 1 ? (cost * (1 + marginFrac)) / (1 - fee) : 0;
    const profit = price * (1 - fee) - cost;
    return { price, profit, feePct: num(feePct) };
  };
  return {
    resale: { label: "Revendedor", ...withMultiplier(s.resaleMultiplier || 3) },
    final: { label: "Consumidor final", ...withMultiplier(s.finalMultiplier || 5) },
    shopee: { label: "Shopee", ...withFee(s.shopeeFeePct) },
    mlClassic: { label: "Mercado Livre clássico", ...withFee(s.mlClassicFeePct) },
    mlPremium: { label: "Mercado Livre premium", ...withFee(s.mlPremiumFeePct) },
    tiktok: { label: "TikTok Shop", ...withFee(s.tiktokFeePct) },
  };
}

function CalcModal({ data, onClose, onApply, prefill }) {

  const pf = prefill || {};

  const h0 = pf.hours ? num(pf.hours) * pieces0 : 0;
  const pfParts = pf.printMode === "partes" && (pf.parts || []).length ? scaleParts(pf.parts, pieces0) : null;
  const [f, setF] = useState({
    mode: "completo",
    print: pfParts ? "partes" : "unica",
    pieces: pieces0,
    hoursH: h0 ? Math.floor(h0) : "", hoursM: h0 ? Math.round((h0 % 1) * 60) : "",
    printerId: data.printers[0] ? data.printers[0].id : "", manualWatts: "",
    manualKg: "", laborH: 0.5, fixed: "", margin: s.defaultMargin,
  });
  const pfFils = (pf.fils || []).filter((x) => x.filamentId);
  const [fils, setFils] = useState(
    pfFils.length
      ? pfFils.map((x) => ({ filamentId: x.filamentId, grams: num(x.grams) > 0 ? String(+(num(x.grams) * pieces0).toFixed(1)) : "" }))
      : pf.filamentId || pf.grams
      ? [{ filamentId: pf.filamentId || "", grams: pf.grams ? String(+(num(pf.grams) * pieces0).toFixed(1)) : "" }]
      : [{ filamentId: data.filaments[0] ? data.filaments[0].id : "", grams: "" }]
  );
  const [parts, setParts] = useState(pfParts || [
    { ...newPart(data.printers, data.filaments, 1), fils: fils.map((x) => ({ ...x })) },
  ]);
  const [extras, setExtras] = useState((pf.extras || []).map((e) => ({ materialId: e.materialId, qty: +(num(e.qty) * pieces0).toFixed(2) })));
  const set = (k) => (e) => setF({ ...f, [k]: e.target.value });
  const setFil = (i, patch) => setFils(fils.map((x, idx) => (idx === i ? { ...x, ...patch } : x)));
  const emPartes = f.print === "partes";

  const pr = data.printers.find((x) => x.id === f.printerId);
  const watts = f.manualWatts !== "" ? num(f.manualWatts) : pr ? num(pr.watts) : 0;
  const deprPerH = pr && num(pr.lifeH) > 0 ? num(pr.price) / num(pr.lifeH) : 0;
  const extrasCost = extrasCostOf(extras, data.materials);

function Pager({ total, page, per, setPage }) {
  const pages = Math.max(1, Math.ceil(total / per));
  if (pages <= 1) return null;
  return (
    <div style={{ display: "flex", gap: 10, alignItems: "center", justifyContent: "center", padding: "14px 0 4px", font: "500 13px Inter,sans-serif", color: "#7E9191", flexWrap: "wrap" }}>
      <Btn small kind="ghost" disabled={page <= 1} onClick={() => setPage(page - 1)}>‹ Anterior</Btn>
      <span>Página {page} de {pages} · {total} itens</span>
      <Btn small kind="ghost" disabled={page >= pages} onClick={() => setPage(page + 1)}>Próxima ›</Btn>
    </div>
  );
}
/* selo de gravacao no rodape: mostra se o ultimo salvamento foi gravado mesmo */
function SaveBadge({ state }) {
  const [, tick] = useState(0);
  useEffect(() => { const t = setInterval(() => tick((n) => n + 1), 15000); return () => clearInterval(t); }, []);
  if (!state.ok) {
    return <div style={{ display: "flex", alignItems: "center", gap: 5, color: "#FF8A88", font: "700 10.5px Inter,sans-serif", marginBottom: 6 }}>
      <span style={{ width: 7, height: 7, borderRadius: "50%", background: "#F0605F", display: "inline-block" }} />NÃO SALVO
    </div>;
  }
  if (!state.at) return null;
  const secs = Math.max(0, Math.round((Date.now() - state.at) / 1000));
  const quando = secs < 20 ? "agora" : secs < 60 ? `há ${secs}s` : secs < 3600 ? `há ${Math.round(secs / 60)} min` : `há ${Math.round(secs / 3600)}h`;
  return <div style={{ display: "flex", alignItems: "center", gap: 5, color: state.photoWarn ? "#FFB067" : "#4FB8A6", font: "600 10.5px Inter,sans-serif", marginBottom: 6 }}>
    <span style={{ width: 7, height: 7, borderRadius: "50%", background: state.photoWarn ? "#F47A20" : "#2F9E8C", display: "inline-block" }} />
    {state.photoWarn ? `salvo ${quando} · fotos pendentes` : `salvo ${quando}`}
  </div>;
}

/* ============================ ACOES / HISTORICO (v4.41) ============================
   Cada mudanca nos dados vira uma "acao" com o antes/depois de tudo o que mudou
   (pedido, filamento, impressora, estoque, financeiro... tudo junto).
   Desfazer aplica o "antes" por cima do estado atual:
   - quantidades (estoque, horas, gramas) voltam pela DIFERENCA, sem estragar o que veio depois;
   - outros campos voltam se ninguem mexeu depois; se mexeram, e conflito e o sistema avisa.
   Guardado 7 dias no navegador (chave separada, fotos ficam como etiqueta leve). */
const ACTIONS_LS = "gestor3d-actions-v1";
const ACTIONS_DAYS = 7;
const ACT_UI = { cat: "Tudo", q: "", open: {} }; /* filtro da aba Acoes sobrevive ao redesenho da tela */
const ACT_DELTA_FIELDS = new Set(["stockG", "qty", "hoursUsed", "stock", "consumedQty"]);
const ACT_ENT = { orders: "pedido", quotes: "orçamento", projects: "projeto", kits: "kit", clients: "cliente", filaments: "filamento", materials: "material", products: "estoque de produto", expenses: "investimento", cashflow: "lançamento do caixa", fixedCosts: "custo fixo", printers: "impressora" };
const ACT_KEY_ORDER = ["quotes", "orders", "projects", "kits", "clients", "expenses", "fixedCosts", "cashflow", "filaments", "materials", "printers", "products", "settings", "storeInfo"];
const ACT_CAT = { orders: "Pedidos", quotes: "Orçamentos", projects: "Projetos", kits: "Projetos", clients: "Clientes", filaments: "Estoque", materials: "Estoque", products: "Estoque", expenses: "Financeiro", cashflow: "Financeiro", fixedCosts: "Financeiro", printers: "Impressoras", settings: "Configurações", storeInfo: "Configurações" };
const ACT_FIELD = { status: "status", paid: "pago", qty: "quantidade", price: "valor", cost: "custo", stockG: "estoque", hoursUsed: "horas de uso", stock: "estoque", name: "nome", salePrice: "preço de venda", dueDate: "entrega", date: "data", unitPrice: "preço", items: "itens", discount: "desconto", value: "valor", clientId: "cliente", printedQty: "impressas", prints: "impressões", active: "ativo", pix: "PIX", consumedQty: "peças já baixadas" };
const ACT_HIDE_FIELDS = new Set(["ts", "movements", "consumedQty", "updatedAt"]);
const actSame = (x, y) => x === y || JSON.stringify(x) === JSON.stringify(y);
const actIsIdList = (arr) => Array.isArray(arr) && arr.length > 0 && arr.every((x) => x && typeof x === "object" && x.id != null);
const actNumLike = (v) => typeof v === "number" || (typeof v === "string" && /^-?\d+(\.\d+)?$/.test(v.trim()));
const actStrip = (v) => stripPhotos(v, {});
function actionsLoad() {
  try { const a = JSON.parse(localStorage.getItem(ACTIONS_LS) || "[]"); return Array.isArray(a) ? actionsPrune(a) : []; } catch (e) { return []; }
}
function actionsPrune(list) {
  const lim = Date.now() - ACTIONS_DAYS * 86400000;
  return list.filter((a) => a && a.ts >= lim).slice(0, 800);
}
function actionsSave(list) {
  let l = actionsPrune(list);
  for (let i = 0; i < 6; i++) {
    try { localStorage.setItem(ACTIONS_LS, JSON.stringify(l)); return l; }
    catch (e) { l = l.slice(0, Math.floor(l.length * 0.7)); } /* sem espaco: guarda as mais recentes */
  }
  return l;
}
/* diferenca entre dois estados (so as colecoes que mudaram de referencia) */
function diffData(prev, next) {
  const ch = {};
  new Set([...Object.keys(prev || {}), ...Object.keys(next || {})]).forEach((k) => {
    const a = prev[k], b = next[k];
    if (a === b) return;
    const listish = (Array.isArray(a) || a == null) && (Array.isArray(b) || b == null) && (actIsIdList(a) || actIsIdList(b) || (Array.isArray(a) && Array.isArray(b) && !a.length && !b.length));
    if (listish) {
      const A = a || [], B = b || [];
      const am = new Map(A.map((x) => [x.id, x])), bm = new Map(B.map((x) => [x.id, x]));
      const added = [], removed = [], changed = [];
      B.forEach((x) => {
        const o = am.get(x.id);
        if (!o) { added.push(x); return; }
        if (o === x) return;
        const before = {}, after = {};
        new Set([...Object.keys(o), ...Object.keys(x)]).forEach((f) => { if (!actSame(o[f], x[f])) { before[f] = o[f]; after[f] = x[f]; } });
        if (Object.keys(before).length || Object.keys(after).length) changed.push({ id: x.id, before, after });
      });
      A.forEach((x, i) => { if (!bm.has(x.id)) removed.push({ item: x, index: i }); });
      if (added.length || removed.length || changed.length) ch[k] = { type: "list", added, removed, changed };
    } else if (!actSame(a, b)) ch[k] = { type: "value", before: a, after: b };
  });
  return ch;
}
/* desfaz uma acao por cima do estado atual. Retorna { next, conflicts } */
function undoChanges(cur, changes) {
  const next = { ...cur };
  const conflicts = [];
  Object.entries(changes || {}).forEach(([k, c]) => {
    const ent = ACT_ENT[k] || k;
    if (c.type === "value") {
      if (!actSame(actStrip(cur[k]), c.after)) conflicts.push(`${ACT_CAT[k] || k}: foi alterado depois`);
      next[k] = c.before;
      return;
    }
    let arr = (cur[k] || []).slice();
    (c.added || []).forEach((it) => {
      const i = arr.findIndex((x) => x.id === it.id);
      if (i < 0) return;
      const now = arr[i];
      if (k === "products" && it.qty != null) {
        /* linha de estoque criada pela acao: tira so a quantidade que a acao colocou */
        const q = num(now.qty) - num(it.qty);
        if (q > 0) { arr[i] = { ...now, qty: q }; return; }
      } else if (!actSame(actStrip(now), it)) conflicts.push(`${ent} "${it.name || it.code || it.desc || it.id}" foi alterado depois de criado`);
      arr.splice(i, 1);
    });
    (c.removed || []).slice().sort((x, y) => x.index - y.index).forEach(({ item, index }) => {
      if (arr.some((x) => x.id === item.id)) return;
      arr.splice(Math.min(index, arr.length), 0, item);
    });
    (c.changed || []).forEach(({ id, before, after }) => {
      const i = arr.findIndex((x) => x.id === id);
      if (i < 0) { conflicts.push(`${ent} foi excluído depois — essa parte não volta`); return; }
      const now = { ...arr[i] };
      new Set([...Object.keys(before), ...Object.keys(after)]).forEach((f) => {
        const b = before[f], a = after[f], cv = actStrip(now[f]);
        if (actSame(cv, a)) { if (b === undefined) delete now[f]; else now[f] = b; return; }
        if (ACT_DELTA_FIELDS.has(f) && actNumLike(b) && actNumLike(a) && actNumLike(cv)) {
          const v = +(num(cv) + (num(b) - num(a))).toFixed(4);
          now[f] = typeof now[f] === "string" ? String(Math.max(0, v)) : Math.max(0, v);
          return;
        }
        if (actIsIdList(b) || actIsIdList(a) || (Array.isArray(a) && Array.isArray(cv))) {
          /* lista dentro do item (ex.: impressoes, movimentos): tira o que a acao pos e devolve o que tirou */
          const bl = b || [], al = a || [];
          const addedIds = new Set(al.filter((x) => x && x.id != null && !bl.some((y) => y && y.id === x.id)).map((x) => x.id));
          const removedIt = bl.filter((x) => x && x.id != null && !al.some((y) => y && y.id === x.id));
          let list = (Array.isArray(now[f]) ? now[f] : []).filter((x) => !(x && addedIds.has(x.id)));
          removedIt.forEach((x) => { if (!list.some((y) => y && y.id === x.id)) list.push(x); });
          now[f] = list;
          return;
        }
        conflicts.push(`${ent} "${arr[i].name || arr[i].code || ""}": ${ACT_FIELD[f] || f} foi alterado depois`.replace(' "": ', ": "));
        if (b === undefined) delete now[f]; else now[f] = b;
      });
      arr[i] = now;
    });
    next[k] = arr;
  });
  return { next, conflicts };
}
const actFmtVal = (f, v) => {
  if (v === undefined || v === null || v === "") return "—";
  if (typeof v === "boolean") return v ? "sim" : "não";
  if (Array.isArray(v)) return `${v.length} item(ns)`;
  if (typeof v === "object") return "…";
  if (["price", "cost", "unitPrice", "value", "salePrice", "discount"].includes(f) && actNumLike(v)) return fmt(v);
  if (f === "stockG" && actNumLike(v)) return fmtN(v) + "g";
  if (f === "hoursUsed" && actNumLike(v)) return fmtN(v, 1) + "h";
  if ((f === "date" || f === "dueDate") && /^\d{4}-\d{2}-\d{2}$/.test(String(v))) return fmtDate(v);
  const s = String(v); return s.length > 40 ? s.slice(0, 40) + "…" : s;
};

/* v4.42: telas "estaveis". Os componentes internos do App eram recriados a cada atualizacao
   dos dados (ou quando um aviso sumia), e o React remontava a tela: abas internas voltavam ao
   inicio e janelas perdiam o que estava sendo digitado. Aqui cada tela ganha uma identidade fixa
   que sempre chama a versao mais nova da funcao — a tela so ATUALIZA, nao remonta. */
const STABLE_COMPONENTS = new Map();
function stableComponent(name, fn) {
  let e = STABLE_COMPONENTS.get(name);
  if (!e) {
    const holder = { fn };
    const C = function StableScreen(props) { return holder.fn(props); };
    C.displayName = name;
    e = { holder, C };
    STABLE_COMPONENTS.set(name, e);
  }
  e.holder.fn = fn;
  return e.C;
}
