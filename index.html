const PJ_UI = { niche: "Todos", q: "", sort: "vendidos", help: false };
const STK_UI = { view: "spools", type: "Todos", sort: "menos", mcat: "Todos", help: false };
const PRD_UI = { f: "Todos", sort: "qtd", q: "" };
const EXP_UI = { month: null, cat: "Todas", q: "" };
const AG_UI = { ym: null, view: "mes", wk: null };
const ORD_UI = { per: "mes", from: "", to: "", type: "todos", sit: "todos", q: "" };
const CLI_UI = { seg: "todos", q: "", niche: "Todos", sort: "gasto" };
const PEN_UI = { filter: "todos", q: "" };
const Q_UI = { st: "Todos", q: "", month: "", open: null };
const FIN_UI = { sub: "fluxo", month: null, src: "all", q: "" };
function App() {
  const [data, setDataRaw] = useState(() => {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return normalizeData(JSON.parse(raw));
    } catch (e) {}
    return DEFAULTS;
  });
  /* ---------- v4.41: registro de acoes (historico com desfazer) ---------- */
  const actRef = useRef(null);
  if (actRef.current === null) actRef.current = actionsLoad();
  const actPrev = useRef(null), actSkip = useRef(false), actMeta = useRef(null);
  const [actTick, setActTick] = useState(0);
  const setData = (u) => setDataRaw(u);
  const setDataQuiet = (u) => { actSkip.current = true; setDataRaw(u); }; /* carregar/hidratar fotos: nao vira acao */
  const logAs = (label, extra) => { actMeta.current = { label, ...(extra || {}) }; };
  const actItemName = (k, it, d) => {
    if (!it) return "";
    if (k === "orders") { const p = (d.projects || []).find((x) => x.id === it.projectId); return `${(p && p.name) || it.projectName || "item"} × ${fmtN(it.qty)}`; }
    if (k === "quotes") { const c = (d.clients || []).find((x) => x.id === it.clientId); return `${it.code || ""}${c ? ` (${c.name})` : ""}`; }
    if (k === "products") { const p = (d.projects || []).find((x) => x.id === it.projectId); return p ? p.name : "produto"; }
    return it.name || it.desc || it.code || "";
  };
  const describeAction = (ch, d, dPrev) => {
    const keys = ACT_KEY_ORDER.filter((k) => ch[k]).concat(Object.keys(ch).filter((k) => !ACT_KEY_ORDER.includes(k)));
    let label = "";
    for (const k of keys) {
      const c = ch[k], ent = ACT_ENT[k] || k;
      if (c.type === "value") { label = k === "settings" || k === "storeInfo" ? "Alterou as configurações" : `Alterou ${k}`; break; }
      if (c.removed.length) { label = `Excluiu ${ent} ${actItemName(k, c.removed[0].item, dPrev)}${c.removed.length > 1 ? ` (+${c.removed.length - 1})` : ""}`; break; }
      if (c.added.length) { label = `${k === "cashflow" || k === "expenses" ? "Lançou" : "Criou"} ${ent} ${actItemName(k, c.added[0], d)}${c.added.length > 1 ? ` (+${c.added.length - 1})` : ""}`; break; }
      if (c.changed.length) {
        const x = c.changed[0]; const it = (d[k] || []).find((y) => y.id === x.id) || (dPrev[k] || []).find((y) => y.id === x.id);
        const fs = Object.keys(x.after).concat(Object.keys(x.before)).filter((f, i, a) => a.indexOf(f) === i && !ACT_HIDE_FIELDS.has(f));
        const what = fs.slice(0, 2).map((f) => (typeof x.after[f] === "object" || typeof x.before[f] === "object") ? (ACT_FIELD[f] || f) : `${ACT_FIELD[f] || f}: ${actFmtVal(f, x.before[f])} → ${actFmtVal(f, x.after[f])}`).join(", ");
        label = `Alterou ${ent} ${actItemName(k, it, d)}${what ? ` (${what})` : ""}`; break;
      }
    }
    const details = [];
    keys.forEach((k) => {
      const c = ch[k], ent = ACT_ENT[k] || k;
      if (c.type === "value") { details.push(k === "settings" ? "Configurações gerais" : k === "storeInfo" ? "Dados da empresa" : k); return; }
      c.removed.forEach((r) => details.push(`🗑 ${ent}: ${actItemName(k, r.item, dPrev)}`));
      c.added.forEach((a) => details.push(`＋ ${ent}: ${actItemName(k, a, d)}${k === "cashflow" && a.value != null ? ` · ${a.kind === "out" ? "−" : "+"}${fmt(a.value)}` : ""}`));
      c.changed.forEach((x) => {
        const it = (d[k] || []).find((y) => y.id === x.id) || {};
        const fs = Object.keys(x.after).concat(Object.keys(x.before)).filter((f, i, a) => a.indexOf(f) === i && !ACT_HIDE_FIELDS.has(f));
        if (!fs.length) return;
        const parts = fs.slice(0, 3).map((f) => {
          const b = x.before[f], a = x.after[f];
          if (typeof a === "object" || typeof b === "object") return ACT_FIELD[f] || f;
          const dl = ACT_DELTA_FIELDS.has(f) && actNumLike(a) && actNumLike(b) ? ` (${num(a) - num(b) > 0 ? "+" : "−"}${f === "stockG" ? fmtN(Math.abs(num(a) - num(b))) + "g" : f === "hoursUsed" ? fmtN(Math.abs(num(a) - num(b)), 1) + "h" : fmtN(Math.abs(num(a) - num(b)))})` : "";
          return `${ACT_FIELD[f] || f} ${actFmtVal(f, b)} → ${actFmtVal(f, a)}${dl}`;
        });
        details.push(`✎ ${ent} ${actItemName(k, it, d)}: ${parts.join(" · ")}`);
      });
    });
    const cats = Array.from(new Set(keys.map((k) => ACT_CAT[k] || "Outros")));
    return { label: label || "Alteração", details: details.slice(0, 14), cats };
  };
  useEffect(() => {
    const prev = actPrev.current; actPrev.current = data;
    if (!prev || prev === data) return;
    if (actSkip.current) { actSkip.current = false; actMeta.current = null; return; }
    try {
      const ch = diffData(prev, data);
      if (!Object.keys(ch).length) { actMeta.current = null; return; }
      const meta = actMeta.current || {}; actMeta.current = null;
      const desc = describeAction(ch, data, prev);
      const entry = { id: uid(), ts: Date.now(), label: meta.label || desc.label, details: desc.details, cats: desc.cats, changes: actStrip(ch), ...(meta.undoOf ? { undoOf: meta.undoOf, kind: meta.kind, target: meta.target } : {}) };
      let list = [entry, ...actRef.current];
      /* a acao desfeita fica riscada; a original (alvo) fica riscada quando foi desfeita e volta ao normal quando refeita */
      if (meta.undoOf) list = list.map((a) => (a.id === meta.undoOf ? { ...a, undone: true } : a.id === meta.target && meta.target !== meta.undoOf ? { ...a, undone: meta.kind === "undo" } : a));
      actRef.current = actionsSave(list);
      if (tab === "acoes") setActTick((t) => t + 1);
    } catch (e) { actMeta.current = null; }
  }, [data]);
  const undoAction = async (a) => {
    const { next, conflicts } = undoChanges(data, a.changes);
    if (conflicts.length && !confirm(`⚠ Algumas coisas desta ação foram alteradas depois:\n\n• ${conflicts.slice(0, 8).join("\n• ")}${conflicts.length > 8 ? `\n• … e mais ${conflicts.length - 8}` : ""}\n\nQuantidades (estoque, horas, filamento) voltam só a diferença desta ação.\nOs outros campos voltam ao valor de antes desta ação.\n\nDesfazer mesmo assim?`)) return;
    /* desfazer um "Desfez" = refazer; desfazer um "Refez" = desfazer de novo */
    const target = a.target ? actRef.current.find((x) => x.id === a.target) : a;
    const base = target ? target.label : a.label.replace(/^(Desfez|Refez): /, "");
    const kind = a.kind === "undo" ? "redo" : "undo";
    logAs(`${kind === "redo" ? "Refez" : "Desfez"}: ${base}`, { undoOf: a.id, kind, target: a.target || a.id });
    setData(next);
    /* fotos de itens que voltaram: busca no armazem do navegador */
    try {
      const refs = new Set(); collectRefs(next, refs);
      if (refs.size) { const map = await idbGetMany([...refs]); if (Object.keys(map).length) setDataQuiet((d) => hydratePhotos(d, map)); }
    } catch (e) {}
    notify(conflicts.length ? "Ação desfeita (com avisos de alterações posteriores)" : "Ação desfeita");
  };

  const [needBackup, setNeedBackup] = useState(false);
  const [tab, setTab] = useState("dash");
  /* v4.45: botao "Instalar o app" quando o Chrome permitir */
  const [canInstall, setCanInstall] = useState(() => !!(typeof window !== "undefined" && window.__pwaPrompt));
  useEffect(() => { const h = () => setCanInstall(!!window.__pwaPrompt); window.addEventListener("pwa-installable", h); return () => window.removeEventListener("pwa-installable", h); }, []);
  const installApp = async () => { const ev = window.__pwaPrompt; if (!ev) return; ev.prompt(); try { await ev.userChoice; } catch (e) { /* cancelado */ } window.__pwaPrompt = null; setCanInstall(false); };
  const [modal, setModal] = useState(null);
  const [toast, setToast] = useState(null);
  const toastT = useRef(null);
  const importRef = useRef(null);
  const [session, setSession] = useState(null);
  const [authChecked, setAuthChecked] = useState(!sb);
  const [offlineMode, setOfflineMode] = useState(false);
  const [recoveryMode, setRecoveryMode] = useState(false);
  const [profile, setProfile] = useState(null);
  const [profileChecked, setProfileChecked] = useState(!sb);
  const dataRef = useRef(data); dataRef.current = data;
  const pulledRef = useRef(false);
  const cloudTimer = useRef(null);
  /* controle de gravacao: sequencia (evita gravacao antiga sobrescrever nova) e estado visivel */
  const saveSeq = useRef(0);
  const photoFailRef = useRef({});          // fotos que o IndexedDB recusou — tenta de novo na proxima gravacao
  const [saveState, setSaveState] = useState({ ok: true, at: 0, err: "", photoWarn: false });

  const [undoSnap, setUndoSnap] = useState(null);
  const notify = (msg, snap) => {
    setToast(msg);
    setUndoSnap(snap || null);
    clearTimeout(toastT.current);
    toastT.current = setTimeout(() => { setToast(null); setUndoSnap(null); }, snap ? 8000 : 3800);
  };
  const notifyUndo = (msg) => notify(msg, data);
  const doUndo = () => { if (undoSnap) setData(undoSnap); setUndoSnap(null); setToast(null); clearTimeout(toastT.current); };

  /* hidrata as fotos do IndexedDB ao abrir + checa idade do ultimo backup */
  useEffect(() => {
    let alive = true;
    (async () => {
      try {
        const refs = new Set(); collectRefs(data, refs);
        if (refs.size) { const map = await idbGetMany([...refs]); if (alive) setDataQuiet((d) => hydratePhotos(d, map)); }
      } catch (e) {}
      const last = +(localStorage.getItem(LAST_BACKUP_KEY) || 0);
      if (alive) setNeedBackup(!last || (Date.now() - last) / 86400000 > 7);
    })();
    return () => { alive = false; };
  }, []);

  /* ================= GRAVACAO ==================
     REGRA DE OURO: o texto (projetos, pedidos, clientes) vai para o localStorage
     PRIMEIRO e de forma SINCRONA. As fotos (IndexedDB) e a nuvem vem depois, isoladas.
     Assim uma falha de foto nunca mais impede o restante de salvar. */
  useEffect(() => {
    const seq = ++saveSeq.current;

    /* ---- passo 1: texto, sincrono, antes de qualquer await ---- */
    const photos = {};
    let light = null, payload = null, okText = false, errMsg = "";
    try { light = stripPhotos(data, photos); payload = JSON.stringify(light); }
    catch (e) { errMsg = "Falha ao preparar os dados para gravar."; }

    if (payload != null) {
      /* a copia interna de seguranca rotaciona no maximo a cada 30 min:
         gravar ela a cada tecla dobrava o consumo do localStorage (limite ~5 MB) */
      try {
        const lastBak = +(localStorage.getItem(BACKUP_STAMP) || 0);
        if (Date.now() - lastBak > BACKUP_EVERY_MS) {
          const prev = localStorage.getItem(STORAGE_KEY);
          if (prev) { localStorage.setItem(BACKUP_KEY, prev); localStorage.setItem(BACKUP_STAMP, String(Date.now())); }
        }
      } catch (e) { /* copia e opcional — nunca atrapalha a gravacao principal */ }

      try { localStorage.setItem(STORAGE_KEY, payload); okText = true; }
      catch (e) {
        /* cota estourada: libera a copia interna e tenta de novo */
        try {
          localStorage.removeItem(BACKUP_KEY); localStorage.removeItem(BACKUP_STAMP);
          localStorage.setItem(STORAGE_KEY, payload); okText = true;
        } catch (e2) { errMsg = "Espaço do navegador cheio — não foi possível gravar."; }
      }
    }

    if (seq === saveSeq.current) {
      setSaveState((s) => okText
        ? { ok: true, at: Date.now(), err: "", photoWarn: s.photoWarn }
        : { ok: false, at: s.at, err: errMsg || "Não foi possível gravar neste navegador.", photoWarn: s.photoWarn });
    }
    /* ---- passo 2: fotos e nuvem, isolados — ja com o texto salvo ---- */
    (async () => {
      const entries = Object.entries({ ...photoFailRef.current, ...photos });
      if (entries.length) {
        try {
          let existing = new Set();
          try { existing = new Set(await idbAllKeys()); } catch (e) {}
          const toPut = entries.filter(([k]) => !existing.has(k));
          if (toPut.length) await idbPutMany(toPut);
          photoFailRef.current = {};
          if (seq === saveSeq.current) setSaveState((s) => s.photoWarn ? { ...s, photoWarn: false } : s);
        } catch (e) {
          /* guarda as fotos que falharam para tentar de novo na proxima gravacao */
          const keep = {}; entries.forEach(([k, v]) => { keep[k] = v; }); photoFailRef.current = keep;
          if (seq === saveSeq.current) setSaveState((s) => ({ ...s, photoWarn: true }));
        }
      }
      if (okText && sb && session && pulledRef.current) {
        clearTimeout(cloudTimer.current);
        cloudTimer.current = setTimeout(() => { pushToCloud(session.user.id, dataRef.current).catch(() => {}); }, 1200);
      }
    })();
  }, [data]);

  /* ---------- nuvem: envia estado atual (texto + fotos novas) ---------- */
  const pushToCloud = async (uid, curData) => {
    const photos = {}; const light = stripPhotos(curData, photos);
    const cloudKeys = await cloudListPhotoKeys(uid);
    const toUp = Object.entries(photos).filter(([k]) => !cloudKeys.has(k));
    if (toUp.length) await cloudUploadPhotos(uid, toUp);
    const nowISO = new Date().toISOString();
    await cloudPutData(uid, light, nowISO);
    localStorage.setItem(LAST_CLOUD_PUSH, nowISO);
  };

  /* ---------- nuvem: sessao de login ---------- */
  useEffect(() => {
    if (!sb) { setAuthChecked(true); return; }
    let sub = null;
    const applySession = (ses) => setSession((prev) => {
      const pid = prev ? prev.user.id : null;
      const nid = ses ? ses.user.id : null;
      if (pid === nid) return prev;            // mesma conta: nao muda o estado (evita redesenhar a tela e zerar formularios ao alternar janelas)
      if (!nid) pulledRef.current = false;
      return ses;
    });
    sb.auth.getSession().then(({ data }) => { applySession((data && data.session) || null); setAuthChecked(true); });
    const r = sb.auth.onAuthStateChange((evt, ses) => { if (evt === "PASSWORD_RECOVERY") setRecoveryMode(true); applySession(ses); });
    sub = r && r.data ? r.data.subscription : null;
    return () => { if (sub) sub.unsubscribe(); };
  }, []);

  /* ---------- nuvem: perfil (aprovação de acesso) ---------- */
  useEffect(() => {
    if (!sb || !session) { setProfileChecked(!sb); return; }
    let alive = true;
    setProfileChecked(false);
    (async () => {
      try {
        const { data: prof, error } = await sb.from("profiles").select("id, email, approved, is_admin").eq("id", session.user.id).maybeSingle();
        if (!alive) return;
        if (error) { setProfile(null); } else { setProfile(prof || null); }
      } catch (e) { if (alive) setProfile(null); }
      if (alive) setProfileChecked(true);
    })();
    return () => { alive = false; };
  }, [session && session.user.id]);

  /* ---------- nuvem: ao logar, puxa/mescla ---------- */
  useEffect(() => {
    if (!sb || !session) return;
    let alive = true;
    (async () => {
      try {
        const uid = session.user.id;
        const row = await cloudGetData(uid);
        const localPush = Date.parse(localStorage.getItem(LAST_CLOUD_PUSH) || "") || 0;
        const cloudMs = row && row.updated_at ? Date.parse(row.updated_at) : 0;
        if (row && row.data && Object.keys(row.data).length && cloudMs > localPush) {
          const refs = new Set(); collectRefs(row.data, refs);
          let have = new Set(); try { have = new Set(await idbAllKeys()); } catch (e) {}
          const missing = [...refs].filter((k) => !have.has(k));
          if (missing.length) { const dl = await cloudDownloadPhotos(uid, missing); const puts = Object.entries(dl); if (puts.length) await idbPutMany(puts); }
          const map = await idbGetMany([...refs]);
          const hydrated = normalizeData(hydratePhotos(row.data, map));
          if (alive) { setDataQuiet(hydrated); localStorage.setItem(LAST_CLOUD_PUSH, row.updated_at || new Date().toISOString()); notify("Dados sincronizados da nuvem"); }
        } else {
          await pushToCloud(uid, dataRef.current);
        }
        pulledRef.current = true;
      } catch (e) { pulledRef.current = true; if (alive) notify("Sem conexão com a nuvem — usando dados do aparelho"); }
    })();
    return () => { alive = false; };
  }, [session]);

  const up = (patch) => setData((d) => ({ ...d, ...patch }));

  /* ---------- backup ---------- */
  const baixarBackup = (sufixo) => {
    const blob = new Blob([JSON.stringify(dataRef.current, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `printar3d-backup-${todayISO()}${sufixo || ""}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
  };
  const exportBackup = () => {
    baixarBackup();
    try { localStorage.setItem(LAST_BACKUP_KEY, String(Date.now())); } catch (e) {}
    setNeedBackup(false);
    notify("Backup exportado");
  };

  /* backup automatico: a cada N dias de uso o app baixa sozinho um .json */
  useEffect(() => {
    const t = setTimeout(() => {
      try {
        const d = dataRef.current;
        const temDado = (d.projects || []).length || (d.orders || []).length || (d.clients || []).length;
        if (!temDado) return;
        const last = +(localStorage.getItem(AUTOBACKUP_KEY) || 0);
        if (last && (Date.now() - last) < AUTOBACKUP_DAYS * 86400000) return;
        baixarBackup("-auto");
        localStorage.setItem(AUTOBACKUP_KEY, String(Date.now()));
        notify(`Backup automático baixado (a cada ${AUTOBACKUP_DAYS} dias). Está na sua pasta de downloads.`);
      } catch (e) {}
    }, 12000);
    return () => clearTimeout(t);
  }, []);
  const importBackup = (file) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const parsed = JSON.parse(e.target.result);
        if (!parsed || typeof parsed !== "object" || !("filaments" in parsed)) throw new Error();
        setDataQuiet(normalizeData(parsed));
        notify("Backup restaurado com sucesso");
      } catch { notify("Arquivo inválido. Escolha um backup exportado pelo Gestor PrintAR 3D."); }
    };
    reader.readAsText(file);
  };
  const restoreInternal = async () => {
    const raw = localStorage.getItem(BACKUP_KEY);
    if (!raw) { notify("Ainda não há cópia de segurança interna."); return; }
    if (!confirm("Restaurar a última cópia de segurança interna? Os dados atuais serão substituídos.")) return;
    try {
      const parsed = JSON.parse(raw);
      const refs = new Set(); collectRefs(parsed, refs);
      const map = await idbGetMany([...refs]);
      setDataQuiet(normalizeData(hydratePhotos(parsed, map)));
      notify("Cópia de segurança interna restaurada");
    } catch (e) { notify("Não foi possível restaurar a cópia interna."); }
  };

  /* ---------- derived ---------- */
  const thisMonth = monthKey(todayISO());
  const filMap = useMemo(() => Object.fromEntries(data.filaments.map((f) => [f.id, f])), [data.filaments]);
  const projMap = useMemo(() => Object.fromEntries(data.projects.map((p) => [p.id, p])), [data.projects]);
  const matMap = useMemo(() => Object.fromEntries(data.materials.map((m) => [m.id, m])), [data.materials]);
  const cliMap = useMemo(() => Object.fromEntries(data.clients.map((c) => [c.id, c])), [data.clients]);
  /* Projeto em partes: nome das partes que usam um filamento (rotulo da troca de cor no pedido) */
  const isPartsProj = (p) => !!(p && p.printMode === "partes" && (p.parts || []).length);
  const partsLabel = (p, fid) => isPartsProj(p) ? p.parts.filter((pt) => (pt.fils || []).some((x) => x.filamentId === fid)).map((pt) => pt.name || "Parte").join(", ") : "";
  /* Horas por peca ate ficar pronta (impressoras em paralelo). Peca unica = tempo normal. */
  const projWallHours = (p, override) => isPartsProj(p) ? partsWall(p.parts, override) : num(p && p.hours);
  /* Horas de uso por impressora, por peca: [{ printerId, hours }] */
  const orderPrinterHours = (p, order) => isPartsProj(p)
    ? p.parts.map((pt) => ({ printerId: ((order && order.partPrinters) || {})[pt.id] || pt.printerId || "", hours: num(pt.hours), part: pt.name }))
    : [{ printerId: (order && order.printerId) || "", hours: num(p && p.hours) }];
  /* Slots de filamento do projeto (chave estavel para o pedido escolher a cor). */
  const projSlots = (p) => !p ? [] : [
    ...(p.filamentId ? [{ key: "main", label: partsLabel(p, p.filamentId) || p.slotLabel || "Principal", filamentId: p.filamentId, grams: num(p.grams), alts: p.altFils || [] }] : []),
    ...((p.moreFils || []).filter((x) => x.filamentId).map((x, i) => ({ key: x.id || ("mf" + i), label: partsLabel(p, x.filamentId) || x.label || `Filamento ${i + 2}`, filamentId: x.filamentId, grams: num(x.grams), alts: x.altFils || [] }))),
  ];
  /* Custo do filamento por peca (R$), somando todos os slots. */
  const filCostPerPiece = (slots, choices) => slots.reduce((s, sl) => {
    const fid = (choices || {})[sl.key] || sl.filamentId;
    const fl = filMap[fid];
    return s + (fl ? num(sl.grams) * (num(fl.price) / Math.max(1, num(fl.qtyG))) : 0);
  }, 0);
  /* Custo do pedido = custo do projeto +/- diferenca de preco do filamento escolhido. */
  const orderUnitCost = (p, choices) => {
    if (!p) return 0;
    const slots = projSlots(p);
    return num(p.cost) + (filCostPerPiece(slots, choices) - filCostPerPiece(slots, null));
  };
  /* Filamentos realmente consumidos por peca, aplicando as trocas de cor do pedido. */
  const orderFilaments = (p, order) => projSlots(p).map((s) => ({
    filamentId: ((order && order.filChoices) || {})[s.key] || s.filamentId,
    grams: s.grams,
  }));

  /* v4.41: cor escolhida por item (orcamento/pedido) */
  const itemColors = (p, choices) => projSlots(p).map((s) => ({ key: s.key, label: s.label, fil: filMap[((choices || {})[s.key]) || s.filamentId] })).filter((x) => x.fil);
  const colorName = (fl) => (fl && (fl.color || fl.name)) || "—";
  const itemColorsText = (p, choices) => { const cs = itemColors(p, choices); return cs.length === 1 ? colorName(cs[0].fil) : cs.map((c) => `${c.label}: ${colorName(c.fil)}`).join(" · "); };
  const itemColorsLine = (p, choices, light) => {
    const cs = itemColors(p, choices);
    if (!cs.length) return null;
    return (
      <div className="item-colors" style={{ display: "flex", gap: 10, flexWrap: "wrap", alignItems: "center", font: "500 11px Inter,sans-serif", color: light ? "#64787A" : "#93A6A6", marginTop: 2 }}>
        <span>{cs.length === 1 ? "Cor:" : "Cores:"}</span>
        {cs.map((c) => (
          <span key={c.key} style={{ display: "inline-flex", alignItems: "center", gap: 4, color: light ? "#22302F" : "#D6E2E2" }}>
            {cs.length > 1 && <span style={{ color: light ? "#78898A" : "#8FA3A3" }}>{c.label}:</span>}
            {colorName(c.fil)}<ColorDot hex={c.fil.colorHex} size={11} title={c.fil.name} />
          </span>
        ))}
      </div>
    );
  };
  /* opcoes de filamento com as cores disponiveis do projeto primeiro (★) */
  const filOptionsFor = (p) => {
    const disp = new Set(projColors(p).map((c) => colorKey(c.name)));
    const isD = (x) => disp.has(colorKey(x.color));
    return data.filaments.slice().sort((a, b) => (isD(b) ? 1 : 0) - (isD(a) ? 1 : 0))
      .map((x) => ({ value: x.id, label: (isD(x) ? "★ " : "") + x.name, sub: (x.color || "sem cor") + (isD(x) ? " · cor disponível" : "") + " · " + fmtN(x.stockG) + "g" }));
  };

  // nome do projeto do pedido; se o projeto foi excluido, usa o nome gravado no pedido
  const projName = (o) => { const p = projMap[o.projectId]; return (p && p.name) || o.projectName || "—"; };
  const prodQty = (projectId) => { const e = data.products.find((x) => x.projectId === projectId); return e ? num(e.qty) : 0; };
  const reservedQty = (projectId, exceptQuoteId) => (data.quotes || [])
    .filter((q) => q.status === "Pendente" && (!q.validUntil || q.validUntil >= todayISO()) && q.id !== exceptQuoteId)
    .reduce((s, q) => s + (q.items || []).filter((it) => it.fromStock && it.projectId === projectId).reduce((a, it) => a + num(it.qty), 0), 0);
  const availableQty = (projectId, exceptQuoteId) => Math.max(0, prodQty(projectId) - reservedQty(projectId, exceptQuoteId));
  const prodHistory = (projectId, from, to) => {
    const evs = [];
    data.orders.filter((o) => o.projectId === projectId && isDone(o)).forEach((o) => {
      const cli = cliMap[o.clientId];
      if (o.dest === "estoque") evs.push({ id: o.id, date: o.date, ts: o.ts, kind: "in", delta: num(o.qty), label: "Produção para estoque", detail: "" });
      else if (o.fromStock) evs.push({ id: o.id, date: o.date, ts: o.ts, kind: "out", delta: -num(o.qty), label: "Venda do estoque", detail: `${cli ? cli.name : "venda avulsa"} · ${fmt(o.price)}${o.quoteCode ? ` · ${o.quoteCode}` : ""}` });
      else evs.push({ id: o.id, date: o.date, ts: o.ts, kind: "direct", delta: 0, label: "Venda direta (produção sob demanda)", detail: `${cli ? cli.name : "venda avulsa"} · ${fmt(o.price)}${o.quoteCode ? ` · ${o.quoteCode}` : ""}` });
    });
    (data.prodMoves || []).filter((m) => m.projectId === projectId).forEach((m) =>
      evs.push({ id: m.id, date: m.date, ts: m.ts, kind: num(m.delta) >= 0 ? "in" : "out", delta: num(m.delta), label: m.note || "Ajuste manual", detail: "" }));
    evs.sort((a, b) => ((a.ts || a.date || "") < (b.ts || b.date || "") ? -1 : 1));
    let saldo = 0;
    evs.forEach((e) => { saldo += e.delta; e.saldo = saldo; });
    return evs.filter((e) => (!from || e.date >= from) && (!to || e.date <= to));
  };

  const isDone = (o) => ["Concluído", "Entregue"].includes(o.status);
  const isSale = (o) => o.dest !== "estoque" && o.dest !== "brinde" && o.dest !== "avulso";
  const salesOrders = data.orders.filter((o) => isDone(o) && isSale(o));
  const producedOrders = data.orders.filter((o) => isDone(o) && !o.fromStock);

  const monthRevenue = salesOrders.filter((o) => monthKey(o.date) === thisMonth).reduce((s, o) => s + num(o.price), 0);
  const monthCost = salesOrders.filter((o) => monthKey(o.date) === thisMonth).reduce((s, o) => s + num(o.cost), 0);
  const monthExpenses = data.expenses.filter((e) => monthKey(e.date) === thisMonth).reduce((s, e) => s + num(e.value), 0);
  const monthProfit = monthRevenue - monthCost - monthExpenses;
  const monthPrints = producedOrders.filter((o) => monthKey(o.date) === thisMonth).reduce((s, o) => s + num(o.qty), 0);
  const monthHours = producedOrders.filter((o) => monthKey(o.date) === thisMonth)
    .reduce((s, o) => s + num(projMap[o.projectId] ? projMap[o.projectId].hours : 0) * num(o.qty), 0);
  const stockTotal = data.filaments.reduce((s, f) => s + num(f.stockG), 0);
  const productsTotal = data.products.reduce((s, p) => s + num(p.qty), 0);

  const lowStock = data.filaments.filter((f) => num(f.stockG) < num(data.settings.lowStockG));
  const lowMaterials = data.materials.filter((m) => num(m.stock) <= num(m.minStock));
  const maintDue = data.printers.filter((p) => num(p.hoursUsed) - num(p.lastMaintH || 0) >= num(data.settings.maintEveryH));
  const lateOrders = data.orders.filter((o) => o.dueDate && o.dueDate < todayISO() && !isDone(o));

  const activeProjects = data.projects.filter((p) => p.active !== false);
  /* ---------- v4.39: cores disponiveis e kits ---------- */
  const projColors = (p) => (p && p.colorsOn ? (p.extraColors || []).filter((c) => c && c.name) : []);
  const projOwnColors = (p) => projFilaments(p).map((x) => filMap[x.filamentId]).filter(Boolean).map((fl) => fl.color);
  const kitMap = Object.fromEntries((data.kits || []).map((k) => [k.id, k]));
  const refPrice = (p) => (num(p.salePrice) > 0 ? num(p.salePrice) : num(p.cost) * (1 + num(data.settings.defaultMargin) / 100));
  const kitLines = (k) => ((k && k.items) || []).map((it) => ({ ...it, p: projMap[it.projectId] })).filter((x) => x.p && num(x.qty) > 0);
  const kitSum = (k) => kitLines(k).reduce((s, x) => s + num(x.qty) * refPrice(x.p), 0);
  const kitCost = (k) => kitLines(k).reduce((s, x) => s + num(x.qty) * num(x.p.cost), 0);
  const kitReady = (k) => kitLines(k).length > 0 && kitLines(k).every((x) => availableQty(x.p.id) >= num(x.qty));
  const kitHasColors = (k) => kitLines(k).some((x) => projColors(x.p).length > 0);
  const kitItemsText = (k) => kitLines(k).map((x) => `${fmtN(x.qty)}× ${x.p.name}`).join(" · ");
  /* item de catalogo (projeto ou kit) num formato unico */
  const catEntry = (id) => {
    const p = projMap[id];
    if (p) return { id, kit: false, name: p.name, image: p.image, gallery: p.gallery || [], niches: projNiches(p), desc: p.catalogDesc || "",
      price: num(p.salePrice) > 0 ? num(p.salePrice) : null, colors: projColors(p), colorsNote: "", items: "", savings: 0 };
    const k = kitMap[id];
    if (k) { const sum = kitSum(k); return { id, kit: true, name: k.name, image: k.image, gallery: k.gallery || [], niches: projNiches(k), desc: k.desc || "",
      price: num(k.price) > 0 ? num(k.price) : null, colors: [], colorsNote: kitHasColors(k) ? "Consultar cores disponíveis" : "", items: kitItemsText(k),
      savings: num(k.price) > 0 && sum > num(k.price) + 0.004 ? sum - num(k.price) : 0, ready: kitReady(k) }; }
    return null;
  };
  const projFilaments = (p) => [
    ...(p && p.filamentId ? [{ filamentId: p.filamentId, grams: num(p.grams) }] : []),
    ...(((p && p.moreFils) || []).filter((x) => x.filamentId).map((x) => ({ filamentId: x.filamentId, grams: num(x.grams) }))),
  ];
  const pendingOrdersList = data.orders.filter((o) => !isDone(o));
  const unpaidSales = data.orders.filter((o) => isDone(o) && isSale(o) && !o.paid);
  const backlogHours = pendingOrdersList.filter((o) => !o.fromStock)
    .reduce((s, o) => s + (projMap[o.projectId] ? projWallHours(projMap[o.projectId], o.partPrinters) : 0) * num(o.qty), 0);
  const monthFixedTotal = (data.fixedCosts || []).reduce((s, c) => s + num(c.value), 0);
  const openQuotes = (data.quotes || []).filter((q) => q.status === "Pendente");

  const last6 = useMemo(() => {
    const out = [];
    const d = new Date();
    for (let i = 5; i >= 0; i--) {
      const dt = new Date(d.getFullYear(), d.getMonth() - i, 1);
      const k = dt.toISOString().slice(0, 7);
      const label = dt.toLocaleDateString("pt-BR", { month: "short" });
      const rev = salesOrders.filter((o) => monthKey(o.date) === k).reduce((s, o) => s + num(o.price), 0);
      const cost = salesOrders.filter((o) => monthKey(o.date) === k).reduce((s, o) => s + num(o.cost), 0);
      const exp = data.expenses.filter((e) => monthKey(e.date) === k).reduce((s, e) => s + num(e.value), 0);
      out.push({ mes: label, Faturamento: +rev.toFixed(2), Gastos: +(cost + exp).toFixed(2), Lucro: +(rev - cost - exp).toFixed(2) });
    }
    return out;
  }, [data]);

  const revenueByNiche = useMemo(() => {
    const m = {};
    salesOrders.forEach((o) => {
      const p = projMap[o.projectId];
      const n = (p && p.niche) || "Sem nicho";
      m[n] = (m[n] || 0) + num(o.price);
    });
    return Object.entries(m).map(([name, value]) => ({ name, value: +value.toFixed(2) })).filter((x) => x.value > 0);
  }, [data]);

  /* ---------- mutations ---------- */
  const saveItem = (key, item) => {
    setData((d) => {
      const list = d[key];
      const i = list.findIndex((x) => x.id === item.id);
      const next = i >= 0 ? list.map((x) => (x.id === item.id ? item : x)) : [...list, item];
      return { ...d, [key]: next };
    });
  };
  const ENTITY_LABEL = { projects: "Projeto", filaments: "Filamento", materials: "Material", printers: "Impressora", clients: "Cliente", quotes: "Orçamento", kits: "Kit", fixedCosts: "Custo fixo", products: "Produto", orders: "Pedido", expenses: "Investimento", cashflow: "Lançamento", prodMoves: "Movimentação" };
  const delItem = (key, id) => {
    const snap = data;
    setData((d) => ({ ...d, [key]: d[key].filter((x) => x.id !== id) }));
    notify(`${ENTITY_LABEL[key] || "Item"} excluído`, snap);
  };

  const addNiche = (name) => {
    const n = (name || "").trim();
    if (!n) return;
    setData((d) => d.settings.niches.includes(n) ? d : { ...d, settings: { ...d.settings, niches: [...d.settings.niches, n] } });
  };

  const materialMovement = (materialId, type, qty, note) => {
    setData((d) => ({
      ...d,
      materials: d.materials.map((m) => m.id === materialId ? {
        ...m,
        stock: Math.max(0, num(m.stock) + (type === "entrada" ? num(qty) : -num(qty))),
        movements: [{ id: uid(), date: todayISO(), type, qty: num(qty), note: note || "" }, ...(m.movements || [])],
      } : m),
    }));
  };

  const changeProductStock = (list, projectId, delta) => {
    const ex = list.find((x) => x.projectId === projectId);
    if (ex) return list.map((x) => x.projectId === projectId ? { ...x, qty: Math.max(0, num(x.qty) + delta) } : x);
    return delta > 0 ? [...list, { id: uid(), projectId, qty: delta }] : list;
  };


  /* v4.41: baixa de filamento / horas / materiais para N pecas (sign = -1 devolve).
     printerId: impressora escolhida no registro da impressao (peca unica); em partes vale a de cada parte. */
  const consumeIn = (d, p, order, pieces, printerId, sign = 1, note) => {
    const q = num(pieces);
    const out = { filaments: d.filaments, printers: d.printers, materials: d.materials, grams: 0, hours: 0 };
    if (!p || !(q > 0)) return out;
    const filsUsed = orderFilaments(p, order);
    out.grams = filsUsed.reduce((s, x) => s + num(x.grams), 0) * q;
    if (filsUsed.length) out.filaments = d.filaments.map((f) => {
      const per = filsUsed.filter((x) => x.filamentId === f.id).reduce((s, x) => s + num(x.grams), 0);
      return per > 0 ? { ...f, stockG: Math.max(0, +(num(f.stockG) - sign * per * q).toFixed(2)) } : f;
    });
    const prH = (isPartsProj(p) || !printerId ? orderPrinterHours(p, order) : [{ printerId, hours: num(p.hours) }]).filter((x) => x.printerId && x.hours > 0);
    out.hours = prH.reduce((s, x) => s + x.hours, 0) * q;
    if (prH.length) out.printers = d.printers.map((pr) => {
      const h = prH.filter((x) => x.printerId === pr.id).reduce((s, x) => s + x.hours, 0) * q;
      return h > 0 ? { ...pr, hoursUsed: Math.max(0, +(num(pr.hoursUsed) + sign * h).toFixed(4)) } : pr;
    });
    if (p.extras && p.extras.length) out.materials = d.materials.map((m) => {
      const ex = p.extras.find((e) => e.materialId === m.id);
      if (!ex) return m;
      const mq = num(ex.qty) * q;
      return { ...m, stock: Math.max(0, num(m.stock) - sign * mq),
        movements: [{ id: uid(), date: todayISO(), type: sign > 0 ? "saida" : "entrada", qty: mq, note: note || (sign > 0 ? `Produção: ${p.name}` : `Estorno de produção: ${p.name}`) }, ...(m.movements || [])] };
    });
    return out;
  };
  /* ---------- v4.44: impressao por parte ---------- */
  /* registros antigos sem parte (peca inteira) contam para todas as partes */
  const partPrinted = (o, pid) => ((o && o.prints) || []).filter((x) => !x.partId || x.partId === pid).reduce((s, x) => s + num(x.qty), 0);
  const piecesPrinted = (o, p) => (p && isPartsProj(p) ? Math.min(...p.parts.map((pt) => partPrinted(o, pt.id))) : ((o && o.prints) || []).reduce((s, x) => s + num(x.qty), 0));
  /* filamentos de uma parte, ja com a cor escolhida no pedido (troca de filamento) */
  const partFils = (p, order, part) => {
    const map = {};
    projSlots(p).forEach((s) => { map[s.filamentId] = ((order && order.filChoices) || {})[s.key] || s.filamentId; });
    return (part.fils || []).filter((x) => x.filamentId && num(x.grams) > 0).map((x) => ({ filamentId: map[x.filamentId] || x.filamentId, grams: num(x.grams) }));
  };
  const partPrinterOf = (order, part) => ((order && order.partPrinters) || {})[part.id] || part.printerId || "";
  const consumePartIn = (d, p, order, part, pieces, printerId, sign = 1) => {
    const q = num(pieces);
    const out = { filaments: d.filaments, printers: d.printers, grams: 0, hours: 0 };
    if (!(q > 0)) return out;
    const fs = partFils(p, order, part);
    out.grams = fs.reduce((s, x) => s + x.grams, 0) * q;
    out.filaments = d.filaments.map((f) => { const per = fs.filter((x) => x.filamentId === f.id).reduce((s, x) => s + x.grams, 0); return per > 0 ? { ...f, stockG: Math.max(0, +(num(f.stockG) - sign * per * q).toFixed(2)) } : f; });
    const pid = printerId || partPrinterOf(order, part);
    out.hours = num(part.hours) * q;
    if (pid && out.hours > 0) out.printers = d.printers.map((pr) => (pr.id === pid ? { ...pr, hoursUsed: Math.max(0, +(num(pr.hoursUsed) + sign * out.hours).toFixed(4)) } : pr));
    return out;
  };
  const consumeExtrasIn = (d, p, pieces, sign = 1) => {
    const q = num(pieces);
    if (!(q > 0) || !p.extras || !p.extras.length) return d.materials;
    return d.materials.map((m) => {
      const ex = p.extras.find((e) => e.materialId === m.id);
      if (!ex) return m;
      const mq = num(ex.qty) * q;
      return { ...m, stock: Math.max(0, num(m.stock) - sign * mq), movements: [{ id: uid(), date: todayISO(), type: sign > 0 ? "saida" : "entrada", qty: mq, note: `${sign > 0 ? "Produção" : "Estorno de produção"}: ${p.name}` }, ...(m.movements || [])] };
    });
  };
  /* pedido em partes que ja teve parte registrada: inicia o controle por parte */
  const ensurePartDone = (o, p) => {
    if (o.partDone) return o;
    const legacy = num(o.consumedQty);
    return { ...o, partDone: Object.fromEntries(p.parts.map((pt) => [pt.id, legacy])), extrasQty: legacy };
  };
  const setOrderStatus = (order, status) => setData((d) => applyOrderStatus(d, order, status));
  const applyOrderStatus = (d, order, status) => {
    {
      let filaments = d.filaments, printers = d.printers, materials = d.materials, products = d.products;
      let cashflow = d.cashflow || [];
      let o = { ...order, status };
      const done = ["Concluído", "Entregue"].includes(status);
      if (done && !order.processed) {
        o.ts = o.ts || nowStamp();
        const p = d.projects.find((x) => x.id === order.projectId);
        if (p) {
          /* pecas que ainda nao tiveram baixa (as impressoes registradas ja baixaram as delas) */
          const rest = Math.max(0, num(order.qty) - num(order.consumedQty));
          const prHours = orderPrinterHours(p, order).filter((x) => x.printerId && x.hours > 0);
          let gramsUsed = 0, hoursUsed = 0;
          if (!order.fromStock && isPartsProj(p) && order.partDone) {
            /* em partes: baixa so o que falta de cada parte + materiais das pecas que faltam */
            let dd = { ...d };
            const pd = { ...order.partDone };
            p.parts.forEach((pt) => {
              const r = Math.max(0, num(order.qty) - num(pd[pt.id]));
              if (r > 0) { const c = consumePartIn(dd, p, order, pt, r, null, 1); dd = { ...dd, filaments: c.filaments, printers: c.printers }; gramsUsed += c.grams; hoursUsed += c.hours; pd[pt.id] = num(pd[pt.id]) + r; }
            });
            const rx = Math.max(0, num(order.qty) - num(order.extrasQty));
            materials = consumeExtrasIn(dd, p, rx, 1);
            filaments = dd.filaments; printers = dd.printers;
            o.partDone = pd; o.extrasQty = num(order.extrasQty) + rx; o.consumedQty = Math.max(num(order.consumedQty), num(order.qty));
          } else if (!order.fromStock && rest > 0) {
            const c = consumeIn(d, p, order, rest, null, 1);
            filaments = c.filaments; printers = c.printers; materials = c.materials;
            gramsUsed = c.grams; hoursUsed = c.hours;
            o.consumedQty = num(order.consumedQty) + rest;
          }
          if (order.dest === "estoque") {
            products = changeProductStock(d.products, order.projectId, num(order.qty));
            notify(`Produção concluída: -${fmtN(gramsUsed)}g de filamento · +${fmtN(order.qty)} un de "${p.name}" no estoque de produtos`);
          } else if (order.dest === "brinde" && !order.fromStock) {
            // Brinde/Teste apenas consome material e coloca a peca no estoque.
            // Nada vai para o financeiro: se a peca for vendida depois, a venda
            // (com receita e custo) e registrada na saida do estoque.
            products = changeProductStock(d.products, order.projectId, num(order.qty));
            notify(`Brinde/Teste registrado: -${fmtN(gramsUsed)}g de filamento · +${fmtN(order.qty)} un no estoque de produtos`);
          } else if (!order.fromStock) {
            notify(`Baixa automática: -${fmtN(gramsUsed)}g de filamento${(p.extras && p.extras.length) ? " · materiais extras" : ""}${hoursUsed > 0 ? ` · +${fmtN(hoursUsed, 1)}h ${prHours.length > 1 ? "nas impressoras" : "na impressora"}` : ""}`);
          }
          o.processed = true;
        }
      }
      return { ...d, filaments, printers, materials, products, cashflow, orders: d.orders.map((x) => (x.id === order.id ? o : x)) };
    }
  };
  /* v4.41: registrar impressao parcial. extraDest: "estoque" | "brinde" para pecas alem do pedido.
     finishShort: concluir com o que foi impresso (menos que o pedido). */
  const registerPrint = (order, { qty, printerId, date, extraDest, finishShort, parts: partRegs }) => {
    const p = projMap[order.projectId];
    if (!p) return;
    let msg = "";
    const regs = isPartsProj(p) && partRegs ? partRegs.filter((r) => num(r.qty) > 0 && p.parts.some((pt) => pt.id === r.partId)) : null;
    if (regs) {
      const c0 = data.orders.find((x) => x.id === order.id) || order;
      const tot0 = num(c0.qty), before = piecesPrinted(c0, p);
      const sim = { ...c0, prints: [...(c0.prints || []), ...regs.map((r) => ({ partId: r.partId, qty: r.qty }))] };
      const after = piecesPrinted(sim, p);
      const names = regs.map((r) => `${fmtN(r.qty)}× ${(p.parts.find((pt) => pt.id === r.partId) || {}).name || "parte"}`).join(" + ");
      logAs(`Registrou impressão (parte): ${names} de ${p.name} × ${fmtN(tot0)}${after >= tot0 ? " — produção completa" : ` (${fmtN(after)}/${fmtN(tot0)} peças prontas)`}${after > before && after < tot0 ? "" : ""}`);
    } else {
      const c0 = data.orders.find((x) => x.id === order.id) || order;
      const pr0 = printedOf(c0), tot0 = num(c0.qty), qq = Math.max(0, Math.round(num(qty)));
      const nm = `${p.name} × ${fmtN(tot0)}`;
      logAs(finishShort ? `Concluiu com ${fmtN(pr0)} de ${fmtN(tot0)}: ${p.name}`
        : pr0 + qq >= tot0 ? `Registrou impressão: ${fmtN(qq)} de ${nm} — produção completa${pr0 + qq > tot0 ? ` (${fmtN(pr0 + qq - tot0)} a mais ${extraDest === "brinde" ? "de brinde" : "para o estoque"})` : ""}`
        : `Registrou impressão: ${fmtN(qq)} de ${nm} (${fmtN(pr0 + qq)}/${fmtN(tot0)})`);
    }
    setData((d) => {
      const cur = d.orders.find((x) => x.id === order.id) || order;
      const q = regs ? 0 : Math.max(0, Math.round(num(qty)));
      let dd = d;
      let o = { ...cur };
      if (regs && regs.length) {
        o = ensurePartDone(o, p);
        const pd = { ...o.partDone }; let g = 0, h = 0;
        regs.forEach((r) => {
          const pt = p.parts.find((x) => x.id === r.partId);
          const rq = Math.max(0, Math.round(num(r.qty)));
          const pid = r.printerId || partPrinterOf(o, pt);
          const c = consumePartIn(dd, p, o, pt, rq, pid, 1);
          dd = { ...dd, filaments: c.filaments, printers: c.printers }; g += c.grams; h += c.hours;
          o.prints = [...(o.prints || []), { id: uid(), date: date || todayISO(), qty: rq, printerId: pid, partId: pt.id }];
          pd[pt.id] = num(pd[pt.id]) + rq;
        });
        o.partDone = pd;
        const pieces = piecesPrinted(o, p);
        if (pieces > num(o.extrasQty)) { dd = { ...dd, materials: consumeExtrasIn(dd, p, pieces - num(o.extrasQty), 1) }; o.extrasQty = pieces; }
        o.consumedQty = Math.max(num(o.consumedQty), Math.min(pieces, num(o.qty)));
        if (["Orçamento", "Aprovado"].includes(o.status)) o.status = "Em produção";
        msg = `Parte registrada · −${fmtN(g)}g de filamento${h > 0 ? ` · +${fmtN(h, 1)}h` : ""} · ${fmtN(pieces)} de ${fmtN(o.qty)} peça(s) pronta(s)`;
      }
      if (q > 0) {
        const c = consumeIn(dd, p, o, q, printerId, 1);
        dd = { ...dd, filaments: c.filaments, printers: c.printers, materials: c.materials };
        o.prints = [...(o.prints || []), { id: uid(), date: date || todayISO(), qty: q, printerId: isPartsProj(p) ? "" : (printerId || "") }];
        o.consumedQty = num(o.consumedQty) + q;
        if (!o.printerId && printerId && !isPartsProj(p)) o.printerId = printerId;
        if (["Orçamento", "Aprovado"].includes(o.status)) o.status = "Em produção";
        msg = `+${fmtN(q)} impressa(s) · −${fmtN(c.grams)}g de filamento${c.hours > 0 ? ` · +${fmtN(c.hours, 1)}h` : ""}`;
      }
      const printed = piecesPrinted(o, p);
      const total = num(o.qty);
      if (finishShort && printed > 0 && printed < total) {
        /* conclui com menos pecas: quantidade e custo acompanham; o valor de venda fica como estava */
        const unit = num(o.cost) / Math.max(1, total);
        o = { ...o, qtyOrdered: total, qty: printed, cost: (unit * printed).toFixed(2) };
        dd = { ...dd, orders: dd.orders.map((x) => (x.id === o.id ? o : x)) };
        dd = applyOrderStatus(dd, o, "Concluído");
        msg = `Pedido concluído com ${fmtN(printed)} de ${fmtN(total)} peça(s)`;
      } else if (printed >= total && total > 0) {
        const extra = printed - total;
        dd = { ...dd, orders: dd.orders.map((x) => (x.id === o.id ? o : x)) };
        dd = applyOrderStatus(dd, o, "Concluído");
        if (extra > 0) {
          if (extraDest === "brinde") {
            dd = { ...dd, orders: [...dd.orders, {
              id: uid(), projectId: o.projectId, projectName: p.name, clientId: o.clientId || "", qty: extra, date: todayISO(), dueDate: "", price: "",
              cost: (orderUnitCost(p, o.filChoices) * extra).toFixed(2), status: "Entregue", printerId: "", paid: false, processed: true, fromStock: true,
              dest: "brinde", ts: nowStamp(), giftNote: `peça(s) a mais do pedido ${projName(o)} × ${fmtN(total)}`,
              ...(o.filChoices ? { filChoices: o.filChoices } : {}), extraOf: o.id,
            }] };
          } else {
            dd = { ...dd, products: changeProductStock(dd.products, o.projectId, extra) };
          }
        }
        msg = `Produção completa: ${fmtN(printed)} de ${fmtN(total)} — pedido concluído${extra > 0 ? ` · ${fmtN(extra)} a mais ${extraDest === "brinde" ? "de brinde para o cliente" : "para o estoque"}` : ""}`;
      } else {
        dd = { ...dd, orders: dd.orders.map((x) => (x.id === o.id ? o : x)) };
        if (q > 0) msg += ` · ${fmtN(printed)} de ${fmtN(total)} (faltam ${fmtN(total - printed)})`;
      }
      return dd;
    });
    setTimeout(() => { if (msg) notify(msg); }, 0);
  };
  /* apaga um registro de impressao (antes de concluir) e devolve filamento/horas/materiais */
  const removePrint = (order, printId) => {
    const p = projMap[order.projectId];
    { const pr = (order.prints || []).find((x) => x.id === printId); const pt = pr && pr.partId && p && isPartsProj(p) ? p.parts.find((x) => x.id === pr.partId) : null; logAs(`Apagou registro de impressão: ${pr ? fmtN(pr.qty) : ""}${pt ? `× ${pt.name || "parte"}` : ""} de ${projName(order)} × ${fmtN(order.qty)}`); }
    setData((d) => {
      const cur = d.orders.find((x) => x.id === order.id) || order;
      const pr = (cur.prints || []).find((x) => x.id === printId);
      if (!pr || cur.processed) return d;
      const pt = pr.partId && p && isPartsProj(p) ? p.parts.find((x) => x.id === pr.partId) : null;
      if (pt) {
        /* registro de uma parte: devolve so aquela parte (e os materiais se a peca deixou de estar completa) */
        const c = consumePartIn(d, p, cur, pt, num(pr.qty), pr.printerId, -1);
        let o = { ...cur, prints: cur.prints.filter((x) => x.id !== printId), partDone: { ...(cur.partDone || {}), [pt.id]: Math.max(0, num((cur.partDone || {})[pt.id]) - num(pr.qty)) } };
        let materials = d.materials;
        const pieces = piecesPrinted(o, p);
        if (pieces < num(o.extrasQty)) { materials = consumeExtrasIn(d, p, num(o.extrasQty) - pieces, -1); o.extrasQty = pieces; }
        o.consumedQty = Math.min(num(o.consumedQty), pieces);
        return { ...d, filaments: c.filaments, printers: c.printers, materials, orders: d.orders.map((x) => (x.id === o.id ? o : x)) };
      }
      const c = consumeIn(d, p, cur, num(pr.qty), pr.printerId, -1);
      const o = { ...cur, prints: cur.prints.filter((x) => x.id !== printId), consumedQty: Math.max(0, num(cur.consumedQty) - num(pr.qty)) };
      return { ...d, filaments: c.filaments, printers: c.printers, materials: c.materials, orders: d.orders.map((x) => (x.id === o.id ? o : x)) };
    });
    notify("Registro de impressão apagado — filamento e horas devolvidos");
  };

  const sellFromStock = (form) => {
    const p = projMap[form.projectId];
    if (!p) return false;
    const gift = form.mode === "brinde";
    const res = reservedQty(form.projectId);
    const avail = availableQty(form.projectId);
    const want = num(form.qty);
    if (avail <= 0) { notify(res > 0 ? "Estoque deste produto está reservado em orçamento pendente." : "Sem estoque suficiente deste produto."); return false; }
    let q = want; let price = gift ? 0 : num(form.price);
    if (want > avail) {
      if (!confirm(`⚠ Você pediu ${fmtN(want)} un, mas só ${fmtN(avail)} estão disponíveis${res > 0 ? ` (${fmtN(res)} reservadas em orçamento pendente)` : ""}.\n\n${gift ? `Dar as ${fmtN(avail)} disponíveis como brinde?` : "Vender as " + fmtN(avail) + " disponíveis? O valor será ajustado proporcionalmente."}`)) return false;
      if (!gift) price = +(price * avail / want).toFixed(2);
      q = avail;
    }
    const cli = cliMap[form.clientId];
    const cost = num(p.cost) * q;
    if (gift) {
      if (!confirm(`CONFIRMAR BRINDE\n\n${fmtN(q)}× ${p.name}\nCliente: ${cli ? cli.name : "sem cliente"}\nReceita: R$ 0,00 (brinde — não entra no faturamento)\nCusto do produto já produzido: ${fmt(cost)}\n\nAs peças saem do estoque. Confirmar?`)) return false;
    } else if (!confirm(`CONFIRMAR VENDA\n\n${fmtN(q)}× ${p.name}\nCliente: ${cli ? cli.name : "venda avulsa"}\nValor da venda: ${fmt(price)}\nCusto do produto: ${fmt(cost)}\nLucro: ${fmt(price - cost)}\n\nConfirmar?`)) return false;
    setData((d) => {
      let products = changeProductStock(d.products, form.projectId, -q);
      return {
        ...d,
        products,
        orders: [...d.orders, {
          id: uid(), projectId: form.projectId, projectName: p.name, clientId: form.clientId || "", qty: q,
          date: form.date, dueDate: "", price: gift ? "" : price, cost: cost.toFixed(2),
          status: "Entregue", printerId: "", paid: gift ? false : !!form.paid, processed: true, fromStock: true,
          dest: gift ? "brinde" : "venda", ts: nowStamp(),
          ...(gift ? { giftNote: (form.giftNote || "").trim() } : {}),
        }],
      };
    });
    notify(gift
      ? `Brinde registrado: ${fmtN(q)}× ${p.name}${cli ? ` para ${cli.name}` : ""} · sem receita (saiu do estoque)`
      : `Venda confirmada: ${fmtN(q)}× ${p.name}${cli ? ` para ${cli.name}` : ""} · ${fmt(price)} (lucro ${fmt(price - cost)})`);
    return true;
  };

  const clientOrders = (clientId) => data.orders.filter((o) => o.clientId === clientId);

  /* ---------- orçamentos ---------- */
  const nextQuoteCode = (dateISO) => {
    const key = (dateISO || todayISO()).replace(/-/g, "");
    const n = (data.quotes || []).filter((q) => (q.code || "").indexOf(`ORC-${key}`) === 0).length + 1;
    return `ORC-${key}-${String(n).padStart(4, "0")}`;
  };
  const quoteHours = (q) => (q.items || []).reduce((s, it) => {
    const p = projMap[it.projectId];
    return s + (p ? projWallHours(p) * num(it.qty) : 0);
  }, 0);
  const quoteTotal = (q) => Math.max(0, (q.items || []).reduce((s, it) => s + num(it.qty) * num(it.unitPrice), 0) - num(q.discount));
  const estimateDeadline = (extraHours) => {
    /* v4.43: impressoras trabalham juntas — o prazo considera a fila de cada uma */
    const perDay = Math.max(1, num(data.settings.prodHoursPerDay) || 8);
    const h = data.printers.length > 1 ? parallelFinishHours(extraHours) : backlogHours + num(extraHours);
    const days = Math.max(1, Math.ceil(h / perDay) + 1);
    return { days, date: addDays(todayISO(), days), hours: h };
  };
  const setQuoteStatus = (quote, status) => {
    if (status === "Aprovado" && quote.status !== "Aprovado") {
      setData((d) => {
        let products = d.products;
        const newOrders = [];
        (quote.items || []).filter((it) => it.projectId && projMap[it.projectId]).forEach((it) => {
          const p = projMap[it.projectId];
          const unitPrice = num(it.unitPrice);
          const mk = (qty, fromStock) => ({
            id: uid(), projectId: it.projectId, clientId: quote.clientId || "", qty,
            date: todayISO(), dueDate: fromStock ? todayISO() : (quote.deadline || ""), price: (qty * unitPrice).toFixed(2),
            cost: (orderUnitCost(p, it.filChoices) * qty).toFixed(2), status: "Aprovado", printerId: "", paid: false,
            processed: fromStock, fromStock, dest: "venda", quoteCode: quote.code, ts: fromStock ? nowStamp() : undefined,
            ...(it.filChoices && Object.keys(it.filChoices).length ? { filChoices: { ...it.filChoices } } : {}),
          });
          if (it.fromStock) {
            const cur = products.find((x) => x.projectId === it.projectId);
            const take = Math.min(num(it.qty), cur ? num(cur.qty) : 0);
            if (take > 0) {
              products = changeProductStock(products, it.projectId, -take);
              newOrders.push(mk(take, true));
            }
            const remainder = num(it.qty) - take;
            if (remainder > 0) newOrders.push(mk(remainder, false));
          } else {
            newOrders.push(mk(num(it.qty), false));
          }
        });
        /* v4.42: desconto do orcamento dividido entre os pedidos (proporcional ao valor, fechando no centavo) */
        const disc = Math.round(Math.min(num(quote.discount), newOrders.reduce((s, o) => s + num(o.price), 0)) * 100);
        if (disc > 0) {
          const cents = newOrders.map((o) => Math.round(num(o.price) * 100));
          const tot = cents.reduce((s, c) => s + c, 0);
          const share = cents.map((c) => Math.floor((disc * c) / tot));
          let rest = disc - share.reduce((s, c) => s + c, 0);
          const order = cents.map((c, i) => i).sort((a, b) => cents[b] - cents[a]);
          for (let k = 0; rest > 0; k = (k + 1) % order.length, rest--) share[order[k]] += 1;
          newOrders.forEach((o, i) => { o.price = ((cents[i] - share[i]) / 100).toFixed(2); if (share[i] > 0) o.discount = (share[i] / 100).toFixed(2); });
        }
        return { ...d, products, orders: [...d.orders, ...newOrders], quotes: d.quotes.map((q) => q.id === quote.id ? { ...q, status, events: [...(q.events || []), { d: todayISO(), t: "approved" }] } : q) };
      });
      const reservedCount = (quote.items || []).filter((it) => it.fromStock).length;
      notify(`Orçamento aprovado — pedido(s) criado(s)${reservedCount > 0 ? " · itens de pronta entrega já saíram do estoque" : ""}`);
    } else {
      setData((d) => ({ ...d, quotes: d.quotes.map((q) => q.id === quote.id ? { ...q, status, ...(status === "Recusado" ? { events: [...(q.events || []), { d: todayISO(), t: "refused" }] } : null) } : q) }));
      if (status === "Recusado") notify("Orçamento recusado — reservas de estoque liberadas");
    }
  };

  const NAV = [
    { group: "Visão geral", items: [
      { id: "dash", label: "Comando", icon: LayoutDashboard },
      { id: "pen", label: "Pendências", icon: ClipboardIc, badge: pendingOrdersList.length + unpaidSales.length },
    ]},
    { group: "Vendas", items: [
      { id: "orc", label: "Orçamentos", icon: ReceiptIc, badge: openQuotes.length },
      { id: "ped", label: "Pedidos", icon: ShoppingCart },
      { id: "agenda", label: "Agenda", icon: CalendarIc },
      { id: "cli", label: "Clientes", icon: UsersIc },
    ]},
    { group: "Produção", items: [
      { id: "proj", label: "Projetos", icon: Boxes },
      { id: "stk", label: "Estoque de Material", icon: WarehouseIc },
      { id: "prod", label: "Estoque de Produtos", icon: BoxSellIc },
    ]},
    { group: "Dinheiro", items: [
      { id: "inv", label: "Investimentos", icon: Wallet },
      { id: "fin", label: "Financeiro", icon: BanknoteIc },
      { id: "cont", label: "Contabilidade", icon: ScaleIc },
      { id: "rel", label: "Relatórios", icon: FileTextIc },
    ]},
    { group: "Sistema", items: [
      { id: "acoes", label: "Ações", icon: ClockIc },
      { id: "cfg", label: "Configurações", icon: SettingsIc },
      { id: "backup", label: "Backup", icon: DownloadIc, action: () => exportBackup(), dot: needBackup, hint: needBackup ? "Faz mais de 7 dias (ou nunca) que você não exporta um backup — clique para baixar" : "Baixar uma cópia de todos os dados" },
    ]},
  ];

  /* ============ RELATORIOS v4.32: brindes/perdas e desempenho por item ============ */
  const daysSince = (iso) => iso ? Math.max(0, Math.floor((new Date(todayISO() + "T12:00:00") - new Date(iso + "T12:00:00")) / 86400000)) : null;
  /* preco de venda de referencia: o do catalogo, ou custo + margem padrao */
  const refSalePrice = (p) => !p ? 0 : (num(p.salePrice) > 0 ? num(p.salePrice) : num(p.cost) * (1 + num(data.settings.defaultMargin) / 100));
  const monthLabel = (mk) => { const [y, m] = String(mk).split("-"); return m && y ? `${m}/${y}` : mk; };
  const GIFT_GROUPS = { produto: "Produto", cliente: "Cliente", mes: "Mês", motivo: "Motivo" };

  /* Brindes e perdas.
     Perda real = brinde que SAIU do estoque de graca (fromStock) + calibracoes.
     Pedido "Brinde / Teste" de producao NAO e perda: a peca vai para o estoque.
     Ele aparece so como informacao ("testes em estoque") para nao contar duas vezes. */
  const giftReport = (from, to, f) => {
    f = f || {};
    const inR = (d) => d && d >= from && d <= to;
    const mq = (f.motivo || "").trim().toLowerCase();
    const okOrder = (o) => {
      const p = projMap[o.projectId];
      if (f.clientId && o.clientId !== f.clientId) return false;
      if (f.projectId && o.projectId !== f.projectId) return false;
      if (f.niche && !hasNiche(p, f.niche)) return false;
      if (mq && !(o.giftNote || "").toLowerCase().includes(mq)) return false;
      return true;
    };
    const rows = [];
    data.orders.filter((o) => o.dest === "brinde" && o.fromStock && isDone(o) && inR(o.date) && okOrder(o)).forEach((o) => {
      const p = projMap[o.projectId]; const c = cliMap[o.clientId];
      rows.push({ id: o.id, kind: "brinde", date: o.date, product: projName(o), client: c ? c.name : "Sem cliente",
        niche: (p && p.niche) || "Sem nicho", motivo: (o.giftNote || "").trim() || "Sem motivo",
        qty: num(o.qty), cost: num(o.cost), lost: num(o.qty) * refSalePrice(p) });
    });
    /* calibracao nao tem cliente/produto/motivo: some quando um desses filtros esta ativo */
    const filtering = !!(f.clientId || f.projectId || f.niche || mq);
    const calibOn = f.calib !== false && !filtering;
    if (calibOn) (data.cashflow || []).filter((e) => e.cat === "Calibração" && e.kind === "out" && inR(e.date)).forEach((e) => {
      rows.push({ id: e.id, kind: "calib", date: e.date, product: "Calibração", client: "—", niche: "—", motivo: "Calibração",
        qty: 0, cost: num(e.value), lost: 0, desc: e.desc });
    });
    rows.sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
    const tests = data.orders.filter((o) => o.dest === "brinde" && !o.fromStock && isDone(o) && inR(o.date) && okOrder(o))
      .map((o) => ({ id: o.id, date: o.date, product: projName(o), qty: num(o.qty), cost: num(o.cost), inStock: o.projectId ? prodQty(o.projectId) : 0 }))
      .sort((a, b) => (a.date < b.date ? -1 : 1));
    const group = GIFT_GROUPS[f.group] ? f.group : "produto";
    const keyOf = (r) => group === "cliente" ? r.client : group === "mes" ? monthLabel(monthKey(r.date)) : group === "motivo" ? r.motivo : r.product;
    const gm = {};
    rows.forEach((r) => {
      const k = keyOf(r);
      if (!gm[k]) gm[k] = { key: k, sortKey: group === "mes" ? monthKey(r.date) : k, n: 0, qty: 0, cost: 0, lost: 0 };
      gm[k].n += 1; gm[k].qty += r.qty; gm[k].cost += r.cost; gm[k].lost += r.lost;
    });
    const groups = Object.values(gm).sort((a, b) => group === "mes" ? (a.sortKey < b.sortKey ? -1 : 1) : b.cost - a.cost);
    const gifts = rows.filter((r) => r.kind === "brinde");
    const total = {
      cost: rows.reduce((s, r) => s + r.cost, 0),
      giftCost: gifts.reduce((s, r) => s + r.cost, 0),
      calibCost: rows.filter((r) => r.kind === "calib").reduce((s, r) => s + r.cost, 0),
      lost: gifts.reduce((s, r) => s + r.lost, 0),
      qty: gifts.reduce((s, r) => s + r.qty, 0),
      gifts: gifts.length, calibs: rows.length - gifts.length,
      testQty: tests.reduce((s, t) => s + t.qty, 0), testCost: tests.reduce((s, t) => s + t.cost, 0),
    };
    return { rows, tests, groups, group, total, calibOn, filtering };
  };
  const giftFilterText = (f) => {
    f = f || {};
    const parts = [];
    if (f.clientId) parts.push("cliente: " + (cliMap[f.clientId] ? cliMap[f.clientId].name : "—"));
    if (f.projectId) parts.push("produto: " + (projMap[f.projectId] ? projMap[f.projectId].name : "—"));
    if (f.niche) parts.push("nicho: " + f.niche);
    if ((f.motivo || "").trim()) parts.push(`motivo contém "${f.motivo.trim()}"`);
    parts.push("agrupado por " + (GIFT_GROUPS[f.group] || "Produto").toLowerCase());
    return parts.join(" · ");
  };

  /* Desempenho por item (projeto) no periodo */
  const ITEM_SORTS = { vendidos: "Mais vendidos", lucro: "Maior lucro", faturamento: "Maior faturamento", margem: "Maior margem", brindes: "Mais brindes", parado: "Mais tempo parado", nome: "Nome (A–Z)" };
  const itemReport = (from, to, f) => {
    f = f || {};
    const inR = (d) => d && d >= from && d <= to;
    const t = (f.q || "").trim().toLowerCase();
    const lastSale = {}, lastAny = {};
    data.orders.forEach((o) => {
      if (!o.projectId) return;
      if (!lastAny[o.projectId] || o.date > lastAny[o.projectId]) lastAny[o.projectId] = o.date;
      if (isDone(o) && isSale(o) && (!lastSale[o.projectId] || o.date > lastSale[o.projectId])) lastSale[o.projectId] = o.date;
    });
    const sum = (list, fn) => list.reduce((s, o) => s + fn(o), 0);
    let rows = data.projects
      .filter((p) => f.status === "todos" ? true : f.status === "inativos" ? p.active === false : p.active !== false)
      .filter((p) => !f.niche || hasNiche(p, f.niche))
      .filter((p) => !t || (p.name || "").toLowerCase().includes(t))
      .map((p) => {
        const os = data.orders.filter((o) => o.projectId === p.id && isDone(o) && inR(o.date));
        const prod = os.filter((o) => !o.fromStock);
        const sold = os.filter(isSale);
        const gift = os.filter((o) => o.dest === "brinde" && o.fromStock);
        const producedQty = sum(prod, (o) => num(o.qty));
        const soldQty = sum(sold, (o) => num(o.qty));
        const revenue = sum(sold, (o) => num(o.price));
        const cost = sum(sold, (o) => num(o.cost));
        const profit = revenue - cost;
        const gPer = projFilaments(p).reduce((s, x) => s + num(x.grams), 0);
        return {
          id: p.id, name: p.name, niche: nichesText(p), active: p.active !== false, image: p.image,
          producedQty, soldQty, giftQty: sum(gift, (o) => num(o.qty)), giftCost: sum(gift, (o) => num(o.cost)),
          stock: prodQty(p.id), revenue, cost, profit, margin: revenue > 0 ? (profit / revenue) * 100 : null,
          ticket: soldQty > 0 ? revenue / soldQty : 0, grams: producedQty * gPer, hours: producedQty * num(p.hours),
          lastSale: lastSale[p.id] || "", idle: daysSince(lastSale[p.id]), lastOrder: lastAny[p.id] || "",
        };
      });
    if (f.mode === "vendidos") rows = rows.filter((r) => r.soldQty > 0);
    if (f.mode === "parados") rows = rows.filter((r) => r.soldQty === 0);
    const sort = ITEM_SORTS[f.sort] ? f.sort : "vendidos";
    const idleVal = (r) => r.idle == null ? Infinity : r.idle;
    rows.sort((a, b) => {
      if (sort === "nome") return (a.name || "").localeCompare(b.name || "");
      if (sort === "lucro") return b.profit - a.profit;
      if (sort === "faturamento") return b.revenue - a.revenue;
      if (sort === "margem") return (b.margin == null ? -Infinity : b.margin) - (a.margin == null ? -Infinity : a.margin);
      if (sort === "brindes") return b.giftQty - a.giftQty;
      if (sort === "parado") return idleVal(b) - idleVal(a);
      return b.soldQty - a.soldQty || b.revenue - a.revenue;
    });
    const total = {
      items: rows.length, producedQty: sum(rows, (r) => r.producedQty), soldQty: sum(rows, (r) => r.soldQty),
      giftQty: sum(rows, (r) => r.giftQty), stock: sum(rows, (r) => r.stock), revenue: sum(rows, (r) => r.revenue),
      cost: sum(rows, (r) => r.cost), profit: sum(rows, (r) => r.profit), grams: sum(rows, (r) => r.grams), hours: sum(rows, (r) => r.hours),
    };
    total.margin = total.revenue > 0 ? (total.profit / total.revenue) * 100 : null;
    return { rows, total, sort };
  };
  const itemFilterText = (f) => {
    f = f || {};
    const parts = [];
    parts.push(f.status === "todos" ? "ativos e inativos" : f.status === "inativos" ? "só inativos" : "só ativos");
    if (f.niche) parts.push("nicho: " + f.niche);
    if ((f.q || "").trim()) parts.push(`busca: "${f.q.trim()}"`);
    if (f.mode === "vendidos") parts.push("só itens com venda no período");
    if (f.mode === "parados") parts.push("só itens parados (sem venda no período)");
    parts.push("ordenado por " + (ITEM_SORTS[f.sort] || ITEM_SORTS.vendidos).toLowerCase());
    return parts.join(" · ");
  };

  /* ============================== DASHBOARD ============================== */
  function Dash() {
    const [iaP, setIaP] = useState("mes");
    const today = todayISO();
    const rangeOf = (k) => {
      if (k === "mes") return [thisMonth + "-01", today];
      if (k === "90d") return [addDays(today, -89), today];
      if (k === "ano") return [today.slice(0, 4) + "-01-01", today];
      return ["0001-01-01", "9999-12-31"];
    };
    /* periodo anterior equivalente, para comparar */
    const prevRangeOf = (k) => {
      if (k === "mes") { const d = new Date(thisMonth + "-01T12:00:00"); d.setMonth(d.getMonth() - 1); const ps = d.toISOString().slice(0, 7) + "-01"; const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); const day = Math.min(+today.slice(8, 10), last); return [ps, ps.slice(0, 8) + String(day).padStart(2, "0")]; }
      if (k === "90d") return [addDays(today, -179), addDays(today, -90)];
      if (k === "ano") { const y = +today.slice(0, 4) - 1; return [y + "-01-01", y + today.slice(4)]; }
      return null;
    };
    const statsFor = (from, to) => {
      const inR = (d) => d && d >= from && d <= to;
      const done = data.orders.filter((o) => isDone(o) && inR(o.date));
      const sales = done.filter(isSale);
      const produced = done.filter((o) => !o.fromStock);
      const rev = sales.reduce((s, o) => s + num(o.price), 0);
      const cost = sales.reduce((s, o) => s + num(o.cost), 0);
      const exp = data.expenses.filter((e) => inR(e.date)).reduce((s, e) => s + num(e.value), 0);
      const profit = rev - cost - exp;
      return { sales, produced, rev, cost, exp, profit, margin: rev > 0 ? (profit / rev) * 100 : null, ticket: sales.length ? rev / sales.length : 0,
        pieces: produced.reduce((s, o) => s + num(o.qty), 0), hours: produced.reduce((s, o) => s + num(projMap[o.projectId] ? projMap[o.projectId].hours : 0) * num(o.qty), 0) };
    };
    const [iaFrom, iaTo] = rangeOf(iaP);
    const cur = statsFor(iaFrom, iaTo);
    const pr = prevRangeOf(iaP);
    const prev = pr ? statsFor(pr[0], pr[1]) : null;
    const prevName = iaP === "mes" ? (() => { const d = new Date(thisMonth + "-01T12:00:00"); d.setMonth(d.getMonth() - 1); return d.toLocaleDateString("pt-BR", { month: "short" }).replace(".", ""); })() : iaP === "90d" ? "90 dias antes" : iaP === "ano" ? "ano passado" : "";
    const delta = (a, b) => (!prev || !(b > 0) ? null : ((a - b) / Math.abs(b)) * 100);
    const Delta = ({ a, b, pp, extra }) => {
      if (!prev) return <span className="neo-kd">{extra || "desde o início"}</span>;
      const d = pp ? (a == null || b == null ? null : a - b) : delta(a, b);
      if (d == null || !isFinite(d)) return <span className="neo-kd">{extra || "sem base para comparar"}</span>;
      const up = d >= 0;
      return <span className={"neo-kd " + (up ? "up" : "dn")}>{up ? "▲" : "▼"} {fmtN(Math.abs(d), pp ? 1 : 0)}{pp ? " p.p." : "%"} vs {prevName}</span>;
    };
    const iaReceber = unpaidSales.reduce((s, o) => s + num(o.price), 0);
    const iaReceberCli = new Set(unpaidSales.map((o) => o.clientId || "_")).size;
    const rank = (keyFn, valFn, nameFn) => { const m = {}; cur.sales.forEach((o) => { const k = keyFn(o); if (k == null) return; if (!m[k]) m[k] = { k, name: nameFn(k, o), v: 0, q: 0 }; m[k].v += valFn(o); m[k].q += num(o.qty); }); return Object.values(m).filter((x) => x.v > 0).sort((a, b) => b.v - a.v); };
    const iaProdRank = rank((o) => o.projectId, (o) => num(o.price) - num(o.cost), (k, o) => projName(o));
    const iaCliRank = rank((o) => o.clientId || null, (o) => num(o.price), (k) => (cliMap[k] ? cliMap[k].name : "—"));
    const iaNicheRank = rank((o) => { const p = projMap[o.projectId]; return (p && (projNiches(p)[0] || p.niche)) || "Sem nicho"; }, (o) => num(o.price), (k) => k);
    const iaFilRank = (() => { const m = {}; cur.sales.forEach((o) => { const p = projMap[o.projectId]; if (!p) return; const fils = projFilaments(p); if (!fils.length) return; const main = fils.slice().sort((a, b) => num(b.grams) - num(a.grams))[0]; const fid = ((o.filChoices || {}).main) || main.filamentId; const k = fid; if (!m[k]) m[k] = { k, name: filMap[k] ? filMap[k].name : "Filamento removido", v: 0 }; m[k].v += num(o.price) - num(o.cost); }); return Object.values(m).filter((x) => x.v > 0).sort((a, b) => b.v - a.v); })();
    const iaPrinters = data.printers.map((p) => { const deprH = num(p.lifeH) > 0 ? num(p.price) / num(p.lifeH) : 0; const energyH = (num(p.watts) / 1000) * num(data.settings.kwhPrice); const maintTotal = (p.maintLog || []).reduce((s, mm) => s + num(mm.cost), 0); const maintH = num(p.hoursUsed) > 0 ? maintTotal / num(p.hoursUsed) : 0; const custoHora = deprH + energyH + maintH; const recuperado = Math.min(num(p.price), num(p.hoursUsed) * deprH); const paybackPct = num(p.price) > 0 ? Math.min(100, (recuperado / num(p.price)) * 100) : 0; const falta = Math.max(0, num(p.price) - recuperado); return { p, custoHora, paybackPct, falta }; });
    const iaDaysMonth = new Date(+thisMonth.slice(0, 4), +thisMonth.slice(5, 7), 0).getDate();
    const iaCap = num(data.settings.prodHoursPerDay) * iaDaysMonth * Math.max(1, data.printers.length);
    const iaUsePct = iaCap > 0 ? Math.min(100, (monthHours / iaCap) * 100) : 0;
    const alerts = [
      ...lowStock.map((f) => ({ icon: Layers, msg: `Filamento baixo: ${f.name} — ${fmtN(f.stockG)} g` })),
      ...lowMaterials.map((m) => ({ icon: Package, msg: `Material baixo: ${m.name} — ${fmtN(m.stock)} un (mín. ${fmtN(m.minStock)})` })),
      ...maintDue.map((p) => ({ icon: PrinterIc, msg: `Manutenção recomendada: ${p.name} (${fmtN(num(p.hoursUsed) - num(p.lastMaintH || 0))}h desde a última)` })),
      ...lateOrders.map((o) => ({ icon: ClockIc, msg: `Atrasado: ${projName(o)} · previsto ${fmtDate(o.dueDate)}` })),
    ];

    /* filamentos mais usados */
    const [filView, setFilView] = useState("proj");
    const filUsage = (() => {
      const per = {};
      if (filView === "proj") activeProjects.forEach((p) => projFilaments(p).forEach((x) => { per[x.filamentId] = (per[x.filamentId] || 0) + num(x.grams); }));
      else data.orders.filter((o) => isDone(o) && !o.fromStock).forEach((o) => { const p = projMap[o.projectId]; if (p) projFilaments(p).forEach((x) => { per[x.filamentId] = (per[x.filamentId] || 0) + num(x.grams) * num(o.qty); }); });
      return Object.entries(per).map(([id, g]) => ({ id, name: filMap[id] ? filMap[id].name : "Filamento removido", value: +g.toFixed(1), color: filMap[id] ? filMap[id].colorHex : null }))
        .filter((x) => x.value > 0).sort((a, b) => b.value - a.value);
    })();
    const hasFilCard = activeProjects.some((p) => projFilaments(p).length > 0);
    /* cor visivel no escuro: preto vira cinza com brilho */
    const visColor = (hex, i) => { if (!hex) return CHART_COLORS[i % CHART_COLORS.length]; return isDarkHex(hex) ? "#6B7A7D" : hexShade(hex, 0); };

    /* saude financeira do mes */
    const marginPct = monthRevenue > 0 ? (monthProfit / monthRevenue) * 100 : null;
    const tips = [];
    let score = 100;
    if (monthRevenue === 0) { score -= 35; tips.push("Nenhuma venda registrada neste mês — que tal enviar um orçamento ou divulgar o catálogo?"); }
    else if (monthProfit < 0) { score -= 35; tips.push("O mês está no vermelho: gastos maiores que o faturamento. Revise compras e preços."); }
    else if (marginPct !== null && marginPct < 20) { score -= 15; tips.push(`Margem líquida de ${fmtN(marginPct, 1)}% está apertada — confira a precificação na calculadora.`); }
    if (lateOrders.length > 0) { score -= Math.min(20, lateOrders.length * 6); tips.push(`${lateOrders.length} pedido(s) atrasado(s) — priorize na aba Pendências.`); }
    if (unpaidSales.length > 0) { score -= Math.min(15, unpaidSales.length * 4); tips.push(`${fmt(unpaidSales.reduce((s, o) => s + num(o.price), 0))} a receber de vendas já entregues — cobre com carinho 😉`); }
    if (lowStock.length + lowMaterials.length > 0) { score -= 10; tips.push("Itens com estoque baixo podem travar a produção — planeje a reposição."); }
    if (monthFixedTotal > 0 && monthRevenue > 0 && monthRevenue < monthFixedTotal) { score -= 10; tips.push("O faturamento do mês ainda não cobre os custos fixos."); }
    score = Math.max(5, Math.min(100, score));
    const health = score >= 75 ? { label: "Saudável", color: "#3FD1CE" } : score >= 45 ? { label: "Atenção", color: "#F5821F" } : { label: "Crítico", color: "#FF6B6B" };

    /* meta do mes */
    const goal = num(data.settings.monthlyGoal);
    const goalPct = goal > 0 ? (monthRevenue / goal) * 100 : 0;
    const daysLeft = iaDaysMonth - +today.slice(8, 10);
    const perDay = goal > monthRevenue && daysLeft > 0 ? (goal - monthRevenue) / daysLeft : 0;

    const periods = [["mes", "Mês"], ["90d", "90 dias"], ["ano", "Ano"], ["tudo", "Tudo"]];
    const ChartTip = ({ active, payload, label }) => {
      if (!active || !payload || !payload.length) return null;
      const g = (k) => (payload.find((x) => x.dataKey === k) || {}).value || 0;
      const f = g("Faturamento"), l = g("Lucro");
      return (
        <div className="neo-ctip">
          <div className="m">{String(label).toUpperCase()}</div>
          <div className="a">Faturou {fmt(f)} · gastou {fmt(g("Gastos"))}</div>
          <div className={"b" + (l < 0 ? " neg" : "")}>Lucro {fmt(l)}{f > 0 ? ` (${fmtN((l / f) * 100, 0)}%)` : ""}</div>
        </div>
      );
    };
    const kpi = (i, label, value, format, extra, opts) => (
      <Reveal key={label} className={"neo-hud neo-k" + (opts && opts.cls ? " " + opts.cls : "")} delay={i * 60} onClick={opts && opts.tab ? () => setTab(opts.tab) : undefined}>
        <div className="l">{label}</div>
        <div className="v" style={opts && opts.color ? { color: opts.color } : undefined}>{value == null ? "—" : <CountUp value={value} format={format} />}</div>
        {extra}
        {opts && opts.spark && <Spark values={opts.spark} color={opts.sparkColor} />}
      </Reveal>
    );
    const champ = (i, label, icon, tone, x, sub, tab) => (
      <Reveal key={label} className="neo-hud neo-champ" delay={i * 70} onClick={tab && x ? () => setTab(tab) : undefined}>
        <div className={"ic " + tone}>{icon}</div>
        <div style={{ minWidth: 0 }}><div className="l">{label}</div><b>{x ? x.name : "—"}</b><small>{x ? sub(x) : "sem vendas no período"}</small></div>
      </Reveal>
    );
    const board = (title, code, rows, tone, valFmt) => (
      <div className="neo-board">
        <div className="neo-ttl"><span className="neo-code">{code}</span><b>{title}</b></div>
        {rows.length === 0 ? <div className="neo-empty" style={{ padding: "8px 0" }}>Sem vendas no período.</div> : rows.slice(0, 5).map((x, i) => (
          <div key={x.k} className="neo-lb">
            <span className={"av " + tone}>{tone === "o" ? i + 1 : String(x.name || "?").trim().charAt(0).toUpperCase()}</span>
            <div style={{ minWidth: 0 }}><div className="n">{x.name}</div><div className={"bar " + tone}><i style={{ width: (x.v / rows[0].v * 100) + "%" }} /></div></div>
            <span className={"v " + tone}>{valFmt(x)}</span>
          </div>
        ))}
      </div>
    );

    return (
      <div className="neo-dash">
        <CommandCenter />
        <div className="neo-sec2">
          <span>Números do negócio</span>
          <div className="neo-chips">{periods.map(([k, lb]) => <button key={k} className={iaP === k ? "on" : ""} onClick={() => setIaP(k)}>{lb}</button>)}</div>
        </div>

        <div className="neo-kpis">
