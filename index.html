  /* =============================== ACOES (v4.41) =============================== */
  const ACT_FILTERS = ["Tudo", "Pedidos", "Orçamentos", "Projetos", "Clientes", "Estoque", "Financeiro", "Impressoras", "Configurações"];
  function Acoes() {
    const [, force] = useState(0);
    const ui = ACT_UI;
    const set = (patch) => { Object.assign(ui, patch); force((x) => x + 1); };
    const norm = (s) => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
    const list = actionsPrune(actRef.current || []).filter((a) => ui.cat === "Tudo" || (a.cats || []).includes(ui.cat))
      .filter((a) => !ui.q.trim() || norm(a.label + " " + (a.details || []).join(" ")).includes(norm(ui.q.trim())));
    const dayKey = (ts) => { const d = new Date(ts); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
    const dayLabel = (k) => k === todayISO() ? "Hoje" : k === addDays(todayISO(), -1) ? "Ontem" : fmtDate(k);
    const hhmm = (ts) => { const d = new Date(ts); return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); };
    const groups = [];
    list.forEach((a) => { const k = dayKey(a.ts); const g = groups[groups.length - 1]; if (g && g.k === k) g.items.push(a); else groups.push({ k, items: [a] }); });
    const icon = (a) => a.kind === "undo" || /^Desfez/.test(a.label) ? "↶" : /^Refez/.test(a.label) ? "↷" : /^Excluiu/.test(a.label) ? "🗑" : /^(Criou|Lançou)/.test(a.label) ? "＋" : /pago: não → sim/.test(a.label) ? "💰" : "✎";
    return (
      <div>
        <SectionHead title="Ações" count={(actRef.current || []).length} />
        <div style={{ font: "400 13px Inter,sans-serif", color: "#7E9191", background: "rgba(5,12,12,.55)", border: "1px solid rgba(63,209,206,.1)", borderRadius: 10, padding: "10px 14px", marginBottom: 14 }}>
          💡 Tudo o que foi feito nos últimos <b>7 dias</b>. <b>Desfazer</b> volta a ação inteira — inclusive o que ela mexeu junto (filamento, horas da impressora, estoque, financeiro). Se outra coisa mexeu nos mesmos dados depois, o sistema avisa antes. As ações ficam guardadas neste computador.
        </div>
        <div style={{ display: "flex", gap: 10, flexWrap: "wrap", alignItems: "center", marginBottom: 12 }}>
          <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
            {ACT_FILTERS.map((c) => (
              <button key={c} className="act-filter" data-c={c} onClick={() => set({ cat: c })} style={{ padding: "6px 12px", borderRadius: 999, cursor: "pointer", border: ui.cat === c ? "1.5px solid #14A6A4" : "1px solid rgba(63,209,206,.22)", background: ui.cat === c ? "rgba(63,209,206,.1)" : "rgba(12,26,28,.72)", font: "600 12.5px Inter,sans-serif", color: ui.cat === c ? "#3FD1CE" : "#B5C4C4" }}>{c}</button>
            ))}
          </div>
          <div style={{ flex: 1, minWidth: 180 }}><In className="act-search" value={ui.q} onChange={(e) => set({ q: e.target.value })} placeholder="Buscar nas ações…" /></div>
        </div>
        {list.length === 0 ? <Card><Empty icon={ClockIc} text="Nenhuma ação encontrada" hint="As ações aparecem aqui conforme você usa o sistema." /></Card> : groups.map((g) => (
          <div key={g.k} style={{ marginBottom: 14 }}>
            <div style={{ font: "600 11.5px Inter,sans-serif", color: "#3FD1CE", textTransform: "uppercase", letterSpacing: ".06em", margin: "4px 2px 6px" }}>{dayLabel(g.k)}</div>
            <Card style={{ padding: 0, overflow: "hidden" }}>
              {g.items.map((a, i) => {
                const op = !!ui.open[a.id];
                return (
                  <div key={a.id} className={"act-row" + (a.undone ? " undone" : "")} style={{ borderTop: i ? "1px solid rgba(63,209,206,.1)" : "none", padding: "10px 14px", opacity: a.undone ? .55 : 1 }}>
                    <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
                      <span style={{ font: "600 12px 'JetBrains Mono',monospace", color: "#8FA3A3", flexShrink: 0 }}>{hhmm(a.ts)}</span>
                      <span style={{ width: 20, textAlign: "center", flexShrink: 0 }}>{icon(a)}</span>
                      <div onClick={() => set({ open: { ...ui.open, [a.id]: !op } })} style={{ flex: 1, minWidth: 0, cursor: "pointer" }}>
                        <div className="act-label" style={{ font: "500 13px Inter,sans-serif", color: "#D6E2E2", textDecoration: a.undone ? "line-through" : "none" }}>{a.label}</div>
                        <div style={{ font: "400 11px Inter,sans-serif", color: "#7E9191" }}>{(a.cats || []).join(" · ")}{(a.details || []).length > 1 ? ` · ${op ? "esconder" : "ver"} ${a.details.length} detalhe(s)` : ""}{a.undone ? " · desfeita" : ""}</div>
                      </div>
                      {!a.undone && <Btn small kind="ghost" className="act-undo" onClick={() => undoAction(a)}>{a.kind === "undo" ? "↷ Refazer" : "↶ Desfazer"}</Btn>}
                    </div>
                    {op && (a.details || []).length > 0 && (
                      <div style={{ margin: "6px 0 2px 64px", font: "400 12px Inter,sans-serif", color: "#93A6A6", lineHeight: 1.6 }}>
                        {a.details.map((t, j) => <div key={j}>{t}</div>)}
                      </div>
                    )}
                  </div>
                );
              })}
            </Card>
          </div>
        ))}
      </div>
    );
  }

  /* =============================== ORÇAMENTOS ============================== */
  const QUOTE_STYLE = {
    "Pendente": { bg: "#2E2413", fg: "#FFB067" },
    "Aprovado": { bg: "rgba(63,209,206,.1)", fg: "#3FD1CE" },
    "Recusado": { bg: "#331A1A", fg: "#F0605F" },
    "Expirado": { bg: "rgba(5,12,12,.55)", fg: "#8FA0AC" },
  };
  const waLink = (quote) => {
    const c = cliMap[quote.clientId];
    const si = data.storeInfo || {};
    const digits = c && c.phone ? String(c.phone).replace(/\D/g, "") : "";
    const first = c && c.name ? c.name.trim().split(" ")[0] : "";
    const items = (quote.items || []).map((it) => {
      const p = projMap[it.projectId];
      return `🔹 ${fmtN(it.qty)}× ${it.desc || (p ? p.name : "Item")}${p && itemColors(p, it.filChoices).length ? ` (${itemColorsText(p, it.filChoices)})` : ""} — ${fmt(num(it.qty) * num(it.unitPrice))}${it.fromStock ? " ⚡ *PRONTA ENTREGA*" : ""}`;
    }).join("\n");
    const insta = si.instagram ? String(si.instagram).replace("@", "") : "";
    const contact = [si.phone ? `📱 ${si.phone}` : "", insta ? `📸 Instagram: @${insta}` : ""].filter(Boolean).join(" · ");
    const msg = `🧡 *${(si.name || "PrintAR 3D").toUpperCase()}*
_${si.tagline || "suas ideias, impressas em 3D"}_
━━━━━━━━━━━━━━━
📋 *ORÇAMENTO* ${quote.code}

Olá${first ? `, *${first}*` : ""}! 😊 Preparei seu orçamento com todo carinho:

${items}

${num(quote.discount) > 0 ? `🎁 Desconto: −${fmt(quote.discount)}\n` : ""}💰 *TOTAL: ${fmt(quoteTotal(quote))}*
━━━━━━━━━━━━━━━
🚚 Entrega estimada: *${fmtDate(quote.deadline)}*
⏳ Proposta válida até: *${fmtDate(quote.validUntil)}*

Ficou com alguma dúvida? É só responder aqui! 😉
Vamos tirar essa ideia da tela? 🚀${contact ? `\n${contact}` : ""}`;
    return `https://wa.me/${digits ? "55" + digits : ""}?text=${encodeURIComponent(msg)}`;
  };
  /* ---------- v4.49: apoio da aba Orçamentos ---------- */
  const quoteState = (q) => (q.status === "Pendente" && q.validUntil && q.validUntil < todayISO() ? "Expirado" : q.status);
  /* eventos da linha do tempo: gravados sem virar "ação" no histórico */
  const quoteEvent = (q, t) => setDataQuiet((d) => ({ ...d, quotes: (d.quotes || []).map((x) => (x.id === q.id ? { ...x, events: [...(x.events || []), { d: todayISO(), t }] } : x)) }));
  const remindMsg = (q) => {
    const c = cliMap[q.clientId];
    const si = data.storeInfo || {};
    return `Oi, ${firstName(c && c.name)}! Tudo bem? 😊\nPassando para saber se ficou alguma dúvida no orçamento ${q.code} (${fmt(quoteTotal(q))}).${q.validUntil ? `\nEle vale até ${fmtDate(q.validUntil)}.` : ""}\nSe quiser, posso ajustar quantidade, cores ou prazo. É só me chamar!${si.name ? `\n— ${si.name}` : ""}`;
  };
  const Q_EVENT_TXT = { created: "Orçamento criado", pdf: "PDF gerado", wa: "Enviado no WhatsApp", pix: "Arte do PIX gerada", reminder: "Lembrete enviado no WhatsApp", renewed: "Validade renovada", approved: "Aprovado — virou pedido", refused: "Recusado" };
  const Q_TONE = { Pendente: "#6FA0EA", Aprovado: "#3FD1CE", Recusado: "#FF6B6B", Expirado: "#FF8A8A" };

  function Quotes() {
    const [qq, setQqS] = useState(Q_UI.q);
    const setQq = (v) => { Q_UI.q = v; setQqS(v); setQPage(1); };
    const [qStatus, setQStatusS] = useState(Q_UI.st);
    const setQStatus = (v) => { Q_UI.st = v; setQStatusS(v); setQPage(1); };
    const [qMonth, setQMonthS] = useState(Q_UI.month);
    const setQMonth = (v) => { Q_UI.month = v; setQMonthS(v); setQPage(1); };
    const [qPage, setQPage] = useState(1);
    const [open, setOpenS] = useState(Q_UI.open);
    const setOpen = (v) => { Q_UI.open = v; setOpenS(v); };
    const [menu, setMenu] = useState(null);
    useEffect(() => {
      if (!menu) return;
      const close = (e) => { if (!(e.target.closest && e.target.closest(".neo-qmenu, .neo-qmore"))) setMenu(null); };
      document.addEventListener("mousedown", close);
      return () => document.removeEventListener("mousedown", close);
    }, [menu]);
    const today = todayISO();
    const all = [...(data.quotes || [])].sort((a, b) => ((a.date || "") < (b.date || "") ? 1 : -1));
    const base = all.filter((q) => {
      const c = cliMap[q.clientId]; const cn = (c ? c.name : (q.clientName || "")).toLowerCase();
      if (qq) { const t = qq.toLowerCase(); if (!(cn.includes(t) || (q.code || "").toLowerCase().includes(t))) return false; }
      if (qMonth && monthKey(q.date) !== qMonth) return false;
      return true;
    });
    const cnt = (st) => base.filter((q) => quoteState(q) === st).length;
    const list = qStatus === "Todos" ? base : base.filter((q) => quoteState(q) === qStatus);
    const PER = 25;
    const pageCount = Math.max(1, Math.ceil(list.length / PER));
    const curPage = Math.min(qPage, pageCount);
    const pageList = list.slice((curPage - 1) * PER, curPage * PER);
    /* numeros do topo */
    const openQ = all.filter((q) => quoteState(q) === "Pendente");
    const openSum = openQ.reduce((s, q) => s + quoteTotal(q), 0);
    const from90 = addDays(today, -89);
    const q90 = all.filter((q) => q.date && q.date >= from90);
    const by90 = { Aprovado: 0, Pendente: 0, Recusado: 0, Expirado: 0 };
    q90.forEach((q) => { const s = quoteState(q); if (by90[s] != null) by90[s]++; });
    const rate = q90.length ? (by90.Aprovado / q90.length) * 100 : null;
    const expiring = openQ.filter((q) => q.validUntil && q.validUntil <= addDays(today, 3));
    const apDate = (q) => { const e = (q.events || []).filter((x) => x.t === "approved").pop(); return e ? e.d : q.date; };
    const apSum = (from, to) => all.filter((q) => q.status === "Aprovado" && apDate(q) >= from && apDate(q) <= to).reduce((s, q) => s + quoteTotal(q), 0);
    const apMonth = apSum(thisMonth + "-01", today);
    const prevM = (() => { const d = new Date(thisMonth + "-01T12:00:00"); d.setMonth(d.getMonth() - 1); const ps = d.toISOString().slice(0, 7) + "-01"; const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); return [ps, ps.slice(0, 8) + String(Math.min(+today.slice(8, 10), last)).padStart(2, "0"), d.toLocaleDateString("pt-BR", { month: "short" }).replace(".", "")]; })();
    const apPrev = apSum(prevM[0], prevM[1]);
    const apDelta = apPrev > 0 ? ((apMonth - apPrev) / apPrev) * 100 : null;
    const renew = (q) => {
      const vu = addDays(today, Math.max(1, num(data.settings.quoteValidityDays) || 7));
      logAs(`Renovou o orçamento ${q.code} até ${fmtDate(vu)}`);
      setData((d) => ({ ...d, quotes: d.quotes.map((x) => (x.id === q.id ? { ...x, validUntil: vu, events: [...(x.events || []), { d: today, t: "renewed" }] } : x)) }));
      notify(`${q.code} renovado até ${fmtDate(vu)}`);
    };
    const valBox = (q, st) => {
      if (st === "Aprovado") { const n = data.orders.filter((o) => o.quoteCode === q.code).length; return <div className="neo-qval"><b style={{ color: "#3FD1CE" }}>{n ? `virou ${n} pedido${n > 1 ? "s" : ""}` : "aprovado"}</b><small>{fmtDate(apDate(q)).slice(0, 5)}</small></div>; }
      if (st === "Recusado") return <div className="neo-qval"><b style={{ color: "#FF8A8A" }}>recusado</b><small>{q.validUntil ? `validade ${fmtDate(q.validUntil).slice(0, 5)}` : ""}</small></div>;
      if (!q.validUntil) return <div className="neo-qval"><b className="mut">sem validade</b></div>;
      const d = daysUntil(q.validUntil);
      if (d < 0) return <div className="neo-qval"><b style={{ color: "#FF8A8A" }}>expirou há {-d} dia{-d > 1 ? "s" : ""}</b><small>era {fmtDate(q.validUntil)}</small></div>;
      return <div className="neo-qval"><b style={{ color: d <= 3 ? "#FFAA5C" : "#E6F1F1" }}>{d === 0 ? "vence hoje" : d === 1 ? "vence amanhã" : `vence em ${d} dias`}</b><small>até {fmtDate(q.validUntil)}</small></div>;
    };
    const itemsPreview = (q) => {
      const its = q.items || [];
      return (
        <div className="neo-qitems">
          {its.slice(0, 2).map((it) => { const p = projMap[it.projectId]; const cs = p ? itemColors(p, it.filChoices) : []; return (
            <span key={it.id}><i style={{ background: cs[0] && cs[0].fil ? (cs[0].fil.colorHex || "#4A5257") : "#4A5257" }} />{fmtN(it.qty)}× {it.desc || (p ? p.name : "Item")}{cs.length ? <em>{cs.length > 1 ? `${cs.length} cores` : colorName(cs[0].fil)}</em> : null}</span>
          ); })}
          {its.length > 2 && <span className="more">+{its.length - 2} ite{its.length - 2 > 1 ? "ns" : "m"}</span>}
          {its.length === 0 && <span className="more">sem itens</span>}
        </div>
      );
    };
    const timeline = (q, st) => {
      const ev = [{ d: q.date, t: "created" }, ...(q.events || [])];
      return (
        <div className="neo-tline">
          {ev.map((e, i) => <div key={i} className="print-row"><span className="d">{fmtDate(e.d).slice(0, 5)}</span><span>{Q_EVENT_TXT[e.t] || e.t}</span></div>)}
          {st === "Pendente" && q.validUntil && <div className="print-row fut"><span className="d">{fmtDate(q.validUntil).slice(0, 5)}</span><span>Vence se não for aprovado</span></div>}
        </div>
      );
    };
    const filters = [["Todos", base.length], ["Pendente", cnt("Pendente")], ["Aprovado", cnt("Aprovado")], ["Recusado", cnt("Recusado")], ["Expirado", cnt("Expirado")]];
    const plural = { Todos: "Todos", Pendente: "Pendentes", Aprovado: "Aprovados", Recusado: "Recusados", Expirado: "Expirados" };

    return (
      <div className="neo-quotes">
        <div className="neo-pagehead">
          <span className="neo-code">ORÇAMENTOS</span><h2>Propostas</h2>
          <button className="neo-b1" style={{ marginLeft: "auto" }} onClick={() => setModal({ type: "quote" })}><Plus size={15} />Novo orçamento</button>
        </div>
        <div className="neo-qtop">
          <Reveal className="neo-hud neo-k or" delay={0} onClick={() => setQStatus("Pendente")}><div className="l">Em aberto</div><div className="v"><CountUp value={openSum} format={fmt} /></div><span className="neo-kd">{openQ.length} orçamento{openQ.length === 1 ? "" : "s"} pendente{openQ.length === 1 ? "" : "s"}</span></Reveal>
          <Reveal className="neo-hud neo-k" delay={60}><div className="l">Aprovação</div><div className="v" style={{ color: "#3FD1CE" }}>{rate == null ? "—" : <CountUp value={rate} format={(v) => fmtN(v, 0) + "%"} />}</div><span className="neo-kd">últimos 90 dias · {by90.Aprovado} de {q90.length}</span></Reveal>
          <Reveal className="neo-hud neo-k" delay={120} onClick={() => setQStatus("Pendente")}><div className="l">Vencendo</div><div className="v" style={{ color: expiring.length ? "#FFAA5C" : undefined }}><CountUp value={expiring.length} /></div><span className="neo-kd">nos próximos 3 dias</span></Reveal>
          <Reveal className="neo-hud neo-k" delay={180}><div className="l">Aprovado no mês</div><div className="v"><CountUp value={apMonth} format={fmt} /></div>{apDelta == null ? <span className="neo-kd">sem base para comparar</span> : <span className={"neo-kd " + (apDelta >= 0 ? "up" : "dn")}>{apDelta >= 0 ? "▲" : "▼"} {fmtN(Math.abs(apDelta), 0)}% vs {prevM[2]}</span>}</Reveal>
          <Reveal className="neo-hud neo-funnel" delay={240}>
            <span className="neo-code">FUNIL · 90 DIAS</span>
            <div className="bar">{q90.length ? [["Aprovado", "a"], ["Pendente", "p"], ["Recusado", "r"], ["Expirado", "e"]].map(([k, c]) => by90[k] > 0 && <i key={k} className={c} style={{ width: (by90[k] / q90.length * 100) + "%" }} title={`${plural[k]}: ${by90[k]}`} />) : <i className="e" style={{ width: "100%", opacity: .3 }} />}</div>
            <div className="leg"><span className="a">Aprovados {by90.Aprovado}</span><span className="p">Pendentes {by90.Pendente}</span><span className="r">Recusados {by90.Recusado}</span><span className="e">Expirados {by90.Expirado}</span></div>
          </Reveal>
        </div>
        <div className="neo-penbar">
          <div className="neo-fchips">{filters.map(([k, n]) => <button key={k} className={"neo-fchip q-filter" + (qStatus === k ? " on" : "") + (k === "Recusado" && n ? " r" : "")} data-st={k} onClick={() => setQStatus(k)}>{plural[k]} {n}</button>)}</div>
          <In type="month" value={qMonth} onChange={(e) => setQMonth(e.target.value)} style={{ width: 170, marginLeft: "auto", height: 36, padding: "6px 10px" }} title="Filtrar por mês" />
          <div className="neo-search" style={{ marginLeft: 0 }}><SearchIc size={14} /><input value={qq} onChange={(e) => setQq(e.target.value)} placeholder="Cliente ou código…" />{qq && <button onClick={() => setQq("")}>×</button>}</div>
        </div>
        {all.length === 0 ? <Card><Empty icon={ReceiptIc} text="Nenhum orçamento criado" hint="Monte um orçamento profissional em PDF e envie pelo WhatsApp para o seu cliente." /></Card>
          : list.length === 0 ? <div className="neo-hud neo-empty">Nenhum orçamento neste filtro. <a onClick={() => { setQStatus("Todos"); setQq(""); setQMonth(""); }}>Ver todos</a></div>
          : pageList.map((q, idx) => {
            const c = cliMap[q.clientId];
            const st = quoteState(q);
            const isOpen = open === q.id;
            const disc = num(q.discount);
            const nOrders = st === "Aprovado" ? data.orders.filter((o) => o.quoteCode === q.code) : [];
            return (
              <Reveal key={q.id} className={"neo-qrow" + (isOpen ? " open" : "") + (st === "Expirado" || st === "Recusado" ? " bad" : "")} delay={Math.min(idx, 8) * 35} style={{ "--qc": Q_TONE[st] || "#7F9A9B", ...(menu === q.id ? { zIndex: 30 } : null) }}>
                <div className="neo-qstripe" />
                <div className="neo-qbody" data-code={q.code}>
                  <div className="neo-qline" onClick={() => setOpen(isOpen ? null : q.id)}>
                    <div className="neo-qcode">{q.code}<small>{fmtDate(q.date)}</small></div>
                    <div className="neo-qcli"><span className="av">{(c ? c.name : (q.clientName || "?")).trim().charAt(0).toUpperCase()}</span><div><b>{c ? c.name : (q.clientName || "—")}</b><small>{c && c.phone ? c.phone : "sem telefone"}</small></div></div>
                    {itemsPreview(q)}
                    <div className="neo-qtot">{fmt(quoteTotal(q))}{disc > 0 && <small>−{fmt(disc)} desc.</small>}</div>
                    <div><span className="neo-qpill" style={{ color: Q_TONE[st] }}>{st}</span>{valBox(q, st)}</div>
                    <div className="neo-oacts" onClick={(e) => e.stopPropagation()}>
                      {st === "Pendente" && <button className="neo-bp q-approve" title="Aprovar e criar os pedidos" onClick={() => { if (confirm("Aprovar este orçamento e criar os pedidos correspondentes?")) setQuoteStatus(q, "Aprovado"); }}><CheckCircle2 size={13} />Aprovar</button>}
                      {st === "Expirado" && <button className="neo-bg2 q-renew" title={`Reabrir com validade de ${num(data.settings.quoteValidityDays) || 7} dias`} onClick={() => renew(q)}>↻ Renovar</button>}
                      {st === "Aprovado" && <button className="neo-bg2" onClick={() => setTab(nOrders.some((o) => !isDone(o)) ? "pen" : "ped")}>Ver pedido →</button>}
                      <button className="neo-bg2 ic" title="Gerar PDF" onClick={() => { quoteEvent(q, "pdf"); setModal({ type: "printQuote", quote: q }); }}><PrintIc size={14} /></button>
                      <button className="neo-bg2" title="Imagem com QR e chave PIX para mandar no WhatsApp" onClick={() => { quoteEvent(q, "pix"); openPix(q.code, q.clientId); }}>PIX</button>
                      <button className="neo-bg2 ic wa" title="Enviar o orçamento no WhatsApp" onClick={() => { quoteEvent(q, "wa"); window.open(waLink(q), "_blank"); }}><WhatsIc size={14} /></button>
                      <button className={"neo-bg2 ic neo-qmore" + (menu === q.id ? " on" : "")} title="Mais opções" onClick={() => setMenu(menu === q.id ? null : q.id)}>⋯</button>
                      {menu === q.id && (
                        <div className="neo-qmenu">
                          <button onClick={() => { setMenu(null); setModal({ type: "quote", item: q }); }}><Pencil size={13} />Editar</button>
                          <label className="quote-pix" title="Marcado: o PDF do orçamento sai com o QR e a chave PIX">
                            <input type="checkbox" checked={!!q.pix} onChange={(e) => { if (e.target.checked && !pixReady(storePix())) { notify("Cadastre o PIX em Configurações → Dados da empresa."); return; } saveItem("quotes", { ...q, pix: e.target.checked }); }} />PIX no PDF
                          </label>
                          {st === "Pendente" && <><hr /><button className="q-refuse" onClick={() => { setMenu(null); setQuoteStatus(q, "Recusado"); }}><XIc size={13} />Recusar</button></>}
                          <hr />
                          <button className="r q-delete" onClick={() => { setMenu(null); if (confirm(`Excluir o orçamento ${q.code}?`)) delItem("quotes", q.id); }}><Trash2 size={13} />Excluir</button>
                        </div>
                      )}
                    </div>
                  </div>
                  {isOpen && (
                    <div className="neo-qexp">
                      <div>
                        <div className="neo-mini">ITENS</div>
                        <div className="neo-qtbl">
                          <div className="hd"><span>Produto</span><span>Qtd</span><span>Unit.</span><span>Total</span></div>
                          {(q.items || []).map((it) => { const p = projMap[it.projectId]; return (
                            <div key={it.id}><span>{it.desc || (p ? p.name : "Item")}{p && itemColors(p, it.filChoices).length ? <em> · {itemColorsText(p, it.filChoices)}</em> : null}{it.fromStock ? <em> · pronta entrega</em> : null}</span><span>{fmtN(it.qty)}</span><span>{fmtN(num(it.unitPrice), 2)}</span><span>{fmtN(num(it.qty) * num(it.unitPrice), 2)}</span></div>
                          ); })}
                          {disc > 0 && <div><span>Desconto</span><span /><span /><span className="o">−{fmtN(disc, 2)}</span></div>}
                          <div className="tt"><span>Total</span><span /><span /><span>{fmtN(quoteTotal(q), 2)}</span></div>
                        </div>
                        {(q.notes || q.deadline) && <div className="neo-qnote">{q.notes ? <>Obs.: {q.notes}</> : null}{q.notes && q.deadline ? " · " : ""}{q.deadline ? <>Prazo de entrega: {fmtDate(q.deadline)}</> : null}</div>}
                      </div>
                      <div>
                        <div className="neo-mini">LINHA DO TEMPO</div>
                        {timeline(q, st)}
                        {st === "Pendente" && <div className="neo-oacts left">
                          <button className="neo-bg2 wa" disabled={!(c && c.phone)} title={c && c.phone ? "Mensagem de acompanhamento pronta no WhatsApp" : "Cadastre o telefone do cliente para usar"} onClick={() => { if (waOpen(c.phone, remindMsg(q))) quoteEvent(q, "reminder"); }}><WaIc size={13} />Lembrar cliente</button>
                        </div>}
                      </div>
                    </div>
                  )}
                </div>
              </Reveal>
            );
          })}
        <Pager total={list.length} page={curPage} per={PER} setPage={setQPage} />
      </div>
    );
  }

  function QuoteModal({ item, presetClient, presetProject }) {
    const sugPrice = (p) => p ? (num(p.salePrice) > 0 ? num(p.salePrice).toFixed(2) : (num(p.cost) * (1 + num(data.settings.defaultMargin) / 100)).toFixed(2)) : "";
    const [f, setF] = useState(item ? { discount: 0, notes: "", ...item } : {
      id: uid(), code: nextQuoteCode(), date: todayISO(), clientId: presetClient || (data.clients[0] ? data.clients[0].id : ""),
      validUntil: addDays(todayISO(), num(data.settings.quoteValidityDays) || 7),
      items: [(() => { const p0 = (presetProject && projMap[presetProject]) || activeProjects[0]; return { id: uid(), projectId: p0 ? p0.id : "", desc: "", qty: 1, unitPrice: sugPrice(p0), auto: true }; })()],
      discount: 0, notes: "", deadline: "", status: "Pendente",
    });
    const setItem = (i, patch) => setF({ ...f, items: f.items.map((x, idx) => idx === i ? { ...x, ...patch, auto: false } : x) });
    const [kitPick, setKitPick] = useState(null);
    /* + Kit: coloca os itens do kit com o preco do kit dividido entre eles (fecha no centavo) */
    const addKit = (kid) => {
      const k = kitMap[kid]; if (!k) return;
      const lines = kitLines(k).map((x) => ({ projectId: x.p.id, qty: num(x.qty), ref: refPrice(x.p) }));
      const priced = num(k.price) > 0 ? splitKitPrice(lines, k.price) : lines.map((l) => ({ ...l, unitCents: Math.round(l.ref * 100) }));
      const novos = priced.map((l) => ({ id: uid(), projectId: l.projectId, desc: "", qty: l.qty, unitPrice: (l.unitCents / 100).toFixed(2), kitName: k.name, kitId: k.id }));
      /* orcamento novo com so a linha automatica (nao mexida) ou linha vazia: o kit substitui */
      const vazio = f.items.length === 1 && (f.items[0].auto || (!f.items[0].projectId && !f.items[0].desc && !num(f.items[0].unitPrice)));
      setF({ ...f, items: [...(vazio ? [] : f.items), ...novos] });
      setKitPick(null);
      /* sem aviso (toast) aqui: o aviso redesenha a tela e apagaria o orcamento em edicao */
    };
    const hrs = quoteHours(f);
    const est = estimateDeadline(hrs);
    const total = quoteTotal(f);
    return (
      <Modal title={item ? `Editar orçamento ${f.code}` : `Novo orçamento ${f.code}`} onClose={() => setModal(null)} wide>
        <Row cols={3}>
          <div><L>Cliente</L>
            <div style={{ display: "flex", gap: 8 }}>
              <Combo value={f.clientId} onChange={(v) => setF({ ...f, clientId: v })} placeholder="— sem cliente —"
                options={[{ value: "", label: "— sem cliente —" }].concat(data.clients.map((c) => ({ value: c.id, label: c.name, sub: c.phone || undefined })))} />
              <Btn small kind="ghost" title="Cadastrar cliente" style={{ whiteSpace: "nowrap" }} onClick={() => {
                const n = prompt("Nome do novo cliente:");
                if (n && n.trim()) { const c = { id: uid(), name: n.trim(), phone: "", team: "", kids: "", niches: [], notes: "", createdAt: todayISO() }; saveItem("clients", c); setF((x) => ({ ...x, clientId: c.id })); }
              }}><Plus size={15} /></Btn>
            </div>
          </div>
          <div><L>Data</L><In type="date" value={f.date} onChange={(e) => setF({ ...f, date: e.target.value })} /></div>
          <div><L>Válido até</L><In type="date" value={f.validUntil} onChange={(e) => setF({ ...f, validUntil: e.target.value })} /></div>
        </Row>
        <L>Itens do orçamento</L>
        {f.items.map((it, i) => {
          const p = projMap[it.projectId];
          return (
            <div key={it.id} style={{ display: "grid", gridTemplateColumns: "2fr 62px 100px 110px 110px 34px", gap: 8, marginBottom: 8, alignItems: "center" }}>
              <div style={{ display: "flex", alignItems: "center", gap: 7, minWidth: 0 }}>
                {p && (p.image
                  ? <img src={p.image} alt="" style={{ width: 30, height: 30, objectFit: "cover", borderRadius: 6, border: "1px solid rgba(63,209,206,.14)", flexShrink: 0, display: "block" }} />
                  : <span style={{ width: 30, height: 30, borderRadius: 6, border: "1px solid rgba(63,209,206,.14)", background: "rgba(5,12,12,.55)", flexShrink: 0, display: "block" }} />)}
                <div style={{ flex: 1, minWidth: 0 }}>
                  <Combo value={it.projectId} onChange={(v) => { const np = projMap[v]; setItem(i, { projectId: v, unitPrice: it.unitPrice || sugPrice(np), filChoices: {} }); }} placeholder="— item avulso —"
                    options={[{ value: "", label: "— item avulso —" }].concat(activeProjects.map((x) => ({ value: x.id, label: x.name, sub: nichesText(x) || undefined })))} />
                </div>
              </div>
              <In type="number" min="1" value={it.qty} onChange={(e) => setItem(i, { qty: e.target.value })} title="Quantidade" />
              <In disabled title="Custo por peça (não editável)" value={p ? fmt(orderUnitCost(p, it.filChoices)) : "—"} style={{ background: "rgba(63,209,206,.06)", color: "#8FA3A3", textAlign: "right" }} />
              <In type="number" step="0.01" value={it.unitPrice} onChange={(e) => setItem(i, { unitPrice: e.target.value })} placeholder="R$ unit." title="Preço sugerido (editável)" />
              <div style={{ font: "600 13px 'JetBrains Mono',monospace", color: "#3FD1CE", textAlign: "right" }}>{fmt(num(it.qty) * num(it.unitPrice))}</div>
              <button onClick={() => setF({ ...f, items: f.items.filter((_, idx) => idx !== i) })} style={{ background: "none", border: "none", cursor: "pointer", color: "#F0605F" }}><Trash2 size={15} /></button>
              {!it.projectId && <In value={it.desc} onChange={(e) => setItem(i, { desc: e.target.value })} placeholder="Descrição do item avulso" style={{ gridColumn: "1 / -1" }} />}
              {it.kitName && <div style={{ gridColumn: "1 / -1", font: "600 11px Inter,sans-serif", color: "#FFB067", marginTop: -4 }}>📦 parte do kit "{it.kitName}"</div>}
              {p && projSlots(p).length > 0 && (
                <div className="quote-colors" style={{ gridColumn: "1 / -1", display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center", marginTop: -2 }}>
                  {projSlots(p).map((s) => {
                    const cur = (it.filChoices || {})[s.key] || s.filamentId; const fl = filMap[cur];
                    return (
                      <div key={s.key} className="quote-color" style={{ display: "flex", alignItems: "center", gap: 6, minWidth: 230, flex: projSlots(p).length > 1 ? "1 1 230px" : "0 1 320px" }}>
                        <span style={{ font: "600 11px Inter,sans-serif", color: "#8FA3A3", whiteSpace: "nowrap" }}>{projSlots(p).length > 1 ? s.label : "Cor"}</span>
                        <ColorDot hex={fl ? fl.colorHex : ""} size={13} />
                        <div style={{ flex: 1 }}><Combo value={cur} onChange={(v) => setItem(i, { filChoices: { ...(it.filChoices || {}), [s.key]: v } })} placeholder="— cor —" options={filOptionsFor(p)} /></div>
                      </div>
                    );
                  })}
                </div>
              )}
              {p && (() => {
                const sug = num(sugPrice(p)); const atual = num(it.unitPrice); const lucro = atual - orderUnitCost(p, it.filChoices);
                return (
                  <div style={{ gridColumn: "1 / -1", display: "flex", gap: 12, flexWrap: "wrap", font: "400 11px Inter,sans-serif", color: "#8FA3A3", marginTop: -4 }}>
                    <span>sugestão com margem {data.settings.defaultMargin}%: <b style={{ color: "#93A6A6" }}>{fmt(sug)}</b></span>
                    {Math.abs(atual - sug) > 0.005 && <a onClick={() => setItem(i, { unitPrice: sugPrice(p) })} style={{ color: "#14A6A4", cursor: "pointer", fontWeight: 600 }}>usar sugerido</a>}
                    <span>lucro/pç: <b style={{ color: lucro >= 0 ? "#3FD1CE" : "#F0605F" }}>{fmt(lucro)}</b></span>
                  </div>
                );
              })()}
              {p && prodQty(p.id) > 0 && (() => {
                const avail = availableQty(p.id, f.id);
                const enough = num(it.qty) <= avail;
                return (
                  <div style={{ gridColumn: "1 / -1", background: it.fromStock ? "rgba(245,130,31,.1)" : "rgba(5,12,12,.6)", border: `1px dashed ${it.fromStock ? "rgba(245,130,31,.55)" : "rgba(63,209,206,.35)"}`, borderRadius: 10, padding: "8px 11px", marginTop: -2 }}>
                    <label style={{ display: "flex", gap: 8, alignItems: "center", cursor: enough ? "pointer" : "default", opacity: enough || it.fromStock ? 1 : .75 }}>
                      <input type="checkbox" checked={!!it.fromStock} disabled={!enough && !it.fromStock} onChange={(e) => setItem(i, { fromStock: e.target.checked })} />
                      <span style={{ font: "400 12px Inter,sans-serif", color: "#C9DADA" }}>
                        ✔ Você tem <b>{fmtN(prodQty(p.id))} un em estoque</b>{reservedQty(p.id, f.id) > 0 ? ` (${fmtN(avail)} disponível — o restante já está reservado em outros orçamentos)` : ""}. <b style={{ color: "#FFB067" }}>Reservar do estoque (pronta entrega)?</b>
                        {!enough && <span style={{ color: "#F0605F" }}> — quantidade maior que o disponível</span>}
                      </span>
                    </label>
                  </div>
                );
              })()}
            </div>
          );
        })}
        <div style={{ display: "flex", gap: 8, alignItems: "center", marginBottom: 14, flexWrap: "wrap" }}>
          <Btn small kind="ghost" onClick={() => setF({ ...f, items: [...f.items, { id: uid(), projectId: "", desc: "", qty: 1, unitPrice: "" }] })}><Plus size={13} />Adicionar item</Btn>
          {(data.kits || []).length > 0 && (kitPick === null
            ? <Btn small kind="ghost" className="add-kit" onClick={() => setKitPick("")}><Package size={13} />+ Kit</Btn>
            : <div style={{ display: "flex", gap: 8, alignItems: "center", minWidth: 280 }}>
                <div style={{ flex: 1 }}><Combo value={kitPick} onChange={(v) => addKit(v)} placeholder="Escolher kit…"
                  options={(data.kits || []).filter((k) => k.active !== false).map((k) => ({ value: k.id, label: k.name, sub: num(k.price) > 0 ? fmt(k.price) : "sem preço" }))} /></div>
                <Btn small kind="ghost" onClick={() => setKitPick(null)}><XIc size={13} /></Btn>
              </div>)}
        </div>
        <Row cols={3}>
          <div><L>Desconto (R$)</L><In type="number" step="0.01" value={f.discount} onChange={(e) => setF({ ...f, discount: e.target.value })} /></div>
          <div><L>Prazo de entrega</L>
            <In type="date" value={f.deadline || est.date} onChange={(e) => setF({ ...f, deadline: e.target.value })} />
            <div style={{ font: "400 11px Inter,sans-serif", color: "#8FA3A3", marginTop: 4 }}>Sugestão pela fila: ~{est.days} dia(s) ({fmtN(backlogHours, 1)}h na fila{data.printers.length > 1 ? ` dividida em ${data.printers.length} impressoras` : ""} + {fmtN(hrs, 1)}h deste orçamento)</div>
          </div>
          <div style={{ textAlign: "right" }}>
            <L>Total</L>
            <div style={{ font: "700 24px 'Space Grotesk',sans-serif", color: "#3FD1CE" }}>{fmt(total)}</div>
          </div>
        </Row>
        <Row cols={1}><div><L>Observações (aparecem no PDF)</L><In value={f.notes} onChange={(e) => setF({ ...f, notes: e.target.value })} placeholder="ex: 50% de entrada para iniciar a produção" /></div></Row>
        <div style={{ display: "flex", justifyContent: "flex-end", gap: 10, marginTop: 6 }}>
          <Btn kind="ghost" onClick={() => setModal(null)}>Cancelar</Btn>
          <Btn disabled={f.items.length === 0} onClick={() => {
            const items = f.items.map((it) => it.fromStock && num(it.qty) <= availableQty(it.projectId, f.id) ? it : { ...it, fromStock: false });
            saveItem("quotes", { ...f, items, deadline: f.deadline || est.date });
            setModal(null); notify(item ? "Orçamento atualizado" : `Orçamento ${f.code} criado`);
          }}>Salvar orçamento</Btn>
        </div>
      </Modal>
    );
  }

  /* =============================== FINANCEIRO ============================== */
  const FIN_SRC = { sale: { l: "VENDA", c: "#3FD1CE", ic: "↑" }, recv: { l: "A RECEBER", c: "#FFAA5C", ic: "↑" }, exp: { l: "GASTO", c: "#8FA0AC", ic: "↓" }, fix: { l: "FIXO", c: "#FFD166", ic: "🗓" }, man: { l: "AVULSO", c: "#A88AF0", ic: "✍" } };
  const monthDays = (mk) => new Date(+mk.slice(0, 4), +mk.slice(5, 7), 0).getDate();
  const fixDue = (c, mk) => `${mk}-${String(Math.min(monthDays(mk), num(c.day) || 1)).padStart(2, "0")}`;
  const fixPaid = (c, mk) => (c.paidMonths || []).includes(mk);
  const shiftMonth = (mk, d) => { const x = new Date(mk + "-15T12:00:00"); x.setMonth(x.getMonth() + d); return x.toISOString().slice(0, 7); };
  /* contas fixas que ainda não foram marcadas como pagas, com o próximo vencimento (este mês ou o seguinte) */
  const upcomingFixed = () => {
    const t = todayISO(); const mk = t.slice(0, 7); const nx = shiftMonth(mk, 1);
    return (data.fixedCosts || []).map((c) => {
      const d1 = fixDue(c, mk);
      if (!fixPaid(c, mk)) return { c, due: d1, mk, days: Math.round((new Date(d1 + "T12:00:00") - new Date(t + "T12:00:00")) / 86400000) };
      const d2 = fixDue(c, nx);
      return fixPaid(c, nx) ? null : { c, due: d2, mk: nx, days: Math.round((new Date(d2 + "T12:00:00") - new Date(t + "T12:00:00")) / 86400000) };
    }).filter(Boolean).sort((a, b) => a.days - b.days);
  };
  const monthStatement = (mk) => {
    const rows = [];
    salesOrders.filter((o) => monthKey(o.date) === mk).forEach((o) => {
      const c = cliMap[o.clientId];
      rows.push({ date: o.date, kind: "in", desc: `Venda: ${projName(o)} × ${fmtN(o.qty)}${o.paid ? "" : " (a receber)"}`, value: num(o.price), cat: "Vendas", src: o.paid ? "sale" : "recv", sub: c ? c.name : "Venda sem cliente" });
    });
    data.expenses.filter((e) => monthKey(e.date) === mk).forEach((e) => {
      rows.push({ date: e.date, kind: "out", desc: `${e.category || e.cat || "Gasto"}: ${e.desc || e.name || ""}`, value: num(e.value), cat: e.category || e.cat || "Gastos", src: "exp", title: e.desc || e.name || e.category || "Gasto", sub: `Investimentos · ${e.category || e.cat || "Gasto"}` });
    });
    (data.fixedCosts || []).forEach((c) => {
      rows.push({ date: fixDue(c, mk), kind: "out", desc: `Custo fixo: ${c.name}`, value: num(c.value), cat: "Custos fixos", src: "fix", title: c.name, sub: `Custo fixo · vence dia ${num(c.day) || 1}${fixPaid(c, mk) ? " · pago" : ""}` });
    });
    (data.cashflow || []).filter((e) => monthKey(e.date) === mk).forEach((e) => {
      rows.push({ date: e.date, kind: e.kind, desc: e.desc, value: num(e.value), cat: e.cat || "Lançamento manual", manual: e, src: "man", title: e.desc, sub: `Lançamento avulso${e.cat ? " · " + e.cat : ""}` });
    });
    rows.sort((a, b) => (a.date || "") < (b.date || "") ? -1 : 1);
    const inn = rows.filter((r) => r.kind === "in").reduce((s, r) => s + r.value, 0);
    const out = rows.filter((r) => r.kind === "out").reduce((s, r) => s + r.value, 0);
    return { rows, inn, out, saldo: inn - out };
  };
  function Financeiro() {
    const [sub, setSubS] = useState(FIN_UI.sub);
    const setSub = (v) => { FIN_UI.sub = v; setSubS(v); };
    const [mk, setMkS] = useState(FIN_UI.month || thisMonth);
    const setMk = (v) => { FIN_UI.month = v; setMkS(v); };
    const [src, setSrcS] = useState(FIN_UI.src);
    const setSrc = (v) => { FIN_UI.src = v; setSrcS(v); };
    const [q, setQS] = useState(FIN_UI.q);
    const setQ = (v) => { FIN_UI.q = v; setQS(v); };
    const [help, setHelp] = useState(false);
    const [menu, setMenu] = useState(null);
    useEffect(() => {
      if (!menu) return;
      const close = (e) => { if (!(e.target.closest && e.target.closest(".neo-qmenu, .neo-qmore"))) setMenu(null); };
      document.addEventListener("mousedown", close);
      return () => document.removeEventListener("mousedown", close);
    }, [menu]);
    const today = todayISO();
    const monthLabel = new Date(mk + "-15T12:00:00").toLocaleDateString("pt-BR", { month: "long", year: "numeric" }).replace(" de ", " ");
    const st = monthStatement(mk);
    const prev = monthStatement(shiftMonth(mk, -1));
    const dIn = prev.inn > 0 ? ((st.inn - prev.inn) / prev.inn) * 100 : null;
    const recvMonth = st.rows.filter((r) => r.src === "recv").reduce((s, r) => s + r.value, 0);
    const expOut = st.rows.filter((r) => r.src === "exp").reduce((s, r) => s + r.value, 0);
    const fixOut = st.rows.filter((r) => r.src === "fix").reduce((s, r) => s + r.value, 0);
    const manOut = st.rows.filter((r) => r.src === "man" && r.kind === "out").reduce((s, r) => s + r.value, 0);
    const nDays = monthDays(mk);
    const todayIdx = mk === thisMonth ? +today.slice(8, 10) : mk < thisMonth ? nDays : 0;
    const daysElapsed = Math.max(1, todayIdx || nDays);
    const perDay = st.inn / daysElapsed;
    const fixDays = perDay > 0 && monthFixedTotal > 0 ? Math.ceil(monthFixedTotal / perDay) : null;
    // saldo dia a dia
    const cum = [0]; for (let d = 1; d <= nDays; d++) { const dk = `${mk}-${String(d).padStart(2, "0")}`; cum.push(cum[d - 1] + st.rows.filter((r) => r.date === dk).reduce((s, r) => s + (r.kind === "in" ? r.value : -r.value), 0)); }
    const cMin = Math.min(0, ...cum), cMax = Math.max(0, ...cum); const span = Math.max(1, cMax - cMin);
    const CW = 1000, CH = 150;
    const cx = (d) => (d / nDays) * CW, cy = (v) => CH - 12 - ((v - cMin) / span) * (CH - 30);
    const pathOf = (a, b) => cum.slice(a, b + 1).map((v, i) => `${i ? "L" : "M"}${cx(a + i).toFixed(1)},${cy(v).toFixed(1)}`).join(" ");
    const realPath = todayIdx > 0 ? pathOf(0, todayIdx) : "";
    const prevPath = todayIdx < nDays ? pathOf(todayIdx, nDays) : "";
    // 6 meses
    const m6 = Array.from({ length: 6 }).map((_, i) => { const m = shiftMonth(mk, i - 5); return { m, v: monthStatement(m).saldo }; });
    const m6max = Math.max(1, ...m6.map((x) => Math.abs(x.v)));
    // extrato
    const srcCount = (k) => st.rows.filter((r) => (k === "sale" ? r.src === "sale" || r.src === "recv" : k === "in" ? r.kind === "in" : k === "out" ? r.kind === "out" : r.src === k)).length;
    const rows = st.rows.filter((r) => (src === "all" || (src === "sale" ? r.src === "sale" || r.src === "recv" : src === "in" ? r.kind === "in" : src === "out" ? r.kind === "out" : r.src === src))
      && (!q || `${r.desc} ${r.sub || ""}`.toLowerCase().includes(q.toLowerCase()))).slice().reverse();
    const days = []; rows.forEach((r) => { const last = days[days.length - 1]; if (last && last.d === r.date) last.items.push(r); else days.push({ d: r.date, items: [r] }); });
    const upc = upcomingFixed().slice(0, 4);
    // a receber
    const arList = data.orders.filter((o) => isDone(o) && isSale(o) && !o.paid).sort((a, b) => (a.date < b.date ? -1 : 1));
    const arTotal = arList.reduce((s, o) => s + num(o.price), 0);
    const ageOf = (o) => daysSince(o.date) || 0;
    const bk = [[0, 15, "#3FD1CE", "até 15 dias"], [16, 30, "#FFD166", "16–30 dias"], [31, 1e9, "#FF6B6B", "+30 dias"]].map(([a, b, c, l]) => ({ c, l, v: arList.filter((o) => ageOf(o) >= a && ageOf(o) <= b).reduce((s, o) => s + num(o.price), 0) }));
    const recebidoMes = data.orders.filter((o) => isSale(o) && o.paid && monthKey(o.date) === mk).reduce((s, o) => s + num(o.price), 0);
    const ageColor = (d) => (d > 30 ? "#FF6B6B" : d > 15 ? "#FFD166" : "#3FD1CE");
    // custos fixos
    const fixed = (data.fixedCosts || []).slice().sort((a, b) => (num(a.day) || 1) - (num(b.day) || 1));
    const paidSum = fixed.filter((c) => fixPaid(c, mk)).reduce((s, c) => s + num(c.value), 0);
    const togglePaid = (c, v) => { const pm = (c.paidMonths || []).filter((m) => m !== mk); logAs(`${v ? "Marcou como pago" : "Desmarcou o pagamento de"}: ${c.name} (${monthLabel})`); saveItem("fixedCosts", { ...c, paidMonths: v ? [...pm, mk] : pm }); };
    const dueByDay = {}; fixed.forEach((c) => { const d = +fixDue(c, mk).slice(8, 10); (dueByDay[d] = dueByDay[d] || []).push(c); });
    const fixStatus = (c) => {
      if (fixPaid(c, mk)) return null;
      const dd = Math.round((new Date(fixDue(c, mk) + "T12:00:00") - new Date(today + "T12:00:00")) / 86400000);
      if (mk > thisMonth) return { t: `em ${dd} dias`, c: "#7F9A9B" };
      if (dd > 0) return { t: dd === 1 ? "amanhã" : `em ${dd} dias`, c: dd <= 3 ? "#FFD166" : "#7F9A9B" };
      if (dd === 0) return { t: "vence hoje", c: "#FFD166" };
      return { t: `venceu há ${-dd} dia${dd === -1 ? "" : "s"}`, c: "#FF6B6B" };
    };
    const sCode = (n) => (n >= 0 ? "+ " : "− ") + fmt(Math.abs(n));
    return (
      <div className="neo-finpage">
        <div className="neo-pagehead">
          <span className="neo-code">FINANCEIRO</span><h2>Dinheiro do negócio</h2>
          <button className={"neo-help" + (help ? " on" : "")} onClick={() => setHelp(!help)} title="Como funciona">?</button>
          <div className="neo-oacts" style={{ marginLeft: "auto" }}>
            <button className="neo-bg2 ic fin-prev" title="Mês anterior" onClick={() => setMk(shiftMonth(mk, -1))}>‹</button>
            <span className="neo-mlabel">{monthLabel}</span>
            <button className="neo-bg2 ic fin-next" title="Próximo mês" onClick={() => setMk(shiftMonth(mk, 1))}>›</button>
            {sub === "fixos" ? <Btn onClick={() => setModal({ type: "fixedCost" })}><Plus size={16} />Custo fixo</Btn> : <Btn onClick={() => setModal({ type: "cashflow" })}><Plus size={16} />Lançamento</Btn>}
          </div>
        </div>
        {help && <div className="neo-hud neo-helpbox">💡 O Financeiro junta tudo sozinho: vendas concluídas (Pedidos), gastos (Investimentos) e custos fixos mensais. Use “Lançamento” só para entradas ou saídas que não passam por esses lugares — assim nada é contado duas vezes.</div>}
        <div className="neo-seg fin-tabs" style={{ width: "max-content", maxWidth: "100%", marginBottom: 14, flexWrap: "wrap" }}>
          {[["fluxo", "📈 Fluxo de caixa", null], ["receber", "💰 A receber", arList.length], ["fixos", "🗓 Custos fixos", fixed.length]].map(([k, l, n]) => <button key={k} className={"fin-tab" + (sub === k ? " on" : "")} data-t={k} onClick={() => setSub(k)}>{l}{n ? <i>{n}</i> : null}</button>)}
        </div>

        {sub === "fluxo" && (
          <React.Fragment>
            <div className="neo-ckpis">
              <Reveal className="neo-hud neo-k fin-k-in" delay={0}><div className="l">Entrou no mês</div><div className="v" style={{ color: "#3FD1CE" }}><CountUp value={st.inn} format={fmt} /></div><span className="neo-kd">{dIn == null ? "" : <span className={dIn >= 0 ? "up" : "dn"}>{dIn >= 0 ? "▲" : "▼"} {fmtN(Math.abs(dIn), 0)}% vs mês anterior{recvMonth > 0 ? " · " : ""}</span>}{recvMonth > 0 ? <span style={{ color: "#FFAA5C" }}>{fmt(recvMonth)} ainda a receber</span> : dIn == null ? "vendas e entradas avulsas" : ""}</span></Reveal>
              <Reveal className="neo-hud neo-k fin-k-out" delay={60}><div className="l">Saiu no mês</div><div className="v" style={{ color: "#FF6B6B" }}><CountUp value={st.out} format={fmt} /></div><span className="neo-kd">gastos {fmt(expOut)} · fixos {fmt(fixOut)}{manOut > 0 ? ` · avulsos ${fmt(manOut)}` : ""}</span></Reveal>
              <Reveal className="neo-hud neo-k fin-k-saldo" delay={120}><div className="l">Saldo do mês <InfoTip text="Tudo que entrou menos tudo que saiu no mês (vendas concluídas, gastos lançados em Investimentos, custos fixos e lançamentos avulsos). Vendas ainda não pagas já entram aqui, porque o dinheiro é seu — só falta receber." /></div><div className="v" style={{ color: st.saldo >= 0 ? "#3FD1CE" : "#FF6B6B" }}><CountUp value={st.saldo} format={(v) => sCode(v)} /></div><span className="neo-kd">{st.inn > 0 ? `de cada R$ 1 que entrou, ${st.saldo >= 0 ? "sobraram" : "faltaram"} ${fmt(Math.abs(st.saldo) / st.inn)}` : "sem entradas neste mês"}</span></Reveal>
              <Reveal className="neo-hud neo-k fin-k-fix" delay={180}><div className="l">Custos fixos/mês <InfoTip text="Soma das contas que se repetem todo mês (internet, assinaturas, aluguel…). O número de dias é quanto tempo das vendas deste mês (na média por dia) é preciso para pagar essas contas." /></div><div className="v" style={{ color: "#FFD166" }}><CountUp value={monthFixedTotal} format={fmt} /></div><span className="neo-kd">{fixDays != null ? `≈ ${fixDays} dia${fixDays > 1 ? "s" : ""} de vendas para pagar` : `${fixed.length} conta(s) cadastrada(s)`}</span></Reveal>
            </div>
            <Reveal className="neo-hud neo-finchart" delay={80}>
              <span className="neo-code">SALDO DIA A DIA</span>
              <span className="neo-finleg"><b>━</b> real{todayIdx < nDays && <> &nbsp; <b style={{ opacity: .55 }}>┅</b> previsão (contas fixas que ainda vão vencer)</>}</span>
              <div className="neo-finsvg">
                <svg viewBox={`0 0 ${CW} ${CH}`} preserveAspectRatio="none">
                  <defs><linearGradient id="fin-ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stopColor="#3FD1CE" stopOpacity=".35" /><stop offset="1" stopColor="#3FD1CE" stopOpacity="0" /></linearGradient></defs>
                  <line x1="0" x2={CW} y1={cy(0)} y2={cy(0)} stroke="rgba(127,154,155,.35)" strokeDasharray="3 4" vectorEffect="non-scaling-stroke" />
                  {realPath && <path d={`${realPath} L${cx(todayIdx)},${cy(0)} L0,${cy(0)} Z`} fill="url(#fin-ga)" />}
                  {realPath && <path className="fin-real" d={realPath} fill="none" stroke="#3FD1CE" strokeWidth="2.5" vectorEffect="non-scaling-stroke" style={{ filter: "drop-shadow(0 0 4px #3FD1CE)" }} />}
                  {prevPath && <path className="fin-prevline" d={prevPath} fill="none" stroke="#3FD1CE" strokeWidth="2" strokeDasharray="6 6" opacity=".5" vectorEffect="non-scaling-stroke" />}
                  {todayIdx > 0 && todayIdx < nDays && <line x1={cx(todayIdx)} x2={cx(todayIdx)} y1="0" y2={CH} stroke="#F5821F" strokeDasharray="3 3" vectorEffect="non-scaling-stroke" />}
                </svg>
                {todayIdx > 0 && todayIdx < nDays && <React.Fragment><span className="neo-findot" style={{ left: `${(todayIdx / nDays) * 100}%`, top: cy(cum[todayIdx]) }} /><span className="neo-fintoday" style={{ left: `${(todayIdx / nDays) * 100}%` }}>HOJE · {fmt(cum[todayIdx])}</span></React.Fragment>}
                <div className="neo-finx">{Array.from({ length: nDays }).map((_, i) => ((i + 1) % 4 === 1 ? <span key={i} style={{ left: `${((i + 1) / nDays) * 100}%` }}>{String(i + 1).padStart(2, "0")}</span> : null))}</div>
              </div>
            </Reveal>
            <div className="neo-penbar">
              <div className="neo-fchips">
                {[["all", "Tudo"], ["sale", "🛒 Vendas"], ["exp", "🧾 Gastos"], ["fix", "🗓 Fixos"], ["man", "✍ Avulsos"], ["in", "↑ só entradas"], ["out", "↓ só saídas"]].map(([k, l]) => <button key={k} className={"neo-fchip fin-src" + (src === k ? " on" : "")} data-s={k} onClick={() => setSrc(k)}>{l}{k === "in" || k === "out" ? "" : ` ${k === "all" ? st.rows.length : srcCount(k)}`}</button>)}
              </div>
              <div className="neo-search"><SearchIc size={14} /><input value={q} onChange={(e) => setQ(e.target.value)} placeholder="Descrição…" />{q && <button onClick={() => setQ("")}>×</button>}</div>
            </div>
            <div className="neo-expgrid">
              <div className="neo-hud">
                <span className="neo-code">EXTRATO</span>
                {rows.length === 0 ? <Empty icon={BanknoteIc} text={st.rows.length ? "Nada neste filtro" : "Nenhuma movimentação neste mês"} hint="Vendas, gastos e custos fixos entram aqui automaticamente. Use “Lançamento” para entradas/saídas avulsas." /> : days.map((g) => {
                  const ds = g.items.reduce((s, r) => s + (r.kind === "in" ? r.value : -r.value), 0);
                  return (
                    <React.Fragment key={g.d}>
                      <div className="neo-expday">{new Date(g.d + "T12:00:00").toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit", weekday: "short" }).replace(".", "").toUpperCase()}<span style={{ color: ds >= 0 ? "#3FD1CE" : "#FF6B6B" }}>{sCode(ds)}</span></div>
                      {g.items.map((r, i) => {
                        const S = FIN_SRC[r.src] || FIN_SRC.man;
                        const icCol = r.src === "sale" || r.src === "recv" ? "#3FD1CE" : r.src === "exp" ? "#FF6B6B" : S.c;
                        const id = r.manual ? r.manual.id : `${g.d}-${i}`;
                        return (
                          <div key={id} className="neo-finrow" data-src={r.src} style={menu === id ? { zIndex: 30, position: "relative" } : undefined}>
                            <span className="ic" style={{ color: icCol }}>{r.src === "man" ? (r.kind === "in" ? "↑" : "↓") : S.ic}</span>
                            <div style={{ minWidth: 0 }}><b>{r.title || r.desc.replace(" (a receber)", "")}</b><small>{r.sub}</small></div>
                            <span className="tag" style={{ color: S.c }}>{S.l}</span>
                            <span className="v" style={{ color: r.kind === "in" ? "#3FD1CE" : "#FF6B6B", opacity: r.src === "recv" ? .75 : 1 }}>{r.kind === "in" ? "+ " : "− "}{fmt(r.value)}</span>
                            <div className="neo-oacts">{r.manual ? <React.Fragment>
                              <button className={"neo-bg2 ic neo-qmore" + (menu === id ? " on" : "")} title="Mais opções" onClick={() => setMenu(menu === id ? null : id)}>⋯</button>
                              {menu === id && <div className="neo-qmenu"><button onClick={() => { setMenu(null); setModal({ type: "cashflow", item: r.manual }); }}><Pencil size={13} />Editar</button><button className="r fin-del" onClick={() => { setMenu(null); if (confirm(`Excluir o lançamento "${r.desc}" (${fmt(r.value)})?`)) delItem("cashflow", r.manual.id); }}><Trash2 size={13} />Excluir</button></div>}
                            </React.Fragment> : <span style={{ width: 30 }} />}</div>
                          </div>
                        );
                      })}
                    </React.Fragment>
                  );
                })}
                {st.rows.length > 0 && <div className="neo-finsum"><span>Saldo do mês</span><b><span style={{ color: "#3FD1CE" }}>{fmt(st.inn)}</span> − <span style={{ color: "#FF6B6B" }}>{fmt(st.out)}</span> = <span style={{ color: st.saldo >= 0 ? "#3FD1CE" : "#FF6B6B" }}>{fmt(st.saldo)}</span></b></div>}
              </div>
              <div className="neo-col">
                <Reveal className="neo-hud neo-fincmp" delay={60}>
                  <span className="neo-code">ENTROU × SAIU</span>
                  <div><label>Entrou <b style={{ color: "#3FD1CE" }}>{fmt(st.inn)}</b></label><div className="tr"><i style={{ width: `${(st.inn / Math.max(1, st.inn, st.out)) * 100}%`, background: "linear-gradient(90deg,#14B8B2,#3FD1CE)" }} /></div></div>
                  <div><label>Saiu <b style={{ color: "#FF6B6B" }}>{fmt(st.out)}</b></label><div className="tr"><i style={{ width: `${(st.out / Math.max(1, st.inn, st.out)) * 100}%`, background: "linear-gradient(90deg,#c44,#FF6B6B)" }} /></div></div>
                  <div className="mini"><span>Gastos (Investimentos)</span><b>{fmt(expOut)}</b></div>
                  <div className="mini"><span>Custos fixos</span><b>{fmt(fixOut)}</b></div>
                  <div className="mini" style={{ border: 0 }}><span>Saídas avulsas</span><b>{fmt(manOut)}</b></div>
                </Reveal>
                <Reveal className="neo-hud" delay={120}>
                  <span className="neo-code">PRÓXIMOS VENCIMENTOS</span>
                  {upc.length === 0 ? <div className="neo-empty">{fixed.length ? "Todas as contas fixas estão pagas. 👌" : "Nenhum custo fixo cadastrado."}</div> : upc.map((u) => (
                    <div key={u.c.id} className="neo-findue">
                      <span className="d">{u.due.slice(8, 10)}<small>{new Date(u.due + "T12:00:00").toLocaleDateString("pt-BR", { month: "short" }).replace(".", "").toUpperCase()}</small></span>
                      <div>{u.c.name}<em style={{ color: u.days < 0 ? "#FF6B6B" : u.days <= 3 ? "#FFD166" : undefined }}>{u.days < 0 ? `venceu há ${-u.days} dia(s)` : u.days === 0 ? "vence hoje" : u.days === 1 ? "vence amanhã" : `vence em ${u.days} dias`}</em></div>
                      <b>{fmt(u.c.value)}</b>
                    </div>
                  ))}
                  {upc.length > 0 && <button className="neo-go" style={{ marginTop: 8 }} onClick={() => setSub("fixos")}>Ver custos fixos</button>}
                </Reveal>
                <Reveal className="neo-hud" delay={180}>
                  <span className="neo-code">ÚLTIMOS 6 MESES · SALDO</span>
                  <div className="neo-expbars fin-bars" style={{ height: 120 }}>
                    {m6.map((x) => (
                      <button key={x.m} className={"exp-bar" + (x.m === mk ? " on" : "") + (x.v < 0 ? " neg" : "")} title={`Saldo ${sCode(x.v)} — clique para ver o mês`} onClick={() => setMk(x.m)}>
                        <small>{x.v !== 0 ? (x.v < 0 ? "−" : "") + fmtN(Math.round(Math.abs(x.v))) : ""}</small>
                        <i style={{ height: Math.max(2, (Math.abs(x.v) / m6max) * 100) + "%" }} />
                        <span>{new Date(x.m + "-15T12:00:00").toLocaleDateString("pt-BR", { month: "short" }).replace(".", "")}</span>
                      </button>
                    ))}
                  </div>
                </Reveal>
              </div>
            </div>
          </React.Fragment>
        )}

        {sub === "receber" && (
          <div className="neo-hud neo-finar">
            <span className="neo-code">QUEM ME DEVE</span>
            <div className="neo-finbig"><span style={{ color: "#FFAA5C" }}><CountUp value={arTotal} format={fmt} /></span><small>{arList.length} venda(s) em aberto · recebido em {monthLabel.split(" ")[0]}: {fmt(recebidoMes)}</small></div>
            {arTotal > 0 && <React.Fragment>
              <div className="neo-finage">{bk.filter((b) => b.v > 0).map((b) => <i key={b.l} style={{ width: `${(b.v / arTotal) * 100}%`, background: b.c }} title={`${b.l}: ${fmt(b.v)}`} />)}</div>
              <div className="neo-finagel">{bk.map((b) => <span key={b.l}><i style={{ background: b.c }} />{b.l} <b>{fmt(b.v)}</b></span>)}</div>
            </React.Fragment>}
            {arList.length === 0 ? <Empty icon={CheckCircle2} text="Tudo recebido!" hint="Nenhuma venda em aberto. Quando uma venda concluída não estiver marcada como paga, ela aparece aqui." /> : arList.map((o) => {
              const c = cliMap[o.clientId]; const d = ageOf(o); const col = ageColor(d);
              return (
                <div key={o.id} className="neo-finarrow" data-id={o.id}>
                  <span className="dd" style={{ color: col, boxShadow: `0 0 12px ${col}33` }}>{d}<small>{d === 1 ? "DIA" : "DIAS"}</small></span>
                  <div style={{ minWidth: 0 }}><b>{c ? c.name : "Venda sem cliente"}</b><small>{projName(o)} × {fmtN(o.qty)} · venda {fmtDate(o.date)}</small></div>
                  <div className="rt">
                    <div className="v">{fmt(num(o.price))}</div>
                    <div className="neo-oacts">
                      <button className="neo-bg2" title="Imagem com QR e chave PIX" onClick={() => openPix(`Venda ${fmtDate(o.date)} · ${projName(o)}`, o.clientId)}>PIX</button>
                      {c && c.phone && <button className="neo-bg2 wa fin-wa" title="Cobrar no WhatsApp" onClick={() => waOpen(c.phone, cobrarMsg(c, [o]))}><WhatsIc size={13} />Cobrar</button>}
                      <button className="neo-bp fin-recv" onClick={() => { saveItem("orders", { ...o, paid: true }); notify("Recebimento registrado ✓"); }}><CheckCircle2 size={13} />Recebi</button>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        )}

        {sub === "fixos" && (
          <div className="neo-hud neo-finfix">
            <span className="neo-code">CUSTOS FIXOS</span>
            <div className="neo-finbig"><span style={{ color: "#FFD166" }}><CountUp value={monthFixedTotal} format={fmt} /></span><small>por mês · {fixed.length} conta(s) · pago em {monthLabel.split(" ")[0]}: <b style={{ color: "#3FD1CE" }}>{fmt(paidSum)}</b></small></div>
            {fixed.length > 0 && <React.Fragment>
              <div className="neo-fincal" style={{ gridTemplateColumns: `repeat(${nDays},1fr)` }}>
                {Array.from({ length: nDays }).map((_, i) => {
                  const d = i + 1; const cs = dueByDay[d] || [];
                  const cls = cs.length ? (cs.every((c) => fixPaid(c, mk)) ? " pd" : " on") : "";
                  return <span key={d} className={cls + (mk === thisMonth && d === +today.slice(8, 10) ? " td" : "")} title={cs.length ? cs.map((c) => `${c.name} — ${fmt(c.value)}${fixPaid(c, mk) ? " (pago)" : ""}`).join("\n") : undefined}>{d}</span>;
                })}
              </div>
              <div className="neo-fincalleg">Régua do mês: <b style={{ color: "#FFD166" }}>■</b> vence &nbsp;<b style={{ color: "#3FD1CE" }}>■</b> pago{mk === thisMonth && <> &nbsp;<b style={{ color: "#F5821F" }}>▢</b> hoje</>}</div>
            </React.Fragment>}
            {fixed.length === 0 ? <Empty icon={ClockIc} text="Nenhum custo fixo cadastrado" hint="Internet, energia base, assinaturas, aluguel… tudo que se repete todo mês. Eles entram sozinhos no fluxo de caixa e na contabilidade." /> : fixed.map((c) => {
              const s = fixStatus(c); const paid = fixPaid(c, mk);
              return (
                <div key={c.id} className={"neo-finfc" + (paid ? " paid" : "")} data-id={c.id} style={menu === c.id ? { zIndex: 30, position: "relative" } : undefined}>
                  <span className="dd">{num(c.day) || 1}<small>DIA</small></span>
                  <div style={{ minWidth: 0 }}><b>{c.name}</b><div className="sh" title={`${fmtN((num(c.value) / Math.max(1, monthFixedTotal)) * 100, 0)}% do total`}><i style={{ width: `${(num(c.value) / Math.max(1, monthFixedTotal)) * 100}%` }} /></div></div>
                  <span className="v">{fmt(c.value)}</span>
                  <span className="st">{paid ? <span className="pill">✓ PAGO</span> : <em style={{ color: s.c }}>{s.t}</em>}<Switch on={paid} title={paid ? "Pago neste mês — clique para desmarcar" : "Marcar como pago neste mês"} onChange={(v) => togglePaid(c, v)} /></span>
                  <div className="neo-oacts">
                    <button className="neo-bg2 ic" title="Editar" onClick={() => setModal({ type: "fixedCost", item: c })}><Pencil size={13} /></button>
                    <button className={"neo-bg2 ic neo-qmore" + (menu === c.id ? " on" : "")} title="Mais opções" onClick={() => setMenu(menu === c.id ? null : c.id)}>⋯</button>
                    {menu === c.id && <div className="neo-qmenu"><button className="r fix-del" onClick={() => { setMenu(null); if (confirm(`Remover o custo fixo "${c.name}"?`)) delItem("fixedCosts", c.id); }}><Trash2 size={13} />Excluir</button></div>}
                  </div>
                </div>
              );
            })}
            {fixed.length > 0 && <div className="neo-exptotal"><span>Total mensal</span><b style={{ color: "#FFD166" }}>{fmt(monthFixedTotal)}</b></div>}
          </div>
        )}
      </div>
    );
  }
  function FixedCostModal({ item }) {
    const [f, setF] = useState(item || { id: uid(), name: "", value: "", day: "" });
    return (
      <Modal title={item ? "Editar custo fixo" : "Novo custo fixo mensal"} onClose={() => setModal(null)}>
        <Row cols={1}><div><L>Nome da conta</L><In value={f.name} onChange={(e) => setF({ ...f, name: e.target.value })} placeholder="ex: Internet, Energia (parte fixa), Canva Pro" /></div></Row>
        <Row>
          <div><L>Valor mensal (R$)</L><In type="number" step="0.01" value={f.value} onChange={(e) => setF({ ...f, value: e.target.value })} /></div>
          <div><L>Dia do vencimento</L><In type="number" min="1" max="31" value={f.day} onChange={(e) => setF({ ...f, day: e.target.value })} /></div>

        <div style={{ display: "flex", justifyContent: "flex-end", gap: 10, marginTop: 6 }}>
          <Btn kind="ghost" onClick={() => setModal(null)}>Cancelar</Btn>

      <Modal title="Lançamento avulso no caixa" onClose={() => setModal(null)}>
        <Row>
          <div><L>Tipo</L>
            <Sel value={f.kind} onChange={(e) => setF({ ...f, kind: e.target.value })}>
              <option value="in">ENTRADA (recebi)</option>
              <option value="out">SAÍDA (paguei)</option>
            </Sel>
          </div>
          <div><L>Data</L><In type="date" value={f.date} onChange={(e) => setF({ ...f, date: e.target.value })} /></div>
        </Row>
        <Row>
          <div><L>Descrição</L><In value={f.desc} onChange={(e) => setF({ ...f, desc: e.target.value })} placeholder="ex: Frete pago pelo cliente" /></div>
          <div><L>Valor (R$)</L><In type="number" step="0.01" value={f.value} onChange={(e) => setF({ ...f, value: e.target.value })} /></div>
        </Row>
        <div style={{ font: "400 12px Inter,sans-serif", color: "#8FA3A3", marginBottom: 12 }}>Use apenas para movimentações que não passam por Pedidos nem Investimentos, para não contar duas vezes.</div>
        <div style={{ display: "flex", justifyContent: "flex-end", gap: 10 }}>
          <Btn kind="ghost" onClick={() => setModal(null)}>Cancelar</Btn>
          <Btn disabled={!f.desc || !f.value} onClick={() => { saveItem("cashflow", f); setModal(null); notify("Lançamento registrado"); }}>Salvar</Btn>
        </div>
      </Modal>
    );
  }

  /* ============================== CONTABILIDADE ============================ */
  function Contabilidade() {
    const [mk, setMk] = useState(thisMonth);
    const mSales = salesOrders.filter((o) => monthKey(o.date) === mk);
    const receita = mSales.reduce((s, o) => s + num(o.price), 0);
    const cpv = mSales.reduce((s, o) => s + num(o.cost), 0);
    const lucroBruto = receita - cpv;
    const equipTotal = data.expenses.filter((e) => (e.category || e.cat) === "Equipamento").reduce((s, e) => s + num(e.value), 0);
    const deprMes = equipTotal / 36;
    const despVar = data.expenses.filter((e) => monthKey(e.date) === mk && (e.category || e.cat) !== "Equipamento").reduce((s, e) => s + num(e.value), 0);
    const resultado = lucroBruto - monthFixedTotal - despVar - deprMes;
    const margContrib = receita > 0 ? 1 - cpv / receita : 0;
    const breakEven = margContrib > 0 ? (monthFixedTotal + deprMes) / margContrib : 0;
    const ticket = mSales.length > 0 ? receita / mSales.reduce((s, o) => s + num(o.qty), 0) : 0;
    // balanço simplificado
    const caixaHist = (() => { let t = 0; data.orders.filter((o) => isDone(o) && isSale(o) && o.paid).forEach((o) => t += num(o.price)); data.expenses.forEach((e) => t -= num(e.value)); (data.cashflow || []).forEach((e) => t += (e.kind === "in" ? 1 : -1) * num(e.value)); return t; })();
    const estoqueFil = data.filaments.reduce((s, f) => s + num(f.stockG) / 1000 * (num(f.price) / Math.max(1, num(f.qtyG)) * 1000), 0);
    const estoqueProd = data.products.reduce((s, p) => { const pr = projMap[p.projectId]; return s + num(p.qty) * (pr ? num(pr.cost) : 0); }, 0);
    const firstEquip = data.expenses.filter((e) => (e.category || e.cat) === "Equipamento").map((e) => e.date).sort()[0];
    const monthsSince = firstEquip ? Math.max(0, (new Date().getFullYear() - +firstEquip.slice(0, 4)) * 12 + (new Date().getMonth() + 1 - +firstEquip.slice(5, 7))) : 0;
    const deprAcum = Math.min(equipTotal, deprMes * monthsSince);
    const equipLiq = equipTotal - deprAcum;
    const ativoTotal = caixaHist + estoqueFil + estoqueProd + equipLiq;
    const DreLine = ({ label, value, bold, neg, indent }) => (
      <div style={{ display: "flex", justifyContent: "space-between", padding: "8px 0", borderBottom: "1px solid rgba(63,209,206,.1)", font: `${bold ? 700 : 400} ${bold ? 14.5 : 13.5}px Inter,sans-serif`, paddingLeft: indent ? 16 : 0 }}>
        <span>{label}</span>
        <span style={{ fontFamily: "'JetBrains Mono',monospace", fontWeight: bold ? 700 : 500, color: neg ? "#F0605F" : (bold ? "#3FD1CE" : "#F3F6F6") }}>{neg ? `(${fmt(value)})` : fmt(value)}</span>
      </div>
    );
    return (
      <div>
        <SectionHead title="Contabilidade">
          <In type="month" value={mk} onChange={(e) => setMk(e.target.value)} style={{ width: 170 }} />
        </SectionHead>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(330px,1fr))", gap: 14 }}>
          <Card>
            <div style={{ font: "600 14px 'Space Grotesk',sans-serif", marginBottom: 4 }}>DRE — Demonstrativo de resultado</div>
            <div style={{ font: "400 11.5px Inter,sans-serif", color: "#93A6A6", marginBottom: 10 }}>Quanto o negócio realmente lucrou no mês</div>
            <DreLine label="Receita bruta de vendas" value={receita} />
            <DreLine label="(−) Custo dos produtos vendidos" value={cpv} neg indent />
            <DreLine label="= Lucro bruto" value={lucroBruto} bold />
            <DreLine label="(−) Custos fixos mensais" value={monthFixedTotal} neg indent />
            <DreLine label="(−) Gastos do mês (Investimentos)" value={despVar} neg indent />
            <DreLine label="(−) Depreciação de equipamentos" value={deprMes} neg indent />
            <div style={{ display: "flex", justifyContent: "space-between", padding: "10px 0 2px", font: "700 16px 'Space Grotesk',sans-serif" }}>
              <span>= Resultado líquido</span>
              <span style={{ fontFamily: "'JetBrains Mono',monospace", color: resultado >= 0 ? "#3FD1CE" : "#F0605F" }}>{fmt(resultado)}</span>
            </div>
            <div style={{ font: "400 12px Inter,sans-serif", color: "#93A6A6", marginTop: 4 }}>{receita > 0 ? `Margem líquida de ${fmtN((resultado / receita) * 100, 1)}%` : "Sem vendas no mês selecionado"}</div>
          </Card>
          <Card>
            <div style={{ font: "600 14px 'Space Grotesk',sans-serif", marginBottom: 4 }}>Ponto de equilíbrio</div>
            <div style={{ font: "400 11.5px Inter,sans-serif", color: "#93A6A6", marginBottom: 10 }}>Quanto você precisa faturar por mês para não sair no prejuízo</div>
            {margContrib <= 0 ? <div style={{ font: "400 13px Inter,sans-serif", color: "#93A6A6" }}>Registre vendas com custo cadastrado para calcular a margem de contribuição.</div>
            : <React.Fragment>
                <div style={{ font: "700 28px 'Space Grotesk',sans-serif", color: "#3FD1CE" }}>{fmt(breakEven)}<span style={{ font: "500 13px Inter,sans-serif", color: "#93A6A6" }}> /mês</span></div>
                <div style={{ font: "400 13px Inter,sans-serif", color: "#D6E2E2", marginTop: 8, lineHeight: 1.6 }}>
                  Margem de contribuição média: <b>{fmtN(margContrib * 100, 1)}%</b><br />
                  {ticket > 0 && <span>Com ticket médio de {fmt(ticket)}, isso equivale a <b>~{fmtN(Math.ceil(breakEven / ticket))} peças/mês</b>.<br /></span>}
                  Faturamento atual do mês: <b style={{ color: receita >= breakEven ? "#3FD1CE" : "#F0605F" }}>{fmt(receita)}</b> ({receita >= breakEven ? "acima" : "abaixo"} do equilíbrio)
                </div>
                <div style={{ height: 8, background: "rgba(5,12,12,.55)", borderRadius: 99, marginTop: 12 }}>
                  <div style={{ height: 8, width: `${Math.min(100, breakEven > 0 ? (receita / breakEven) * 100 : 0)}%`, background: receita >= breakEven ? "#14A6A4" : "#F47A20", borderRadius: 99 }} />
                </div>
              </React.Fragment>}
          </Card>
          <Card>
            <div style={{ font: "600 14px 'Space Grotesk',sans-serif", marginBottom: 4 }}>Balanço simplificado</div>
            <div style={{ font: "400 11.5px Inter,sans-serif", color: "#93A6A6", marginBottom: 10 }}>O que o negócio tem hoje (posição acumulada)</div>
            <DreLine label="Caixa acumulado (recebido − gasto)" value={caixaHist} neg={caixaHist < 0} />
            <DreLine label="Estoque de filamento (ao custo)" value={estoqueFil} />
            <DreLine label="Produtos acabados (ao custo)" value={estoqueProd} />
            <DreLine label={`Equipamentos (${fmt(equipTotal)} − depreciação)`} value={equipLiq} />
            <div style={{ display: "flex", justifyContent: "space-between", padding: "10px 0 2px", font: "700 15px 'Space Grotesk',sans-serif" }}>
              <span>Patrimônio total</span>
              <span style={{ fontFamily: "'JetBrains Mono',monospace", color: ativoTotal >= 0 ? "#3FD1CE" : "#F0605F" }}>{fmt(ativoTotal)}</span>
            </div>
          </Card>
          <Card>
            <div style={{ font: "600 14px 'Space Grotesk',sans-serif", marginBottom: 4 }}>Balancete do mês</div>
            <div style={{ font: "400 11.5px Inter,sans-serif", color: "#93A6A6", marginBottom: 10 }}>Totais por conta em {mk.split("-").reverse().join("/")}</div>
            <table>
              <thead><tr><th>Conta</th><th style={{ textAlign: "right" }}>Crédito</th><th style={{ textAlign: "right" }}>Débito</th></tr></thead>
              <tbody>
                <tr><td>Receita de vendas</td><td style={{ textAlign: "right", fontFamily: "'JetBrains Mono',monospace", color: "#3FD1CE" }}>{fmt(receita)}</td><td /></tr>
                <tr><td>Custo dos produtos vendidos</td><td /><td style={{ textAlign: "right", fontFamily: "'JetBrains Mono',monospace", color: "#F0605F" }}>{fmt(cpv)}</td></tr>
                {Object.entries(data.expenses.filter((e) => monthKey(e.date) === mk).reduce((m, e) => { const c = e.category || e.cat || "Outros"; m[c] = (m[c] || 0) + num(e.value); return m; }, {})).map(([c, v]) => (
                  <tr key={c}><td>Gastos — {c}</td><td /><td style={{ textAlign: "right", fontFamily: "'JetBrains Mono',monospace", color: "#F0605F" }}>{fmt(v)}</td></tr>
                ))}
                <tr><td>Custos fixos</td><td /><td style={{ textAlign: "right", fontFamily: "'JetBrains Mono',monospace", color: "#F0605F" }}>{fmt(monthFixedTotal)}</td></tr>
                <tr><td>Depreciação</td><td /><td style={{ textAlign: "right", fontFamily: "'JetBrains Mono',monospace", color: "#F0605F" }}>{fmt(deprMes)}</td></tr>
              </tbody>
            </table>
          </Card>
        </div>
      </div>
    );
  }

  /* ====================== CATÁLOGO INTERATIVO (HTML) ====================== */
  const ytId = (url) => {
    if (!url) return "";
    const m = String(url).match(/(?:youtu\.be\/|[?&]v=|shorts\/|embed\/|live\/)([A-Za-z0-9_-]{6,20})/);
    return m ? m[1] : "";
  };
  const downloadFile = (name, content, mime) => {
    const blob = new Blob([content], { type: mime || "text/html;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = name;
