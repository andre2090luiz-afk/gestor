    const inNiche = (p, k) => (k === NONE ? projNiches(p).length === 0 : hasNiche(p, k));
    const nicheName = (k) => (k === NONE ? "Sem nicho" : k);
    const price = (p) => (num(p.salePrice) > 0 ? num(p.salePrice) : null);
    const idx = Object.fromEntries(pool.map((p, i) => [p.id, i]));
    const ORDERS = { az: "Nome (A→Z)", za: "Nome (Z→A)", pmin: "Menor preço", pmax: "Maior preço", rec: "Mais recentes" };
    const ordered = (list) => {
      const byName = (a, b) => sortCollator.compare(a.name || "", b.name || "");
      return list.slice().sort((a, b) => {
        if (order === "za") return byName(b, a);
        if (order === "pmin" || order === "pmax") {
          const pa = price(a), pb = price(b);
          if (pa == null || pb == null) return pa == null && pb == null ? byName(a, b) : pa == null ? 1 : -1;
          return (order === "pmin" ? pa - pb : pb - pa) || byName(a, b);
        }
        if (order === "rec") return idx[b.id] - idx[a.id];
        return byName(a, b);
      });
    };
    const norm = (s) => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
    const nicheKeys = Array.from(new Set([...(data.settings.niches || []), ...pool.flatMap((p) => projNiches(p))]))
      .filter((n) => pool.some((p) => hasNiche(p, n)));
    if (pool.some((p) => projNiches(p).length === 0)) nicheKeys.push(NONE);
    const chosenAll = ordered(pool.filter((p) => sel[p.id]));
    const visible = ordered(pool
      .filter((p) => niche === ALL ? true : niche === SELV ? !!sel[p.id] : inNiche(p, niche))
      .filter((p) => !q.trim() || norm(p.name).includes(norm(q.trim()))));
    const countSel = (k) => pool.filter((p) => inNiche(p, k) && sel[p.id]).length;
    const countAll = (k) => pool.filter((p) => inNiche(p, k)).length;
    const markVisible = (v) => setSel((s) => { const n = { ...s }; visible.forEach((p) => { if (v) n[p.id] = true; else delete n[p.id]; }); return n; });
    const chip = (key, label, on, badge) => (
      <button key={key} className="cat-chip" data-key={key} onClick={() => setNiche(key)} style={{
        padding: "6px 12px", borderRadius: 999, cursor: "pointer", whiteSpace: "nowrap",
        border: on ? "1.5px solid #14A6A4" : "1px solid rgba(63,209,206,.22)", background: on ? "rgba(63,209,206,.1)" : "rgba(12,26,28,.72)",
        font: "600 12.5px Inter,sans-serif", color: on ? "#3FD1CE" : "#B5C4C4",
      }}>{label} <span style={{ font: "600 11px 'JetBrains Mono',monospace", color: badge && badge.startsWith("0/") ? "#6E8080" : "#FFB067", marginLeft: 3 }}>{badge}</span></button>
    );
    const breakdown = nicheKeys.map((k) => [nicheName(k), countSel(k)]).filter(([, n]) => n > 0);
    return (
      <Modal title="Gerar catálogo (PDF ou site interativo)" onClose={() => setModal(null)} wide>
        <div style={{ font: "400 13px Inter,sans-serif", color: "#7E9191", marginBottom: 12 }}>Escolha um nicho, marque os produtos e troque de nicho à vontade — o que já foi marcado continua marcado. O catálogo sai com tudo que estiver marcado, na ordem escolhida.</div>
        <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 10 }}>
          {chip(ALL, "Todos", niche === ALL, `${chosenAll.length}/${pool.length}`)}
          {nicheKeys.map((k) => chip(k, nicheName(k), niche === k, `${countSel(k)}/${countAll(k)}`))}
          {chip(SELV, "✓ Selecionados", niche === SELV, String(chosenAll.length))}
        </div>
        <div style={{ display: "flex", gap: 10, flexWrap: "wrap", alignItems: "flex-end", marginBottom: 10 }}>
          <div style={{ flex: 1, minWidth: 180 }}><L>Buscar</L><In className="cat-search" value={q} onChange={(e) => setQ(e.target.value)} placeholder="Buscar produto…" /></div>
          <div><L>Ordenar por</L><Sel className="cat-order" value={order} onChange={(e) => setOrder(e.target.value)} style={{ width: 160 }}>{Object.entries(ORDERS).map(([k, v]) => <option key={k} value={k}>{v}</option>)}</Sel></div>
          <Btn small kind="ghost" disabled={visible.length === 0} onClick={() => markVisible(true)}><CheckCircle2 size={13} />Marcar todos</Btn>
          <Btn small kind="ghost" disabled={visible.length === 0} onClick={() => markVisible(false)}><XIc size={13} />Desmarcar todos</Btn>
        </div>
        {visible.length === 0 ? (
          <div style={{ font: "400 13px Inter,sans-serif", color: "#7E9191", padding: "20px 0", textAlign: "center" }}>{niche === SELV ? "Nenhum produto marcado ainda." : "Nenhum produto encontrado."}</div>
        ) : (
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill,minmax(220px,1fr))", gap: 8, marginBottom: 14, maxHeight: 420, overflowY: "auto" }}>
            {visible.map((p) => (
              <label key={p.id} className="cat-item" style={{ display: "flex", gap: 9, alignItems: "center", border: sel[p.id] ? "1px solid #14A6A4" : "1px solid rgba(63,209,206,.14)", borderRadius: 10, padding: "8px 10px", cursor: "pointer", background: sel[p.id] ? "rgba(63,209,206,.1)" : "rgba(12,26,28,.72)", opacity: p.active === false ? .7 : 1 }}>
                <input type="checkbox" checked={!!sel[p.id]} onChange={(e) => setSel((s) => { const n = { ...s }; if (e.target.checked) n[p.id] = true; else delete n[p.id]; return n; })} style={{ width: 16, height: 16, accentColor: "#14A6A4", flexShrink: 0 }} />
                {p.image ? <img src={p.image} alt="" style={{ width: 34, height: 34, objectFit: "cover", borderRadius: 6, flexShrink: 0 }} /> : <ImageIcon size={20} style={{ color: "#4A5559" }} />}
                <span style={{ minWidth: 0 }}>
                  <span style={{ display: "block", font: "600 12.5px Inter,sans-serif" }}>{p.__kit && <span className="kit-badge" style={{ background: "#F47A20", color: "#fff", borderRadius: 999, padding: "0 6px", font: "700 9.5px Inter,sans-serif", marginRight: 5 }}>KIT</span>}{p.name}{p.active === false && <span style={{ color: "#F0605F", fontWeight: 500 }}> (inativo)</span>}</span>
                  <span style={{ display: "block", font: "500 11px Inter,sans-serif", color: "#8FA3A3" }}>{price(p) != null ? fmt(price(p)) : "Sob consulta"}{` · ${nichesText(p) || "Sem nicho"}`}</span>
                </span>
              </label>
            ))}
          </div>
        )}
        <div style={{ position: "sticky", bottom: -1, background: "rgba(12,26,28,.72)", borderTop: "1px solid rgba(63,209,206,.14)", padding: "10px 0 2px", display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 10 }}>
          <span className="cat-count" style={{ font: "500 12.5px Inter,sans-serif", color: "#93A6A6" }}>
            <b style={{ color: chosenAll.length ? "#3FD1CE" : "#93A6A6" }}>{chosenAll.length} produto(s) no catálogo</b>
            {breakdown.length > 0 && <span> · {breakdown.map(([n, c]) => `${n} ${c}`).join(" · ")}</span>}
          </span>
          <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
            <Btn kind="ghost" onClick={() => setModal(null)}>Cancelar</Btn>
            <Btn kind="ghost" disabled={chosenAll.length === 0} onClick={() => setModal({ type: "printCatalog", ids: chosenAll.map((p) => p.id) })}><PrintIc size={15} />Catálogo PDF</Btn>
            <Btn kind="orange" disabled={chosenAll.length === 0} onClick={() => {
              const digits = String((data.storeInfo || {}).phone || "").replace(/\D/g, "");
              if (!digits) { notify("⚠ Preencha o WhatsApp da empresa em Configurações → Dados da empresa antes de gerar (é ele que recebe os pedidos)."); return; }
              downloadFile("index.html", buildInteractiveCatalog(chosenAll.map((p) => p.id)));
              notify("index.html baixado! Coloque numa pasta e arraste em app.netlify.com/drop para gerar seu link.");
            }}><EyeIc size={15} />Site interativo</Btn>
          </div>
        </div>
        <div style={{ font: "400 11.5px Inter,sans-serif", color: "#7E9191", marginTop: 10, lineHeight: 1.7, background: "rgba(5,12,12,.55)", border: "1px solid rgba(63,209,206,.1)", borderRadius: 10, padding: "10px 14px" }}>
          <b style={{ color: "#3FD1CE" }}>🌐 Como publicar seu link (uma vez só):</b><br />
          1️⃣ O botão laranja baixa o <b>index.html</b> · 2️⃣ Crie uma pasta (ex: "catalogo") e coloque ele dentro · 3️⃣ Entre em <b>app.netlify.com/drop</b> e arraste a <b>pasta</b> · 4️⃣ Pronto — seu link fica tipo <i>printar3d.netlify.app</i>.<br />
          <b>Para atualizar:</b> gere de novo aqui e arraste a pasta no mesmo site (Deploys → arrastar) — o link não muda. Se preferir mandar como arquivo no WhatsApp, pode renomear para <i>catalogo.html</i> que funciona igual.
        </div>
      </Modal>
    );
  }

  /* =========================== DOCUMENTOS (PDF) =========================== */
  function ReportDoc({ report, from, to, label, filters }) {
    const inR = (d) => d && d >= from && d <= to;
    const TITLES = { resumo: "RESUMO DO NEGÓCIO", pedidos: "PEDIDOS E VENDAS", orcamentos: "ORÇAMENTOS", projetos: "PROJETOS", clientes: "CLIENTES", investimentos: "INVESTIMENTOS", brindes: "BRINDES E PERDAS", itens: "DESEMPENHO POR ITEM" };
    const empty = <div style={{ padding: "22px 4px", font: "400 13px Inter,sans-serif", color: "#93A6A6", textAlign: "center" }}>Nenhum registro neste período.</div>;
    const kpi = (lab, val, color) => (
      <div style={{ border: "1px solid rgba(63,209,206,.14)", borderRadius: 10, padding: "10px 12px" }}>
        <div style={{ font: "600 10px Inter,sans-serif", color: "#93A6A6", textTransform: "uppercase", letterSpacing: ".05em" }}>{lab}</div>
        <div style={{ font: "700 17px 'Space Grotesk',sans-serif", color: color || "#F3F6F6", marginTop: 3 }}>{val}</div>
      </div>
    );
    const totBar = (children) => <div style={{ display: "flex", justifyContent: "flex-end", gap: 20, marginTop: 10, font: "600 13px Inter,sans-serif", color: "#F3F6F6", flexWrap: "wrap" }}>{children}</div>;
    let body = null;

    if (report === "resumo") {
      const done = data.orders.filter((o) => isDone(o) && inR(o.date));
      const sales = done.filter(isSale);
      const produced = done.filter((o) => !o.fromStock);
      const rev = sales.reduce((s, o) => s + num(o.price), 0);
      const pcost = sales.reduce((s, o) => s + num(o.cost), 0);
      const exp = data.expenses.filter((e) => inR(e.date));
      const expTotal = exp.reduce((s, e) => s + num(e.value), 0);
      const pieces = produced.reduce((s, o) => s + num(o.qty), 0);
      const hours = produced.reduce((s, o) => s + num(projMap[o.projectId] ? projMap[o.projectId].hours : 0) * num(o.qty), 0);
      const recebido = data.orders.filter((o) => inR(o.date) && o.paid && isSale(o)).reduce((s, o) => s + num(o.price), 0);
      const lucro = rev - pcost - expTotal;
      const top = Object.values(sales.reduce((m, o) => { const k = o.projectId; if (!m[k]) m[k] = { name: projMap[k] ? projMap[k].name : "—", qty: 0, rev: 0 }; m[k].qty += num(o.qty); m[k].rev += num(o.price); return m; }, {})).sort((a, b) => b.rev - a.rev).slice(0, 8);
      body = (
        <React.Fragment>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(4,1fr)", gap: 10, marginBottom: 18 }}>
            {kpi("Faturamento", fmt(rev), "#3FD1CE")}
            {kpi("Custo de produção", fmt(pcost), "#FFB067")}
            {kpi("Investimentos", fmt(expTotal), "#F0605F")}
            {kpi("Lucro do período", fmt(lucro), lucro >= 0 ? "#3FD1CE" : "#F0605F")}
            {kpi("Recebido", fmt(recebido), "#6FA0EA")}
            {kpi("Vendas concluídas", fmtN(sales.length), "#F3F6F6")}
            {kpi("Peças produzidas", fmtN(pieces), "#F3F6F6")}
            {kpi("Horas de impressão", fmtN(hours, 1) + "h", "#F3F6F6")}
          </div>
          <div style={{ font: "700 13px 'Space Grotesk',sans-serif", color: "#F3F6F6", margin: "6px 0 8px" }}>Produtos que mais faturaram</div>
          {top.length === 0 ? empty : (
            <table><thead><tr><th>Produto</th><th style={{ textAlign: "center" }}>Vendidos</th><th style={{ textAlign: "right" }}>Faturamento</th></tr></thead>
              <tbody>{top.map((t, i) => <tr key={i}><td style={{ fontWeight: 600 }}>{t.name}</td><td style={{ textAlign: "center" }}>{fmtN(t.qty)}</td><td style={{ textAlign: "right", fontFamily: "'JetBrains Mono',monospace" }}>{fmt(t.rev)}</td></tr>)}</tbody>
            </table>
          )}
        </React.Fragment>
      );
    } else if (report === "pedidos") {
      const list = data.orders.filter((o) => inR(o.date)).sort((a, b) => (a.date < b.date ? -1 : 1));
      const rev = list.filter(isSale).reduce((s, o) => s + num(o.price), 0);
      const cost = list.filter(isSale).reduce((s, o) => s + num(o.cost), 0);
      body = (
        <React.Fragment>
          {list.length === 0 ? empty : (
            <table><thead><tr><th>Data</th><th>Projeto</th><th>Cliente / destino</th><th style={{ textAlign: "center" }}>Qtd</th><th style={{ textAlign: "right" }}>Valor</th><th style={{ textAlign: "right" }}>Custo</th><th>Status</th><th style={{ textAlign: "center" }}>Pago</th></tr></thead>
              <tbody>{list.map((o) => { const p = projMap[o.projectId]; const c = o.clientId ? cliMap[o.clientId] : null; return (
                <tr key={o.id}><td>{fmtDate(o.date)}</td><td style={{ fontWeight: 600 }}>{projName(o)}</td><td>{c ? c.name : (o.dest === "estoque" ? "Estoque" : o.dest === "brinde" ? "Brinde / Teste" : o.dest === "avulso" ? "Impressão avulsa" : "—")}</td><td style={{ textAlign: "center" }}>{fmtN(o.qty)}</td><td style={{ textAlign: "right", fontFamily: "'JetBrains Mono',monospace" }}>{isSale(o) ? fmt(num(o.price)) : "—"}</td><td style={{ textAlign: "right", fontFamily: "'JetBrains Mono',monospace" }}>{fmt(num(o.cost))}</td><td>{o.status}</td><td style={{ textAlign: "center" }}>{o.paid ? "Sim" : "—"}</td></tr>
              ); })}</tbody>
            </table>
          )}
          {list.length > 0 && totBar(<React.Fragment><span>Pedidos: {list.length}</span><span>Faturamento: <b style={{ color: "#3FD1CE" }}>{fmt(rev)}</b></span><span>Custo: {fmt(cost)}</span><span>Lucro: <b style={{ color: (rev - cost) >= 0 ? "#3FD1CE" : "#F0605F" }}>{fmt(rev - cost)}</b></span></React.Fragment>)}
        </React.Fragment>
      );
    } else if (report === "orcamentos") {
      const QST = { "Pendente": { bg: "#2E2413", fg: "#FFB067" }, "Aprovado": { bg: "rgba(63,209,206,.1)", fg: "#3FD1CE" }, "Recusado": { bg: "#331A1A", fg: "#F0605F" } };
      const list = (data.quotes || []).filter((q) => inR(q.date)).sort((a, b) => (a.date < b.date ? -1 : 1));
      const tot = list.reduce((s, q) => s + quoteTotal(q), 0);
      const aprov = list.filter((q) => q.status === "Aprovado");
      const totAprov = aprov.reduce((s, q) => s + quoteTotal(q), 0);
      const byStatus = {}; list.forEach((q) => { byStatus[q.status || "—"] = (byStatus[q.status || "—"] || 0) + 1; });
      const pedidosDe = (q) => data.orders.filter((o) => o.quoteCode && o.quoteCode === q.code).length;
      body = (
        <React.Fragment>
          {list.length === 0 ? empty : (
            <table><thead><tr><th>Nº</th><th>Data</th><th>Cliente</th><th>Status</th><th>Validade</th><th style={{ textAlign: "center" }}>Gerou pedido?</th><th style={{ textAlign: "right" }}>Total</th></tr></thead>
              <tbody>{list.map((q) => { const c = cliMap[q.clientId]; const np = pedidosDe(q); const st = QST[q.status] || { bg: "rgba(5,12,12,.55)", fg: "#8FA0AC" }; return (
                <tr key={q.id}><td style={{ fontFamily: "'JetBrains Mono',monospace", fontWeight: 600 }}>{q.code}</td><td>{fmtDate(q.date)}</td><td>{c ? c.name : (q.clientName || "—")}</td><td><span style={{ background: st.bg, color: st.fg, borderRadius: 999, padding: "1px 8px", font: "600 11px Inter,sans-serif" }}>{q.status || "—"}</span></td><td>{fmtDate(q.validUntil)}</td><td style={{ textAlign: "center", fontWeight: 600, color: np > 0 ? "#3FD1CE" : "#8FA3A3" }}>{np > 0 ? `Sim (${np})` : "Não"}</td><td style={{ textAlign: "right", fontFamily: "'JetBrains Mono',monospace" }}>{fmt(quoteTotal(q))}</td></tr>
              ); })}</tbody>
            </table>
          )}
          {list.length > 0 && totBar(<React.Fragment><span>Orçamentos: {list.length}</span>{Object.keys(byStatus).map((k) => <span key={k} style={{ color: "#7E9191" }}>{k}: {byStatus[k]}</span>)}<span>Aprovado: <b style={{ color: "#3FD1CE" }}>{fmt(totAprov)}</b></span><span>Total geral: {fmt(tot)}</span></React.Fragment>)}
        </React.Fragment>
      );
    } else if (report === "projetos") {
      const soldInR = {}; data.orders.filter((o) => inR(o.date) && isSale(o) && isDone(o)).forEach((o) => { soldInR[o.projectId] = (soldInR[o.projectId] || 0) + num(o.qty); });
      const list = data.projects.slice().sort((a, b) => (a.name || "").localeCompare(b.name || ""));
      body = (
        <React.Fragment>
          {list.length === 0 ? empty : (
            <table><thead><tr><th>Projeto</th><th>Nicho</th><th style={{ textAlign: "right" }}>Custo</th><th style={{ textAlign: "right" }}>Preço</th><th style={{ textAlign: "center" }}>Margem</th><th style={{ textAlign: "center" }}>Vendidos</th><th style={{ textAlign: "center" }}>Ativo</th></tr></thead>
              <tbody>{list.map((p) => { const sp = num(p.salePrice); const marg = sp > 0 ? ((sp - num(p.cost)) / sp) * 100 : 0; return (
                <tr key={p.id}><td style={{ fontWeight: 600 }}>{p.name}</td><td>{nichesText(p) || "—"}</td><td style={{ textAlign: "right", fontFamily: "'JetBrains Mono',monospace" }}>{fmt(num(p.cost))}</td><td style={{ textAlign: "right", fontFamily: "'JetBrains Mono',monospace" }}>{sp > 0 ? fmt(sp) : "—"}</td><td style={{ textAlign: "center" }}>{sp > 0 ? fmtN(marg, 0) + "%" : "—"}</td><td style={{ textAlign: "center" }}>{fmtN(soldInR[p.id] || 0)}</td><td style={{ textAlign: "center" }}>{p.active === false ? "Não" : "Sim"}</td></tr>
              ); })}</tbody>
            </table>
          )}
          {list.length > 0 && totBar(<span>Projetos cadastrados: {list.length} · Vendidos = unidades no período selecionado</span>)}
        </React.Fragment>
      );
    } else if (report === "clientes") {
      const rows = data.clients.map((c) => { const ords = clientOrders(c.id).filter((o) => inR(o.date) && isSale(o) && isDone(o)); return { c, n: ords.length, total: ords.reduce((s, o) => s + num(o.price), 0) }; }).sort((a, b) => b.total - a.total);
      const totRev = rows.reduce((s, r) => s + r.total, 0);
      body = (
        <React.Fragment>
          {rows.length === 0 ? empty : (
            <table><thead><tr><th>Cliente</th><th>Telefone</th><th>Nichos</th><th style={{ textAlign: "center" }}>Compras</th><th style={{ textAlign: "right" }}>Total no período</th></tr></thead>
              <tbody>{rows.map((r) => (
                <tr key={r.c.id}><td style={{ fontWeight: 600 }}>{r.c.name}</td><td>{r.c.phone || "—"}</td><td>{(r.c.niches || []).join(", ") || "—"}</td><td style={{ textAlign: "center" }}>{r.n}</td><td style={{ textAlign: "right", fontFamily: "'JetBrains Mono',monospace" }}>{r.total > 0 ? fmt(r.total) : "—"}</td></tr>
              ))}</tbody>
            </table>
          )}
          {rows.length > 0 && totBar(<React.Fragment><span>Clientes: {rows.length}</span><span>Faturamento no período: <b style={{ color: "#3FD1CE" }}>{fmt(totRev)}</b></span></React.Fragment>)}
        </React.Fragment>
      );
    } else if (report === "brindes") {
      const r = giftReport(from, to, filters);
      const ink = "#22302F";
      const pk = (lab, val, color) => (
        <div style={{ border: "1px solid #D3DEDE", borderRadius: 10, padding: "10px 12px" }}>
          <div style={{ font: "600 10px Inter,sans-serif", color: "#64787A", textTransform: "uppercase", letterSpacing: ".05em" }}>{lab}</div>
          <div style={{ font: "700 17px 'Space Grotesk',sans-serif", color: color || ink, marginTop: 3 }}>{val}</div>
        </div>
      );
      body = (
        <React.Fragment>
          <div style={{ font: "400 11.5px Inter,sans-serif", color: "#64787A", marginBottom: 12 }}>Filtros: {giftFilterText(filters)}{r.calibOn ? " · com calibrações" : " · sem calibrações"}</div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(4,1fr)", gap: 10, marginBottom: 18 }}>
            {pk("Perda real (custo)", fmt(r.total.cost), "#C43A3A")}
            {pk("Deixou de faturar", fmt(r.total.lost), "#B35A00")}
            {pk("Peças dadas", fmtN(r.total.qty))}
            {pk("Calibrações", r.calibOn ? fmt(r.total.calibCost) : "—")}
          </div>
          <div style={{ font: "700 13px 'Space Grotesk',sans-serif", color: ink, margin: "6px 0 8px" }}>Perda por {GIFT_GROUPS[r.group].toLowerCase()}</div>
          {r.groups.length === 0 ? empty : (
            <table><thead><tr><th>{GIFT_GROUPS[r.group]}</th><th style={{ textAlign: "center" }}>Lanç.</th><th style={{ textAlign: "center" }}>Peças</th><th style={{ textAlign: "right" }}>Custo perdido</th><th style={{ textAlign: "right" }}>%</th><th style={{ textAlign: "right" }}>Deixou de faturar</th></tr></thead>
              <tbody>{r.groups.map((g) => (

    const load = async () => {

        setRows(profs || []);

    useEffect(() => { load(); }, []);
    const setApproved = async (id, val) => {
      setBusyId(id);
      try {
        const { error } = await sb.from("profiles").update({ approved: val }).eq("id", id);
        if (error) throw error;
        setRows((r) => r.map((p) => (p.id === id ? { ...p, approved: val } : p)));

      <Card style={{ marginBottom: 16 }}>

          <Btn small kind="ghost" onClick={load}>Atualizar</Btn>
        </div>
        <div style={{ font: "400 11.5px Inter,sans-serif", color: "#8FA3A3", marginBottom: 12 }}>Contas cadastradas no app. Aprove para liberar o acesso aos dados.</div>
        {err && <div style={{ font: "400 12.5px Inter,sans-serif", color: "#F0605F", marginBottom: 8 }}>{err}</div>}
        {rows === null ? (
          <div style={{ font: "400 13px Inter,sans-serif", color: "#8FA3A3" }}>Carregando…</div>
        ) : rows.length === 0 ? (
          <div style={{ font: "400 13px Inter,sans-serif", color: "#8FA3A3" }}>Nenhum usuário encontrado.</div>
        ) : (
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {rows.map((p) => (
              <div key={p.id} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10, border: "1px solid rgba(63,209,206,.14)", borderRadius: 10, padding: "8px 12px" }}>

                  <div style={{ font: "400 11px Inter,sans-serif", color: p.approved ? "#3FD1CE" : "#FFB067" }}>{p.approved ? "Aprovado" : "Aguardando aprovação"}</div>
                </div>
                {!p.is_admin && (
                  p.approved
                    ? <Btn small kind="ghost" disabled={busyId === p.id} onClick={() => setApproved(p.id, false)}>Revogar</Btn>
                    : <Btn small disabled={busyId === p.id} onClick={() => setApproved(p.id, true)}>Aprovar</Btn>
                )}
              </div>
            ))}

        )}

  /* ---------- painel de armazenamento (Configuracoes) ---------- */
  const LS_LIMITE = 5 * 1024 * 1024;   // ~5 MB: teto do localStorage na maioria dos navegadores
  function StoragePanel() {
    const [m, setM] = useState(null);
    const [busy, setBusy] = useState("");
    const [nuvem, setNuvem] = useState(null);

    const medir = async () => {
      let ls = 0, lsApp = 0;
      try {
        for (const k in localStorage) {
          if (!Object.prototype.hasOwnProperty.call(localStorage, k)) continue;
          const b = (k.length + String(localStorage[k]).length) * 2;
          ls += b; if (k.indexOf("gestor3d") === 0) lsApp += b;
        }
      } catch (e) {}
      let fotos = -1, fotosBytes = 0;
      try {
        const vals = await idbTx("readonly", (store) => { const h = { v: [] }; const r = store.getAll(); r.onsuccess = () => { h.v = r.result || []; }; return h; }).then((h) => h.v);
        fotos = vals.length;
        vals.forEach((x) => { if (typeof x === "string") fotosBytes += x.length * 2; });
      } catch (e) {}
      /* fotos mais pesadas, por projeto (le do estado, que ja esta com as imagens) */
      const pesados = (data.projects || []).map((p) => {
        const imgs = [p.image, ...(p.gallery || [])].filter((x) => typeof x === "string" && x.indexOf("data:image") === 0);
        return { name: p.name, n: imgs.length, bytes: imgs.reduce((s, x) => s + x.length * 2, 0) };
      }).filter((x) => x.bytes > 0).sort((a, b) => b.bytes - a.bytes).slice(0, 5);
      setM({ ls, lsApp, fotos, fotosBytes, pesados });
    };
    useEffect(() => { medir(); }, [data]);

    useEffect(() => {
      if (!sb || !session) return;
      let vivo = true;
      (async () => {
        try { const ks = await cloudListPhotoKeys(session.user.id); if (vivo) setNuvem({ fotos: ks.size }); }
        catch (e) { if (vivo) setNuvem({ fotos: -1 }); }
      })();
      return () => { vivo = false; };
    }, [session && session.user.id]);

    const kb = (n) => n >= 1048576 ? (n / 1048576).toFixed(2) + " MB" : (n / 1024).toFixed(1) + " KB";
    const pct = m ? Math.min(100, (m.lsApp / LS_LIMITE) * 100) : 0;
    const cor = pct >= 85 ? "#F0605F" : pct >= 70 ? "#F47A20" : "#2F9E8C";
    const ultimaNuvem = (() => { try { const v = localStorage.getItem(LAST_CLOUD_PUSH); return v ? new Date(v) : null; } catch (e) { return null; } })();

    /* reduz as imagens guardadas: 900px no maior lado, JPEG 72% */
    const comprimir = async () => {
      const alvo = (data.projects || []).filter((p) => (typeof p.image === "string" && p.image.indexOf("data:image") === 0) || (p.gallery || []).some((g) => typeof g === "string" && g.indexOf("data:image") === 0));
      if (!alvo.length) { notify("Nenhuma foto para comprimir."); return; }
      if (!confirm(`Comprimir as fotos de ${alvo.length} projeto(s)?\n\nAs imagens são reduzidas para 900px e qualidade 72% — fica ótimo na tela e ocupa bem menos espaço.\n\nAs fotos originais não voltam. Exporte um backup antes se quiser guardá-las.`)) return;
      setBusy("Comprimindo…");
      const encolher = (url) => new Promise((res) => {
        try {
          const img = new Image();
          img.onload = () => {
            try {
              const esc = Math.min(1, 900 / Math.max(img.width, img.height));
              const cv = document.createElement("canvas");
              cv.width = Math.max(1, Math.round(img.width * esc));
              cv.height = Math.max(1, Math.round(img.height * esc));
              const cx = cv.getContext("2d");
              cx.fillStyle = "#fff"; cx.fillRect(0, 0, cv.width, cv.height);
              cx.drawImage(img, 0, 0, cv.width, cv.height);
              const out = cv.toDataURL("image/jpeg", 0.72);
              res(out && out.length < url.length ? out : url);
            } catch (e) { res(url); }
          };
          img.onerror = () => res(url);
          img.src = url;
        } catch (e) { res(url); }
      });
      const antes = (data.projects || []).reduce((s, p) => s + [p.image, ...(p.gallery || [])].filter((x) => typeof x === "string").reduce((a, x) => a + x.length * 2, 0), 0);
      const novos = [];
      for (const p of (data.projects || [])) {
        const img = (typeof p.image === "string" && p.image.indexOf("data:image") === 0) ? await encolher(p.image) : p.image;
        const gal = [];
        for (const g of (p.gallery || [])) gal.push((typeof g === "string" && g.indexOf("data:image") === 0) ? await encolher(g) : g);
        novos.push({ ...p, image: img, ...(p.gallery ? { gallery: gal } : {}) });
      }
      const depois = novos.reduce((s, p) => s + [p.image, ...(p.gallery || [])].filter((x) => typeof x === "string").reduce((a, x) => a + x.length * 2, 0), 0);
      setData((d) => ({ ...d, projects: novos }));
      setBusy("");
      notify(`Fotos comprimidas: ${kb(antes)} → ${kb(depois)} (${antes > 0 ? Math.round((1 - depois / antes) * 100) : 0}% menor)`);
    };

    /* apaga do IndexedDB as fotos que nenhum projeto usa mais */
    const limparOrfas = async () => {
      setBusy("Limpando…");
      try {
        const photos = {}; stripPhotos(data, photos);
        const usadas = new Set(Object.keys(photos));
        try { const r = new Set(); collectRefs(actRef.current, r); r.forEach((k) => usadas.add(k)); } catch (e) {} /* fotos das Acoes (7 dias) ficam */
        const todas = await idbAllKeys();
        const orfas = todas.filter((k) => !usadas.has(k));
        if (!orfas.length) { setBusy(""); notify("Nenhuma foto órfã encontrada."); return; }
        await idbTx("readwrite", (store) => { orfas.forEach((k) => store.delete(k)); });
        setBusy(""); medir();
        notify(`${orfas.length} foto(s) sem uso removida(s) do navegador.`);
      } catch (e) { setBusy(""); notify("Não foi possível limpar as fotos órfãs."); }
    };

    return (
      <div style={{ marginBottom: 18 }}>
        <div style={{ font: "600 13px 'Space Grotesk',sans-serif", color: "#3FD1CE", margin: "8px 0 12px", textTransform: "uppercase", letterSpacing: ".06em" }}>Armazenamento</div>
        {!m ? <div style={{ font: "400 12.5px Inter,sans-serif", color: "#7E9191" }}>Medindo…</div> : (
          <div style={{ background: "rgba(5,12,12,.55)", border: "1px solid rgba(63,209,206,.14)", borderRadius: 12, padding: "14px 16px" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 6, flexWrap: "wrap", gap: 8 }}>
              <span style={{ font: "600 12.5px Inter,sans-serif", color: "#D6E2E2" }}>Dados (projetos, pedidos, clientes, financeiro)</span>
              <span style={{ font: "700 13px 'JetBrains Mono',monospace", color: cor }}>{kb(m.lsApp)} de ~5 MB · {pct.toFixed(1)}%</span>
            </div>
            <div style={{ height: 9, background: "#14171A", borderRadius: 999, overflow: "hidden", marginBottom: 4 }}>
              <div style={{ width: pct + "%", height: "100%", background: cor, borderRadius: 999, transition: "width .3s" }} />
            </div>
            {pct >= 70 && (
              <div style={{ font: "600 12px Inter,sans-serif", color: cor, marginBottom: 8 }}>
                {pct >= 85 ? "⛔ Perto do limite — comprima as fotos agora para não perder gravações." : "⚠ Passou de 70% do limite — vale comprimir as fotos."}
              </div>
            )}
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(170px,1fr))", gap: 12, margin: "14px 0 6px" }}>
              <div>
                <div style={{ font: "600 11px Inter,sans-serif", color: "#7E9191" }}>FOTOS NO NAVEGADOR</div>
                <div style={{ font: "700 15px 'Space Grotesk',sans-serif", color: "#F3F6F6" }}>{m.fotos < 0 ? "—" : `${m.fotos} · ${kb(m.fotosBytes)}`}</div>
                <div style={{ font: "400 11px Inter,sans-serif", color: "#7E9191" }}>guardadas fora do limite de 5 MB</div>
              </div>
              <div>
                <div style={{ font: "600 11px Inter,sans-serif", color: "#7E9191" }}>NUVEM</div>
                <div style={{ font: "700 15px 'Space Grotesk',sans-serif", color: sb && session ? "#3FD1CE" : "#6E8080" }}>
                  {sb && session ? (nuvem ? (nuvem.fotos < 0 ? "sem resposta" : `${nuvem.fotos} fotos`) : "consultando…") : "não conectado"}
                </div>
                <div style={{ font: "400 11px Inter,sans-serif", color: "#7E9191" }}>
                  {sb && session ? (ultimaNuvem ? `última sincronia ${fmtDate(ultimaNuvem.toISOString().slice(0, 10))} ${ultimaNuvem.toTimeString().slice(0, 5)}` : "ainda não sincronizou") : "entre com sua conta para sincronizar"}
                </div>
              </div>
            </div>
            {m.pesados.length > 0 && (
              <div style={{ marginTop: 12, paddingTop: 12, borderTop: "1px dashed rgba(63,209,206,.14)" }}>
                <div style={{ font: "600 11.5px Inter,sans-serif", color: "#7E9191", marginBottom: 6 }}>PROJETOS COM AS FOTOS MAIS PESADAS</div>
                {m.pesados.map((x, i) => (
                  <div key={i} style={{ display: "flex", justifyContent: "space-between", gap: 10, font: "400 12.5px Inter,sans-serif", color: "#D6E2E2", padding: "2px 0" }}>
                    <span style={{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{x.name}{x.n > 1 ? ` (${x.n} fotos)` : ""}</span>
                    <span style={{ fontFamily: "'JetBrains Mono',monospace", color: "#93A6A6" }}>{kb(x.bytes)}</span>
                  </div>
                ))}
              </div>
            )}
            <div style={{ display: "flex", gap: 10, flexWrap: "wrap", marginTop: 14 }}>
              <Btn kind="orange" disabled={!!busy} onClick={comprimir}><ImageIcon size={15} />{busy === "Comprimindo…" ? "Comprimindo…" : "Comprimir fotos"}</Btn>
              <Btn kind="ghost" disabled={!!busy} onClick={limparOrfas}><Trash2 size={15} />Limpar fotos sem uso</Btn>
              <Btn kind="ghost" disabled={!!busy} onClick={medir}>Recalcular</Btn>
            </div>
            <div style={{ font: "400 11.5px Inter,sans-serif", color: "#7E9191", marginTop: 10 }}>
              Os dados em texto são o que tem limite apertado (~5 MB por navegador). As fotos ficam num depósito separado e bem maior, mas comprimi-las ajuda a sincronizar mais rápido e a economizar espaço na nuvem.
            </div>
          </div>
        )}
      </div>
    );

          <div style={{ font: "400 11.5px Inter,sans-serif", color: "#8FA3A3", marginBottom: 12 }}>Usados para calcular o preço e o lucro do produto em cada canal, a partir do custo por peça.</div>
          <Row>

  function Login() {
    const [mode, setMode] = useState("in");
    const [email, setEmail] = useState("");
    const [pass, setPass] = useState("");
    const [busy, setBusy] = useState(false);
    const [msg, setMsg] = useState("");
    const [msgOk, setMsgOk] = useState(false);
    const submit = async () => {
      setBusy(true); setMsg(""); setMsgOk(false);
      try {
        if (mode === "in") { const { error } = await sb.auth.signInWithPassword({ email: email.trim(), password: pass }); if (error) throw error; }
        else if (mode === "recover") {
          const { error } = await sb.auth.resetPasswordForEmail(email.trim(), { redirectTo: window.location.href.split("#")[0].split("?")[0] });
          if (error) throw error;
          setMsgOk(true); setMsg("Enviamos um link para redefinir sua senha. Confira seu e-mail (e o spam).");
        }
        else { const { data, error } = await sb.auth.signUp({ email: email.trim(), password: pass }); if (error) throw error; if (!data.session) setMsg("Conta criada! Se pedir confirmação por e-mail, confirme e depois entre. Seu acesso pode precisar de aprovação do administrador."); }
      } catch (e) { setMsg((e && e.message) || "Não foi possível concluir."); }
      setBusy(false);
    };
    return (
      <div style={{ minHeight: "100vh", display: "grid", placeItems: "center", background: "#14171A", padding: 16 }}>
        <div style={{ width: "100%", maxWidth: 380, background: "rgba(12,26,28,.72)", border: "1px solid rgba(63,209,206,.14)", borderRadius: 16, padding: 26, boxShadow: "0 18px 50px rgba(8,40,40,.10)" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 16 }}>
            <img src={LOGO_S} alt="" style={{ width: 40, height: 40, borderRadius: "50%" }} />
            <div style={{ font: "700 20px 'Space Grotesk',sans-serif", color: "#F3F6F6" }}>Print<span style={{ color: "#14A6A4" }}>AR</span> <span style={{ color: "#F47A20" }}>3D</span></div>
          </div>
          <div style={{ font: "400 13px Inter,sans-serif", color: "#7E9191", marginBottom: 16 }}>
            {mode === "in" ? "Entre para acessar e sincronizar seus dados." : mode === "up" ? "Crie sua conta para sincronizar entre aparelhos." : "Informe seu e-mail para redefinir a senha."}
          </div>
          <L>E-mail</L><In type="email" value={email} onChange={(e) => setEmail(e.target.value)} placeholder="voce@email.com" />
          {mode !== "recover" && (<>
            <div style={{ height: 10 }} />
            <L>Senha</L><In type="password" value={pass} onChange={(e) => setPass(e.target.value)} placeholder="mínimo 6 caracteres" onKeyDown={(e) => { if (e.key === "Enter") submit(); }} />
          </>)}
          {msg && <div style={{ font: "400 12.5px Inter,sans-serif", color: msgOk ? "#3FD1CE" : "#F0605F", marginTop: 10 }}>{msg}</div>}
          <div style={{ marginTop: 18 }}>
            <Btn onClick={submit} disabled={busy || !email || (mode !== "recover" && !pass)} style={{ width: "100%", justifyContent: "center" }}>
              {busy ? "Aguarde…" : mode === "in" ? "Entrar" : mode === "up" ? "Criar conta" : "Enviar link de redefinição"}
            </Btn>
          </div>
          <div style={{ textAlign: "center", marginTop: 12, font: "400 12.5px Inter,sans-serif", color: "#7E9191", display: "flex", flexDirection: "column", gap: 6 }}>
            {mode === "in" && <span>Não tem conta? <a onClick={() => { setMode("up"); setMsg(""); }} style={{ color: "#14A6A4", cursor: "pointer", fontWeight: 600 }}>Criar agora</a></span>}
            {mode === "up" && <span>Já tem conta? <a onClick={() => { setMode("in"); setMsg(""); }} style={{ color: "#14A6A4", cursor: "pointer", fontWeight: 600 }}>Entrar</a></span>}
            {mode === "in" && <a onClick={() => { setMode("recover"); setMsg(""); }} style={{ color: "#8FA3A3", cursor: "pointer" }}>Esqueci minha senha</a>}
            {mode === "recover" && <a onClick={() => { setMode("in"); setMsg(""); }} style={{ color: "#14A6A4", cursor: "pointer", fontWeight: 600 }}>Voltar para entrar</a>}
          </div>
          <div style={{ textAlign: "center", marginTop: 16, borderTop: "1px solid rgba(63,209,206,.1)", paddingTop: 14 }}>
            <a onClick={() => setOfflineMode(true)} style={{ color: "#8FA3A3", cursor: "pointer", font: "400 12px Inter,sans-serif" }}>Usar offline neste aparelho (sem sincronizar)</a>
          </div>
        </div>
      </div>
    );
  }

  function ResetPasswordScreen() {
    const [pass, setPass] = useState("");
    const [pass2, setPass2] = useState("");
    const [busy, setBusy] = useState(false);
    const [msg, setMsg] = useState("");
    const submit = async () => {
      if (pass.length < 6) { setMsg("A senha precisa ter pelo menos 6 caracteres."); return; }
      if (pass !== pass2) { setMsg("As senhas não coincidem."); return; }
      setBusy(true); setMsg("");
      try {
        const { error } = await sb.auth.updateUser({ password: pass });
        if (error) throw error;
        setRecoveryMode(false);
        notify("Senha atualizada! Você já está conectado.");
      } catch (e) { setMsg((e && e.message) || "Não foi possível atualizar a senha."); }
      setBusy(false);
    };
    return (
      <div style={{ minHeight: "100vh", display: "grid", placeItems: "center", background: "#14171A", padding: 16 }}>
        <div style={{ width: "100%", maxWidth: 380, background: "rgba(12,26,28,.72)", border: "1px solid rgba(63,209,206,.14)", borderRadius: 16, padding: 26, boxShadow: "0 18px 50px rgba(8,40,40,.10)" }}>
          <div style={{ font: "700 18px 'Space Grotesk',sans-serif", color: "#F3F6F6", marginBottom: 6 }}>Defina sua nova senha</div>
          <div style={{ font: "400 13px Inter,sans-serif", color: "#7E9191", marginBottom: 16 }}>Crie uma nova senha para sua conta.</div>
          <L>Nova senha</L><In type="password" value={pass} onChange={(e) => setPass(e.target.value)} placeholder="mínimo 6 caracteres" />
          <div style={{ height: 10 }} />
          <L>Confirmar nova senha</L><In type="password" value={pass2} onChange={(e) => setPass2(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter") submit(); }} />
          {msg && <div style={{ font: "400 12.5px Inter,sans-serif", color: "#F0605F", marginTop: 10 }}>{msg}</div>}
          <div style={{ marginTop: 18 }}><Btn onClick={submit} disabled={busy || !pass || !pass2} style={{ width: "100%", justifyContent: "center" }}>{busy ? "Aguarde…" : "Salvar nova senha"}</Btn></div>
        </div>
      </div>
    );
  }

  function PendingApprovalScreen() {
    return (
      <div style={{ minHeight: "100vh", display: "grid", placeItems: "center", background: "#14171A", padding: 16 }}>
        <div style={{ width: "100%", maxWidth: 380, background: "rgba(12,26,28,.72)", border: "1px solid rgba(63,209,206,.14)", borderRadius: 16, padding: 26, textAlign: "center" }}>
          <img src={LOGO_S} alt="" style={{ width: 44, height: 44, borderRadius: "50%", marginBottom: 12 }} />

        </div>
      </div>
    );
  }

  Dash = stableComponent("Dash", Dash);
  Projects = stableComponent("Projects", Projects);
  KitsTab = stableComponent("KitsTab", KitsTab);
  KitModal = stableComponent("KitModal", KitModal);
  ProjectViewModal = stableComponent("ProjectViewModal", ProjectViewModal);
  ProjectModal = stableComponent("ProjectModal", ProjectModal);
  Stock = stableComponent("Stock", Stock);
  FilamentModal = stableComponent("FilamentModal", FilamentModal);
  MaterialModal = stableComponent("MaterialModal", MaterialModal);
  MovementModal = stableComponent("MovementModal", MovementModal);
  Products = stableComponent("Products", Products);
  SellModal = stableComponent("SellModal", SellModal);
  ProdAdjustModal = stableComponent("ProdAdjustModal", ProdAdjustModal);
  Printers = stableComponent("Printers", Printers);
  MaintModal = stableComponent("MaintModal", MaintModal);
  PrinterModal = stableComponent("PrinterModal", PrinterModal);
  Expenses = stableComponent("Expenses", Expenses);
  ExpenseModal = stableComponent("ExpenseModal", ExpenseModal);
  Agenda = stableComponent("Agenda", Agenda);
  KitRow = stableComponent("KitRow", KitRow);
  Orders = stableComponent("Orders", Orders);
  OrderModal = stableComponent("OrderModal", OrderModal);
  QuickPrintModal = stableComponent("QuickPrintModal", QuickPrintModal);
  CalibrationModal = stableComponent("CalibrationModal", CalibrationModal);
  Clients = stableComponent("Clients", Clients);
  ClientModal = stableComponent("ClientModal", ClientModal);
  ClientDetailModal = stableComponent("ClientDetailModal", ClientDetailModal);
  Reports = stableComponent("Reports", Reports);
  GiftPanel = stableComponent("GiftPanel", GiftPanel);
  ItemPanel = stableComponent("ItemPanel", ItemPanel);
  SubTabs = stableComponent("SubTabs", SubTabs);
  ProductionProgress = stableComponent("ProductionProgress", ProductionProgress);
  PrinterQueueBoard = stableComponent("PrinterQueueBoard", PrinterQueueBoard);
  CommandCenter = stableComponent("CommandCenter", CommandCenter);
  PrintModal = stableComponent("PrintModal", PrintModal);
  Pendencias = stableComponent("Pendencias", Pendencias);
  Acoes = stableComponent("Acoes", Acoes);
  Quotes = stableComponent("Quotes", Quotes);
  QuoteModal = stableComponent("QuoteModal", QuoteModal);
  Financeiro = stableComponent("Financeiro", Financeiro);
  FixedCostModal = stableComponent("FixedCostModal", FixedCostModal);
  CashflowModal = stableComponent("CashflowModal", CashflowModal);
  Contabilidade = stableComponent("Contabilidade", Contabilidade);
  CatalogModal = stableComponent("CatalogModal", CatalogModal);
  ReportDoc = stableComponent("ReportDoc", ReportDoc);
  PrintFrame = stableComponent("PrintFrame", PrintFrame);
  DocHeader = stableComponent("DocHeader", DocHeader);
  DocFooter = stableComponent("DocFooter", DocFooter);
  PixModal = stableComponent("PixModal", PixModal);
  PrintQuoteDoc = stableComponent("PrintQuoteDoc", PrintQuoteDoc);
  PrintCatalogDoc = stableComponent("PrintCatalogDoc", PrintCatalogDoc);
  ProdHistoryModal = stableComponent("ProdHistoryModal", ProdHistoryModal);
  PrintProdHistoryDoc = stableComponent("PrintProdHistoryDoc", PrintProdHistoryDoc);
  ListEditor = stableComponent("ListEditor", ListEditor);
  UsersAdminPanel = stableComponent("UsersAdminPanel", UsersAdminPanel);
  StoragePanel = stableComponent("StoragePanel", StoragePanel);
  Config = stableComponent("Config", Config);
  SectionHead = stableComponent("SectionHead", SectionHead);
  Login = stableComponent("Login", Login);
  ResetPasswordScreen = stableComponent("ResetPasswordScreen", ResetPasswordScreen);
  PendingApprovalScreen = stableComponent("PendingApprovalScreen", PendingApprovalScreen);
  /* cada abertura de janela ganha uma chave propria: abrir outra janela do mesmo tipo comeca do zero */
  const modalKey = modal ? (modal.__k || (modal.__k = uid())) : "none";
  if (sb && recoveryMode) return <ResetPasswordScreen />;
  if (sb && authChecked && !session && !offlineMode) return <Login />;
  if (sb && session && !offlineMode && profileChecked && profile && profile.approved === false && !profile.is_admin) return <PendingApprovalScreen />;

  return (
    <div style={{ minHeight: "100vh", background: "#050C0D", fontFamily: "Inter,sans-serif", color: "#F3F6F6" }}>
      <div className="neo-bg no-print" /><div className="neo-scan no-print" />
      <aside className="app-aside" style={{ position: "fixed", top: saveState.ok ? 0 : 64, left: 0, bottom: 0, width: 216, background: "rgba(12,26,28,.72)", display: "flex", flexDirection: "column", zIndex: 20, overflowY: "auto" }}>
        <div className="neo-brand">
          <img src={LOGO_NAV} alt="PrintAR 3D" />
          <small><span>CENTRAL DE COMANDO</span><b>v{APP_VERSION}</b></small>
        </div>
        <nav style={{ flex: 1, padding: "10px 8px 16px" }}>
          {NAV.map((g) => (
            <div key={g.group} style={{ marginBottom: 10 }}>
              <div style={{ font: "700 9.5px Inter,sans-serif", color: "#6FA3A3", textTransform: "uppercase", letterSpacing: ".12em", padding: "8px 10px 5px" }}>{g.group}</div>
              {g.items.map((t) => (
                <button key={t.id} title={t.hint} className={"neo-nav-btn" + (tab === t.id ? " on" : "") + (t.action ? " bk" : "")} onClick={() => (t.action ? t.action() : setTab(t.id))} style={{
                  display: "flex", alignItems: "center", gap: 9, width: "100%", padding: "8.5px 10px", cursor: "pointer",
                  background: "none", border: "none", borderRadius: 9, textAlign: "left",
                  font: "500 13px Inter,sans-serif", color: "#A9BDBD", marginBottom: 2,
                }}>
                  <t.icon size={15} /><span style={{ flex: 1 }}>{t.label}</span>
                  {t.dot && <span className="neo-dot" />}
                  {!!t.badge && <span style={{ background: "#F47A20", color: "#fff", borderRadius: 999, padding: "1px 7px", font: "700 10.5px Inter,sans-serif" }}>{t.badge}</span>}
                </button>
              ))}
            </div>
          ))}
        </nav>
        <div style={{ padding: "10px 14px 14px", borderTop: "1px solid rgba(255,255,255,.08)", font: "400 10.5px Inter,sans-serif", color: "#6FA3A3" }}>
          {canInstall && <button className="neo-install" onClick={installApp}><DownloadIc size={14} />Instalar o app</button>}
          <SaveBadge state={saveState} />
          {sb && session ? <span>Conectado: {session.user.email}<br /><a onClick={async () => { await sb.auth.signOut(); }} style={{ color: "#5FA3A3", cursor: "pointer" }}>Sair</a> · Colíder · MT — v{APP_VERSION}</span> : <span>{offlineMode ? "Offline · " : ""}Colíder · MT — v{APP_VERSION}</span>}
        </div>
      </aside>

      {!saveState.ok && (
        <div className="no-print" style={{
          position: "fixed", top: 0, left: 0, right: 0, zIndex: 9000,
          display: "flex", alignItems: "center", gap: 12, flexWrap: "wrap",
          background: "#7A1F1C", borderBottom: "2px solid #F0605F", padding: "11px 18px",
          font: "600 13.5px Inter,sans-serif", color: "#FFE2E0", boxShadow: "0 4px 18px rgba(0,0,0,.45)",
        }}>
          <span style={{ fontSize: 17 }}>⛔</span>
          <span style={{ flex: 1, minWidth: 260 }}>
            SEUS DADOS NÃO ESTÃO SENDO SALVOS NESTE NAVEGADOR.
            <span style={{ font: "400 12.5px Inter,sans-serif", color: "#FFC9C6", display: "block" }}>
              {saveState.err} Tudo que você lançar agora se perde ao fechar a aba. Exporte um backup AGORA e abra o arquivo em outro navegador.
            </span>
          </span>
          <Btn kind="orange" onClick={exportBackup}><DownloadIc size={15} />Baixar backup agora</Btn>
        </div>
      )}
      <main className="app-main" style={{ marginLeft: 216, maxWidth: 1260, padding: "22px 24px 60px", paddingTop: saveState.ok ? 22 : 86 }}>
        {saveState.ok && saveState.photoWarn && (
          <div className="no-print" style={{ display: "flex", alignItems: "center", gap: 10, background: "#2E2413", border: "1px solid #F3D08A", borderRadius: 10, padding: "10px 14px", marginBottom: 16, font: "500 13px Inter,sans-serif", color: "#FFB067" }}>
            <span style={{ flex: 1 }}>⚠ As fotos não estão sendo gravadas neste navegador (os dados estão salvos normalmente). Imagens novas podem sumir ao recarregar — tente outro navegador ou libere espaço.</span>
          </div>
        )}
        {tab === "dash" && <Dash />}
        {tab === "pen" && <Pendencias />}
        {tab === "orc" && <Quotes />}
        {tab === "proj" && <Projects />}
        {tab === "stk" && <Stock />}
        {tab === "prod" && <Products />}
        {tab === "inv" && <Expenses />}
        {tab === "fin" && <Financeiro />}
        {tab === "cont" && <Contabilidade />}
        {tab === "ped" && <Orders />}
        {tab === "agenda" && <Agenda />}
        {tab === "cli" && <Clients />}
        {tab === "rel" && <Reports />}
        {tab === "acoes" && <Acoes />}
        {tab === "cfg" && <Config />}
      </main>

      {toast && (
        <div style={{ position: "fixed", bottom: 22, left: "50%", transform: "translateX(-50%)", background: "rgba(12,26,28,.72)", color: "#fff", padding: "11px 18px", borderRadius: 10, font: "500 13px Inter,sans-serif", boxShadow: "0 10px 30px rgba(0,0,0,.25)", zIndex: 90, display: "flex", gap: 8, alignItems: "center", maxWidth: "90vw" }}>
          <CheckCircle2 size={16} color="#5CD6C7" /><span>{toast}</span>
          {undoSnap && <button onClick={doUndo} style={{ marginLeft: 6, background: "none", border: "1px solid #5CD6C7", color: "#5CD6C7", borderRadius: 7, padding: "4px 10px", cursor: "pointer", font: "600 12.5px Inter,sans-serif" }}>Desfazer</button>}
        </div>
      )}

      {modal && modal.type === "calc" && <CalcModal key={modalKey} data={data} onClose={() => setModal(null)} />}
      {modal && modal.type === "project" && <ProjectModal key={modalKey} item={modal.item} isCopy={modal.isCopy} />}
      {modal && modal.type === "filament" && <FilamentModal key={modalKey} item={modal.item} restock={modal.restock} />}
      {modal && modal.type === "material" && <MaterialModal key={modalKey} item={modal.item} />}
      {modal && modal.type === "movement" && <MovementModal key={modalKey} />}
      {modal && modal.type === "sell" && <SellModal key={modalKey} presetProjectId={modal.presetProjectId} presetMode={modal.presetMode} />}
      {modal && modal.type === "prodAdjust" && <ProdAdjustModal key={modalKey} presetProject={modal.projectId} />}
      {modal && modal.type === "printer" && <PrinterModal key={modalKey} item={modal.item} />}
      {modal && modal.type === "maint" && <MaintModal key={modalKey} item={modal.item} />}
      {modal && modal.type === "expense" && <ExpenseModal key={modalKey} item={modal.item} />}
      {modal && modal.type === "projectView" && <ProjectViewModal key={modalKey} item={modal.item} />}
      {modal && modal.type === "kit" && <KitModal key={modalKey} item={modal.item} isCopy={modal.isCopy} />}
      {modal && modal.type === "print" && <PrintModal key={modalKey} orderId={modal.orderId} />}
      {modal && modal.type === "order" && <OrderModal key={modalKey} item={modal.item} presetProject={modal.projectId} />}
      {modal && modal.type === "calib" && <CalibrationModal key={modalKey} />}
      {modal && modal.type === "quick" && <QuickPrintModal key={modalKey} />}
      {modal && modal.type === "client" && <ClientModal key={modalKey} item={modal.item} />}
      {modal && modal.type === "clientDetail" && <ClientDetailModal key={modalKey} item={modal.item} />}
      {modal && modal.type === "quote" && <QuoteModal key={modalKey} item={modal.item} presetClient={modal.clientId} presetProject={modal.projectId} />}
      {modal && modal.type === "fixedCost" && <FixedCostModal key={modalKey} item={modal.item} />}
      {modal && modal.type === "cashflow" && <CashflowModal key={modalKey} item={modal.item} />}
      {modal && modal.type === "catalog" && <CatalogModal key={modalKey} />}
      {modal && modal.type === "printQuote" && <PrintQuoteDoc key={modalKey} quote={modal.quote} />}
      {modal && modal.type === "pix" && <PixModal key={modalKey} refTxt={modal.ref} clientId={modal.clientId} />}
      {modal && modal.type === "report" && <ReportDoc key={modalKey} report={modal.report} from={modal.from} to={modal.to} label={modal.label} filters={modal.filters} />}
      {modal && modal.type === "printCatalog" && <PrintCatalogDoc key={modalKey} ids={modal.ids} />}
      {modal && modal.type === "prodHistory" && <ProdHistoryModal key={modalKey} presetProject={modal.projectId} />}
      {modal && modal.type === "printProdHistory" && <PrintProdHistoryDoc key={modalKey} projectId={modal.projectId} from={modal.from} to={modal.to} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
