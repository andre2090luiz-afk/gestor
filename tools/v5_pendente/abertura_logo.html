<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Abertura PrintAR</title>
<style>
html,body{margin:0;height:100%;background:#050C0D;overflow:hidden;font-family:Inter,system-ui,sans-serif}
#splash{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse 60% 45% at 50% 46%,rgba(20,184,178,.16),transparent 70%),#050C0D;transition:opacity .45s ease,transform .45s ease}
#splash.out{opacity:0;transform:scale(1.04);pointer-events:none}
#splash .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(63,209,206,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(63,209,206,.06) 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:radial-gradient(ellipse 55% 50% at 50% 50%,#000 30%,transparent 75%);mask-image:radial-gradient(ellipse 55% 50% at 50% 50%,#000 30%,transparent 75%)}
.stage{position:relative;width:min(560px,86vw);aspect-ratio:900/218}
.stage img{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
#ghost{opacity:.07;filter:grayscale(1) brightness(2)}
#sym,#txt,#d3{clip-path:inset(100% 0 0 0)}
#sym{filter:drop-shadow(0 0 10px rgba(63,209,206,.35))}
#bed{position:absolute;left:-4%;right:-4%;bottom:-9%;height:3px;border-radius:3px;background:linear-gradient(90deg,transparent,rgba(63,209,206,.55),transparent);box-shadow:0 0 18px rgba(63,209,206,.5);opacity:0;transition:opacity .4s}
#noz{position:absolute;width:20px;height:24px;margin:-26px 0 0 -10px;opacity:0;transition:opacity .25s}
#noz:before{content:"";position:absolute;left:3px;top:0;width:14px;height:14px;border-radius:3px;background:linear-gradient(#E9EEEF,#9FB0B2);box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}
#noz:after{content:"";position:absolute;left:6px;top:13px;border:4px solid transparent;border-top:9px solid #C7D2D4;border-bottom:0}
#hot{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:radial-gradient(circle,#F2FFFE 0,#46E6E0 30%,rgba(70,230,224,0) 70%);opacity:0;mix-blend-mode:screen}
#trail{position:absolute;height:3px;margin-top:-1.5px;border-radius:3px;background:linear-gradient(90deg,rgba(70,230,224,0),#BFFFFC);opacity:0;filter:blur(.4px)}
#d3wrap{position:absolute;inset:0;transform-origin:88% 82%}
.pop{animation:pop .55s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}
#flash{position:absolute;inset:-40% -20%;background:radial-gradient(closest-side,rgba(70,230,224,.28),rgba(70,230,224,0));opacity:0;pointer-events:none}
.load{margin-top:34px;width:min(260px,60vw);text-align:center}
.bar{height:3px;border-radius:3px;background:rgba(127,154,155,.18);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:3px;background:linear-gradient(90deg,#14B8B2,#3FD1CE 60%,#F5821F)}
.lt{margin-top:10px;font:500 11px "JetBrains Mono",ui-monospace,monospace;letter-spacing:.12em;color:#5D7374;text-transform:uppercase;min-height:14px}
.skip{position:absolute;bottom:22px;font:500 11px Inter,sans-serif;color:#3d5354}
@media (prefers-reduced-motion: reduce){#splash{transition:none}}
/* só para a demonstração */
.demo-app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#5D7374;font:500 14px Inter,sans-serif}
.again{position:fixed;bottom:18px;right:18px;z-index:1;font:600 12px Inter,sans-serif;color:#3FD1CE;background:rgba(63,209,206,.1);border:1px solid rgba(63,209,206,.35);border-radius:999px;padding:8px 14px;cursor:pointer}
</style></head><body>

    <div id="bed"></div><div id="trail"></div><div id="hot"></div><div id="noz"></div>
  </div>
  <div class="load"><div class="bar"><i id="bar"></i></div><div class="lt" id="lt">aquecendo o bico…</div></div>
  <div class="skip">toque para pular</div>
</div>
<script>
function runSplash(){
  const $=id=>document.getElementById(id), sp=$('splash');
  sp.classList.remove('out'); sp.style.display='flex';
  const SYM_R=27.0, TXT_L=27.8, D3_T=73, LAYERS=7;           // % da imagem
  const sym=$('sym'),txt=$('txt'),d3=$('d3'),noz=$('noz'),hot=$('hot'),trail=$('trail'),bar=$('bar'),lt=$('lt'),bed=$('bed'),flash=$('flash');
  const T1=1.5, T2=2.4, T3=3.0, END=3.3;                   // fases (s)
  const msgs=[[0,'aquecendo o bico…'],[0.55,'imprimindo camadas…'],[T1,'acabamento…'],[T2,'carregando seus dados…']];
  let t0=null, done=false, popped=false;
  const ease=x=>1-Math.pow(1-x,3);
  const place=(x,y)=>{noz.style.left=x+'%';noz.style.top=y+'%';hot.style.left=x+'%';hot.style.top=y+'%';};
  function frame(ts){
    if(done) return; if(t0===null) t0=ts; const t=(ts-t0)/1000;
    bed.style.opacity=t>0.05?1:0;
    lt.textContent=msgs.filter(m=>t>=m[0]).pop()[1];
    bar.style.width=Math.min(100,ease(Math.min(1,t/T3))*100)+'%';
    if(t<T1){ // símbolo camada por camada, de baixo para cima
      const p=t/T1, L=p*LAYERS, k=Math.floor(L), f=L-k;
      const done_=Math.min(LAYERS,k)/LAYERS;               // camadas inteiras prontas
      const yLayerTop=100-(k+1)/LAYERS*100, yLayerBot=100-k/LAYERS*100;
      // camada atual é revelada na horizontal conforme o bico passa (zigue-zague)
      const dir=k%2===0?1:-1, xr=dir>0?f*SYM_R:SYM_R*(1-f);
      sym.style.clipPath=`polygon(0% ${yLayerBot}%,${SYM_R}% ${yLayerBot}%,${SYM_R}% 100%,0% 100%)`;
      const cur= dir>0? `polygon(0% ${yLayerTop}%, ${xr}% ${yLayerTop}%, ${xr}% ${yLayerBot}%, 0% ${yLayerBot}%)` : `polygon(${xr}% ${yLayerTop}%, ${SYM_R}% ${yLayerTop}%, ${SYM_R}% ${yLayerBot}%, ${xr}% ${yLayerBot}%)`;
      sym.style.clipPath=`path(evenodd,'')`; // reset (navegadores antigos)
      sym.style.clipPath=`polygon(evenodd,0% 100%,${SYM_R}% 100%,${SYM_R}% ${yLayerBot}%,${dir>0?xr:SYM_R}% ${yLayerBot}%,${dir>0?xr:SYM_R}% ${yLayerTop}%,${dir>0?0:xr}% ${yLayerTop}%,${dir>0?0:xr}% ${yLayerBot}%,0% ${yLayerBot}%)`;
      noz.style.opacity=1; hot.style.opacity=.95; place(xr,yLayerTop+ (yLayerBot-yLayerTop)*0.15);
      trail.style.opacity=.8; trail.style.top=(yLayerTop+(yLayerBot-yLayerTop)*0.15)+'%';
      trail.style.left=(dir>0?Math.max(0,xr-9):xr)+'%'; trail.style.width='9%'; trail.style.transform=dir>0?'none':'scaleX(-1)';
    } else if(t<T2){ // texto: o bico varre da esquerda para a direita
      sym.style.clipPath='inset(0 0 0 0)';
      const p=ease((t-T1)/(T2-T1)), xr=TXT_L+(100-TXT_L)*p;
      txt.style.clipPath=`polygon(${TXT_L}% 0%,${xr}% 0%,${xr}% ${D3_T}%,${TXT_L}% ${D3_T}%)`;
      place(xr,40+Math.sin(p*Math.PI*10)*22); trail.style.top=(40+Math.sin(p*Math.PI*10)*22)+'%'; trail.style.left=Math.max(TXT_L,xr-12)+'%'; trail.style.width='12%'; trail.style.transform='none';
    } else { // "3D" aparece com pulo e brilho
      txt.style.clipPath=`polygon(${TXT_L}% 0%,100% 0%,100% ${D3_T}%,${TXT_L}% ${D3_T}%)`;
      noz.style.opacity=0; hot.style.opacity=0; trail.style.opacity=0;
      if(!popped){popped=true; d3.style.clipPath=`inset(${D3_T}% 0 0 ${TXT_L}%)`; $('d3wrap').classList.remove('pop'); void $('d3wrap').offsetWidth; $('d3wrap').classList.add('pop');}
      const q=Math.min(1,(t-T2)/0.5); flash.style.opacity=Math.sin(q*Math.PI)*0.9;
    }
    if(t>=END){ finish(); return; }
    requestAnimationFrame(frame);
  }
  function finish(){ if(done) return; done=true; sym.style.clipPath='inset(0 0 0 0)'; txt.style.clipPath=`inset(0 0 ${100-D3_T}% ${TXT_L}%)`; d3.style.clipPath=`inset(${D3_T}% 0 0 ${TXT_L}%)`; bar.style.width='100%'; sp.classList.add('out'); setTimeout(()=>{sp.style.display='none'},460); }
  sp.onclick=finish;
  [sym,txt,d3].forEach(e=>e.style.clipPath='inset(100% 0 0 0)'); flash.style.opacity=0;
  requestAnimationFrame(frame);
}
runSplash();
</script></body></html>
